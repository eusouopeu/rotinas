<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Brita — player</title>
<style>
  :root{
    --bg:#1C1B1A; --surface:#262422; --text:#EDE7DD; --muted:#8A8478;
    --accent:#E0619E; --grad:linear-gradient(135deg,#EC6AA8,#5B8DEF); --line:#3A3632;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:transparent; }
  body{
    font-family:-apple-system, 'Inter', sans-serif; color:var(--text);
    display:flex; flex-direction:column; justify-content:center;
    height:100vh; padding:14px 16px;
    background:var(--surface); border-radius:14px; border:1px solid var(--line);
    overflow:hidden; -webkit-app-region:drag; cursor:default;
    user-select:none;
  }
  .mp-empty{ color:var(--muted); font-size:13px; text-align:center; line-height:1.5; }
  .mp-routine{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .mp-step{
    font-size:15px; font-weight:600; line-height:1.25; margin-bottom:8px;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .mp-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .mp-time{ font-size:26px; font-weight:500; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .mp-time.overtime{ color:#E07070; }
  .mp-idx{ font-size:12px; color:var(--muted); }
  .mp-controls{ display:flex; gap:8px; -webkit-app-region:no-drag; }
  button{
    -webkit-app-region:no-drag; border:none; border-radius:50%; width:32px; height:32px;
    background:var(--grad); color:#fff; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  button.ghost{ background:#2F2C29; border:1px solid var(--line); color:var(--text); }
  button:active{ transform:scale(.92); }
</style>
</head>
<body>
  <div id="mp"><div class="mp-empty">Nenhuma rotina em andamento.<br>Abra o Brita e comece uma rotina.</div></div>
<script>
  var el = document.getElementById("mp");
  function fmt(sec){
    var neg = sec < 0; sec = Math.abs(Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return (neg?"+":"") + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  async function tick(){
    var st = null;
    try{ st = await window.electronBridge.miniPlayer.getState(); }catch(e){}
    if(!st){
      el.innerHTML = '<div class="mp-empty">Nenhuma rotina em andamento.<br>Abra o Brita e comece uma rotina.</div>';
      return;
    }
    el.innerHTML =
      '<div class="mp-routine">' + escapeHtml(st.routineName) + '</div>' +
      '<div class="mp-step">' + escapeHtml(st.stepName) + '</div>' +
      '<div class="mp-row">' +
        (st.isTimer
          ? '<span class="mp-time' + (st.remaining<0?' overtime':'') + '">' + fmt(st.remaining) + '</span>'
          : '<span class="mp-idx">' + (st.idx+1) + ' / ' + st.total + '</span>') +
        '<span class="mp-controls">' +
          (st.isTimer ? '<button id="mpPause" class="ghost" title="' + (st.paused?'Retomar':'Pausar') + '">' + (st.paused?'&#9654;':'&#10073;&#10073;') + '</button>' : '') +
          '<button id="mpNext" title="Concluir etapa">&#10003;</button>' +
        '</span>' +
      '</div>';
    var pb = document.getElementById("mpPause");
    if(pb) pb.onclick = function(){ window.electronBridge.miniPlayer.control("pause"); };
    var nb = document.getElementById("mpNext");
    if(nb) nb.onclick = function(){ window.electronBridge.miniPlayer.control("next"); };
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
