  function abrirFormMeta(doc, alvoExistente){
    const t = alvoExistente || null;
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box" style="text-align:left; max-height:86vh; overflow-y:auto;">
        <p style="margin-bottom:12px;">${t?"Editar meta":"Nova meta"}</p>
        <input type="text" id="cdTitle" placeholder="Alvo (ex: Prova SEFAZ-BA)" class="mk-e-name" style="width:100%; margin-bottom:8px;" value="${t?escapeHtml(t.title):""}">
        <div class="section-label" style="margin:8px 0 6px;">Prazo</div>
        <input type="date" id="cdDate" style="width:100%;" value="${t?t.date:""}">
        <div class="section-label" style="margin:12px 0 6px;">Quantidade (opcional)</div>
        <div class="market-form-row">
          <input type="number" id="cdTopics" inputmode="numeric" min="1" placeholder="quantos" style="width:110px;" value="${t&&t.topics!=null?t.topics:""}">
          <input type="text" id="cdUnit" placeholder="do quê? (ex: questões)" style="flex:1; min-width:0;" value="${t?escapeHtml(t.unit||""):""}">
        </div>
        <div class="section-label" style="margin:12px 0 6px;">Áreas</div>
        <div id="cdAreasWrap"></div>
        <div class="section-label" style="margin:12px 0 6px;">Dias para trabalhar (opcional — nenhum marcado = todo dia)</div>
        <div class="day-chips" id="cdDiasWrap">
          ${["D","S","T","Q","Q","S","S"].map((l,d)=>`<span class="day-chip ${t&&t.dias&&t.dias.includes(d)?'active':''}" data-cddia="${d}">${l}</span>`).join("")}
        </div>
        <div class="section-label" style="margin:12px 0 6px;">Peso no boletim</div>
        ${tagValorPillsHtml(t ? (t.tagValor || "alto") : "alto", false)}
        <div class="dev-n" id="cdEscopoHint" style="margin-top:12px;"></div>
        <div class="confirm-actions" style="margin-top:18px;">
          <button class="btn-cancel" id="cdFormCancel">Cancelar</button>
          <button class="btn-confirm" id="cdAdd" style="background:var(--grad);">${t?"Salvar":"Adicionar"}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    // valores normalizados para rótulo: o que for digitado e não existir vira área nova
    let areasSel = ((t && t.areas) || []).map(a=>metaAreaInfo(a).label).filter(Boolean);
    mountTagInput(ov.querySelector("#cdAreasWrap"), areasSel, metaAreasPool(doc), vals => { areasSel = vals; });
    let diasSel = ((t && t.dias) || []).slice();
    ov.querySelectorAll("[data-cddia]").forEach(chip=>{
      chip.onclick = () => {
        const d = +chip.dataset.cddia;
        const pos = diasSel.indexOf(d);
        if(pos >= 0) diasSel.splice(pos,1); else diasSel.push(d);
        chip.classList.toggle("active", diasSel.includes(d));
      };
    });
    wireTagValorPills(ov);
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    // mostra desde já em que escopo a meta vai pontuar e quanto ela vale
    function atualizarHint(){
      const d = ov.querySelector("#cdDate").value;
      const hint = ov.querySelector("#cdEscopoHint");
      if(!d){ hint.textContent = ""; return; }
      const fake = {
        date: d, criadoEm: t && t.criadoEm ? t.criadoEm : Date.now(),
        tagValor: readTagValorPills(ov) || "alto"
      };
      const esc = metaEscopo(fake);
      const total = metaPontosTotais(fake);
      const qtd = +ov.querySelector("#cdTopics").value || 0;
      hint.innerHTML = `Vale <b>${total.toFixed(1)}</b> pontos no boletim <b>${ESCOPO_META_LABEL[esc]}</b>`
        + ` (base ${gam.config.pontosMeta[esc]} &times; peso ${TAG_LABELS[fake.tagValor].toLowerCase()})`
        + (qtd > 0 ? `, creditados aos poucos: ${(total/qtd).toFixed(2)} por item.` : `. Informe a quantidade para pontuar item por item.`);
    }
    ov.querySelector("#cdDate").onchange = atualizarHint;
    ov.querySelector("#cdTopics").oninput = atualizarHint;
    ov.querySelectorAll("[data-tagval]").forEach(sp=> sp.addEventListener("click", atualizarHint));
    atualizarHint();
    ov.querySelector("#cdTitle").focus();
    ov.querySelector("#cdFormCancel").onclick = () => ov.remove();
    ov.querySelector("#cdAdd").onclick = () => {
      const title = ov.querySelector("#cdTitle").value.trim();
      const date = ov.querySelector("#cdDate").value;
      if(!title || !date){ showAlertBanner("Preencha o nome e o prazo"); return; }
      const topics = +ov.querySelector("#cdTopics").value || null;
      const unit = ov.querySelector("#cdUnit").value.trim() || "tópicos";
      const areas = [...areasSel];
      const dias = [...diasSel];
      const tagValor = readTagValorPills(ov) || "alto";
      if(t){
        t.title = title; t.date = date; t.unit = unit; t.areas = areas; t.dias = dias;
        t.topics = topics; t.tagValor = tagValor;
        if(topics != null) t.done = Math.min(t.done||0, topics);
        sincronizarPontosMeta(t);
      } else {
        doc.targets.push({ id: uid(), title, date, topics, unit, done:0, areas, dias, tagValor, criadoEm: Date.now() });
      }
      saveTemplates(doc);
      ov.remove();
      render();
    };
  }

  function abrirFormMetaRec(doc, alvoExistente){
    const rec = alvoExistente || null;
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box" style="text-align:left; max-height:86vh; overflow-y:auto;">
        <p style="margin-bottom:12px;">${rec?"Editar meta recorrente":"Nova meta recorrente"}</p>
        <input type="text" id="mrTitle" placeholder="Ex: Beber água" class="mk-e-name" style="width:100%; margin-bottom:8px;" value="${rec?escapeHtml(rec.titulo):""}">
        <div class="section-label" style="margin:8px 0 6px;">Repete</div>
        <div class="type-toggle" id="mrTipo">
          <span data-mrtipo="diaria" class="${(!rec||rec.tipo==='diaria')?'active':''}">ao dia</span>
          <span data-mrtipo="semanal" class="${rec&&rec.tipo==='semanal'?'active':''}">na semana</span>
        </div>
        <label class="switch-row" style="margin-top:12px;"><span>Meta negativa</span><input type="checkbox" id="mrNegativa" ${rec&&rec.negativa?'checked':''}></label>
        <div class="section-label" style="margin:12px 0 6px;" id="mrVezesLabel">Quantas vezes</div>
        <input type="number" id="mrVezes" inputmode="numeric" min="1" max="20" style="width:110px;" value="${rec?rec.vezes:4}">
        <div class="dev-n" id="mrNegativaHint" style="margin-top:6px;"></div>
        <div id="mrPesoWrap" style="margin-top:12px;">
          <div class="section-label" style="margin:0 0 6px;">Peso da penalidade</div>
          ${tagValorPillsHtml(rec ? (rec.tagValor||"medio") : "medio", false)}
          <div class="dev-n" style="margin-top:6px;">Cada vez que passar do limite desconta pontos do boletim da semana.</div>
        </div>
        ${rodaAtiva() ? `<div class="section-label" style="margin:12px 0 6px;">Área</div><div id="mrAreaWrap"></div>` : ""}
        <div class="section-label" style="margin:12px 0 6px;" id="mrNotifLabel">Notificar (só quando é ao dia)</div>
        <label class="switch-row"><span>Lembrar em horários fixos</span><input type="checkbox" id="mrNotifOn" ${rec&&rec.notif?'checked':''}></label>
        <div class="sched-time-row" id="mrNotifRow" style="${rec&&rec.notif?'':'display:none;'}">
          <input type="time" id="mrNotifIni" value="${rec&&rec.notif?rec.notif.inicio:'08:00'}">
          <span style="align-self:center; color:var(--muted);">até</span>
          <input type="time" id="mrNotifFim" value="${rec&&rec.notif?rec.notif.fim:'18:00'}">
        </div>
        <div class="dev-n" id="mrNotifHint" style="margin-top:6px;"></div>
        <div class="confirm-actions" style="margin-top:18px;">
          <button class="btn-cancel" id="mrCancel">Cancelar</button>
          <button class="btn-confirm" id="mrSalvar" style="background:var(--grad);">${rec?"Salvar":"Adicionar"}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    wireTagValorPills(ov);
    let tipoSel = rec ? rec.tipo : "diaria";
    let areaSel = rec ? (rec.area || null) : null;
    if(rodaAtiva()) pintarAreaChips(ov.querySelector("#mrAreaWrap"), areaSel, v => { areaSel = v; });
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.querySelector("#mrCancel").onclick = () => ov.remove();
    function atualizarNegativaVisibilidade(){
      const neg = ov.querySelector("#mrNegativa").checked;
      ov.querySelector("#mrVezesLabel").textContent = neg ? "Limite (vezes)" : "Quantas vezes";
      ov.querySelector("#mrPesoWrap").style.display = neg ? "" : "none";
      ov.querySelector("#mrNegativaHint").textContent = neg
        ? "Marque cada vez que acontecer. Passar do limite desconta do boletim."
        : "";
    }
    ov.querySelector("#mrNegativa").onchange = atualizarNegativaVisibilidade;
    atualizarNegativaVisibilidade();
    function atualizarNotifVisibilidade(){
      const ehDiaria = tipoSel === "diaria";
      ov.querySelector("#mrNotifLabel").style.opacity = ehDiaria ? "1" : ".45";
      ov.querySelector("#mrNotifOn").disabled = !ehDiaria;
      if(!ehDiaria) ov.querySelector("#mrNotifOn").checked = false;
      atualizarHint();
    }
    function atualizarHint(){
      const hint = ov.querySelector("#mrNotifHint");
      const on = ov.querySelector("#mrNotifOn").checked;
      ov.querySelector("#mrNotifRow").style.display = on ? "flex" : "none";
      if(!on){ hint.textContent = ""; return; }
      const vezes = Math.max(1, +ov.querySelector("#mrVezes").value || 1);
      const ini = ov.querySelector("#mrNotifIni").value, fim = ov.querySelector("#mrNotifFim").value;
      const horarios = metaRecHorarios({ tipo:"diaria", vezes, notif:{inicio:ini, fim:fim} });
      hint.textContent = horarios.length
        ? "Alarmes às " + horarios.map(h=>String(h.hour).padStart(2,"0")+":"+String(h.minute).padStart(2,"0")).join(", ")
        : "Janela inválida (fim precisa ser depois do início)";
    }
    ov.querySelectorAll("[data-mrtipo]").forEach(sp=>{
      sp.onclick = () => {
        tipoSel = sp.dataset.mrtipo;
        ov.querySelectorAll("[data-mrtipo]").forEach(s=>s.classList.toggle("active", s===sp));
        atualizarNotifVisibilidade();
      };
    });
    ov.querySelector("#mrVezes").oninput = atualizarHint;
    ov.querySelector("#mrNotifIni").onchange = atualizarHint;
    ov.querySelector("#mrNotifFim").onchange = atualizarHint;
    ov.querySelector("#mrNotifOn").onchange = atualizarHint;
    atualizarNotifVisibilidade();
    ov.querySelector("#mrTitle").focus();
    ov.querySelector("#mrSalvar").onclick = () => {
      const titulo = ov.querySelector("#mrTitle").value.trim();
      if(!titulo){ showAlertBanner("Dê um nome para a meta"); return; }
      const vezes = Math.max(1, +ov.querySelector("#mrVezes").value || 1);
      const notifOn = tipoSel === "diaria" && ov.querySelector("#mrNotifOn").checked;
      const notif = notifOn ? { inicio: ov.querySelector("#mrNotifIni").value, fim: ov.querySelector("#mrNotifFim").value } : null;
      const negativa = ov.querySelector("#mrNegativa").checked;
      const tagValor = readTagValorPills(ov) || "medio";
      if(rec){
        // excesso ANTES considera o estado antigo de negativa/vezes; DEPOIS já
        // com os campos novos — cobre tanto virar negativa quanto mudar o limite
        const excessoAntes = rec.negativa ? metaRecExcesso(rec) : 0;
        rec.titulo = titulo; rec.tipo = tipoSel; rec.vezes = vezes; rec.area = areaSel; rec.notif = notif;
        rec.negativa = negativa; rec.tagValor = tagValor;
        metaRecProgresso(rec); // reencaixa o progresso se vezes/tipo mudou de período
        const excessoDepois = rec.negativa ? metaRecExcesso(rec) : 0;
        sincronizarPenalidadeMetaRec(rec, excessoAntes, excessoDepois);
      } else {
        doc.recorrentes.push({ id: uid(), titulo, tipo: tipoSel, vezes, area: areaSel, notif, negativa, tagValor, criadoEm: Date.now(), progresso: null });
      }
      saveTemplates(doc);
      ov.remove();
      render();
    };
  }

  function renderMetas(){
    const doc = metaDoc();
    if(!doc.targets) doc.targets = [];
    if(!doc.recorrentes) doc.recorrentes = [];
    const el = document.createElement("div");
    el.className = "screen with-tabbar";
    // Prazos e recorrentes eram um either/or (view toggle exclusivo). Virou
    // multiselect (metasSubviewSel) para poder ver os dois juntos — sempre ao
    // menos um dos dois fica marcado (ver o guard no handler abaixo).
    const mostraPrazos = metasSubviewSel.includes("prazos");
    const mostraRecorrentes = metasSubviewSel.includes("recorrentes");
    const ambos = mostraPrazos && mostraRecorrentes;
    /* cabeçalho DENTRO da área que rola (padrão de Dados e Diário). O corpo é
       irmão do cabeçalho, e não o mesmo nó: pintarTudo() monta os cards com
       um array (join no fim) e recriaria os botões do topo se fosse o mesmo nó. */
    el.innerHTML = `<div class="tab-scroll">
      <div class="home-header">
        <h1>Metas</h1>
        <div class="header-right">
          ${mostraPrazos ? `<button class="bell-btn" id="cdPdf" title="Exportar PDF" aria-label="Exportar PDF" style="width:auto; padding:0 12px;">PDF</button>` : ""}
          ${cfgBtnHtml()}
        </div>
      </div>
      ${rodaVidaResumoHtml()}
      <div class="area-chips area-filter-row" id="metasSubviewToggle" style="margin-bottom:14px;">
        <span class="area-chip ${mostraRecorrentes?'sel':''}" data-metasview="recorrentes" style="--chip:var(--accent);">Recorrentes</span>
        <span class="area-chip ${mostraPrazos?'sel':''}" data-metasview="prazos" style="--chip:var(--accent);">Prazos</span>
        ${mostraPrazos ? `<button class="bell-btn di-hoje ${homeSoHoje?'on':''}" id="metasSoHojeBtn" title="Mostrar só as metas de hoje" aria-pressed="${homeSoHoje?'true':'false'}" style="flex:0 0 auto;">hoje</button>` : ""}
      </div>
      ${metasAreaFiltroChipsHtml()}
      <div id="metasBody" style="padding-bottom:20px;"></div>
    </div>`;
    wireMetasAreaFiltroChips(el);
    // Toque em "Prazos"/"Recorrentes" alterna a presença no array — não troca
    // de tela como antes. Nunca deixa os dois desmarcados (senão a tela ficaria
    // vazia sem nenhum jeito óbvio de voltar).
    el.querySelectorAll("[data-metasview]").forEach(sp=>{
      sp.onclick = () => {
        const v = sp.dataset.metasview;
        const pos = metasSubviewSel.indexOf(v);
        if(pos >= 0){
          if(metasSubviewSel.length === 1) return;
          metasSubviewSel.splice(pos, 1);
        } else metasSubviewSel.push(v);
        save(K_METASSUBVIEWSEL, metasSubviewSel);
        render();
      };
    });
    if(mostraPrazos) el.querySelector("#metasSoHojeBtn").onclick = () => {
      homeSoHoje = !homeSoHoje;
      save(K_SOHOJE, homeSoHoje);
      render();
    };
    const body = el.querySelector("#metasBody");
    const fabMeta = document.createElement("button");
    fabMeta.className = "fab"; fabMeta.textContent = "+";
    fabMeta.id = "cdNovaBtn"; fabMeta.title = mostraPrazos ? "Nova meta" : "Nova meta recorrente";
    el.appendChild(fabMeta);
    el.appendChild(renderTabbar("metas"));
    app.appendChild(el);
    wireCfgBtn(el);

    function metaCardHtml(t){
      const d = daysUntil(t.date);
      const p = cdPace(t);
      const [y,m,dd] = t.date.split("-");
      const cls = d < 0 ? "late" : (d <= 7 ? "late" : d <= 30 ? "ontime" : "early");
      const esc = metaEscopo(t);
      const feita = metaConcluida(t);
      const areas = (t.areas||[]).map(metaAreaChipHtml).join("");
      return `
        <div class="stat-card" style="margin-bottom:10px; ${feita?'border-color:var(--good);':''}">
          <div class="dev-row" style="border:none; padding:0;">
            <span style="font-family:'Fraunces',serif; font-size:17px; flex:1;">${escapeHtml(t.title)}</span>
            <button class="icon-btn" data-cdedit="${t.id}" title="Editar meta" aria-label="Editar meta">${svgIcon(ICON_D.notes,14)}</button>
            <button class="del-exec" data-cddel="${t.id}" title="Remover meta" aria-label="Remover meta">${svgIcon(ICON_D.xmark,14)}</button>
          </div>
          ${areas ? `<div class="meta-areas" style="margin:6px 0 2px;">${areas}</div>` : ""}
          ${metaDiasChipHtml(t)}
          <div class="cd-big ${cls}">${d>=0 ? d : "+"+Math.abs(d)}<span> dia(s)${d<0?" atrás":""}</span></div>
          <div class="dev-n">${dd}/${m}/${y} · escopo ${ESCOPO_META_LABEL[esc]} · peso ${TAG_LABELS[t.tagValor || "alto"].toLowerCase()}</div>
          ${t.topics ? `<div class="dev-n" style="margin-top:2px;">boletim ${ESCOPO_META_LABEL[esc]}: <b style="color:var(--accent);">${metaCreditado(t).toFixed(1)}</b> de ${metaPontosTotais(t).toFixed(1)} pts · ${(metaPontosTotais(t)/t.topics).toFixed(2)} pts cada</div>` : ""}
          ${t.topics != null ? `
          <div class="cd-topics">
            <button class="ctrl-btn" style="width:36px;height:36px;font-size:15px;" data-cdminus="${t.id}" title="Menos um" aria-label="Menos um">&minus;</button>
            <span><input type="number" class="cd-done-inp" data-cddone="${t.id}" value="${t.done||0}" inputmode="numeric" min="0" max="${t.topics}"> / <input type="number" class="cd-done-inp" data-cdtotal="${t.id}" value="${t.topics}" inputmode="numeric" min="1"> ${escapeHtml(cdUnit(t))}</span>
            <button class="ctrl-btn" style="width:36px;height:36px;font-size:15px;" data-cdplus="${t.id}" title="Mais um" aria-label="Mais um">+</button>
          </div>
          <div class="dev-n" style="margin-top:4px;">ritmo necessário: <b style="color:${feita?'var(--good)':'var(--accent)'};">${p.txt}</b>${feita?" "+svgIcon(ICON_D.check,13):""}</div>` : ""}
          ${(t.nota||"").trim()
            ? `<div class="meta-nota" data-cdnotaview="${t.id}">${renderMdBlock(t.nota, "meta:"+t.id, "")}</div>
               <button class="link-btn" data-cdnota="${t.id}" style="margin-top:2px;">${svgIcon(ICON_D.notes,14)} editar anotação</button>`
            : `<button class="link-btn" data-cdnota="${t.id}" style="margin-top:8px;">+ anotação</button>`}
        </div>`;
    }

    function recCardHtml(rec){
      const feitas = metaRecFeitas(rec);
      const completa = rec.negativa ? !metaRecExcedida(rec) : metaRecCompleta(rec);
      const excesso = rec.negativa ? metaRecExcesso(rec) : 0;
      const areaChip = rec.area ? `<div class="sched-chip chip-block" style="color:${areaInfoRoda(rec.area).color};">${escapeHtml(areaInfoRoda(rec.area).label)}</div>` : "";
      const statusTxt = rec.negativa
        ? (excesso>0 ? `excedeu em ${excesso} · -${(excesso*-metaRecPenalidadeUnidade(rec)*fatorDaArea(rec.area||"")).toFixed(1)} pts · ` : "dentro do limite · ")
        : (completa?'concluída ✓ · ':'');
      const idxFull = doc.recorrentes.indexOf(rec);
      return `
        <div class="stat-card" style="margin-bottom:10px; ${rec.negativa ? (excesso>0?'border-color:var(--danger);':'border-color:var(--good);') : (completa?'border-color:var(--good);':'')}">
          <div class="dev-row" style="border:none; padding:0;">
            <span style="font-family:'Fraunces',serif; font-size:17px; flex:1;">${escapeHtml(rec.titulo)}${rec.negativa?' <span class="dev-n">(limite)</span>':''}</span>
            <button class="kb-move-btn" data-mrup="${rec.id}" title="Mover para cima" aria-label="Mover para cima" ${idxFull<=0?'disabled':''}>${svgIcon(ICON_D.arrowUp,14)}</button>
            <button class="kb-move-btn" data-mrdown="${rec.id}" title="Mover para baixo" aria-label="Mover para baixo" ${idxFull>=doc.recorrentes.length-1?'disabled':''}>${svgIcon(ICON_D.arrowDown,14)}</button>
            <button class="icon-btn" data-mredit="${rec.id}" title="Editar" aria-label="Editar">${svgIcon(ICON_D.notes,14)}</button>
            <button class="del-exec" data-mrdel="${rec.id}" title="Remover" aria-label="Remover">${svgIcon(ICON_D.xmark,14)}</button>
          </div>
          ${areaChip}
          <div class="dev-n" style="margin-top:2px;">${rec.negativa?'até ':''}${rec.vezes}&times; ${rec.tipo==='semanal'?'na semana':'ao dia'}${rec.notif?' · lembretes '+rec.notif.inicio+'–'+rec.notif.fim:''}</div>
          <div class="cd-topics">
            <button class="ctrl-btn" style="width:36px;height:36px;font-size:15px;" data-mrminus="${rec.id}" title="Menos um" aria-label="Menos um">&minus;</button>
            <span>${feitas} / ${rec.vezes}</span>
            <button class="ctrl-btn ${rec.negativa ? (excesso>0?'':'ok') : (completa?'ok':'')}" style="width:36px;height:36px;font-size:15px;" data-mrplus="${rec.id}" title="Mais um" aria-label="Mais um">+</button>
          </div>
          <div class="dev-n" style="margin-top:4px; color:${rec.negativa ? (excesso>0?'var(--danger)':'var(--good)') : (completa?'var(--good)':'var(--muted)')};">${statusTxt}${metaRecReiniciaEmTxt(rec)}</div>
        </div>`;
    }

    // Sempre reconstrói as duas seções (a que estiver visível) do zero — mesma
    // filosofia de "replace" do resto do app, só que agora as duas listas podem
    // conviver no mesmo #metasBody em vez de uma excluir a outra.
    function pintarTudo(){
      const partes = [];
      if(mostraPrazos){
        const sorted = [...doc.targets]
          .filter(t => !homeSoHoje || metaOcorreHoje(t))
          .filter(passaFiltroAreaMetaMulti)
          .sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
        if(ambos) partes.push(`<div class="section-label">Prazos</div>`);
        partes.push(sorted.map(metaCardHtml).join(""));
        if(doc.targets.length === 0){
          partes.push(`<div class="empty-state" style="min-height:25vh;"><h2>Nenhuma meta ainda</h2><p>Crie uma meta com prazo — os dias restantes, o ritmo e a pontuação se atualizam sozinhos.</p></div>`);
        } else if(sorted.length === 0){
          partes.push(`<div class="empty-state" style="min-height:25vh;"><h2>Nenhuma meta com esse filtro</h2><p>Desligue o "só hoje" ou troque a área para ver outras metas.</p></div>`);
        }
      }
      if(mostraRecorrentes){
        const lista = [...doc.recorrentes].filter(passaFiltroAreaRecMulti);
        if(ambos) partes.push(`<div class="section-label">Recorrentes</div>`);
        partes.push(lista.map(recCardHtml).join(""));
        if(doc.recorrentes.length === 0){
          partes.push(`<div class="empty-state" style="min-height:25vh;"><h2>Nenhuma meta recorrente</h2><p>Crie um hábito que repete algumas vezes por dia ou por semana — "beber água" 4x ao dia, "lavar o cabelo" 2x na semana.</p></div>`);
        } else if(lista.length === 0){

  /* ============ DESPESAS RÁPIDAS ============ */
  const EXP_CATS = ["Alimentação","Transporte","Moradia","Lazer","Saúde","Educação","Outros"];

  /* ---- Parsing de CSV de extrato (banco/cartão) ---- */
  function parseCsvText(text){
    text = String(text).replace(/^﻿/, "");
    const rawLines = text.split(/\r?\n/).filter(l=>l.trim().length);
    if(!rawLines.length) return { delimiter:";", rows:[] };
    // detecta delimitador pela 1ª linha (fora de aspas): ; , tab
    const sample = rawLines[0];
    const counts = { ";": (sample.match(/;/g)||[]).length, ",": (sample.match(/,/g)||[]).length, "\t": (sample.match(/\t/g)||[]).length };
    const delimiter = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0] || ";";
    function splitLine(line){
      const out = []; let cur = "", inQ = false;
      for(let i=0;i<line.length;i++){
        const ch = line[i];
        if(ch === '"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ = !inQ; }
        else if(ch === delimiter && !inQ){ out.push(cur); cur=""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(c=>c.trim());
    }
    const rows = rawLines.map(splitLine);
    return { delimiter, rows };
  }
  function parseBRNumber(s){
    if(s == null) return NaN;
    let t = String(s).trim().replace(/r\$/i,"").replace(/\s/g,"");
    if(!t) return NaN;
    let neg = false;
    if(/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
    if(/-/.test(t)){ neg = true; t = t.replace(/-/g,""); }
    // formato brasileiro (1.234,56) vs americano (1,234.56)
    const hasComma = t.indexOf(",")>=0, hasDot = t.indexOf(".")>=0;
    if(hasComma && hasDot){
      if(t.lastIndexOf(",") > t.lastIndexOf(".")) t = t.replace(/\./g,"").replace(",",".");
      else t = t.replace(/,/g,"");
    } else if(hasComma){ t = t.replace(",","."); }
    const v = parseFloat(t);
    if(isNaN(v)) return NaN;
    return neg ? -v : v;
  }
  function parseFlexDate(s){
    if(!s) return null;
    const t = String(s).trim();
    let m;
    if((m = t.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
    if((m = t.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/))){
      let y = m[3]; if(y.length===2) y = "20"+y;
      return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
    }
    return null;
  }
  function guessExpenseColumns(rows){
    // decide se a 1ª linha é cabeçalho
    const first = rows[0] || [];
    const headerLike = first.some(c=>/data|date|valor|value|hist|lan[çc]|descri|estabelec|montante|amount|d[eé]bito|cr[eé]dito|t[ií]tulo|memo/i.test(c));
    const header = headerLike ? first : null;
    const dataRows = headerLike ? rows.slice(1) : rows;
    const ncol = Math.max(...rows.map(r=>r.length));
    // pontuações por coluna
    let dateCol=-1, valCol=-1, descCol=-1;
    if(header){
      header.forEach((h,i)=>{
        if(dateCol<0 && /data|date/i.test(h)) dateCol=i;
        if(valCol<0 && /valor|value|montante|amount|d[eé]bito/i.test(h)) valCol=i;
        if(descCol<0 && /descri|hist|lan[çc]|estabelec|memo|t[ií]tulo/i.test(h)) descCol=i;
      });
    }
    // heurística por conteúdo se não achou
    const sampleRows = dataRows.slice(0, 20);
    if(dateCol<0){
      for(let i=0;i<ncol;i++){ if(sampleRows.filter(r=>parseFlexDate(r[i])).length >= Math.max(1, sampleRows.length*0.6)){ dateCol=i; break; } }
    }
    if(valCol<0){
      let best=-1, bestScore=-1;
      for(let i=0;i<ncol;i++){
        if(i===dateCol) continue;
        const score = sampleRows.filter(r=>!isNaN(parseBRNumber(r[i])) && r[i] && /\d/.test(r[i])).length;
        if(score>bestScore){ bestScore=score; best=i; }
      }
      valCol = best;
    }
    if(descCol<0){
      let best=-1, bestLen=-1;
      for(let i=0;i<ncol;i++){
        if(i===dateCol || i===valCol) continue;
        const avg = sampleRows.reduce((a,r)=>a+((r[i]||"").length),0)/(sampleRows.length||1);
        if(avg>bestLen){ bestLen=avg; best=i; }
      }
      descCol = best;
    }
    return { header, dataRows, ncol, dateCol, valCol, descCol };
  }

  const CAT_COLORS = ["#EC6AA8","#5B8DEF","#6B8F71","#C9B23E","#B25B4C","#9C7BB8","#8A8478"];
  function catColor(cat){ const i = EXP_CATS.indexOf(cat); return CAT_COLORS[i>=0 ? i % CAT_COLORS.length : CAT_COLORS.length-1]; }
  function donutSvg(segments, total){
    const R=52, C=2*Math.PI*R, cx=64, cy=64, sw=22;
    let acc=0;
    const arcs = segments.filter(s=>s.value>0).map(s=>{
      const frac = total>0 ? s.value/total : 0;
      const dash = frac*C;
      const seg = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 ${cx} ${cy})"/>`;
      acc += frac;
      return seg;
    }).join("");
    return `<svg viewBox="0 0 128 128" width="118" height="118" style="flex:0 0 auto;">${arcs}<circle cx="${cx}" cy="${cy}" r="${R-sw/2-1}" fill="var(--surface)"/></svg>`;
  }

  /* ============ DESPESAS (pasta única — cada lançamento é a própria nota) ============ */
  function expenseDocs(){ return templates.filter(t=>t.type==="expense"); }
  function isoWeekStart(dateStr){
    return inicioSemanaISO(new Date(dateStr+"T12:00:00"));
  }
  function chartsBucketKey(dateStr, period){
    if(period==="semana") return isoWeekStart(dateStr);
    if(period==="trimestre"){ const y=dateStr.slice(0,4), m=+dateStr.slice(5,7); return y+"-T"+(Math.floor((m-1)/3)+1); }
    if(period==="ano") return dateStr.slice(0,4);
    return dateStr.slice(0,7);
  }
  function chartsBucketLabel(key, period){
    if(period==="semana") return key.slice(8,10)+"/"+key.slice(5,7);
    if(period==="mes") return key.slice(5,7)+"/"+key.slice(2,4);
    return key;
  }
  function chartsPeriodUnit(p){ return {semana:"semana", mes:"mês", trimestre:"trimestre", ano:"ano"}[p]; }
  function renderExpenseFolder(){
    const el = document.createElement("div");
    el.className = "screen with-tabbar";

      <h1><span id="expBackBtn" style="cursor:pointer; color:var(--muted); font-size:22px;">${svgIcon(ICON_D.chevronLeft,18)}</span> ${svgIcon(ICON_D.expense)} Despesas</h1>

    fabExp.className = "fab"; fabExp.textContent = "+";
    fabExp.id = "exNovaBtn"; fabExp.title = "Nova despesa";
    el.appendChild(fabExp);
    el.appendChild(renderTabbar("templates"));

    document.getElementById("expBackBtn").onclick = () => { goTo({ tab:"templates", screen:"templates" }); };

    let exView = "lista", exEditingId = null, exImport = null;
    let folderQuery = "", folderFrom = "", folderTo = "", folderCat = "";
    let chartsPeriod = "mes";

    function filteredDocs(){
      let arr = expenseDocs();
      const q = folderQuery.trim().toLowerCase();
      if(q) arr = arr.filter(e => (e.desc||"").toLowerCase().includes(q) || (e.cat||"").toLowerCase().includes(q));
      if(folderFrom) arr = arr.filter(e => e.date >= folderFrom);
      if(folderTo) arr = arr.filter(e => e.date <= folderTo);
      if(folderCat) arr = arr.filter(e => e.cat === folderCat);
      return arr;
    }

    function chartsHtml(docs){
      const byBucket = {};
      docs.forEach(e=>{ const k = chartsBucketKey(e.date, chartsPeriod); byBucket[k] = (byBucket[k]||0) + e.value; });
      const buckets = Object.keys(byBucket).sort();
      const maxB = Math.max(...buckets.map(b=>byBucket[b]), 1);
      const trend = buckets.slice(-8).map(b=>{
        const h = Math.max(4, Math.round(byBucket[b]/maxB*60));
        return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;">
          <div class="bar-val" style="width:auto; font-size:10px;">${brl(byBucket[b]).replace("R$ ","")}</div>
          <div class="trend-bar ontime" style="height:${h}px; width:60%;"></div>
          <div class="dev-n" style="font-size:10px;">${chartsBucketLabel(b, chartsPeriod)}</div>
        </div>`;
      }).join("");

      const byCat = {};
      docs.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + e.value; });
      const total = Object.values(byCat).reduce((a,v)=>a+v,0);
      const segs = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>({label:c, value:v, color:catColor(c)}));
      const legend = segs.map(s=>`<div class="bar-row" style="margin:5px 0;">
        <span style="width:10px; height:10px; border-radius:3px; background:${s.color}; flex:0 0 auto;"></span>
        <div class="bar-name" style="width:auto; flex:1;">${escapeHtml(s.label)}</div>
        <div class="bar-val">${brl(s.value)}</div>
      </div>`).join("");

      const avgBucket = buckets.length ? (buckets.reduce((a,b)=>a+byBucket[b],0) / buckets.length) : 0;
      const curKey = chartsBucketKey(localKey(), chartsPeriod);
      const curDocs = docs.filter(e => chartsBucketKey(e.date, chartsPeriod) === curKey);
      const curTotal = curDocs.reduce((a,e)=>a+e.value,0);
      const curByCat = {};
      curDocs.forEach(e=>{ curByCat[e.cat] = (curByCat[e.cat]||0) + e.value; });
      const topCat = Object.entries(curByCat).sort((a,b)=>b[1]-a[1])[0];
      const periodLabel = chartsPeriodUnit(chartsPeriod) + " atual";

      return `
        <div class="type-toggle" id="chartsPeriodToggle" style="margin-bottom:12px;">
          ${["semana","mes","trimestre","ano"].map(p=>`<span data-cperiod="${p}" class="${chartsPeriod===p?'active':''}">${chartsPeriodUnit(p)}</span>`).join("")}
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
          <div class="stat-card" style="text-align:center;"><div class="dev-n">média por ${chartsPeriodUnit(chartsPeriod)}</div><b style="font-size:17px;">${brl(avgBucket)}</b></div>
          <div class="stat-card" style="text-align:center;"><div class="dev-n">total ${periodLabel}</div><b style="font-size:17px;">${brl(curTotal)}</b></div>
          <div class="stat-card" style="text-align:center;"><div class="dev-n">maior categoria (${periodLabel})</div><b style="font-size:14px;">${topCat?escapeHtml(topCat[0])+" · "+brl(topCat[1]):"—"}</b></div>
          <div class="stat-card" style="text-align:center;"><div class="dev-n">lançamentos (${periodLabel})</div><b style="font-size:17px;">${curDocs.length}</b></div>
        </div>
        <div class="section-label">Total por ${chartsPeriodUnit(chartsPeriod)}</div>
        <div class="stat-card"><div style="display:flex; align-items:flex-end; gap:6px; min-height:90px;">${trend||'<div class="dev-n">sem dados</div>'}</div></div>
        <div class="section-label">Por categoria</div>
        <div class="stat-card" style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <div style="position:relative; flex:0 0 auto;">${donutSvg(segs, total)}
            <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
              <div style="font-size:11px; color:var(--muted);">total</div>
              <div style="font-family:'Inter', sans-serif; font-size:13px;">${brl(total)}</div>
            </div>
          </div>
          <div style="flex:1; min-width:140px;">${legend || '<div class="dev-n">sem dados</div>'}</div>
        </div>`;
    }

    function paintResults(){
      const resultsBox = document.getElementById("exResultsBox");
      if(!resultsBox) return;

      if(exView === "graficos"){
        resultsBox.innerHTML = docs.length ? chartsHtml(docs) : `<div class="empty-state" style="min-height:25vh;"><p>Sem dados para visualizar ainda.</p></div>`;
        resultsBox.querySelectorAll("[data-cperiod]").forEach(sp=> sp.onclick = () => { chartsPeriod = sp.dataset.cperiod; paintResults(); });

      const byMonth = {};

        html += `<div class="section-label">${mk.slice(5,7)}/${mk.slice(0,4)} — total ${brl(tot)}</div>

      resultsBox.innerHTML = html;

      resultsBox.querySelectorAll("[data-exdel]").forEach(b=> b.onclick = () => {
        const idx = templates.findIndex(x=>x.id===b.dataset.exdel);
        const removed = idx>-1 ? templates[idx] : null;

    function computeImportPreview(){
      const { dataRows, map, sign } = exImport;
      const parsed = [];
      let skipped = 0;
      dataRows.forEach(r=>{
        const date = parseFlexDate(r[map.date]);
        const rawVal = parseBRNumber(r[map.val]);
        const desc = (r[map.desc]||"").trim();
        if(!date || isNaN(rawVal)){ skipped++; return; }
        let value;
        if(sign === "neg"){ if(rawVal >= 0) return; value = -rawVal; }
        else if(sign === "pos"){ if(rawVal <= 0) return; value = rawVal; }
        else { value = Math.abs(rawVal); }
        if(value === 0) return;
        parsed.push({ date, desc: desc || "(sem descrição)", value });
      });
      return { parsed, skipped };
    }

        <div class="stat-card">${sample || '<div class="dev-n">Nenhum lançamento reconhecido com esse mapeamento.</div>'}</div>
        <div class="bottom-actions" style="position:static; background:none; padding:14px 0 0;">
          <button class="btn-cancel" id="impCancelEx">Cancelar</button>
          <button class="btn-primary" id="impConfirmEx" ${parsed.length?'':'disabled'}>Importar ${parsed.length}</button>
        </div>`;
      const remap = () => {
        exImport.map.date = +document.getElementById("impDate").value;
        exImport.map.desc = +document.getElementById("impDesc").value;
        exImport.map.val = +document.getElementById("impVal").value;
        exImport.sign = document.getElementById("impSign").value;
        paintImport();
      };
      ["impDate","impDesc","impVal","impSign"].forEach(id=> document.getElementById(id).onchange = remap);
      document.getElementById("impCancelEx").onclick = () => { exImport = null; paint(); };
      document.getElementById("impConfirmEx").onclick = () => {
        const res = computeImportPreview();
        res.parsed.forEach(e=> doc.entries.push({ id: uid(), desc: e.desc, value: +e.value.toFixed(2), cat: "Outros", date: e.date }));
        saveTemplates(doc);
        const n = res.parsed.length;
        exImport = null;
        showAlertBanner(n + " lançamento(s) importado(s) ✓");
        paint();
      };
    }

    if(exImport) paintImport(); else paint();

    const csvFile = document.getElementById("exCsvFile");
    document.getElementById("exImportBtn").onclick = () => csvFile.click();
    csvFile.onchange = ev => {
      const file = ev.target.files && ev.target.files[0];
      ev.target.value = "";
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const { rows } = parseCsvText(String(reader.result));
        if(!rows.length){ showAlertBanner("CSV vazio ou ilegível"); return; }
        const g = guessExpenseColumns(rows);
        if(g.dateCol<0 || g.valCol<0){ showAlertBanner("Não reconheci colunas de data e valor — confira o arquivo"); return; }
        const anyNeg = g.dataRows.some(r=> parseBRNumber(r[g.valCol]) < 0);
        exImport = { dataRows: g.dataRows, guess: g, map:{ date:g.dateCol, val:g.valCol, desc: g.descCol>=0?g.descCol:0 }, sign: anyNeg ? "neg" : "abs" };
        paintImport();
      };
      reader.readAsText(file, "utf-8");
    };
    document.getElementById("exCsv").onclick = () => {
      const rows = [["data","descricao","valor","categoria"]];
      [...doc.entries].sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        rows.push([e.date, e.desc.replace(/;/g,","), e.value.toFixed(2).replace(".",","), e.cat]);
      });
      const csv = "\ufeff" + rows.map(r=>r.join(";")).join("\n");
      downloadFile(slugify(doc.title) + ".csv", csv, "text/csv;charset=utf-8", "Despesas");
      showAlertBanner("CSV exportado ✓");
    };
  }

  /* ============ PRÓS E CONTRAS ============ */
  function prosconsMd(doc){
    const ps = doc.pros.reduce((a,i)=>a+i.w,0), cs = doc.cons.reduce((a,i)=>a+i.w,0);
    let md = "# " + doc.title + "\n\n## Prós (" + ps + ")\n";
    doc.pros.forEach(i=>{ md += "- " + i.text + " (peso " + i.w + ")\n"; });
    md += "\n## Contras (" + cs + ")\n";
    doc.cons.forEach(i=>{ md += "- " + i.text + " (peso " + i.w + ")\n"; });
    md += "\n**Placar: " + (ps-cs>0?"+":"") + (ps-cs) + "** — " + (ps>cs?"prós vencem":cs>ps?"contras vencem":"empate") + "\n";
    return md;
  }

      const verdict = ps>cs ? `<b class="early" style="color:var(--good);">prós vencem (+${ps-cs})</b>` : cs>ps ? `<b class="late">contras vencem (&minus;${cs-ps})</b>` : `<b class="ontime">empate</b>`;
      body.innerHTML = `<div class="stat-card" style="margin-bottom:12px; text-align:center;"><div class="cd-big ontime" style="font-size:34px;">${ps} &times; ${cs}</div><div>${verdict}</div></div>`;
      [["pros","Prós","#6B8F71"],["cons","Contras","#B25B4C"]].forEach(([key,label,color])=>{

      });
      body.querySelectorAll("[data-pcadd]").forEach(inp=>{
        inp.onkeydown = e => { if(e.key==="Enter" && inp.value.trim()){ doc[inp.dataset.pcadd].push({ id:uid(), text:inp.value.trim(), w:3 }); saveTemplates(doc); paint(); } };

  /* ============ LISTA DE VIAGEM ============ */
  /* Lista de viagem — reaproveita a estrutura da lista de mercado:
     "gôndolas" viram categorias de viagem, sempre visíveis (inclusive vazias). */
  const TRAVEL_DB = {
    "Documentos": ["passaporte","rg","cnh","passagens","reserva do hotel","cartão de embarque","seguro viagem","dinheiro","cartão de crédito","vistos","comprovante de vacina"],
    "Roupas": ["camisas","camisetas","calças","shorts","roupa íntima","cuecas","calcinhas","meias","casaco","blusa de frio","pijama","roupa de banho","biquíni","sunga","vestido"],
    "Calçados": ["tênis","chinelo","sandália","sapato social","bota"],
    "Higiene": ["escova de dente","pasta de dente","shampoo","condicionador","sabonete","desodorante","protetor solar","escova de cabelo","aparelho de barbear","absorvente","fio dental","cotonete"],
    "Saúde": ["remédios","analgésico","band-aid","álcool gel","repelente","antialérgico","pomada"],
    "Eletrônicos": ["carregador","power bank","fones de ouvido","adaptador de tomada","câmera","cabo usb","notebook","kindle"],
    "Acessórios": ["óculos de sol","boné","chapéu","guarda-chuva","mochila","cadeado","garrafa de água","travesseiro de pescoço","necessaire"]
  };
  const TRAVEL_CATS = Object.keys(TRAVEL_DB).concat(["Outros"]);
  function guessTravelCat(name){
    const n = (name||"").trim().toLowerCase();
    for(const [cat, items] of Object.entries(TRAVEL_DB)){
      if(items.some(it => n === it || n.includes(it) || (it.includes(n) && n.length >= 4))) return cat;
    }
    return "Outros";
  }
  function travelMigrate(doc){
    if(!doc.items){
      doc.items = [];
      if(doc.sections){
        doc.sections.forEach(s=>{ (s.items||[]).forEach(it=>{
          doc.items.push({ id: it.id||uid(), name: it.text||it.name||"", cat: TRAVEL_CATS.includes(s.title)?s.title:"Outros", qty: it.qty||1, checked: !!it.checked });
        }); });
        delete doc.sections;
      }
    }
    if(!doc.catOrder) doc.catOrder = [...TRAVEL_CATS];
  }
  function travelMd(doc){
    travelMigrate(doc);
    let md = "# " + doc.title + "\n";
    const byCat = {};
    doc.items.forEach(it=>{ (byCat[it.cat||"Outros"] = byCat[it.cat||"Outros"]||[]).push(it); });
    doc.catOrder.concat(Object.keys(byCat).filter(c=>!doc.catOrder.includes(c))).forEach(cat=>{
      const list = byCat[cat]; if(!list || !list.length) return;
      md += "\n## " + cat + "\n" + list.map(i=>(i.checked?"- [x] ":"- [ ] ")+i.name+(i.qty&&i.qty>1?" ×"+i.qty:"")).join("\n") + "\n";
    });
    return md;
  }

    let tvEditing = null;

              <input type="number" class="tv-e-qty" inputmode="numeric" min="1" value="${it.qty||1}" style="width:64px;">

          </div>`).join("") || `<div class="dev-n" style="padding:4px 2px; opacity:.6;">— vazia —</div>`;
        body.innerHTML += `<div class="section-label">${escapeHtml(cat)}</div><div class="stat-card" style="padding:10px 14px;">${rows}</div>`;
      });
      if(doc.items.length === 0) body.innerHTML += `<div class="empty-state" style="min-height:25vh;"><p>Adicione itens — eles serão agrupados por categoria.</p></div>`;

      body.querySelectorAll("[data-tvcheck]").forEach(b=> b.onclick = () => { const it=doc.items.find(x=>x.id===b.dataset.tvcheck); it.checked=!it.checked; saveTemplates(doc); paint(); });
      body.querySelectorAll("[data-tvedit]").forEach(s=> s.onclick = () => { tvEditing = s.dataset.tvedit; paint(); });
      body.querySelectorAll("[data-tvsave]").forEach(b=> b.onclick = () => {
        const it = doc.items.find(x=>x.id===b.dataset.tvsave);
        const row = body.querySelector(`[data-editrow="${it.id}"]`);
        it.name = row.querySelector(".mk-e-name").value.trim() || it.name;
        it.cat = row.querySelector(".tv-e-cat").value;
        it.qty = Math.max(1, +row.querySelector(".tv-e-qty").value || 1);
        tvEditing = null; saveTemplates(doc); paint();
      });
      body.querySelectorAll("[data-tvdel]").forEach(b=> b.onclick = () => {
        const idx = doc.items.findIndex(x=>x.id===b.dataset.tvdel);
        const removed = idx>-1 ? doc.items[idx] : null;
        doc.items = doc.items.filter(x=>x.id!==b.dataset.tvdel); tvEditing = null; saveTemplates(doc); paint();
        if(removed) showUndoBanner("Item removido", ()=>{
          doc.items.splice(Math.min(idx, doc.items.length), 0, removed); saveTemplates(doc); paint();
        });

      body.querySelectorAll("[data-tvcancel]").forEach(b=> b.onclick = () => { tvEditing = null; paint(); });
