    "Pet": ["ração","areia de gato","petisco"]
  };
  const AISLES = Object.keys(GROCERY_DB).concat(["Outros"]);
  function guessAisle(name){
    const n = name.trim().toLowerCase();
    if(mkFreq[n] && mkFreq[n].aisle) return mkFreq[n].aisle;
    for(const [aisle, items] of Object.entries(GROCERY_DB)){
      if(items.some(it => n === it || n.includes(it) || (it.includes(n) && n.length >= 4))) return aisle;
    }
    return "Outros";
  }
  function brl(v){ return "R$ " + (v||0).toFixed(2).replace(".",","); }

  const MATRIX_COLORS = ["#EC6AA8","#5B8DEF","#6B8F71","#C9B23E","#B25B4C","#9C7BB8"];

  /* ---- helpers de exportação ---- */
  async function copyMarkdown(md){
    try{
      await navigator.clipboard.writeText(md);
      showAlertBanner("Markdown copiado ✓");
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = md; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); showAlertBanner("Markdown copiado ✓"); }catch(_){ showAlertBanner("Não foi possível copiar"); }
      ta.remove();
    }
  }
  function exportPdfView(title, innerHtml, subpasta){
    if(isNative){
      // WebView não suporta window.print(): salva o HTML e abre o share sheet
      const html = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>' + title + '</title></head><body style="font-family:Georgia,serif;color:#222;margin:28px;line-height:1.5;">' + innerHtml + '</body></html>';
      shareOrDownload(slugify(title || "documento") + ".html", html, "text/html", subpasta);
      return;
    }
    const w = window.open("", "_blank");
    if(!w){ showAlertBanner("Permita pop-ups para gerar o PDF"); return; }
    w.document.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>' + title + '</title><style>' +
      'body{font-family:Georgia,serif;color:#222;margin:28px;line-height:1.5;}' +
      'h1{font-size:22px;margin:0 0 14px;} h2{font-size:15px;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;}' +
      'ul{margin:4px 0;padding-left:20px;} li{margin:2px 0;font-size:13px;}' +
      '.done{color:#888;text-decoration:line-through;} .meta{color:#666;font-size:12px;}' +
      '.mxgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}' +
      '.mxq{border:2px solid;border-radius:8px;padding:10px;} .mxq h2{border:none;margin:0 0 6px;padding:0;}' +
      '.sub{margin-left:18px;} .score{font-size:15px;font-weight:bold;margin-top:10px;}' +
      '@media print{ body{margin:12mm;} }' +
      '</style></head><body>' + innerHtml + '</body></html>');
    w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 450);
  }

  function newTemplateDoc(type, preset){
    const doc = { id: uid(), type, updatedAt: Date.now(), createdAt: Date.now() };
    if(type === "market"){
      doc.title = nomeAutoDoc();
      doc.items = [];
      doc.aisleOrder = [...AISLES];
      doc.shopMode = false;
    } else if(type === "matrix"){
      doc.title = nomeAutoDoc();
      if(preset === "swot"){
        doc.axisX = "Ajuda ↔ Atrapalha"; doc.axisY = "Interno ↕ Externo";
        doc.quadrants = [
          { title:"Forças", color:"#6B8F71", mode:"ul", items:[] },
          { title:"Fraquezas", color:"#B25B4C", mode:"ul", items:[] },
          { title:"Oportunidades", color:"#5B8DEF", mode:"ul", items:[] },
          { title:"Ameaças", color:"#C9B23E", mode:"ul", items:[] }
        ];
      } else if(preset === "blank"){
        doc.axisX = ""; doc.axisY = "";
        doc.quadrants = [1,2,3,4].map(i=>({ title:"Quadrante "+i, color:MATRIX_COLORS[i-1], mode:"ul", items:[] }));
      } else {
        doc.axisX = "Urgência"; doc.axisY = "Importância";
        doc.quadrants = [
          { title:"Urgente e importante", color:"#B25B4C", mode:"check", items:[] },
          { title:"Importante, não urgente", color:"#5B8DEF", mode:"check", items:[] },
          { title:"Urgente, não importante", color:"#C9B23E", mode:"check", items:[] },
          { title:"Nem urgente nem importante", color:"#6B8F71", mode:"check", items:[] }
        ];
      }
    } else if(type === "kanban"){
      doc.title = nomeAutoDoc();
      doc.cols = [ {title:"A fazer", items:[]}, {title:"Fazendo", items:[]}, {title:"Feito", items:[]} ];
    } else if(type === "countdown"){
      doc.title = "Contagens regressivas";
      doc.targets = [];
    } else if(type === "expenses"){
      doc.title = nomeAutoDoc();
      doc.entries = [];
    } else if(type === "proscons"){
      doc.title = nomeAutoDoc();
      doc.pros = []; doc.cons = [];
    } else if(type === "travel"){
      doc.title = nomeAutoDoc();
      doc.items = [];
      doc.catOrder = Object.keys(TRAVEL_DB).concat(["Outros"]);
    } else if(type === "scoreboard"){
      doc.title = nomeAutoDoc();
      doc.players = [{ id: uid(), name:"" }, { id: uid(), name:"" }];
      doc.rounds = [];
      doc.higherWins = true;
    } else if(type === "thoughtrecord"){
      doc.title = nomeAutoDoc();
      doc.trigger = "";
      doc.emotions = "";
      doc.distortion = "";
      doc.altThoughts = "";
      doc.results = "";
    }
    templates.push(doc);
    save(K_TEMPLATES, templates);
    syncDocMd(doc);
    return doc;
  }
  /* "Contagem regressiva" é um doc único e compartilhado — todos os alvos ficam juntos, não espalhados em docs separados */
  function getOrCreateCountdownDoc(){
    const existing = templates.filter(t=>t.type==="countdown").sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    if(existing) return existing;
    return newTemplateDoc("countdown");
  }
  function saveTemplates(doc){ doc.updatedAt = Date.now(); save(K_TEMPLATES, templates); syncDocMd(doc); }

  function tmplMeta(t){
    if(t.type === "market"){ const p = (t.items||[]).filter(i=>!i.checked).length; return p + " pendente(s) de " + (t.items||[]).length; }
    if(t.type === "matrix") return (t.quadrants||[]).map(q=>q.items.length).reduce((a,b)=>a+b,0) + " item(ns)";
    if(t.type === "kanban") return (t.cols||[]).map(c=>c.items.length).join(" / ");
    if(t.type === "countdown"){
      const next = (t.targets||[]).map(x=>({...x, days: daysUntil(x.date)})).filter(x=>x.days>=0).sort((a,b)=>a.days-b.days)[0];
      return next ? escapeHtml(next.title) + " em " + next.days + "d" : (t.targets||[]).length + " alvo(s)";
    }
    if(t.type === "expenses"){
      const mk = localKey().slice(0,7);
      const tot = (t.entries||[]).filter(e=>e.date.startsWith(mk)).reduce((a,e)=>a+e.value,0);
      return brl(tot) + " este mês";
    }
    if(t.type === "proscons"){
      const s = (t.pros||[]).reduce((a,i)=>a+i.w,0) - (t.cons||[]).reduce((a,i)=>a+i.w,0);
      return "placar " + (s>0?"+":"") + s;
    }
    if(t.type === "travel"){
      const all = t.items || (t.sections||[]).flatMap(s=>s.items);
      return all.filter(i=>!i.checked).length + " pendente(s) de " + all.length;
    }
    if(t.type === "journal"){
      return (t.sections||[]).length + " anotação(ões)";
    }
    if(t.type === "thoughtrecord"){
      return t.trigger ? stripMdForSnippet(t.trigger) : "sem gatilho registrado";
    }
    if(t.type === "scoreboard"){
      const lid = sbLideres(t);
      if(!lid.length) return (t.players||[]).length + " jogador(es) · sem turnos";
      const tot = sbTotais(t);
      const nomes = lid.map(id=>sbNome(t.players.find(p=>p.id===id), t.players.findIndex(p=>p.id===id)));
      return (t.rounds||[]).length + " turno(s) · " + escapeHtml(nomes.join(", ")) + " " + tot[lid[0]];
    }
    return "";
  }
  function daysUntil(dateStr){
    const target = new Date(dateStr + "T12:00:00");
    const today = new Date(); today.setHours(12,0,0,0);
    return Math.round((target - today)/86400000);
  }

  /* Duas famílias de pasta, apresentadas em seções separadas: as fixas (uma por
     tipo de modelo, criadas à mão) e as de rotina (uma por rotina que gera notas
     de journaling, criadas sozinhas ao executar a rotina). */
  /* dias (escopo "dia" do Diário) cujo texto da anotação não está vazio —
     não conta o kanban, só o que foi escrito na nota do dia. */
  function diarioDiasComAnotacao(){
    return Object.keys(diario)
      .filter(k=>k.startsWith("dia:") && (diario[k]||"").trim())
      .map(k=>k.slice(4))
      .sort((a,b)=>b.localeCompare(a));
  }
  function templateFolderTiles(){

      ...TMPL_TYPES.map(t=>({ key:t.type, icon:t.icon, label:t.label }))
    ];
    const porKey = key => todas.find(f=>f.key===key);
    return {
      secoes: TMPL_SECOES.map(s=>({ key:s.key, label:s.label, tiles: s.tipos.map(porKey).filter(Boolean) })),
      rotinas: journalRoutineIds.map(rid=>{
        const r = routines.find(x=>x.id===rid);
        return { key:"journal:"+rid, icon:svgIcon(ICON_D.notes,14), label: escapeHtml(r ? r.name : "Rotina excluída") };

  /* multiselect de tags: valores existentes viram chips removíveis, digitar + Enter/,
     cria uma tag nova, sugestões (prefix-match) aparecem enquanto digita */
  function mountTagInput(container, values, suggestions, onChange){
    function paint(){
      container.innerHTML = `<div class="tag-input-box">
        ${values.map((v,i)=>`<span class="tag-input-chip">${escapeHtml(v)}<button data-rmtag="${i}" title="Remover" aria-label="Remover">${svgIcon(ICON_D.xmark,14)}</button></span>`).join("")}
        <input type="text" class="tag-input-field" id="tagInputField" placeholder="${values.length?'':'digite e pressione Enter…'}">
      </div>
      <div class="tag-input-suggest" id="tagInputSuggest"></div>`;
      container.querySelectorAll("[data-rmtag]").forEach(b=> b.onclick = () => {
        values.splice(+b.dataset.rmtag, 1);
        onChange([...values]); paint();
      });
      const field = container.querySelector("#tagInputField");
      const suggestBox = container.querySelector("#tagInputSuggest");
      function addTag(raw){
        const v = raw.trim();
        if(!v || values.includes(v)) return;
        values.push(v);
        onChange([...values]); paint();
      }
      function renderSuggest(){
        const q = field.value.trim().toLowerCase();
        const pool = suggestions.filter(s=>!values.includes(s));
        const matches = (q ? pool.filter(s=>s.toLowerCase().startsWith(q)) : pool).slice(0,8);
        suggestBox.innerHTML = matches.map(m=>`<span class="tag-chip" data-sug="${escapeHtml(m)}">${escapeHtml(m)}</span>`).join("");
        suggestBox.querySelectorAll("[data-sug]").forEach(s=> s.onclick = () => { addTag(s.dataset.sug); });
      }
      field.oninput = renderSuggest;
      field.onfocus = renderSuggest;
      field.onkeydown = e => {
        if(e.key==="Enter" || e.key===","){ e.preventDefault(); addTag(field.value); }
        else if(e.key==="Backspace" && !field.value && values.length){ values.pop(); onChange([...values]); paint(); }
      };
      renderSuggest();
    }
    paint();
  }

  /* ============ REGISTRO DE PONTOS (placar por turno) ============
     Layout pensado para uso com o jogo em andamento: uma grade única em que as
     colunas são os jogadores e as linhas são os turnos, com a linha de totais
     logo abaixo dos nomes — assim o placar fica alinhado com as colunas e é lido
     de relance, sem duplicar informação em outro card. */
  function sbTotais(doc){
    const tot = {};
    (doc.players||[]).forEach(p=>{ tot[p.id] = 0; });
    (doc.rounds||[]).forEach(r=>{
      (doc.players||[]).forEach(p=>{
        const v = r.scores ? r.scores[p.id] : null;
        if(typeof v === "number") tot[p.id] += v;
      });
    });
    return tot;
  }
  /* pode haver empate na liderança — devolve todos os ids no topo */
  function sbLideres(doc){
    const tot = sbTotais(doc);
    const ids = Object.keys(tot);
    if(!ids.length || !(doc.rounds||[]).length) return [];
    const vals = ids.map(id=>tot[id]);
    const alvo = doc.higherWins === false ? Math.min(...vals) : Math.max(...vals);
    return ids.filter(id=>tot[id] === alvo);
  }
  function sbNome(p, i){ return (p.name||"").trim() || ("Jogador " + (i+1)); }
  function scoreboardMd(doc){
    const tot = sbTotais(doc);
    const nomes = (doc.players||[]).map(sbNome);
    let md = "# " + (doc.title||"Registro de pontos") + "\n\n";
    if(!nomes.length) return md + "_sem jogadores_\n";
    md += "| Turno | " + nomes.join(" | ") + " |\n";
    md += "|---|" + nomes.map(()=>"---:").join("|") + "|\n";
    (doc.rounds||[]).forEach((r,ri)=>{
      md += "| " + (ri+1) + " | " + doc.players.map(p=>{
        const v = r.scores ? r.scores[p.id] : null;
        return typeof v === "number" ? String(v) : "–";
      }).join(" | ") + " |\n";
    });
    md += "| **Total** | " + doc.players.map(p=>"**"+tot[p.id]+"**").join(" | ") + " |\n";
    const lid = sbLideres(doc);
    if(lid.length) md += "\n" + (lid.length>1 ? "Empate na liderança: " : "Liderando: ")
      + lid.map(id=>sbNome(doc.players.find(p=>p.id===id), doc.players.findIndex(p=>p.id===id))).join(", ")
      + " (" + tot[lid[0]] + ")\n";
    return md;
  }

  function renderScoreboardDoc(doc){
    if(!doc.players) doc.players = [];
    if(!doc.rounds) doc.rounds = [];
    if(doc.higherWins === undefined) doc.higherWins = true;
    const el = document.createElement("div");
    el.className = "screen";
    tmplHeader(el, doc, "");
    const body = document.createElement("div");
    body.style.cssText = "overflow-y:auto; flex:1; padding-bottom:20px;";
    el.appendChild(body);
    app.appendChild(el);

    function resumoHtml(){
      const tot = sbTotais(doc), lideres = sbLideres(doc);
      const nome = id => escapeHtml(sbNome(doc.players.find(p=>p.id===id), doc.players.findIndex(p=>p.id===id)));
      const lid = lideres.length
        ? ` · ${lideres.length>1?"empate entre":"liderando:"} ${lideres.map(nome).join(", ")} (${tot[lideres[0]]})`
        : "";
      return `${doc.rounds.length} turno(s) · ${doc.players.length} jogador(es)${lid}`;
    }
    function paint(focar){
      const tot = sbTotais(doc);
      const lideres = sbLideres(doc);
      const n = doc.players.length;
      // colunas elásticas (minmax(0,1fr)) para caber sempre na largura da tela;
      // a partir de 4 jogadores a tipografia encolhe junto em vez de rolar
      const cols = `26px repeat(${n}, minmax(0, 1fr)) 26px`;
      const densidade = n >= 6 ? "mini" : (n >= 4 ? "compacto" : "");
      body.innerHTML = `
        <div class="sb-toolbar">
          <button class="bell-btn di-hoje" id="sbAddPlayer">+ jogador</button>
          <div class="type-toggle" id="sbWin">
            <span data-sbwin="1" class="${doc.higherWins!==false?'active':''}">maior vence</span>
            <span data-sbwin="0" class="${doc.higherWins===false?'active':''}">menor vence</span>
          </div>
        </div>
        ${n === 0 ? `<div class="empty-state" style="min-height:25vh;"><h2>Sem jogadores</h2><p>Toque em <b>+ jogador</b> para montar o placar.</p></div>` : `
        <div class="sb-scroll">
          <div class="sb-grid ${densidade}" style="grid-template-columns:${cols};">
            <div class="sb-h sb-idx">#</div>
            ${doc.players.map((p,pi)=>`<div class="sb-h">
              <input type="text" class="sb-name" data-sbname="${pi}" value="${escapeHtml(p.name||"")}" placeholder="J${pi+1}">
              ${n>1 ? `<button class="del-exec sb-delp" data-sbdelp="${pi}" title="Remover jogador" aria-label="Remover jogador">${svgIcon(ICON_D.xmark,14)}</button>` : ""}
            </div>`).join("")}
            <div class="sb-h"></div>
            <div class="sb-tot sb-idx">&Sigma;</div>
            ${doc.players.map(p=>`<div class="sb-tot ${lideres.includes(p.id)?'lider':''}">${tot[p.id]}</div>`).join("")}
            <div class="sb-tot"></div>
            ${doc.rounds.map((r,ri)=>`
              <div class="sb-c sb-idx">${ri+1}</div>
              ${doc.players.map(p=>`<div class="sb-c"><input type="number" inputmode="numeric" class="sb-in" data-sbs="${ri}|${p.id}" value="${r.scores && r.scores[p.id] != null ? r.scores[p.id] : ""}" placeholder="–"></div>`).join("")}
              <div class="sb-c"><button class="del-exec" data-sbdelr="${ri}" title="Remover turno" aria-label="Remover turno">${svgIcon(ICON_D.xmark,14)}</button></div>
            `).join("")}
          </div>
        </div>
        <button class="btn-primary" id="sbAddRound" style="margin-top:12px; width:100%;">+ turno</button>
        <div class="dev-n" id="sbResumo" style="margin-top:10px; text-align:center;">${resumoHtml()}</div>`}
      `;

      body.querySelectorAll("[data-sbname]").forEach(inp=>{
        inp.oninput = () => { doc.players[+inp.dataset.sbname].name = inp.value; saveTemplates(doc); atualizarTotais(); };
      });
      body.querySelectorAll("[data-sbdelp]").forEach(b=>{
        b.onclick = () => {
          const pi = +b.dataset.sbdelp;
          const p = doc.players[pi];
          confirmModal("Remover <b>"+escapeHtml(sbNome(p, pi))+"</b> e os pontos dele?", "Remover", ()=>{
            doc.players.splice(pi,1);
            doc.rounds.forEach(r=>{ if(r.scores) delete r.scores[p.id]; });
            saveTemplates(doc); paint();
          });
        };
      });
      body.querySelectorAll("[data-sbs]").forEach(inp=>{
        inp.oninput = () => {
          const [ri, pid] = inp.dataset.sbs.split("|");
          const r = doc.rounds[+ri];
          if(!r.scores) r.scores = {};
          const raw = inp.value.trim();
          // campo vazio é "ainda não jogou", diferente de zero
          if(raw === "") delete r.scores[pid];
          else { const v = parseFloat(raw.replace(",", ".")); if(!isNaN(v)) r.scores[pid] = v; }
          saveTemplates(doc);
          atualizarTotais();
        };
      });
      body.querySelectorAll("[data-sbdelr]").forEach(b=>{
        b.onclick = () => { doc.rounds.splice(+b.dataset.sbdelr, 1); saveTemplates(doc); paint(); };
      });
      body.querySelectorAll("#sbWin [data-sbwin]").forEach(sp=>{
        sp.onclick = () => { doc.higherWins = sp.dataset.sbwin === "1"; saveTemplates(doc); paint(); };
      });
      const addP = body.querySelector("#sbAddPlayer");
      if(addP) addP.onclick = () => {
        doc.players.push({ id: uid(), name:"" });
        saveTemplates(doc); paint("player");
      };
      const addR = body.querySelector("#sbAddRound");
      if(addR) addR.onclick = () => {
        doc.rounds.push({ id: uid(), scores:{} });
        saveTemplates(doc); paint("round");
      };

      if(focar === "player"){
        const inps = body.querySelectorAll("[data-sbname]");
        if(inps.length) inps[inps.length-1].focus();
      } else if(focar === "round"){
        const inps = body.querySelectorAll("[data-sbs]");
        // primeiro campo do turno recém-criado
        const alvo = inps[inps.length - doc.players.length];
        if(alvo){ alvo.focus(); alvo.scrollIntoView({ block:"center" }); }
      }
    }
    /* Digitar um ponto não pode repintar a grade (o input perderia o foco), então
       só os totais e a liderança são atualizados no lugar. */
    function atualizarTotais(){
      const tot = sbTotais(doc);
      const lideres = sbLideres(doc);
      const cells = body.querySelectorAll(".sb-tot");
      doc.players.forEach((p,i)=>{
        const c = cells[i+1]; // cells[0] é o "Σ" da coluna do índice
        if(!c) return;
        c.textContent = tot[p.id];
        c.classList.toggle("lider", lideres.includes(p.id));
      });
      const res = body.querySelector("#sbResumo");
      if(res) res.innerHTML = resumoHtml();
    }
    paint();
  }

  /* ============ JOURNAL (nota gerada por execução de rotina com tarefas de anotação) ============
     Cada seção é escrita em markdown (negrito, listas, checklist) durante a rotina
     e aqui é exibida já formatada; um toque no lápis abre a edição em texto bruto,
     com altura que cresce sozinha conforme o conteúdo (autoGrowTextarea). */
  /* Ancestral mais próximo que efetivamente rola — usado para não perder a
     posição de rolagem ao redimensionar uma textarea que cresce sozinha (ver
     autoGrowTextarea). */
  function nearestScroller(el){
    let node = el.parentElement;
    while(node){
      const cs = getComputedStyle(node);
      if(/(auto|scroll)/.test(cs.overflowY) && node.scrollHeight > node.clientHeight) return node;
      node = node.parentElement;
    }
    return null;
  }
  /* Redefinir a altura para "auto" antes de recalcular faz a caixa colapsar
     por um instante — dentro de um contêiner que rola, o navegador encolhe o
     intervalo de rolagem nesse instante e "puxa" o scroll pra cima. Guardar e
     restaurar o scrollTop do ancestral cobre a maioria dos casos, mas não o
     de digitar espaço com a caixa cheia: o espaço no fim de uma linha às
     vezes não força quebra visual (o navegador "pendura" o espaço fora da
     largura), então esse colapso-e-remedida troca a altura por um valor
     igual ou momentaneamente menor, e o teclado virtual do celular reage
     nesse instante — antes do JS restaurar o scrollTop — puxando a página.
     Por isso, ao digitar para a frente (inserção), nem colapsamos: o
     scrollHeight de uma textarea já reflete a altura real do conteúdo
     mesmo com a altura em CSS menor que ele (ela só corta visualmente, não
     limita a medida), então basta crescer direto. O colapso-e-remedida só
     roda quando o conteúdo pode ter encolhido (apagar, colar, ou a pintura
     inicial), para o campo também conseguir diminuir de novo. */
  function autoGrowTextarea(ta, e){
    const isDelecao = e && typeof e.inputType === "string" && e.inputType.indexOf("delete") === 0;
    if(!e || isDelecao){
      const scroller = nearestScroller(ta);
      const prevScrollTop = scroller ? scroller.scrollTop : null;
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
      if(scroller && prevScrollTop !== null) scroller.scrollTop = prevScrollTop;
    } else if(ta.scrollHeight > ta.clientHeight){
      ta.style.height = ta.scrollHeight + "px";
    }
  }
  /* Faz toda caixa de texto livre de uma tela crescer junto com o conteúdo em vez
     de ganhar barra de rolagem interna. Chamar DEPOIS de inserir no DOM —
     scrollHeight é 0 fora dele. */
  function autoGrowAll(scope){
    scope.querySelectorAll("textarea.mk-e-name, textarea.mx-e-text").forEach(ta=>{
      autoGrowTextarea(ta);
      ta.addEventListener("input", (e)=>autoGrowTextarea(ta, e));
    });
  }
  function renderJournalDoc(doc){

          : `<div class="stat-card jsec-view" data-jview="${i}">${renderMdBlock(sec.text, secKey(i), "Sem anotações.")}</div>`}
      `).join("") || `<div class="empty-state" style="min-height:25vh;"><p>Sem anotações nesta execução.</p></div>`;

      body.querySelectorAll("[data-jedit]").forEach(b=>{

  /* ============ LISTA DE MERCADO ============ */
  let mkEditId = null, mkReorderAisles = false;
  function renderMarketDoc(doc){
    if(!doc.aisleOrder) doc.aisleOrder = [...AISLES];
    const el = document.createElement("div");
    el.className = "screen";
    tmplHeader(el, doc, `
      <button class="icon-btn ${doc.shopMode?'pin-btn pinned':''}" id="mkShop" title="Modo compra" aria-label="Modo compra">${svgIcon(ICON_D.market,15)}</button>
      <button class="icon-btn" id="mkRebuy" title="Recomprar (desmarcar tudo)" aria-label="Recomprar (desmarcar tudo)">${svgIcon(ICON_D.arrowPath,15)}</button>
      <button class="icon-btn" id="mkShare" title="Compartilhar como texto" aria-label="Compartilhar como texto">${svgIcon(ICON_D.arrowUpRight,13)}</button>
    `);

    /* A seção de adicionar produto ficava fora da área de rolagem (fixa acima
       da lista) e tomava espaço demais da tela no celular, sobrando pouco
       para ver os produtos durante a compra. Agora ela é o primeiro filho do
       mesmo container que rola — some da vista ao rolar a lista, em vez de
       ficar cravada no topo. */
    const scrollWrap = document.createElement("div");
    scrollWrap.style.cssText = "overflow-y:auto; flex:1; padding-bottom:20px;";
    el.appendChild(scrollWrap);

    if(!doc.shopMode){
      const form = document.createElement("div");
      form.className = "market-form";
      const freqChips = Object.values(mkFreq)
        .sort((a,b)=>b.count-a.count).slice(0,8)
        .filter(f=>!doc.items.some(i=>i.name.toLowerCase()===f.name.toLowerCase()));
      form.innerHTML = `
        ${freqChips.length ? `<div class="mk-chips"><span class="dev-n" style="margin-right:2px;">frequentes:</span>${freqChips.map(f=>`<span class="tag-chip" data-freq="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>`).join("")}</div>` : ""}
        <input type="text" id="mkName" placeholder="Item" autocomplete="off">
        <div class="mk-chips" id="mkSuggest"></div>
        <div class="market-form-row" style="margin-bottom:8px;">
          <input type="number" id="mkQty" inputmode="decimal" min="0" step="any" placeholder="qtd" value="1" style="flex:1; min-width:0;">
          <select id="mkUnit" style="flex:1; min-width:0;"><option value="un">un</option><option value="g">g</option><option value="kg">kg</option><option value="L">L</option><option value="ml">ml</option></select>
          <input type="number" id="mkPrice" inputmode="decimal" min="0" step="0.01" placeholder="R$ (opc)" style="flex:1; min-width:0;">
        </div>
        <div class="market-form-row">
          <select id="mkAisle" style="flex:1; min-width:0;">${doc.aisleOrder.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("")}</select>
          <button class="btn-primary" id="mkAdd" style="flex:0 0 auto; padding:10px 24px;">+</button>
        </div>`;
      scrollWrap.appendChild(form);
    }

    const listBox = document.createElement("div");
    scrollWrap.appendChild(listBox);
    app.appendChild(el);

    const nameInp = document.getElementById("mkName");
    const aisleSel = document.getElementById("mkAisle");
    const suggestBox = document.getElementById("mkSuggest");
    const allSuggestions = [...new Set(Object.values(GROCERY_DB).flat().concat(Object.values(mkFreq).map(f=>f.name)))];

    if(nameInp){
      nameInp.oninput = () => {
        aisleSel.value = guessAisle(nameInp.value);
        const q = nameInp.value.trim().toLowerCase();
        if(q.length < 2){ suggestBox.innerHTML = ""; return; }
        const matches = allSuggestions.filter(s=>s.toLowerCase().includes(q)).slice(0,6);
        suggestBox.innerHTML = matches.map(m=>`<span class="tag-chip" data-sug="${escapeHtml(m)}">${escapeHtml(m)}</span>`).join("");
        suggestBox.querySelectorAll("[data-sug]").forEach(ch=>{
          ch.onclick = () => { nameInp.value = ch.dataset.sug; aisleSel.value = guessAisle(ch.dataset.sug); suggestBox.innerHTML = ""; nameInp.focus(); };
        });
      };
      nameInp.onkeydown = e => { if(e.key === "Enter") addItem(); };
    }

    function bumpFreq(name, unit, qty, price, aisle){
      const k = name.toLowerCase();
      const f = mkFreq[k] = mkFreq[k] || { name, count:0 };
      f.count++; f.unit = unit; f.qty = qty; f.aisle = aisle;
      if(price) f.price = price;
      save(K_MKFREQ, mkFreq);
    }

    function addItem(prefill){
      const name = prefill ? prefill.name : nameInp.value.trim();
      if(!name) return;
      const qty = prefill ? (prefill.qty||1) : (+document.getElementById("mkQty").value || 1);
      const unit = prefill ? (prefill.unit||"un") : document.getElementById("mkUnit").value;
      const price = prefill ? (prefill.price||0) : (+document.getElementById("mkPrice").value || 0);
      const aisle = prefill ? (prefill.aisle||guessAisle(name)) : aisleSel.value;
      // duplicata: mesmo nome e unidade → soma
      const dup = doc.items.find(i=>i.name.toLowerCase()===name.toLowerCase() && i.unit===unit);
      if(dup){
        dup.qty += qty;
        if(price) dup.price = (dup.price||0) + price;
        showAlertBanner("Quantidade somada em \"" + name + "\" ✓");
      } else {
        doc.items.push({ id: uid(), name, qty, unit, price, aisle, checked:false });
      }
      bumpFreq(name, unit, qty, price, aisle);
      saveTemplates(doc);
      if(!prefill){
        nameInp.value = ""; document.getElementById("mkQty").value = "1"; document.getElementById("mkPrice").value = "";
        suggestBox.innerHTML = "";
        nameInp.focus();
      }
      paintList();
    }
    const addBtn = document.getElementById("mkAdd");
    if(addBtn) addBtn.onclick = () => addItem();
    document.querySelectorAll("[data-freq]").forEach(ch=>{
      ch.onclick = () => { const f = mkFreq[ch.dataset.freq.toLowerCase()]; if(f) addItem(f); };
    });

    function itemRight(it){
      const q = it.qty + (it.unit==="un" ? " un" : it.unit);
      return q + (it.price ? " · " + brl(it.price) : "");
    }

    function paintList(){
      listBox.innerHTML = "";
      const pending = doc.items.filter(i=>!i.checked);
      const listTotal = doc.items.reduce((a,i)=>a+(i.price||0),0);
      const cartTotal = doc.items.filter(i=>i.checked).reduce((a,i)=>a+(i.price||0),0);

      if(doc.shopMode){
        listBox.innerHTML += `<div class="shop-counter">${pending.length}<span> restante(s)</span></div>`;
      }
      if(listTotal > 0){
        listBox.innerHTML += `<div class="stat-foot" style="margin:2px 0 8px;">carrinho ${brl(cartTotal)} · lista ${brl(listTotal)}</div>`;
      } else if(!doc.shopMode){
        listBox.innerHTML += `<div class="stat-foot" style="margin:2px 0 8px;">${pending.length} pendente(s) de ${doc.items.length}</div>`;
      }
      if(!doc.shopMode){
        listBox.innerHTML += `<button class="link-btn" id="mkOrderBtn" style="font-size:13px; padding:0 0 8px;">${mkReorderAisles?"concluir ordenação":`${svgIcon(ICON_D.arrowsUpDown,13)} ordenar gôndolas`}</button>`;
      }
      if(doc.items.length === 0){
        listBox.innerHTML += `<div class="empty-state" style="min-height:30vh;"><p>Adicione itens — eles serão agrupados por gôndola.</p></div>`;
      }

      const byAisle = {};
      doc.items.forEach(it=>{ (byAisle[it.aisle||"Outros"] = byAisle[it.aisle||"Outros"]||[]).push(it); });
      const order = doc.aisleOrder.concat(Object.keys(byAisle).filter(a=>!doc.aisleOrder.includes(a)));

      const hasAnyItem = doc.items.length > 0;
      order.forEach((aisle, ai)=>{
        const items = byAisle[aisle] || [];
        let visible = doc.shopMode ? items.filter(i=>!i.checked) : items;
        // modo compra: esconde gôndolas sem pendências. modo normal: mostra todas as
        // gôndolas (inclusive vazias) desde que a lista tenha ao menos um item.
        if(doc.shopMode ? visible.length === 0 : (visible.length === 0 && !hasAnyItem)) return;
        visible = [...visible].sort((a,b)=>(a.checked?1:0)-(b.checked?1:0));

        let head = `<div class="section-label" style="display:flex; align-items:center; gap:8px;">${escapeHtml(aisle)}`;
        if(mkReorderAisles) head += ` <button class="order-btn" data-aup="${ai}" ${ai===0?'disabled':''}>${svgIcon(ICON_D.arrowUp,14)}</button><button class="order-btn" data-adown="${ai}" ${ai===order.length-1?'disabled':''}>${svgIcon(ICON_D.arrowDown,14)}</button>`;
        head += `</div>`;

        let rows = visible.map(it=>{
          if(mkEditId === it.id){
            return `<div class="mk-edit" data-editrow="${it.id}">
              <input type="text" class="mk-e-name" value="${escapeHtml(it.name)}">
              <div class="market-form-row">
                <input type="number" class="mk-e-qty" inputmode="decimal" min="0" step="any" value="${it.qty}">
                <select class="mk-e-unit">${["un","g","kg","L","ml"].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join("")}</select>
                <input type="number" class="mk-e-price" inputmode="decimal" min="0" step="0.01" placeholder="R$" value="${it.price||""}">
                <select class="mk-e-aisle">${order.map(a=>`<option ${it.aisle===a?'selected':''}>${escapeHtml(a)}</option>`).join("")}</select>
              </div>
              <div class="notice-actions">
                <button data-esave="${it.id}">ok</button>
                <button class="ghost" data-edel="${it.id}" style="color:var(--danger);">excluir</button>
                <button class="ghost" data-ecancel="1">cancelar</button>
              </div>
            </div>`;
          }
          return `<div class="checklist-item mk-item ${it.checked?'checked':''}">
            <span class="checklist-box" data-mkcheck="${it.id}">${it.checked?svgIcon(ICON_D.check,14):''}</span>
            <span class="txt mk-name" data-mkedit="${it.id}">${escapeHtml(it.name)}</span>
            <span class="mk-right" data-mkedit="${it.id}">${itemRight(it)}</span>
          </div>`;
        }).join("") || `<div class="dev-n" style="padding:4px 2px; opacity:.6;">— vazia —</div>`;
        listBox.innerHTML += head + `<div class="stat-card" style="padding:10px 14px;">${rows}</div>`;
      });

      if(!doc.shopMode && doc.items.some(i=>i.checked)){
        listBox.innerHTML += `<button class="add-step-btn" id="mkClearDone" style="width:100%;">limpar itens marcados</button>`;
      }

      /* handlers */
      listBox.querySelectorAll("[data-mkcheck]").forEach(b=>{
        b.onclick = () => { const it = doc.items.find(x=>x.id===b.dataset.mkcheck); it.checked = !it.checked; saveTemplates(doc); paintList(); };
      });
      listBox.querySelectorAll("[data-mkedit]").forEach(b=>{
        b.onclick = () => { mkEditId = b.dataset.mkedit; paintList(); };
      });
      listBox.querySelectorAll("[data-esave]").forEach(b=>{
        b.onclick = () => {
          const it = doc.items.find(x=>x.id===b.dataset.esave);
          const row = listBox.querySelector(`[data-editrow="${it.id}"]`);
          it.name = row.querySelector(".mk-e-name").value.trim() || it.name;
          it.qty = +row.querySelector(".mk-e-qty").value || it.qty;
          it.unit = row.querySelector(".mk-e-unit").value;
          it.price = +row.querySelector(".mk-e-price").value || 0;
          it.aisle = row.querySelector(".mk-e-aisle").value;
          mkEditId = null; saveTemplates(doc); paintList();
        };
      });
      listBox.querySelectorAll("[data-edel]").forEach(b=>{
        b.onclick = () => {
          const idx = doc.items.findIndex(x=>x.id===b.dataset.edel);
          const removed = idx>-1 ? doc.items[idx] : null;
          doc.items = doc.items.filter(x=>x.id!==b.dataset.edel); mkEditId = null; saveTemplates(doc); paintList();
          if(removed) showUndoBanner("Item removido", ()=>{
            doc.items.splice(Math.min(idx, doc.items.length), 0, removed); saveTemplates(doc); paintList();
          });
        };
      });
      listBox.querySelectorAll("[data-ecancel]").forEach(b=>{ b.onclick = () => { mkEditId = null; paintList(); }; });
      listBox.querySelectorAll("[data-aup]").forEach(b=>{
        b.onclick = () => { const i = +b.dataset.aup; doc.aisleOrder = order; [doc.aisleOrder[i-1], doc.aisleOrder[i]] = [doc.aisleOrder[i], doc.aisleOrder[i-1]]; saveTemplates(doc); paintList(); };
      });
      listBox.querySelectorAll("[data-adown]").forEach(b=>{
        b.onclick = () => { const i = +b.dataset.adown; doc.aisleOrder = order; [doc.aisleOrder[i+1], doc.aisleOrder[i]] = [doc.aisleOrder[i], doc.aisleOrder[i+1]]; saveTemplates(doc); paintList(); };
      });
      const ob = document.getElementById("mkOrderBtn");
      if(ob) ob.onclick = () => { mkReorderAisles = !mkReorderAisles; paintList(); };
      const clr = document.getElementById("mkClearDone");
      if(clr) clr.onclick = () => {
        const n = doc.items.filter(i=>i.checked).length;
        confirmModal("Remover " + n + " item(ns) marcado(s)?", "Remover", ()=>{ doc.items = doc.items.filter(i=>!i.checked); saveTemplates(doc); paintList(); });
      };
    }
    paintList();

    document.getElementById("mkShop").onclick = () => { doc.shopMode = !doc.shopMode; mkEditId = null; saveTemplates(doc); render(); };
    document.getElementById("mkRebuy").onclick = () => {
      confirmModal("Desmarcar todos os itens para recomprar?", "Recomprar", ()=>{ doc.items.forEach(i=>i.checked=false); saveTemplates(doc); render(); });
    };
    document.getElementById("mkShare").onclick = () => {
      const byAisle = {};
      doc.items.filter(i=>!i.checked).forEach(it=>{ (byAisle[it.aisle||"Outros"] = byAisle[it.aisle||"Outros"]||[]).push(it); });
      let txt = doc.title + "\n";
      doc.aisleOrder.concat(Object.keys(byAisle).filter(a=>!doc.aisleOrder.includes(a))).forEach(a=>{
        if(!byAisle[a] || !byAisle[a].length) return;
        txt += "\n" + a + "\n" + byAisle[a].map(it=>"• " + it.name + " — " + it.qty + (it.unit==="un"?" un":it.unit) + (it.price?" — "+brl(it.price):"")).join("\n") + "\n";
      });
      if(navigator.share){ navigator.share({ text: txt, title: doc.title }).catch(()=>{}); }
      else copyMarkdown(txt);
    };
  }

  /* ============ MATRIZ 2×2 ============ */
  let mxEdit = null, mxExpand = null, mxShowAxes = false;
  function matrixMd(doc){
    let md = "# " + doc.title + "\n";
    if(doc.axisX || doc.axisY) md += "_Eixos: " + (doc.axisX||"—") + " × " + (doc.axisY||"—") + "_\n";
    doc.quadrants.forEach(q=>{
      md += "\n## " + q.title + " (" + q.items.length + ")\n";
      q.items.forEach((it,ii)=>{
        const ind = it.indent ? "  " : "";
        const mk = q.mode==="check" ? (it.checked?"- [x] ":"- [ ] ") : (q.mode==="ol" ? (ii+1)+". " : "- ");
        md += ind + mk + it.text + "\n";
      });
    });
    return md;
  }
  function matrixPdfHtml(doc){
    let inner = "<h1>" + escapeHtml(doc.title) + "</h1>";
    if(doc.axisX || doc.axisY) inner += `<p class="meta">Eixos: ${escapeHtml(doc.axisX||"—")} × ${escapeHtml(doc.axisY||"—")}</p>`;
    inner += `<div class="mxgrid">`;
    doc.quadrants.forEach(q=>{
      inner += `<div class="mxq" style="border-color:${q.color}"><h2 style="color:${q.color}">${escapeHtml(q.title)} (${q.items.length})</h2><ul>`;
      q.items.forEach(it=>{
        inner += `<li class="${it.indent?'sub':''} ${q.mode==='check'&&it.checked?'done':''}">${escapeHtml(it.text)}</li>`;
      });
      inner += `</ul></div>`;
    });
    return inner + `</div>`;
  }

  function renderMatrixDoc(doc){
    if(doc.axisX === undefined) doc.axisX = "";
    if(doc.axisY === undefined) doc.axisY = "";
    doc.quadrants.forEach(q=>q.items.forEach(it=>{ if(it.indent===undefined) it.indent=0; }));
    const el = document.createElement("div");
    el.className = "screen";
    tmplHeader(el, doc, `
      <button class="icon-btn" id="mxAxes" title="Rótulos dos eixos" aria-label="Rótulos dos eixos">${svgIcon(ICON_D.tag,15)}</button>
      <button class="icon-btn" id="mxPdf" title="Exportar PDF" aria-label="Exportar PDF">PDF</button>
    `);

    const body = document.createElement("div");
    body.style.cssText = "flex:1; display:flex; flex-direction:column; min-height:0;";
    el.appendChild(body);
    app.appendChild(el);

    function quadHtml(q, qi, big){
      let itemsHtml = q.items.map((it,ii)=>{
        if(mxEdit && mxEdit.qi===qi && mxEdit.ii===ii){
          return `<div class="mx-editbox">
            <textarea class="mx-e-text" rows="1">${escapeHtml(it.text)}</textarea>
            <div class="mx-e-tools">
              <select class="mx-e-quad">${doc.quadrants.map((qq,qqi)=>`<option value="${qqi}" ${qqi===qi?'selected':''}>${escapeHtml(qq.title.slice(0,18))}</option>`).join("")}</select>
              <button class="order-btn" data-mxind="1" title="Indentar" aria-label="Indentar">${svgIcon(ICON_D.chevronDoubleRight,14)}</button>
              <button class="order-btn" data-mxind="0" title="Remover indentação" aria-label="Remover indentação">${svgIcon(ICON_D.chevronDoubleLeft,14)}</button>
              <button class="order-btn" data-mxup="1" ${ii===0?'disabled':''}>${svgIcon(ICON_D.arrowUp,14)}</button>
              <button class="order-btn" data-mxdown="1" ${ii===q.items.length-1?'disabled':''}>${svgIcon(ICON_D.arrowDown,14)}</button>
            </div>
            <div class="notice-actions">
              <button data-mxok="1">ok</button>
              <button class="ghost" data-mxdel="1" style="color:var(--danger);">excluir</button>
            </div>
          </div>`;
        }
        const indStyle = it.indent ? "margin-left:16px;" : "";
        if(q.mode === "check"){
          return `<div class="checklist-item ${it.checked?'checked':''}" style="margin:3px 0; font-size:${big?15:13.5}px; ${indStyle}">
            <span class="checklist-box mx-box" data-q="${qi}" data-i="${ii}" style="width:16px;height:16px;border-color:${q.color};${it.checked?`background:${q.color};`:""}">${it.checked?svgIcon(ICON_D.check,14):''}</span>
            <span class="txt" style="flex:1;" data-mxe="${qi}-${ii}">${escapeHtml(it.text)}</span>
          </div>`;
        }
        const marker = q.mode === "ol" ? (q.items.slice(0,ii).filter(x=>!x.indent).length + (it.indent?0:1)) + "." : "&bull;";
        return `<div class="live-line li-line" style="font-size:${big?15:13.5}px; display:flex; align-items:flex-start; ${indStyle}">
          <span class="li-marker" style="color:${q.color};">${it.indent?"&#9702;":marker}</span>
          <span style="flex:1;" data-mxe="${qi}-${ii}">${escapeHtml(it.text)}</span>
        </div>`;
      }).join("");
      return `
        <input type="text" class="mx-title" data-qt="${qi}" value="${escapeHtml(q.title)}" style="color:${q.color}; font-size:${big?17:14}px;">
        <span class="dev-n" style="font-size:10.5px;">${q.items.length} item(ns)</span>
        <div class="mx-tools">
          <div class="mx-colors">${MATRIX_COLORS.map(c=>`<span class="color-chip mx-chip ${q.color===c?'sel':''}" data-q="${qi}" data-color="${c}" style="background:${c}; width:16px; height:16px;"></span>`).join("")}</div>
          <div style="display:flex; gap:4px; align-items:center;">
            <div class="type-toggle" style="font-size:10px;">
              ${["check","ul","ol"].map(m=>`<span data-qm="${qi}" data-mode="${m}" class="${q.mode===m?'active':''}">${m==="check"?svgIcon(ICON_D.check,13):m==="ul"?"&bull;":"1."}</span>`).join("")}
            </div>
            <button class="order-btn" data-expand="${qi}" title="${big?'Voltar à grade':'Expandir'}" aria-label="${big?'Voltar à grade':'Expandir'}">${big?svgIcon(ICON_D.arrowsPointingIn,15):svgIcon(ICON_D.arrowsPointingOut,15)}</button>
          </div>
        </div>
        <div class="mx-items">${itemsHtml}</div>
        <form class="mx-add" data-qaddform="${qi}"><input type="text" placeholder="+ item (Enter)" data-qadd="${qi}" enterkeyhint="done"></form>`;
    }

    function paint(){
      body.innerHTML = "";
      if(mxShowAxes || doc.axisX || doc.axisY){
        const ax = document.createElement("div");
        ax.className = "mx-axes";
        ax.innerHTML = `
          <input type="text" id="axX" placeholder="eixo horizontal" value="${escapeHtml(doc.axisX)}">
          <input type="text" id="axY" placeholder="eixo vertical" value="${escapeHtml(doc.axisY)}">`;
        ax.style.display = mxShowAxes ? "flex" : "none";
        body.appendChild(ax);
        ax.querySelector("#axX").oninput = e => { doc.axisX = e.target.value; saveTemplates(doc); };
        ax.querySelector("#axY").oninput = e => { doc.axisY = e.target.value; saveTemplates(doc); };
      }
      if(doc.axisX && !mxShowAxes) body.innerHTML += `<div class="mx-axis-x">&larr; ${escapeHtml(doc.axisX)} &rarr;</div>`;

      const expanded = mxExpand && mxExpand.docId === doc.id ? mxExpand.qi : null;
      const wrap = document.createElement("div");
      wrap.style.cssText = "flex:1; display:flex; min-height:0; gap:6px;";
      if(doc.axisY && !mxShowAxes && expanded === null){
        wrap.innerHTML += `<div class="mx-axis-y">${escapeHtml(doc.axisY)}</div>`;
      }
      const gridBox = document.createElement("div");
      if(expanded !== null){
        gridBox.className = "matrix-single";
        const q = doc.quadrants[expanded];
        const quad = document.createElement("div");
        quad.className = "matrix-quad";
        quad.style.borderColor = q.color;
        quad.style.background = q.color + "14";
        quad.innerHTML = quadHtml(q, expanded, true);
        gridBox.appendChild(quad);
      } else {
        gridBox.className = "matrix-grid";
        doc.quadrants.forEach((q,qi)=>{
          const quad = document.createElement("div");
          quad.className = "matrix-quad";
          quad.style.borderColor = q.color;
          quad.style.background = q.color + "14";
          quad.innerHTML = quadHtml(q, qi, false);
          gridBox.appendChild(quad);
        });
      }
      wrap.appendChild(gridBox);
      body.appendChild(wrap);
      wire(gridBox);
    }

    function wire(gridBox){
      gridBox.querySelectorAll("[data-qt]").forEach(inp=> inp.oninput = e => { doc.quadrants[+e.target.dataset.qt].title = e.target.value; saveTemplates(doc); });
      gridBox.querySelectorAll("[data-color]").forEach(ch=> ch.onclick = () => { doc.quadrants[+ch.dataset.q].color = ch.dataset.color; saveTemplates(doc); paint(); });
      gridBox.querySelectorAll("[data-mode]").forEach(sp=> sp.onclick = () => { doc.quadrants[+sp.dataset.qm].mode = sp.dataset.mode; saveTemplates(doc); paint(); });
      gridBox.querySelectorAll(".mx-box").forEach(b=> b.onclick = () => { const it = doc.quadrants[+b.dataset.q].items[+b.dataset.i]; it.checked = !it.checked; saveTemplates(doc); paint(); });
      gridBox.querySelectorAll("[data-mxe]").forEach(sp=>{
        sp.onclick = () => { const [qi,ii] = sp.dataset.mxe.split("-").map(Number); mxEdit = {qi,ii}; paint();
          setTimeout(()=>{ const inp = gridBox.querySelector(".mx-e-text"); if(inp){ inp.focus(); } }, 30); };
      });
      gridBox.querySelectorAll("[data-expand]").forEach(b=>{
        b.onclick = () => {
          const qi = +b.dataset.expand;
          mxExpand = (mxExpand && mxExpand.docId===doc.id && mxExpand.qi===qi) ? null : { docId:doc.id, qi };
          mxEdit = null; paint();
        };
      });
      gridBox.querySelectorAll("[data-qaddform]").forEach(form=>{
        form.onsubmit = e => {
          e.preventDefault();
          const inp = form.querySelector("[data-qadd]");
          const val = inp.value.trim();
          if(!val) return;
          doc.quadrants[+form.dataset.qaddform].items.push({ text: val, checked:false, indent:0 });
          saveTemplates(doc); paint();
          const again = gridBox.querySelector(`[data-qadd="${form.dataset.qaddform}"]`);
          if(again) again.focus();
        };
      });
      /* editor de item */
      const box = gridBox.querySelector(".mx-editbox");
      if(box) autoGrowAll(box);
      if(box && mxEdit){
        const {qi, ii} = mxEdit;
        const q = doc.quadrants[qi];
        const it = q.items[ii];
        const commitText = () => { it.text = box.querySelector(".mx-e-text").value.trim() || it.text; };
        box.querySelector("[data-mxok]").onclick = () => {
          commitText();
          const targetQ = +box.querySelector(".mx-e-quad").value;
          if(targetQ !== qi){
            q.items.splice(ii,1);
            doc.quadrants[targetQ].items.push(it);
          }
          mxEdit = null; saveTemplates(doc); paint();
        };
        box.querySelector("[data-mxdel]").onclick = () => { q.items.splice(ii,1); mxEdit = null; saveTemplates(doc); paint(); };
        box.querySelectorAll("[data-mxind]").forEach(b=> b.onclick = () => { commitText(); it.indent = +b.dataset.mxind; saveTemplates(doc); paint(); });
        box.querySelector("[data-mxup]").onclick = () => { if(ii>0){ commitText(); [q.items[ii-1],q.items[ii]]=[q.items[ii],q.items[ii-1]]; mxEdit={qi,ii:ii-1}; saveTemplates(doc); paint(); } };
        box.querySelector("[data-mxdown]").onclick = () => { if(ii<q.items.length-1){ commitText(); [q.items[ii+1],q.items[ii]]=[q.items[ii],q.items[ii+1]]; mxEdit={qi,ii:ii+1}; saveTemplates(doc); paint(); } };
        box.querySelector(".mx-e-text").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); box.querySelector("[data-mxok]").click(); } };
      }
    }
    paint();

    document.getElementById("mxAxes").onclick = () => { mxShowAxes = !mxShowAxes; paint(); };
    document.getElementById("mxPdf").onclick = () => exportPdfView(doc.title, matrixPdfHtml(doc), "Matrizes 2x2");
  }

  /* ============ KANBAN ============ */
  let kbEdit = null;
  /* Coluna visível quando o tabuleiro está em modo de abas (kanban do Diário):
     mostrar as três empilhadas obrigava a rolar a aba inteira para ver "Feito".
     É índice de coluna e vive fora do pintarKanban porque o repaint é interno. */
  let kbAbaAtiva = 1;
  /* Horário do cartão: "HH:MM" ou vazio. hFim é opcional e só vale com hIni.
     Fora do escopo "dia" o cartão também pode levar `hDia` (data ISO) — o
     período (semana/mês/ano) sozinho não diz QUAL dia, então a data entra
     antes do horário na exibição. */
  function cartaoHoraTxt(it){
    const dia = it.hDia ? it.hDia.slice(8,10) + "/" + it.hDia.slice(5,7) : "";
    const hora = it.hIni ? it.hIni + (it.hFim ? "–" + it.hFim : "") : "";
    if(dia && hora) return dia + " " + hora;
    return dia || hora;
  }
  function horaParaMin(h){
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(h||""));
    if(!m) return null;
    const v = (+m[1])*60 + (+m[2]);
    return v >= 0 && v < 24*60 ? v : null;
  }
  function kanbanMd(doc){
    let md = "# " + doc.title + "\n";
    doc.cols.forEach(c=>{ md += "\n## " + c.title + " (" + c.items.length + ")\n" + c.items.map(i=>"- " + i.text).join("\n") + "\n"; });
    return md;
  }
  /* Tabuleiro reutilizável. `cols` é [{title, items:[{id,text}]}] e é a fonte da
     verdade: arrastar, mover e excluir mexem nesses arrays e só então `gravar()`
     é chamado para persistir do jeito de cada dono (documento de modelo ou
     kanban do diário). O repintar é interno. */
  function pintarKanban(body, cols, gravar, opts){
    opts = opts || {};
    const repaint = () => pintarKanban(body, cols, gravar, opts);
    const commit = () => { gravar(); repaint(); };
    // fora do escopo "dia" o período (semana/mês/ano) não diz por si só QUAL
    // dia — o cartão ganha um campo de data (hDia) além do horário.
    const kbEscopo = opts.per ? escopoDoPer(opts.per) : null;
    const kbPrecisaDia = !!(opts.horarios && kbEscopo && kbEscopo !== "dia");
    body.innerHTML = "";
    /* Modo abas: uma coluna por vez, escolhida por um segmentado no topo. Só o
       kanban do Diário usa (opts.abas) — no modelo "kanban" ver as três de uma
       vez é o ponto. kbAbaAtiva é saneada aqui porque o número de colunas pode
       mudar entre um repaint e outro. */
    if(opts.abas){
      if(kbAbaAtiva >= cols.length || kbAbaAtiva < 0) kbAbaAtiva = 0;
      const seg = document.createElement("div");
      seg.className = "type-toggle kb-abas";
      seg.innerHTML = cols.map((c,i)=>
        `<span data-kbaba="${i}" class="${i===kbAbaAtiva?'active':''}">${escapeHtml(c.title)} <b>${c.items.length}</b></span>`
      ).join("");
      seg.querySelectorAll("[data-kbaba]").forEach(sp=>{
        sp.onclick = () => { kbAbaAtiva = +sp.dataset.kbaba; kbEdit = null; repaint(); };
      });
      body.appendChild(seg);
    }
    cols.forEach((c,ci)=>{
      if(opts.abas && ci !== kbAbaAtiva) return;
      const col = document.createElement("div");
      col.className = "kb-col kb-s" + (ci % 3);
      // índice REAL da coluna: no modo abas a posição no DOM não é o índice em `cols`
      col.dataset.colidx = ci;
      let cards = c.items.map((it,ii)=>{
        if(kbEdit && kbEdit.ci===ci && kbEdit.ii===ii){
          return `<div class="kb-card kb-editing">
            <input type="text" class="kb-e-text" value="${escapeHtml(it.text)}">
            ${opts.horarios ? `<div class="section-label" style="margin:10px 0 4px;">${kbPrecisaDia ? "Dia e horário (opcional)" : "Horário (opcional)"}</div>
              <div class="kb-e-horas">
                ${kbPrecisaDia ? `<input type="date" class="kb-e-dia" value="${escapeHtml(it.hDia||"")}" aria-label="Dia">` : ""}
                <input type="time" class="kb-e-ini" value="${escapeHtml(it.hIni||"")}" aria-label="Hora de início">
                <span class="dev-n">até</span>
                <input type="time" class="kb-e-fim" value="${escapeHtml(it.hFim||"")}" aria-label="Hora de término">
              </div>
              <div class="dev-n" style="margin-top:5px;">${kbEscopo === "dia" ? "Com hora de início o cartão vira um bloco na agenda. Sem hora de término, vale 1h." : "Sem hora de término, vale 1h."}</div>` : ""}
            ${opts.pesos ? `<div class="section-label" style="margin:10px 0 4px;">Peso no boletim</div>
              ${tagValorPillsHtml(it.tagValor || "nenhum", false)}
              <div class="dev-n" style="margin-top:5px;">Vale um bloco de ${gam.config.divisorDuracao} min${(KB_ESCOPO_MULT[escopoDoPer(opts.per)]||1) > 1 ? " &times;" + KB_ESCOPO_MULT[escopoDoPer(opts.per)] + " (escopo " + KB_ESCOPO_LABEL[escopoDoPer(opts.per)] + ")" : ""}. Pontua ao cair em "Feito".</div>` : ""}
            ${opts.pesos && rodaAtiva() ? `<div class="section-label" style="margin:10px 0 4px;">Área</div><div class="kb-e-area"></div>` : ""}
            <div class="notice-actions kb-e-acoes" style="margin-top:10px;">
              <button data-kbok="1">ok</button>
              <button class="ghost" data-kbcancel="1">${svgIcon(ICON_D.xmark,14)}</button>
              <button class="ghost" data-kbdel="1" style="color:var(--danger);" title="Excluir cartão" aria-label="Excluir cartão">${svgIcon(ICON_D.trash,15)}</button>
            </div></div>`;
        }
        const tag = it.tagValor || "nenhum";
        const feito = c.key === "done";

        return `<div class="kb-card" data-kbcard="${ci}-${ii}">

    body.querySelectorAll("[data-kbe]").forEach(sp=> sp.onclick = () => { const [ci,ii]=sp.dataset.kbe.split("-").map(Number); kbEdit={ci,ii}; repaint(); setTimeout(()=>{const i=body.querySelector(".kb-e-text"); if(i) i.focus();},30); });
    // arrastar cartão para outra coluna/posição (alça ${svgIcon(ICON_D.bars3,15)}); botões ‹ › continuam como fallback
    body.querySelectorAll("[data-kbdrag]").forEach(h=>{
      h.onpointerdown = ev => {
        ev.preventDefault();

        const cardEl = h.closest(".kb-card");
        const colEls = [...body.querySelectorAll(".kb-col")];
        cardEl.classList.add("dragging");
        try{ h.setPointerCapture(ev.pointerId); }catch(e){}
        let tci = fci, tii = fii;
        const move = e2 => {
          const x = e2.clientX, y = e2.clientY;
          tci = fci;
          colEls.forEach(colEl=>{
            const rc = colEl.getBoundingClientRect();
            const inside = x >= rc.left && x <= rc.right && y >= rc.top - 40 && y <= rc.bottom + 40;
            colEl.classList.toggle("kb-drop", inside);
            // índice REAL da coluna: no modo abas só uma está no DOM, então a
            // posição no array de elementos não corresponde ao índice em `cols`
            if(inside) tci = +colEl.dataset.colidx;
          });
          // posição na coluna alvo pelo ponto médio de cada cartão (sem o arrastado)
          const alvoEl = colEls.find(el => +el.dataset.colidx === tci) || colEls[0];
          const others = [...alvoEl.querySelectorAll(".kb-card")].filter(c=>c!==cardEl);
          tii = others.length;
          for(let j = 0; j < others.length; j++){
            if(y < others[j].getBoundingClientRect().top + others[j].offsetHeight/2){ tii = j; break; }
          }
        };
        const up = () => {
          h.onpointermove = null; h.onpointerup = null; h.onpointercancel = null;
          cardEl.classList.remove("dragging");
          colEls.forEach(c=>c.classList.remove("kb-drop"));
          const [it] = cols[fci].items.splice(fii, 1);
          // "others" exclui o cartão arrastado, então tii já é o índice correto pós-remoção
          cols[tci].items.splice(Math.min(tii, cols[tci].items.length), 0, it);
          commit();
        };
        h.onpointermove = move; h.onpointerup = up; h.onpointercancel = up;
      };
    });
    body.querySelectorAll("[data-kbl]").forEach(b=> b.onclick = () => { const [ci,ii]=b.dataset.kbl.split("-").map(Number); const [it]=cols[ci].items.splice(ii,1); cols[ci-1].items.push(it); commit(); });
    body.querySelectorAll("[data-kbr]").forEach(b=> b.onclick = () => { const [ci,ii]=b.dataset.kbr.split("-").map(Number); const [it]=cols[ci].items.splice(ii,1); cols[ci+1].items.push(it); commit(); });
    // adiar cartão do kanban do Diário (só escopo dia) — botão e arrastar para a direita
    function adiarCartaoKanban(ci, ii){
      const [it] = cols[ci].items.splice(ii,1);

    if(opts.per && escopoDoPer(opts.per) === "dia"){
      body.querySelectorAll("[data-kbcard]").forEach(card=>{
        const [ci,ii] = card.dataset.kbcard.split("-").map(Number);
        if(cols[ci].key === "done") return;

      });

    body.querySelectorAll("[data-kbaddform]").forEach(form=>{
      form.onsubmit = e => {
        e.preventDefault();
        const inp = form.querySelector("[data-kbadd]");
        const val = inp.value.trim();
        if(!val) return;
        // no kanban do Diário (opts.pesos) o cartão já nasce pontuando um pouco —
        // "nenhum" exigiria abrir o cartão e escolher um peso à toa toda vez.
        // Kanban de modelo (sem gamificação) não ganha o campo.
        const novo = { id:uid(), text:val };
        if(opts.pesos) novo.tagValor = "medio";
        if(opts.horarios){
          const diaInp = form.querySelector("[data-kbadddia]");
          const iniInp = form.querySelector("[data-kbaddini]"), fimInp = form.querySelector("[data-kbaddfim]");
          if(diaInp && diaInp.value) novo.hDia = diaInp.value;
          const ini = iniInp ? iniInp.value : "";
          if(ini){
            novo.hIni = ini;
            const fim = fimInp ? fimInp.value : "";
            novo.hFim = (fim && horaParaMin(fim) > horaParaMin(ini)) ? fim : "";
          }
        }
        cols[+form.dataset.kbaddform].items.push(novo);
        commit();
        const a=body.querySelector(`[data-kbadd="${form.dataset.kbaddform}"]`); if(a) a.focus();
      };
    });
    const eb = body.querySelector(".kb-editing");
    if(eb && kbEdit){
      const {ci,ii} = kbEdit;
      const itAtual = cols[ci].items[ii];
      if(opts.pesos) wireTagValorPills(eb);
      let kbEArea = itAtual.eixo || null;
      const areaWrap = eb.querySelector(".kb-e-area");
      if(areaWrap) pintarAreaChips(areaWrap, kbEArea, v => { kbEArea = v; });
      /* Nada é escrito no cartão enquanto a edição está aberta — os campos são
         lidos só aqui, no "ok". É o que permite o "✕" ser um cancelar de
         verdade: basta fechar a edição, sem desfazer nada. */
      eb.querySelector("[data-kbok]").onclick = () => {
        const it = cols[ci].items[ii];
        it.text = eb.querySelector(".kb-e-text").value.trim() || it.text;
        if(opts.pesos) it.tagValor = readTagValorPills(eb) || "nenhum";
        if(areaWrap) it.eixo = kbEArea;
        const dia = eb.querySelector(".kb-e-dia");
        if(dia) it.hDia = dia.value || "";
        const ini = eb.querySelector(".kb-e-ini"), fim = eb.querySelector(".kb-e-fim");
        if(ini){
          it.hIni = ini.value || "";
          // fim sem início não descreve nada; fim antes do início é engano de digitação
          it.hFim = (it.hIni && fim.value && horaParaMin(fim.value) > horaParaMin(it.hIni)) ? fim.value : "";
        }
        kbEdit=null; commit();
      };
      eb.querySelector("[data-kbcancel]").onclick = () => { kbEdit=null; repaint(); };
      eb.querySelector("[data-kbdel]").onclick = () => {
        const removed = cols[ci].items[ii];
        cols[ci].items.splice(ii,1); kbEdit=null; commit();
        if(removed) showUndoBanner("Cartão excluído", ()=>{
          cols[ci].items.splice(Math.min(ii, cols[ci].items.length), 0, removed); commit();
        });
      };
      eb.querySelector(".kb-e-text").onkeydown = e => { if(e.key==="Enter") eb.querySelector("[data-kbok]").click(); };
    }
  }
  function renderKanbanDoc(doc){

  /* ============ CONTAGEM REGRESSIVA ============ */
  function cdUnit(t){ return (t.unit && t.unit.trim()) || "tópicos"; }
  function cdPace(t){
    const days = daysUntil(t.date);
    if(t.topics == null) return null;
    const unit = cdUnit(t);
    const remaining = Math.max(0, t.topics - (t.done||0));
    if(days <= 0 || remaining <= 0) return { days, remaining, txt: remaining===0 ? "concluído" : "prazo esgotado" };
    const perDay = remaining / days;
    const txt = perDay >= 1
      ? perDay.toFixed(1).replace(".",",") + " " + unit + "/dia"
      : "1 a cada " + (days/remaining).toFixed(1).replace(".",",") + " dias";
    return { days, remaining, txt };
  }
  function countdownMd(doc){
    let md = "# " + doc.title + "\n\n";
    doc.targets.forEach(t=>{
      const d = daysUntil(t.date);
      const [y,m,dd] = t.date.split("-");
      md += "- **" + t.title + "** — " + dd + "/" + m + "/" + y + " — " + (d>=0 ? "faltam " + d + " dia(s)" : Math.abs(d) + " dia(s) atrás");
      const p = cdPace(t);
      if(p && t.topics != null) md += " — " + (t.done||0) + "/" + t.topics + " " + cdUnit(t) + " (" + p.txt + ")";
      md += "\n";
    });
    return md;
  }
  /* Aba Metas (antes "Contagens regressivas"): os dados continuam num doc de
     tipo "countdown" para não exigir migração; só a apresentação mudou.
     O formulário de criação vive num popup aberto pelo + do topo. */
  function metaDoc(){ return getOrCreateCountdownDoc(); }
  /* Áreas de meta são texto livre: os EIXOS entram como sugestão (e emprestam a
     cor deles), mas digitar um nome novo cria a área na hora. Metas antigas
     guardam o *id* do eixo, então o resolvedor aceita id e rótulo. */
  const AREA_CORES = ["#E0619E","#5B8DEF","#6B8F71","#C9B23E","#B25B4C","#8A78C8","#3FA7A0"];
  function metaAreaInfo(v){
    const s = String(v||"").trim();
    const e = EIXOS.find(x=>x.id===s) || EIXOS.find(x=>x.label.toLowerCase()===s.toLowerCase());
    if(e) return { label:e.label, color:e.color };
    // cor estável derivada do nome, para a mesma área sair sempre igual
    let h = 0;
    for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
    return { label:s, color: AREA_CORES[h % AREA_CORES.length] };
  }
  /* Dias específicos p/ trabalhar numa meta (opcional): t.dias vazio/ausente =
     todo dia, mesma convenção de diasDaRotina/rotinaOcorreHoje. */
  function metaDias(t){
    const d = t && t.dias;
    return (d && d.length) ? d : [0,1,2,3,4,5,6];
  }
  function metaDiasChipHtml(t){
    const dias = metaDias(t);
    if(dias.length >= 7) return "";
    return `<div class="sched-chip chip-block" style="color:var(--muted);">${dias.slice().sort((a,b)=>a-b).map(d=>DIAS_ABREV[d]).join("/")}</div>`;
  }
  function metaOcorreHoje(t){
    return metaDias(t).includes(new Date().getDay());
  }
  /* Meta pode ter várias áreas (t.areas, texto livre) — diferente de
     areaDaRotina (uma só). O filtro compartilhado com Rotinas compara pelo
     rótulo resolvido, não pelo id, porque metaAreaInfo aceita id de eixo
     legado e rótulo livre no mesmo campo. */
  function metaTemArea(t, areaId){
    const alvo = areaInfoRoda(areaId).label;
    return (t.areas||[]).some(a => metaAreaInfo(a).label === alvo);
  }
  /* ---- Metas recorrentes (hábitos): diárias/semanais que repetem N vezes no
     período — "beber água" 4x ao dia, "lavar e hidratar o cabelo" 2x na
     semana. Vivem no MESMO doc de countdown (doc.recorrentes), de propósito:
     herdam de graça a persistência em K_TEMPLATES e o resync de notificações
     nativas, que já dispara em save() para essa chave (ver queueNativeSchedSync). */
  function metaRecPeriodoAtual(rec){
    return rec.tipo === "semanal" ? "semana:" + inicioSemanaISO(new Date()) : "dia:" + localKey();
  }
  /* lê o progresso do período CORRENTE, reiniciando sozinho quando o dia/semana vira —
     mesma convenção "lazy reset" de outras janelas de período deste app */
  function metaRecProgresso(rec){
    const per = metaRecPeriodoAtual(rec);
    if(!rec.progresso || rec.progresso.periodo !== per) rec.progresso = { periodo: per, feitas: 0 };
    return rec.progresso;
  }
  function metaRecFeitas(rec){ return metaRecProgresso(rec).feitas; }
  function metaRecCompleta(rec){ return metaRecFeitas(rec) >= rec.vezes; }
  /* meta NEGATIVA (ex.: "delivery no máx. 2x/semana"): `vezes` vira o limite,
     não o alvo — excedeu quando feitas > vezes. */
  function metaRecExcesso(rec){ return Math.max(0, metaRecFeitas(rec) - rec.vezes); }
  function metaRecExcedida(rec){ return metaRecExcesso(rec) > 0; }
  function metaRecItemId(rec, per, n){ return "metarecneg:"+rec.id+":"+per+":"+n; }
  /* Cada ocorrência ALÉM do limite credita uma penalidade (peso negativo) na
     semana corrente — mesma "unidade de bloco" do peso de um cartão do kanban
     (pesoBruto com a duração de referência), só que com o sinal invertido.
     Peso "nenhum" não pontua, igual ao resto do app. */
  function metaRecPenalidadeUnidade(rec){
    return -pesoBruto(rec.tagValor || "medio", gam.config.divisorDuracao);
  }
  /* Ajusta a ficha de penalidades da semana corrente para bater com o excesso
     atual — chamada tanto ao marcar/desmarcar uma ocorrência quanto por
     completeness ao editar o limite/peso da meta (por isso recebe antes/depois
     em vez de assumir só delta ±1). */
  function sincronizarPenalidadeMetaRec(rec, excessoAntes, excessoDepois){
    if(excessoDepois === excessoAntes) return;
    avancarGamificacaoAteAgora();
    const per = metaRecPeriodoAtual(rec);
    const pb = metaRecPenalidadeUnidade(rec);
    if(excessoDepois > excessoAntes){
      if(pb >= 0) return; // peso "nenhum": não credita nada
      for(let n = excessoAntes+1; n <= excessoDepois; n++){
        gam.semanaAtual.concluidos.push({
          itemId: metaRecItemId(rec, per, n), tipo:"metaRecNeg", dataISO: localKey(),
          pontos: pb * fatorDaArea(rec.area||""), pb, agendado:false, area: rec.area||"", rotulo: rec.titulo
        });
      }
    } else {
      for(let n = excessoAntes; n > excessoDepois; n--){
        const i = gam.semanaAtual.concluidos.findIndex(c=>c.itemId===metaRecItemId(rec, per, n));
        if(i>-1) gam.semanaAtual.concluidos.splice(i,1);
      }
    }
    save(K_GAMIFICACAO, gam);
  }
  /* Remove todas as penalidades já creditadas por esta meta na semana corrente
     — usado quando a meta recorrente é apagada. */
  function estornarPenalidadesMetaRec(rec){
    if(!gam.semanaAtual) return;
    const prefixo = "metarecneg:"+rec.id+":";
    gam.semanaAtual.concluidos = gam.semanaAtual.concluidos.filter(c=>!c.itemId.startsWith(prefixo));
    save(K_GAMIFICACAO, gam);
  }
  function metaRecAjustar(doc, rec, delta){
    const p = metaRecProgresso(rec);
    const excessoAntes = metaRecExcesso(rec);
    p.feitas = Math.max(0, rec.negativa ? (p.feitas + delta) : Math.min(rec.vezes, p.feitas + delta));
    if(rec.negativa) sincronizarPenalidadeMetaRec(rec, excessoAntes, metaRecExcesso(rec));
    saveTemplates(doc);
  }
  function metaRecReiniciaEmTxt(rec){
    return rec.tipo === "semanal" ? "reinicia " + DIAS_ABREV[weekStartDow()] : "reinicia à meia-noite";
  }
  /* horários igualmente espaçados dentro da janela de notificação — dividir
     um intervalo de 10h em 5 partes = um alarme a cada 2h, como pedido. */
  function metaRecHorarios(rec){
    if(!rec.notif || rec.tipo !== "diaria") return [];
    const [hi,mi] = rec.notif.inicio.split(":").map(Number);
    const [hf,mf] = rec.notif.fim.split(":").map(Number);
    const ini = hi*60+mi, fim = hf*60+mf;
    if(fim <= ini || rec.vezes < 1) return [];
    const passo = (fim-ini) / rec.vezes;
    return Array.from({length: rec.vezes}, (_,i)=>{
      const m = Math.round(ini + passo*i);
      return { hour: Math.floor(m/60), minute: m%60 };
    });
  }
  function metaAreaChipHtml(v){
    const info = metaAreaInfo(v);
    if(!info.label) return "";
    return `<span class="area-chip sel" style="--chip:${info.color}; pointer-events:none;">${escapeHtml(info.label)}</span>`;
  }
  /* Pool de sugestão = só os rótulos que o próprio usuário já usou em alguma
     meta. Os EIXOS saíram: eram áreas pré-prontas ("Autonomia", "Idiomas"...)
     que ninguém pediu e enchiam o formulário. Continuam sendo resolvidos por
     metaAreaInfo(), para metas antigas que guardaram o id do eixo. */
  function metaAreasPool(doc){
    const set = new Set();
    (doc.targets||[]).forEach(t=>(t.areas||[]).forEach(a=>{
      const l = metaAreaInfo(a).label;
      if(l) set.add(l);
    }));
    return [...set];
  }
  /* Anotação livre de uma meta: markdown, no mesmo dialeto do Diário (listas,
     checklist, toggle). Fica em overlay para não competir com os controles de
     progresso dentro do card. */
  function abrirNotaMeta(doc, t, aoFechar){
    if(!t) return;
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box" style="text-align:left; max-width:460px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <p style="margin:0;">Anotação — ${escapeHtml(t.title)}</p>
          <button class="icon-btn" id="cdNotaClose">${svgIcon(ICON_D.xmark,14)}</button>
        </div>
        <textarea class="mk-e-name" id="cdNotaTxt" rows="7" style="width:100%; line-height:1.5;"
          placeholder="Como está indo, o que travou, o que fazer a seguir... (markdown: - lista, - [ ] tarefa, **negrito**)">${escapeHtml(t.nota||"")}</textarea>
        <div class="confirm-actions" style="margin-top:14px;">
          <button class="btn-cancel" id="cdNotaCancel">Cancelar</button>
          <button class="btn-confirm" id="cdNotaSave" style="background:var(--grad);">Salvar</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const ta = ov.querySelector("#cdNotaTxt");
    autoGrowTextarea(ta);
    ta.oninput = e => autoGrowTextarea(ta, e);
    ta.focus();
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.querySelector("#cdNotaClose").onclick = () => ov.remove();
