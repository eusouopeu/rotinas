<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rotinas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1B1A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --bg: #1C1B1A;
    --surface: #262422;
    --surface-2: #2F2C29;
    --line: #3A3632;
    --text: #EDE7DD;
    --muted: #8A8478;
    --accent: #E0619E;
    --accent-2: #5B8DEF;
    --accent-dim: #8F4066;
    --grad: linear-gradient(135deg, #EC6AA8, #5B8DEF);
    --on-accent: #FFFFFF;
    --good: #6B8F71;
    --danger: #B25B4C;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 58px;
    --font-scale: 1;
    /* raio e elevação como tokens: o "moderno" é a superfície flutuar com
       sombra em vez de depender só da borda de 1px */
    --radius: 18px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.30);
    --shadow-2: 0 10px 28px rgba(0,0,0,.38);
    /* fundo translúcido de barras fixas (tabbar) — precisa de alfa, não serve var(--surface) */
    --surface-blur: rgba(38,36,34,.82);
    --accent-soft: rgba(224,97,158,.16);
    /* estágios do kanban: neutro -> azul (em curso) -> verde (feito). Os tons
       quentes de antes deixavam as colunas com cara de papel envelhecido */
    --kb-todo: #94A3B8;   --kb-todo-bg: rgba(148,163,184,.09);
    --kb-doing: #6E9BF2;  --kb-doing-bg: rgba(110,155,242,.10);
    --kb-done: #6B8F71;   --kb-done-bg: rgba(107,143,113,.10);
  }
  /* Tema claro: cinza claríssimo neutro (não bege), superfícies brancas
     destacadas por sombra suave — leitura tipo Google Docs, com acentos
     saturados no lugar dos tons apagados. */
  body.light{
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --surface-2: #EDF1F6;
    --line: #E2E7EE;
    --text: #191D23;
    --muted: #5F6977;
    --accent: #D8407F;
    --accent-2: #2F6BE0;
    --accent-dim: #F0AECC;
    --grad: linear-gradient(135deg, #E8478C, #3D74E8);
    --on-accent: #FFFFFF;
    --good: #2E9C5C;
    --danger: #D2453B;
    --shadow-1: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --shadow-2: 0 10px 28px rgba(16,24,40,.11);
    --surface-blur: rgba(255,255,255,.86);
    --accent-soft: rgba(216,64,127,.11);
    --kb-todo: #64748B;   --kb-todo-bg: rgba(100,116,139,.07);
    --kb-doing: #2F6BE0;  --kb-doing-bg: rgba(47,107,224,.07);
    --kb-done: #2E9C5C;   --kb-done-bg: rgba(46,156,92,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  form{ margin:0; }
  /* overscroll-behavior no body sozinho não segura o rubber-band: com
     <!DOCTYPE html>, quem rola o documento é o html, não o body — sem isso
     um arrasto lateral dava uma folga elástica na página inteira (a tabbar
     fixa "balançava" junto, mesmo sem nada pra rolar). */
  html{ height:100%; overscroll-behavior:none; }
  body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  #app{
    /* escala de acessibilidade (Configurações → Aparência): transform, não a
       propriedade `zoom` — testado e revertido: `zoom` desalinha o hit-test de
       clique/toque em relação à posição visual (bug real de Chromium com essa
       propriedade não-padrão), o que quebraria toda a interação do app fora do
       tamanho "M". transform é padrão e não tem esse problema. O truque é
       encolher a CAIXA de #app na proporção inversa da escala antes de ampliar
       visualmente — assim o box pós-transform volta a cobrir exatamente o
       viewport, e os descendentes position:fixed (tabbar, FAB), que passam a
       ser ancorados a esse box (transform cria um novo containing block pra
       eles), ficam nas bordas reais da tela. Só não alcança overlays anexados
       direto a document.body (confirm-overlay, busca, tela de PIN) — ficam de
       fora da escala, mas continuam clicáveis normalmente. */
    width: calc(100% / var(--font-scale));
    height: calc(100vh / var(--font-scale));
    height: calc(100dvh / var(--font-scale));
    transform-origin: top left;
    transform: scale(var(--font-scale));
    display:flex;
    flex-direction:column;
    padding-top: calc(var(--safe-top) + 18px);
    overflow:hidden;
  }
  .screen{ flex:1; display:flex; flex-direction:column; padding:0 20px; animation: fade .25s ease; min-height:0; }
  .screen.with-tabbar{ padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 10px); }
  /* nó de rolagem que leva o cabeçalho da aba junto (Metas, Modelos) */
  .tab-scroll{ flex:1; overflow-y:auto; min-height:0; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; letter-spacing:-0.01em; }

  /* ---------- TABBAR ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; height:calc(var(--tabbar-h) + var(--safe-bottom));
    background:var(--surface-blur); border-top:1px solid var(--line);
    backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
    display:flex; padding-bottom:var(--safe-bottom); z-index:30;
    /* os 5 botões não têm rolagem horizontal própria; sem isso um arrasto
       lateral no dedo dava uma leve folga elástica nos botões (nativo do
       WebView tentando "arrastar" algo que não rola de verdade) */
    touch-action: pan-y;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family:'Inter'; font-size:11.5px;
  }
  /* pílula atrás do ícone da aba ativa: marca o lugar sem depender só da cor */
  .tabbar button .ic{
    font-size:19px; display:flex; align-items:center; justify-content:center;
    padding:3px 14px; border-radius:11px; transition: background .18s ease;
  }
  .icon-svg{ display:inline-block; vertical-align:-4px; flex-shrink:0; }
  .tabbar button.active{ color:var(--accent); }
  .tabbar button.active .ic{ background:var(--accent-soft); }

  /* ---------- DIÁRIO ---------- */
  .di-badge{ align-self:center; margin-bottom:10px; font-size:12px; }
  .di-badge span{ padding:6px 12px; }
  /* botão de agenda na mesma linha da pill tab de escopo, do mesmo tamanho */
  .di-escopo-row{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; }
  .di-agenda-inline{ height:auto; padding:6px 11px; align-self:stretch; }
  .di-daterow{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .di-daterow-label{ text-align:center; margin-bottom:12px; }
  .di-daterow input[type=date]{
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    color:var(--text); font-family:'Inter', sans-serif; font-size:13px; padding:8px 10px;
  }
  .di-daterow input[type=date]:focus{ outline:none; border-color:var(--accent); }
  /* botão de texto no lugar de ícone: precisa vencer o width fixo de .bell-btn */
  .bell-btn.di-hoje{ width:auto; padding:0 11px; font-size:12px; font-family:'Inter'; white-space:nowrap; }
  .di-body{ flex:1; overflow-y:auto; padding-bottom:16px; display:flex; flex-direction:column; }
  /* #diContent estica até o fim do espaço disponível em vez de encolher para o
     conteúdo — sem isto a view agenda (que só tem altura própria até a última
     hora com bloco) parecia parar na metade da tela, com vão em branco embaixo.
     Sem display:flex aqui (só no pai): o editor contínuo dentro de #diContent
     (.live-editor) não pode ganhar um contexto flex novo, senão herdaria um
     comportamento de scroll próprio que hoje não tem. */
  .di-body > #diContent{ flex:1; min-height:0; }
  .di-tools{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  /* o kanban do dia vem logo abaixo: o respiro de 40px viraria um vão morto */
  .di-live{ min-height:150px; padding-bottom:14px; }
  /* agenda de time-blocking: régua de horas + blocos posicionados por minuto */
  .ag-wrap{ position:relative; padding-left:52px; margin:4px 0 20px; }
  .ag-hora{ position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .ag-hora span{ position:absolute; left:0; top:-8px; font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); }
  .ag-blocos{ position:absolute; left:52px; right:0; top:0; bottom:0; }
  /* horário e nome na MESMA linha, o nome logo em seguida ao horário; só quebra
     para baixo quando o texto não cabe na largura do bloco */
  .ag-bloco{
    position:absolute; background:var(--surface-2); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:8px; padding:4px 7px;
    overflow:hidden; display:flex; flex-flow:row wrap; align-items:baseline;
    gap:0 6px; align-content:flex-start;
  }
  .ag-bloco{ touch-action:pan-y; } /* o arrasto horizontal é do gesto de adiar */
  /* bloco que veio de um cartão do kanban, e não de uma linha da nota */
  .ag-bloco.ag-kb{ border-left-color:var(--accent-2); background:var(--surface); }
  .ag-bloco.ag-kb .ag-hh::after{ content:" · cartão"; }
  /* bloco de compromisso avulso — mesma linguagem visual, cor própria */
  .ag-bloco.ag-cp{ border-left-color:var(--good); background:var(--surface); }
  .ag-bloco.ag-cp .ag-hh::after{ content:" · compromisso"; }
  .ag-bloco.feito{ border-left-color:var(--good); opacity:.6; }
  .ag-bloco.feito .ag-txt{ text-decoration:line-through; }
  .ag-bloco.adiado{
    border-left-color:var(--muted); border-style:dashed;
    background:repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 7px, var(--surface) 7px, var(--surface) 14px);
  }
  .ag-bloco.adiado .ag-txt{ color:var(--muted); }
  .ag-hh{ font-family:'Inter', sans-serif; font-size:10px; color:var(--muted); flex:0 0 auto; }
  /* basis 0 e não auto: com basis auto o texto largo já não caberia ao lado do
     horário e quebraria para a linha de baixo — o que era exatamente o problema */
  .ag-txt{ font-size:12.5px; line-height:1.25; flex:1 1 0; min-width:0; overflow-wrap:break-word; }
  .ag-agora{ position:absolute; left:44px; right:0; border-top:2px solid var(--danger); z-index:2; }
  /* agenda de semana/mês/ano: lista agrupada em vez de grade de minuto — não
     há granularidade suficiente para posicionar por pixel */
  .ag-grupos{ display:flex; flex-direction:column; gap:16px; margin:4px 0 20px; }
  .ag-grupo-titulo{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin-bottom:6px; }
  .ag-item{
    display:flex; align-items:baseline; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:8px; padding:8px 10px; margin-bottom:6px; touch-action:pan-y;
  }
  .ag-item.feito{ border-left-color:var(--good); opacity:.6; }
  .ag-item.feito .ag-item-txt{ text-decoration:line-through; }
  .ag-item.adiado{
    border-left-color:var(--muted); border-style:dashed;
    background:repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 7px, var(--surface) 7px, var(--surface) 14px);
  }
  .ag-item.adiado .ag-item-txt{ color:var(--muted); }
  .ag-item-hora{ font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); flex:0 0 auto; }
  .ag-item-txt{ font-size:13.5px; line-height:1.3; flex:1 1 0; min-width:0; overflow-wrap:break-word; }

  /* ---------- HOME / HEADER ---------- */
  .home-header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:10px; }
  .home-header h1{ font-size:32px; }
  .header-right{ display:flex; align-items:center; gap:10px; }
  .bell-btn{
    width:34px; height:34px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--line);
    color:var(--muted); font-size:15px; box-shadow: var(--shadow-1); transition: transform .12s ease, background .12s ease;
  }
  .bell-btn:active{ transform: scale(.92); background:var(--surface-2); }
  /* estado ligado de um bell-btn que é toggle (ex.: "hoje" nas Rotinas) */
  .bell-btn.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent); }
  /* alvo de toque de 44px sem mudar o tamanho visual de 34px: a área clicável
     é estendida por um pseudo-elemento, preservando o layout já ajustado */
  .bell-btn, .icon-btn{ position:relative; }
  .bell-btn::after, .icon-btn::after{ content:""; position:absolute; inset:-5px; border-radius:14px; }

  .routine-list, .notes-list{ display:flex; flex-direction:column; gap:12px; flex:1; overflow-y:auto; }
  .routine-card, .note-card{
    background: var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    box-shadow: var(--shadow-1);
    transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
  }
  /* afundar no toque: o card responde antes da tela trocar */
  .routine-card:active, .note-card:active{ background: var(--surface-2); transform: scale(.985); }
  .routine-info, .note-info{ min-width:0; flex:1; }
  .routine-info h3, .note-info h3{ font-size:19px; margin-bottom:6px; }
  .routine-meta{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); }

  /* ---------- SWIPE (revelar excluir / dispensar) ---------- */
  .swipe-item{ position:relative; overflow:hidden; border-radius:var(--radius); flex:0 0 auto; }
  .swipe-track{ position:relative; z-index:1; touch-action:pan-y; will-change:transform; }
  .swipe-del-btn{
    position:absolute; top:0; right:0; bottom:0; width:76px; background:var(--danger); color:#fff;
    border:none; font-family:'Inter'; font-weight:600; font-size:12.5px; z-index:0;
  }
  .swipe-dup-btn{
    position:absolute; top:0; left:0; bottom:0; width:76px; background:var(--accent-2); color:#fff;
    border:none; font-family:'Inter'; font-weight:600; font-size:12.5px; z-index:0;
  }

  /* ---------- TAREFAS: bloco (sub-toggle) + bullets ---------- */
  .tar-bloco-head{ display:flex; align-items:center; gap:8px; cursor:pointer; margin:14px 0 6px; padding:2px 2px; flex:0 0 auto; }
  .tar-bloco-arrow{ color:var(--muted); font-size:11px; width:12px; flex:0 0 auto; text-align:center; }
  .tar-bloco-title{ flex:1; min-width:0; font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--text); line-height:1.3; }
  .tar-bloco-count{ font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); flex:0 0 auto; }
  .tar-item{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-left:14px;
    box-shadow: var(--shadow-1); transition: transform .14s ease, background .14s ease;
  }
  .tar-item:active{ background:var(--surface-2); transform: scale(.985); }
  .tar-item-info{ display:flex; align-items:flex-start; gap:9px; flex:1; min-width:0; }
  .tar-bullet{ flex:0 0 auto; color:var(--muted); font-size:15px; line-height:1.4; }
  .tar-conteudo{ font-family:'Inter'; font-size:14.5px; font-weight:400; line-height:1.4; color:var(--text); overflow-wrap:break-word; word-break:break-word; }
  .tar-item-meta{ margin-top:3px; }
  .tar-detalhes{ margin:5px 0 0; padding-left:16px; list-style:disc; }
  .tar-detalhes li{ font-size:12.5px; color:var(--muted); line-height:1.45; margin:1px 0; overflow-wrap:break-word; word-break:break-word; }
  .tar-item-actions{ display:flex; gap:8px; flex:0 0 auto; }
  .note-snippet{ font-size:13px; color:var(--muted); line-height:1.4; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .routine-actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .icon-btn{
    width:34px; height:34px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--line);
    color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
    box-shadow: var(--shadow-1); transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:active{ transform: scale(.92); background:var(--surface-2); }
  .play-btn{
    width:44px; height:44px; border-radius:50%; background: var(--grad); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; font-size:16px; border:none;
    box-shadow: 0 4px 14px rgba(200,100,180,.35); flex-shrink:0;
    transition: transform .12s ease;
  }
  .play-btn:active{ transform: scale(.92); }
  .sched-chip{
    display:inline-flex; align-items:center; gap:4px; font-family:'Inter', sans-serif;
    font-size:11px; color:var(--accent); margin-top:6px;
  }
  /* inline-flex faria o chip dividir a linha com o de agendamento */
  .sched-chip.chip-block{ display:flex; }
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--muted); gap:10px;
  }
  .empty-state h2{ color:var(--text); font-size:22px; }
  .empty-state p{ font-size:14px; max-width:260px; line-height:1.5; }

  .fab{
    position:fixed; right:24px; bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 20px);
    width:58px; height:58px; border-radius:50%; background: var(--grad); color:var(--on-accent); border:none;
    font-size:28px; font-weight:400; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(200,100,180,.4); z-index:20;
    transition: transform .14s cubic-bezier(.34,1.56,.64,1);
  }
  .fab:active{ transform: scale(.9); }

  /* ---------- ALERT BANNER ---------- */
  .alert-banner{
    position:fixed; top:calc(var(--safe-top) + 10px); left:16px; right:16px;
    background:var(--grad); color:var(--on-accent); padding:14px 16px; border-radius:var(--radius-sm);
    box-shadow: var(--shadow-2);
    font-family:'Inter'; font-weight:600; font-size:14px; z-index:999;
    box-shadow:0 8px 24px rgba(0,0,0,.4); animation: slideIn .3s ease;
  }
  .alert-banner.hide{ opacity:0; transform:translateY(-10px); transition:.4s; }
  @keyframes slideIn{ from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);} }
  /* celebração (badge/meta concluída): mesmo banner, com ícone + leve "pop" de
     entrada pra marcar que este é diferente dos toasts neutros do dia a dia */
  .alert-banner.celebrate{ display:flex; align-items:center; gap:8px; font-size:14.5px; animation: slideIn .3s ease, popIn .4s ease; box-shadow:0 8px 28px rgba(224,97,158,.45); }
  @keyframes popIn{ 0%{transform:scale(.96);} 60%{transform:scale(1.02);} 100%{transform:scale(1);} }

  /* ---------- EDITOR (shared) ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; }
  .topbar .link-btn{ color:var(--accent); font-size:15px; background:none; border:none; padding:8px 0; }
  .topbar .link-btn.muted{ color:var(--muted); }

  input.name-input{
    background:none; border:none; border-bottom:2px solid var(--line);
    font-family:'Fraunces', serif; font-size:26px; color:var(--text);
    padding:8px 0; margin-bottom:18px; width:100%;
  }
  input.name-input:focus{ outline:none; border-color:var(--accent); }

  .section-label{ font-family:'Inter', sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 10px; }

  .steps-list{ display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; }
  .step-row{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; align-items:flex-start; gap:12px; }
  .step-num{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); width:22px; flex-shrink:0; padding-top:2px; }
  .step-fields{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .step-fields input[type=text]{ background:none; border:none; color:var(--text); font-size:16px; font-family:'Inter'; padding:0; width:100%; }
  .step-fields input[type=text]:focus{ outline:none; }
  .step-sub{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .type-toggle{ display:flex; background:var(--surface-2); border-radius:8px; padding:2px; font-size:11px; font-family:'Inter', sans-serif; }
  /* 4 a 5 opções de peso: em tela estreita quebram a linha em vez de estourar */
  .tagval-pills{ flex-wrap:wrap; }
  .type-toggle span{ padding:4px 8px; border-radius:6px; color:var(--muted); }
  .type-toggle span.active{ background:var(--grad); color:var(--on-accent); }
  .dur-input{ background:none; border:none; color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; width:52px; }
  .dur-input:focus{ outline:none; color:var(--accent); }
  .remove-step{ color:var(--danger); background:none; border:none; font-size:18px; padding:4px 6px; flex-shrink:0; }
  .order-btn{ background:none; border:none; color:var(--muted); font-size:13px; padding:4px 8px; }
  .order-btn:disabled{ opacity:.25; }
  /* alça de arrastar: única coisa na coluna direita agora (sem os botões
     ↑/↓), centralizada na altura do card em vez de presa no topo junto do
     número da etapa — align-self próprio, sem mexer no alinhamento das
     outras colunas do .step-row. */
  .step-side{ display:flex; align-items:center; flex-shrink:0; align-self:center; }

  .add-step-btn{ border:1px dashed var(--line); border-radius:14px; padding:16px; color:var(--muted); background:none; font-size:14px; text-align:center; margin-top:4px; }

  .schedule-box{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; font-size:15px; }
  .switch-row input[type=checkbox]{ width:44px; height:26px; accent-color: var(--accent); }
  .sched-time-row{ margin-top:14px; display:flex; align-items:center; gap:12px; }
  .sched-time-row input[type=time]{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; color:var(--text);
    font-family:'Inter', sans-serif; font-size:16px; padding:8px 10px;
  }
  .sched-computed{ margin-top:12px; font-size:13px; color:var(--muted); font-family:'Inter', sans-serif; }
  .sched-computed b{ color:var(--accent); font-weight:600; }
  /* swatch de cor da área (Configurações → roda da vida) — reset do chrome
     nativo do input[type=color] pra virar um quadradinho simples */
  .area-color-swatch{
    width:26px; height:26px; padding:0; border:1px solid var(--line); border-radius:8px;
    background:none; flex:0 0 auto; cursor:pointer;
  }
  .area-color-swatch::-webkit-color-swatch-wrapper{ padding:2px; }
  .area-color-swatch::-webkit-color-swatch{ border:none; border-radius:5px; }

  .bottom-actions{
    position:fixed; left:0; right:0; bottom:0; padding:16px 20px calc(16px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 65%, transparent); display:flex; gap:10px; z-index:15;
  }
  .btn-primary{
    flex:1; background:var(--grad); color:var(--on-accent); border:none; border-radius:var(--radius-sm);
    padding:16px; font-size:16px; font-weight:600; font-family:'Inter';
    box-shadow: 0 4px 14px rgba(200,100,180,.30); transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:active{ transform: scale(.975); box-shadow: 0 2px 8px rgba(200,100,180,.26); }
  .btn-danger-outline{ background:none; border:1px solid var(--danger); color:var(--danger); border-radius:14px; padding:16px 18px; font-size:15px; }

  /* ---------- NOTES ---------- */
  .note-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  /* carimbo automático de criação: informativo, nunca editável */
  .created-stamp{
    font-family:'Inter', sans-serif; font-size:11px; color:var(--muted);
    margin:-4px 0 10px; letter-spacing:.01em;
  }
  .btn-save-note{ background:var(--grad); color:var(--on-accent); border:none; border-radius:10px; padding:0 14px; height:34px; font-family:'Inter'; font-size:13.5px; }
  .note-footer{ display:flex; justify-content:flex-end; padding:12px 0 4px; }
  .note-footer .btn-danger-outline{ padding:10px 20px; font-size:14px; border-radius:12px; }
  input.note-title-input{
    background:none; border:none; font-family:'Fraunces', serif; font-size:28px; color:var(--text);
    padding:6px 0; width:100%; margin-bottom:10px; border-bottom:2px solid var(--line);
    line-height:1.25;
  }
  input.note-title-input:focus{ outline:none; border-color:var(--accent); }
  .mode-toggle{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .mode-toggle span{ padding:6px 12px; border-radius:8px; font-size:13px; color:var(--muted); font-family:'Inter', sans-serif; }
  .mode-toggle span.active{ background:var(--grad); color:var(--on-accent); }
  textarea.note-content{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-family:'Inter', sans-serif; font-size:15px; line-height:1.6;
    padding:14px; resize:none; width:100%;
  }
  textarea.note-content:focus{ outline:none; border-color:var(--accent); }
  .note-preview{ flex:1; overflow-y:auto; padding-bottom:20px; }
  .note-preview h1{ font-size:24px; margin:16px 0 8px; }
  .note-preview h2{ font-size:20px; margin:14px 0 6px; }
  .note-preview h3{ font-size:17px; margin:12px 0 6px; }
  .note-preview p{ margin:6px 0; font-size:15px; line-height:1.55; color:var(--text); }
  .note-preview ul, .note-preview ol{ margin:6px 0; padding-left:22px; }
  .note-preview li{ margin:3px 0; font-size:15px; line-height:1.5; }
  .note-preview code{ background:var(--surface-2); padding:1px 6px; border-radius:5px; font-family:'Inter', sans-serif; font-size:13.5px; }
  .checklist-item{ display:flex; align-items:flex-start; gap:10px; margin:6px 0; font-size:15px; line-height:1.4; }
  .checklist-box{ width:19px; height:19px; border-radius:5px; border:2px solid var(--accent); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--accent); }
  .checklist-item.checked .checklist-box{ background:var(--grad); color:var(--on-accent); border-color:transparent; }
  .checklist-item.checked span.txt{ color:var(--muted); text-decoration:line-through; }
  /* "[>]" — item adiado: nem aberto nem concluído */
  .checklist-item.adiado .checklist-box{ border-color:var(--muted); color:var(--muted); border-style:dashed; }
  .checklist-item.adiado span.txt{ color:var(--muted); }

  /* ---------- LIVE EDITOR (Obsidian-style) ---------- */
  .live-editor{ flex:1; overflow-y:auto; padding-bottom:10px; user-select:text; }
  .live-line{ padding:4px 2px; font-size:15px; line-height:1.5; border-radius:6px; min-height:24px; }
  .live-line:active{ background:var(--surface); }
  .live-line.empty{ min-height:20px; }
  .live-line .inline-h{ margin:6px 0 2px; }
  .live-line h1.inline-h{ font-size:24px; }
  .live-line h2.inline-h{ font-size:20px; }
  .live-line h3.inline-h{ font-size:17px; }
  .li-line{ padding-left:8px; }
  .li-marker{ color:var(--accent); margin-right:6px; }
  .live-line code{ background:var(--surface-2); padding:1px 6px; border-radius:5px; font-family:'Inter', sans-serif; font-size:13.5px; }
  /* superfície contínua: uma só caixa editável, com as linhas dentro */
  .live-editor{ white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; }
  .live-editor:focus{ outline:none; }
  /* A linha do cursor mostra o markdown cru. Sem caixa, sem barra lateral e sem
     mudar de tamanho: no Obsidian a linha em edição é igual às outras, só com a
     sintaxe à vista. Era o realce em caixa (fundo + barra + padding) somado ao
     título que encolhia para 15px que fazia o editor parecer linha a linha em
     vez de um texto corrido. As classes -hN devolvem a tipografia do bloco para
     a linha crua, então nada pula ao mover o cursor. */
  .live-raw{ background:transparent; }
  .live-raw-h1, .live-raw-h2, .live-raw-h3{
    font-family:'Fraunces', serif; font-weight:600;
    padding-top:10px; padding-bottom:6px; /* = padding 4px + margem 6px/2px do .inline-h */
  }
  .live-raw-h1{ font-size:24px; }
  .live-raw-h2{ font-size:20px; }
  .live-raw-h3{ font-size:17px; }
  .live-raw-li{ padding-left:8px; }
  .live-hr{ border-top:1px solid var(--line); margin:8px 0; }

  /* Barra de atalhos markdown acima do teclado (estilo Obsidian): fixa no
     rodapé, deslocada pela altura do teclado via visualViewport (ver
     atualizarBarraMarkdown). Some quando o editor perde o foco ou some da tela. */
  .md-toolbar{
    position:fixed; left:0; right:0; bottom:0; z-index:520;
    display:flex; gap:4px; overflow-x:auto; padding:7px 8px;
    background:var(--surface); border-top:1px solid var(--line);
    box-shadow:var(--shadow-1);
    transform:translateY(100%); transition:transform .15s ease;
  }
  .md-toolbar.show{ transform:translateY(0); }
  .md-tb-btn{
    flex:0 0 auto; min-width:38px; height:38px; padding:0 10px;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:15px; font-family:'Inter', sans-serif;
  }
  .md-tb-btn:active{ transform:scale(.92); background:var(--surface); }
  .md-tb-btn.md-tb-b{ font-weight:700; }
  .md-tb-btn.md-tb-i{ font-style:italic; }

  /* ---------- PLAYER ---------- */
  .player{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding: 6px 0 20px; width:100%; }
  .player-top{ width:100%; display:flex; justify-content:space-between; align-items:center; padding:0 4px; }
  .player-close{ color:var(--muted); background:none; border:none; font-size:15px; }
  .player-progress-label{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); }

  .next-task-row{
    width:100%; text-align:center; font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); margin:10px 0 6px; line-height:1.5;
  }
  .estimate-row{
    width:100%; display:flex; justify-content:center; align-items:center; gap:8px;
    font-family:'Inter', sans-serif; font-size:12.5px; color:var(--muted); margin:0 0 6px;
  }
  .estimate-row b{ color:var(--accent); font-size:19px; font-weight:700; }

  .dial-wrap{ position:relative; width:min(72vw, 280px); height:min(72vw, 280px); display:flex; align-items:center; justify-content:center; margin:8px 0; }
  .dial-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); transition: filter .3s; }
  .dial-track{ stroke: var(--line); }
  .dial-wrap.overtime svg circle#dialArc{ stroke: var(--danger) !important; }
  .dial-time{ position:absolute; font-family:'Inter', sans-serif; font-size:15px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dial-time .t{ font-size:50px; letter-spacing:-1px; }
  .dial-time .t.overtime{ color: var(--danger); }
  .dial-time .label{ font-family:'Fraunces', serif; font-size:16px; color:var(--muted); font-weight:500; max-width:200px; text-align:center; }

  .checklist-body{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; flex:1; padding: 24px 20px; }
  .checklist-body h2{ font-size:26px; text-align:center; }
  .check-circle{ width:110px; height:110px; border-radius:50%; border:3px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:44px; }

  .step-title{ font-size:15px; color:var(--muted); font-family:'Inter', sans-serif; letter-spacing:.04em; text-transform:uppercase; }

  .player-controls{ display:flex; align-items:center; justify-content:center; gap:22px; width:100%; }
  /* com o botão de adiar são 4 controles na linha: aperta o espaçamento p/ caber */
  .player-controls.four{ gap:14px; }
  .ctrl-btn{ width:56px; height:56px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; }
  .ctrl-btn.big{ width:76px; height:76px; background:var(--grad); color:var(--on-accent); border:none; font-size:24px; box-shadow: 0 6px 20px rgba(200,100,180,.4); }
  /* concluir etapa é sempre verde — o gesto de "feito" não disputa cor com o play */
  .ctrl-btn.ok{ background:var(--good); border-color:var(--good); color:#fff; }
  .ctrl-btn.ok.big{ background:var(--good); box-shadow: 0 6px 20px rgba(107,143,113,.42); }
  .ctrl-btn.pulse{ animation: pulseGlow 1.1s infinite; }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(178,91,76,.55);} 50%{ box-shadow:0 0 0 10px rgba(178,91,76,0);} }

  .stepper-track{ display:flex; gap:5px; width:100%; padding:0 4px; margin-bottom:4px; }
  .stepper-track .seg{ flex:1; height:4px; border-radius:2px; background:var(--line); overflow:hidden; }
  .stepper-track .seg .fill{ height:100%; background:var(--grad); width:0%; }
  .stepper-track .seg.done .fill{ width:100%; }

  .done-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  .done-screen .mark{ font-size:56px; color:var(--good); }
  .done-screen h2{ font-size:26px; }
  .done-screen p{ color:var(--muted); font-size:14px; }

  ::-webkit-scrollbar{ display:none; }

  /* ---------- STATS ---------- */
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:6px; box-shadow: var(--shadow-1); }
  .cal-grid{ display:grid; grid-template-columns: repeat(14, 1fr); gap:5px; }
  .cal-dot{ aspect-ratio:1; border-radius:4px; background:var(--surface-2); }
  .cal-dot.on{ background:var(--grad); }
  .stat-foot{ margin-top:12px; font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); }
  .bar-row{ display:flex; align-items:center; gap:10px; margin:8px 0; }
  .bar-name{ width:34%; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--grad); border-radius:4px; }
  .bar-val{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); width:52px; text-align:right; }
  .dev-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .dev-row:last-child{ border-bottom:none; }
  /* Linha de tabela: a 1ª coluna é texto e fica com toda a sobra; as colunas de
     número têm largura mínima fixa, alinhamento à direita e dígitos de largura
     igual (tabular-nums), para uma linha ficar alinhada com a de cima. Sem isso
     o space-between esticava a coluna do meio e cada linha saía torta. */
  .dev-row:not(.exec-row) > :first-child{ flex:1 1 auto; min-width:0; overflow-wrap:break-word; }
  .dev-row:not(.exec-row) > b,
  .dev-row:not(.exec-row) > .dev-n{
    flex:0 0 auto; text-align:right; font-variant-numeric: tabular-nums;
  }
  .dev-row:not(.exec-row) > b{ min-width:58px; }
  .dev-row:not(.exec-row) > .dev-n{ min-width:76px; }
  /* 3ª coluna com texto longo (ex.: "1:30→2:05 · 4x") pode passar da mínima */
  .dev-row:not(.exec-row) > .dev-n.wide{ min-width:110px; }
  /* cabeçalho de tabela: mesma grade das linhas, tipografia de rótulo */
  .dev-row.dev-head{ border-bottom-color:var(--muted); }
  .dev-row.dev-head > *{
    font-family:'Inter', sans-serif; font-size:10.5px; font-weight:400;
    text-transform:uppercase; letter-spacing:.05em; color:var(--muted) !important;
  }
  .bar-val{ font-variant-numeric: tabular-nums; }
  .dev-row b.late{ color:var(--danger); }
  .dev-row b.early{ color:var(--good); }
  .dev-row b.ontime{ color:var(--accent); }
  .dev-n{ font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); }
  .exec-row{ flex-direction:column; align-items:flex-start; gap:2px; }
  .exec-row .exec-name{ line-height:1.3; }

  /* ---------- ZEN MODE ---------- */
  /* lista de etapas do player (overlay ☰) */
  .pl-steps{ display:block; overflow-y:auto; }
  .pl-step{ display:flex; align-items:center; gap:9px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .pl-step:last-child{ border-bottom:none; }
  .pl-step-i{ flex:0 0 22px; text-align:center; font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); }
  .pl-step-nome{ flex:1 1 auto; min-width:0; font-size:14.5px; }
  .pl-step-dur{ flex:0 0 auto; font-family:'Inter', sans-serif; font-size:11.5px; color:var(--muted); }
  .pl-step-moves{ display:flex; gap:4px; flex-shrink:0; }
  .pl-step.feita .pl-step-nome, .pl-step.feita .pl-step-dur{ color:var(--muted); text-decoration:line-through; }
  .pl-step.feita .pl-step-i{ color:var(--good); }
  .pl-step.atual{ background:var(--accent-soft); border-radius:10px; padding-left:6px; padding-right:6px; }
  .pl-step.atual .pl-step-nome{ color:var(--accent); font-weight:600; }

  .zen-screen{ justify-content:center; }
  .zen-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; }
  .zen-label{ font-family:'Fraunces', serif; font-size:22px; color:var(--muted); }
  .zen-time{ font-family:'Inter', sans-serif; font-size:min(26vw, 120px); font-weight:500; letter-spacing:-2px; line-height:1; }
  .zen-time.overtime{ color:var(--danger); }
  .zen-sub{ font-family:'Inter', sans-serif; font-size:13px; color:var(--muted); }
  .zen-sub b{ color:var(--accent); }

  /* ---------- DAY CHIPS / REST / SELECT ---------- */
  .day-chips{ display:flex; gap:6px; margin-top:14px; }
  .day-chip{
    flex:1; text-align:center; padding:8px 0; border-radius:9px; background:var(--surface-2);
    color:var(--muted); font-family:'Inter', sans-serif; font-size:13px; border:1px solid var(--line);
  }
  .day-chip.active{ background:var(--grad); color:var(--on-accent); border-color:transparent; }
  .routine-select{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px; color:var(--text);
    font-family:'Inter'; font-size:14px; padding:8px 10px; width:100%;
  }
  .stepper-track .seg.rest .fill{ background:var(--good); }
  .dial-wrap.restdial .dial-time .label{ color:var(--good); }

  /* ---------- NOTES: SEARCH & PIN ---------- */
  .note-search{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; color:var(--text);
    font-family:'Inter'; font-size:15px; padding:11px 14px; width:100%; margin-bottom:14px;
  }
  .note-search:focus{ outline:none; border-color:var(--accent); }
  .pin-btn{ color:var(--line); font-size:18px; }
  .pin-btn.pinned{ color:var(--accent); border-color:var(--accent-dim); }
  .pin-mark{ color:var(--accent); font-size:14px; }

  /* ---------- CONFIRM MODAL ---------- */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:30px;
    animation: fade .15s ease;
  }
  .confirm-box{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:22px; max-width:320px; width:100%; box-shadow: var(--shadow-2);
  }
  /* busca global: mesma caixa do modal, mas encostada no topo e alta o
     bastante para a lista de acertos rolar sem empurrar o campo de busca */
  .confirm-overlay.search-overlay{ align-items:flex-start; padding:24px 18px; }
  .search-box{ max-width:460px; display:flex; flex-direction:column; max-height:82vh; }
  .search-box .notes-list{ overflow-y:auto; flex:1 1 auto; }
  .confirm-box p{ margin:0 0 18px; font-size:15.5px; line-height:1.5; }
  .confirm-box small{ color:var(--muted); }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{ flex:1; border-radius:12px; padding:13px; font-size:15px; font-family:'Inter'; }
  .btn-cancel{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); }
  .btn-confirm{ background:var(--danger); border:none; color:#fff; font-weight:600; }

  /* ---------- TAGS & WIKILINKS ---------- */
  .tag-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tag-chip{
    padding:5px 11px; border-radius:20px; background:var(--surface); border:1px solid var(--line);
    color:var(--muted); font-family:'Inter', sans-serif; font-size:12.5px;
  }
  .tag-chip.active{ background:var(--grad); color:var(--on-accent); border-color:transparent; }
  .tag-token{ color:var(--accent); }
  .wikilink{ color:var(--accent-2); text-decoration:underline; text-underline-offset:3px; }

  /* ---------- TAG INPUT (multiselect com criação livre) ---------- */
  .tag-input-box{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 8px; margin-bottom:8px;
  }
  .tag-input-chip{
    display:flex; align-items:center; gap:5px; padding:4px 6px 4px 10px; border-radius:20px;
    background:var(--grad); color:var(--on-accent); font-family:'Inter', sans-serif; font-size:12.5px;
  }
  .tag-input-chip button{ background:none; border:none; color:inherit; font-size:14px; line-height:1; padding:0 2px; cursor:pointer; }
  .tag-input-field{ flex:1; min-width:80px; background:none; border:none; color:var(--text); font-size:14px; padding:4px; }
  .tag-input-field:focus{ outline:none; }
  .tag-input-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin:-2px 0 8px; }

  /* ---------- IDENTIDADE VISUAL DA ROTINA ---------- */
  .ident-row{ display:flex; align-items:center; gap:14px; margin:-6px 0 18px; }
  .r-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:1px; }

  /* ---------- PLAYER EXTRAS ---------- */
  .skip-btn{
    background:none; border:1px dashed var(--line); color:var(--muted); border-radius:10px;
    padding:8px 16px; font-size:13.5px; font-family:'Inter';
  }
  .skip-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; }
  .resume-card{ border-color:var(--accent-dim); }
  .resume-card h3{ color:var(--accent); font-size:16px; }
  /* cards fixados no topo da home (boletim, rotina em andamento, semana fechada):
     não podem encostar na lista de rotinas logo abaixo */
  .pinned-card{ flex:0 0 auto; margin-bottom:14px; }
  .pinned-card + .pinned-card{ margin-top:-4px; }

  /* ---------- AVISOS / UNDO ---------- */
  .notice-card{
    background:var(--surface); border:1px dashed var(--accent-dim); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; font-size:13.5px; line-height:1.45;
    display:flex; flex-direction:column; gap:10px;
  }
  .notice-actions{ display:flex; gap:8px; }
  .notice-actions button{
    background:var(--grad); color:var(--on-accent); border:none; border-radius:9px;
    padding:8px 16px; font-size:13.5px; font-family:'Inter'; font-weight:600;
  }
  .notice-actions button.ghost{ background:var(--surface-2); color:var(--muted); font-weight:400; }
  .undo-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .undo-btn{
    background:rgba(255,255,255,.25); border:none; color:var(--on-accent); border-radius:8px;
    padding:7px 14px; font-size:13.5px; font-weight:700; font-family:'Inter'; flex-shrink:0;
  }

  /* ---------- DRAG ---------- */
  .drag-handle{ color:var(--muted); font-size:17px; padding:2px 8px; cursor:grab; touch-action:none; user-select:none; }
  .step-row.dragging, .routine-card.dragging{ opacity:.45; border-color:var(--accent); }
  .step-row.drop-above, .routine-card.drop-above{ box-shadow: 0 -3px 0 0 var(--accent); }
  .step-row.drop-below, .routine-card.drop-below{ box-shadow: 0 3px 0 0 var(--accent); }

  /* ---------- NOTE OVERLAY ---------- */
  .note-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:900;
    display:flex; align-items:flex-end; justify-content:center; animation: fade .2s ease;
  }
  .note-overlay-box{
    background:var(--bg); border:1px solid var(--line); border-radius:22px 22px 0 0;
    width:100%; max-height:75vh; display:flex; flex-direction:column;
    padding:18px 20px calc(18px + var(--safe-bottom));
  }
  .note-overlay-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .note-overlay-top h3{ font-size:19px; }
  .note-overlay-body{ overflow-y:auto; user-select:text; }
  .note-link-btn{ border-style:solid; color:var(--accent-2); border-color:var(--accent-2); }
  .note-link-select{ font-size:13px; padding:6px 8px; color:var(--muted); }

  /* ---------- AGENDA ---------- */
  .agenda-row{ cursor:pointer; }
  .agenda-time{ font-family:'Inter', sans-serif; font-size:12.5px; color:var(--muted); width:96px; flex-shrink:0; }
  .agenda-today{ border-color:var(--accent-dim); }

  /* ---------- TREND ---------- */
  .trend-chart{ display:flex; align-items:flex-end; gap:6px; }
  .trend-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .trend-bar-area{ height:64px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; }
  .trend-bar{ width:70%; max-width:26px; border-radius:4px 4px 0 0; }
  .trend-bar.late{ background:var(--danger); }
  .trend-bar.early{ background:var(--good); }
  .trend-bar.ontime{ background:var(--grad); }
  .trend-val{ font-family:'Inter', sans-serif; font-size:9.5px; color:var(--muted); }
  .trend-lbl{ font-family:'Inter', sans-serif; font-size:9.5px; color:var(--muted); }

  /* ---------- HEATMAP (estilo GitHub) ---------- */
  .hm-scroll{ overflow-x:auto; padding-bottom:4px; }
  .hm-months{ display:flex; gap:3px; margin-bottom:4px; }
  .hm-mlabel{ width:13px; flex-shrink:0; font-family:'Inter', sans-serif; font-size:9px; color:var(--muted); overflow:visible; white-space:nowrap; }
  .hm-grid{ display:flex; gap:3px; }
  .hm-col{ display:flex; flex-direction:column; gap:3px; }
  .hm-cell{ width:13px; height:13px; border-radius:3px; background:var(--surface-2); flex-shrink:0; }
  .hm-cell.hm-void{ background:transparent; }
  .hm-cell.lv1{ background:#EC6AA84D; }
  .hm-cell.lv2{ background:#C973BE99; }
  .hm-cell.lv3{ background:#8B7FD9CC; }
  .hm-cell.lv4{ background:#5B8DEF; }
  body.light .hm-cell.lv1{ background:#EC6AA855; }
  .hm-cell.hm-sel{ outline:2px solid var(--text); outline-offset:1px; }
  .hm-legend{ display:flex; align-items:center; gap:5px; margin-top:8px; font-family:'Inter', sans-serif; font-size:10px; color:var(--muted); }

  /* ---------- NAVEGAÇÃO E CALENDÁRIO MENSAL ---------- */
  .stats-nav{ margin-bottom:12px; display:flex; }
  .view-toggle{ width:100%; }
  .view-toggle span{ flex:1; text-align:center; }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-title{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; }
  .mcal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .mcal-dowlbl{ text-align:center; font-family:'Inter', sans-serif; font-size:10px; color:var(--muted); padding-bottom:2px; }
  .mcal-cell{
    aspect-ratio:.85; border-radius:8px; background:var(--surface-2); position:relative;
    display:flex; flex-direction:column; align-items:center; padding-top:4px; gap:2px;
  }
  .mcal-cell.mcal-void{ background:transparent; }
  .mcal-num{ font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); }
  .mcal-today .mcal-num{ color:var(--accent); font-weight:700; }
  .mcal-today{ outline:1.5px solid var(--accent-dim); }
  .mcal-sel{ outline:2px solid var(--text); }
  .mcal-dots{ display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:90%; }
  .mcal-dot{ width:6px; height:6px; border-radius:50%; }
  .mcal-missed{
    position:absolute; top:2px; right:3px; font-family:'Inter', sans-serif;
    font-size:9px; color:var(--danger); font-weight:700;
  }

  /* ---------- EMPILHADO POR DIA / HISTOGRAMA HORA ---------- */
  .stack-chart{ display:flex; gap:8px; align-items:flex-end; }
  .stack-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .stack-bars{ display:flex; flex-direction:column-reverse; width:70%; max-width:30px; min-height:2px; }
  .stack-seg{ width:100%; }
  .stack-seg:first-child{ border-radius:0 0 3px 3px; }
  .stack-seg:last-child{ border-radius:3px 3px 0 0; }
  .hour-chart{ display:flex; gap:2px; align-items:flex-end; height:84px; }
  .hour-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; }
  .hour-col .trend-lbl{ height:12px; line-height:12px; }
  .hour-bar-area{ flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
  .hour-bar{ width:100%; max-width:12px; background:var(--grad); border-radius:2px 2px 0 0; }
  .tappable{ cursor:pointer; }
  .tappable:active{ opacity:.6; }

  /* ---------- HUMOR / METAS / EXCLUIR EXEC ---------- */
  .mood-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .mood-btn{ background:var(--surface); border:1px solid var(--line); border-radius:14px; font-size:14px; letter-spacing:1px; color:var(--accent); padding:10px 9px; }
  .mood-btn.sel{ border-color:var(--accent); background:var(--surface-2); transform:scale(1.12); }
  .goal-track{ position:relative; }
  .goal-marker{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); opacity:.65; border-radius:1px; }
  .del-exec{ background:none; border:none; color:var(--muted); font-size:13px; padding:2px 6px; flex-shrink:0; }
  .del-exec:active{ color:var(--danger); }
  .suggest-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 0 8px 12px; }
  .suggest-btn{
    background:var(--surface-2); border:1px dashed var(--accent-dim); color:var(--accent);
    border-radius:8px; padding:5px 12px; font-size:12.5px; font-family:'Inter', sans-serif;
  }
  .cyc-inp{ background:var(--surface-2) !important; border:1px solid var(--line) !important; border-radius:8px !important; padding:7px 8px !important; color:var(--text) !important; font-size:15px !important; }

  /* ---------- MODELOS ---------- */
  .tmpl-new-row{ display:flex; gap:10px; margin-bottom:18px; }
  .tmpl-new{
    background:var(--surface); border:1px dashed var(--accent-dim); border-radius:12px;
    padding:9px 6px; color:var(--text); font-family:'Inter'; font-size:12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; min-height:0;
    aspect-ratio:1/1;
  }
  .tmpl-ic{ font-size:19px; height:19px; display:flex; align-items:center; justify-content:center; }
  .tmpl-new .icon-svg{ vertical-align:0; }
  .market-form{ margin-bottom:14px; }
  .market-form input[type=text]{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font-size:15px; padding:11px 14px; margin-bottom:8px;
  }
  .market-form input[type=text]:focus{ outline:none; border-color:var(--accent); }
  .market-form-row{ display:flex; gap:8px; }
  .market-form-row input, .market-form-row select{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:14px; padding:9px 8px;
  }
  .market-form-row input{ width:64px; }
  .market-form-row select{ flex:1; min-width:0; }
  .matrix-grid{
    flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    gap:10px; overflow-y:auto; padding-bottom:16px; min-height:0;
  }
  .matrix-quad{
    border:1.5px solid; border-radius:14px; padding:10px; display:flex; flex-direction:column;
    min-height:0; overflow:hidden;
  }
  .mx-title{
    background:none; border:none; font-family:'Fraunces', serif; font-weight:600; font-size:14px;
    width:100%; padding:0 0 4px;
  }
  .mx-title:focus{ outline:none; }
  .mx-tools{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; flex-wrap:wrap; row-gap:6px; }
  .mx-colors{ display:flex; gap:4px; flex-wrap:wrap; }
  .mx-items{ flex:1; overflow-y:auto; min-height:0; }
  .mx-add input{
    width:100%; background:transparent; border:none; border-top:1px dashed var(--line);
    color:var(--text); font-size:13px; padding:7px 2px 2px;
  }
  .mx-add input:focus{ outline:none; }

  /* ---------- MERCADO v2 ---------- */
  .mk-chips{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .mk-item{ gap:8px; }
  .mk-name{ flex:1; min-width:0; overflow-wrap:break-word; }
  .mk-right{ margin-left:auto; flex-shrink:0; font-family:'Inter', sans-serif; font-size:12px; color:var(--muted); text-align:right; }
  .mk-edit{ background:var(--surface-2); border-radius:10px; padding:10px; margin:6px 0; }
  .mk-e-name{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:9px; color:var(--text); font-size:14.5px; padding:9px 10px; margin-bottom:8px; }
  .mk-e-name:focus{ outline:none; border-color:var(--accent); }
  /* caixas de texto livres crescem com o conteúdo (autoGrowAll), então nada de
     rolagem interna nem alça de resize manual */
  textarea.mk-e-name, textarea.mx-e-text{
    resize:none; overflow:hidden; line-height:1.5;
    font-family:'Inter', -apple-system, sans-serif;
  }
  .shop-counter{ font-family:'Inter', sans-serif; font-size:44px; text-align:center; padding:8px 0 2px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .shop-counter span{ font-size:14px; color:var(--muted); -webkit-text-fill-color:var(--muted); }
  .tmpl-new-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:18px; }
  /* o nó que rola é o de fora (cabeçalho junto): aqui só o empilhamento */
  .tmpl-folders{ flex:0 0 auto; }
  /* divisor entre as pastas fixas e as que nascem das anotações de rotina */
  .tmpl-sep{ display:flex; align-items:center; gap:10px; margin:2px 0 14px; }
  .tmpl-sep::before, .tmpl-sep::after{ content:""; flex:1; height:1px; background:var(--line); }
  .tmpl-sep span{
    font-family:'Inter', sans-serif; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted);
  }

  /* ---------- REGISTRO DE PONTOS ---------- */
  .sb-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 12px; flex-wrap:wrap; }
  .sb-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .sb-grid{ display:grid; width:100%; align-items:stretch; }
  .sb-grid > div{ border-bottom:1px solid var(--line); padding:6px 2px; display:flex; align-items:center; justify-content:center; min-width:0; }
  /* a coluna do número do turno gruda à esquerda: com muitos jogadores a grade
     rola e sem isso perde-se a referência de qual linha é qual turno */
  .sb-idx{
    font-family:'Inter', sans-serif; font-size:11px; color:var(--muted);
    position:sticky; left:0; z-index:1; background:var(--bg);
  }
  .sb-tot.sb-idx{ background:var(--surface); }
  /* nome em cima e o ✕ embaixo: empilhados, o cabeçalho não disputa largura */
  .sb-h{ border-bottom:1px solid var(--line); flex-direction:column; gap:1px; }
  .sb-name{
    width:100%; min-width:0; background:none; border:none; color:var(--text);
    font-family:'Fraunces', serif; font-size:14px; text-align:center; padding:2px 0;
    text-overflow:ellipsis;
  }
  .sb-name:focus{ outline:none; color:var(--accent); }
  .sb-delp{ font-size:10px; padding:0; line-height:1; }
  .sb-tot{
    font-family:'Inter', sans-serif; font-size:20px; font-weight:600;
    background:var(--surface); border-bottom:2px solid var(--line) !important;
  }
  .sb-tot.lider{ color:var(--accent); }
  .sb-in{
    width:100%; min-width:0; background:none; border:none; color:var(--text);
    font-family:'Inter', sans-serif; font-size:16px; text-align:center; padding:4px 0;
    -moz-appearance:textfield;
  }
  /* 4–5 e 6+ jogadores: a tipografia encolhe para tudo caber sem rolar */
  .sb-grid.compacto .sb-name{ font-size:12px; }
  .sb-grid.compacto .sb-tot{ font-size:16px; }
  .sb-grid.compacto .sb-in{ font-size:14px; }
  .sb-grid.mini .sb-name{ font-size:10.5px; }
  .sb-grid.mini .sb-tot{ font-size:13.5px; }
  .sb-grid.mini .sb-in{ font-size:12.5px; }
  .sb-grid.mini > div{ padding:5px 1px; }
  .sb-in::-webkit-outer-spin-button, .sb-in::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .sb-in:focus{ outline:none; background:var(--surface); border-radius:6px; }

  /* ---------- MATRIZ v2 ---------- */
  .matrix-single{ flex:1; display:flex; min-height:0; }
  .matrix-single .matrix-quad{ flex:1; min-height:0; }
  .mx-editbox{ background:var(--surface); border-radius:9px; padding:8px; margin:4px 0; }
  .mx-e-text{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:14px; padding:8px 9px; margin-bottom:6px; }
  .mx-e-text:focus{ outline:none; border-color:var(--accent); }
  .mx-e-tools{ display:flex; align-items:center; gap:2px; margin-bottom:6px; flex-wrap:wrap; }
  .mx-e-quad{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:12px; padding:6px; }
  .mx-axes{ display:flex; gap:8px; margin-bottom:8px; }
  .mx-axes input{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:9px; color:var(--text); font-size:13px; padding:8px 10px; }
  .mx-axis-x{ text-align:center; font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .mx-axis-y{ writing-mode:vertical-rl; transform:rotate(180deg); font-family:'Inter', sans-serif; font-size:11px; color:var(--muted); display:flex; align-items:center; }

  /* ---------- KANBAN ---------- */
  .kb-board{ flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding-bottom:14px; min-height:0; }
  .kb-col{ flex:0 0 auto; width:100%; max-height:min(46vh,360px); background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column; min-height:0; }
  .kb-head{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  /* cor por estágio (índice da coluna, ciclando se houver mais de 3) */
  .kb-col.kb-s0{ background:var(--kb-todo-bg);  border-left:4px solid var(--kb-todo); }
  .kb-col.kb-s1{ background:var(--kb-doing-bg); border-left:4px solid var(--kb-doing); }
  .kb-col.kb-s2{ background:var(--kb-done-bg);  border-left:4px solid var(--kb-done); }
  /* chips de área (multiselect das metas) */
  .meta-areas{ display:flex; flex-wrap:wrap; gap:6px; }
  /* anotação da meta: bloco recuado, para não se confundir com os dados do prazo */
  .meta-nota{ margin-top:10px; padding-left:10px; border-left:2px solid var(--line); font-size:14px; line-height:1.55; }
  .meta-nota .live-line.empty{ height:6px; }
  .area-chip{ font-family:'Inter', sans-serif; font-size:11px; padding:5px 9px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); background:var(--surface-2); cursor:pointer; }
  .area-chip.sel{ border-color:var(--chip); color:var(--chip); background:transparent; }
  .area-chips{ display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  /* filtro de área nas abas Rotinas/Metas: rola na horizontal em vez de quebrar linha.
     Precisa anular o flex:1 de .area-chips — aqui a linha é filha direta do .screen
     (coluna flex) e flex:1 a esticava para ocupar a altura toda da tela. */
  .area-filter-row{ flex:0 0 auto; flex-wrap:nowrap; overflow-x:auto; margin-bottom:16px; padding-bottom:2px; }
  .area-filter-row .area-chip{ flex:0 0 auto; }
  /* selo da rotina já consolidada (desconto de hábito ativo na semana) */
  .habito-chip{ font-family:'Inter', sans-serif; font-size:10.5px; color:var(--good); border:1px solid var(--good);
    border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:middle; }
  .kb-col.kb-s0 .kb-head{ color:var(--kb-todo); }
  .kb-col.kb-s1 .kb-head{ color:var(--kb-doing); }
  .kb-col.kb-s2 .kb-head{ color:var(--kb-done); }
  .kb-cards{ flex:1; overflow-y:auto; min-height:60px; }
  /* kanban embutido numa tela que já rola (o do diário): sem altura travada e
     sem rolagem própria, para não criar rolagem dentro de rolagem */
  .kb-board.kb-inline{ flex:0 0 auto; overflow:visible; margin-top:2px; }
  .kb-inline .kb-col{ max-height:none; }
  .kb-inline .kb-cards{ overflow:visible; }
  /* Cartão em duas linhas: texto em cima com a largura toda, controles embaixo.
     Em linha única o texto ficava espremido entre a alça e três botões. */
  .kb-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 10px; margin-bottom:7px; display:flex; flex-direction:column; gap:6px; box-shadow: var(--shadow-1); }
  .kb-card-top{ display:flex; align-items:flex-start; gap:6px; }
  .kb-card-bot{ display:flex; align-items:center; gap:6px; padding-left:23px; } /* alinha com o texto, depois da alça */
  .kb-card-bot .kb-moves{ margin-left:auto; }
  .kb-hora{ flex-shrink:0; font-family:'Inter', sans-serif; font-size:10px; color:var(--accent-2);
    border:1px solid var(--accent-2); border-radius:6px; padding:1px 5px; }
  /* nota anexada à rotina, aberta por cima do player */
  .ed-nota-sel{ flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; color:var(--text); font-size:13px; padding:7px 9px; }
  .nota-rot-box{ display:flex; flex-direction:column; max-height:82vh; }
  .nota-rot-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .nota-rot-titulo{ flex:1; min-width:0; font-family:'Fraunces', serif; font-weight:600; font-size:17px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nota-rot-corpo{ flex:1; min-height:0; overflow-y:auto; font-size:14.5px; line-height:1.55; }
  .nota-rot-ta{ width:100%; min-height:40vh; line-height:1.55; }
  /* lista de notas já anotadas no lançamento rápido do player */
  .qa-idea-list{ display:flex; flex-direction:column; gap:6px; max-height:34vh; overflow-y:auto; }
  .qa-idea-row{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 11px; color:var(--text); width:100%; }
  .qa-idea-row:active{ transform:scale(.985); background:var(--surface); }
  /* o aspect-ratio 1/1 de .tmpl-new viraria um quadradão de largura total aqui */
  .qa-idea-nova{ width:100%; margin-top:12px; aspect-ratio:auto; flex-direction:row; gap:8px; padding:12px; }
  .qa-idea-nome{ font-size:14px; }
  .qa-idea-meta{ font-family:'Inter', sans-serif; font-size:11px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .kb-e-horas{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kb-e-horas input[type=time], .kb-e-horas input[type=date]{ background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:'Inter', sans-serif; font-size:13px; padding:6px 8px; }
  /* segmentado de coluna do kanban do Diário (uma coluna por vez) */
  .kb-abas{ margin-bottom:8px; }
  .kb-abas span{ flex:1; text-align:center; white-space:nowrap; }
  .kb-abas b{ font-weight:600; opacity:.65; }
  .kb-drag{ flex-shrink:0; color:var(--muted); font-size:15px; cursor:grab; touch-action:none; padding:2px 4px; }
  .kb-card.dragging{ opacity:.45; }
  .kb-col.kb-drop{ border-color:var(--accent-2); }
  .kb-text{ flex:1; font-size:14px; min-width:0; overflow-wrap:break-word; }
  .kb-moves{ display:flex; flex-shrink:0; gap:4px; }
  /* alvo de toque de verdade: os ‹ › eram texto de 13px e erravam o dedo.
     O último salto (para "Feito") vira um check verde — é a ação que fecha. */
  .kb-move-btn{
    width:30px; height:30px; border-radius:9px; background:var(--surface); border:1px solid var(--line);
    color:var(--muted); font-size:17px; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-1); transition: transform .12s ease, background .12s ease; position:relative;
  }
  .kb-move-btn::after{ content:""; position:absolute; inset:-6px; border-radius:14px; }
  .kb-move-btn:active:not(:disabled){ transform: scale(.9); background:var(--surface-2); }
  .kb-move-btn.para-feito{ color:var(--good); font-size:14px; }
  .kb-move-btn:disabled{ opacity:.28; box-shadow:none; }
  /* cartão em edição empilha texto + peso: o flex em linha do .kb-card não serve */
  .kb-card.kb-editing{ flex-direction:column; align-items:stretch; }
  .kb-peso{
    flex-shrink:0; font-family:'Inter', sans-serif; font-size:10px;
    color:var(--accent); border:1px solid var(--accent-dim); border-radius:6px; padding:1px 5px;
  }
  .kb-peso.feito{ color:var(--good); border-color:var(--good); }
  .kb-add{ width:100%; background:transparent; border:none; border-top:1px dashed var(--line); color:var(--text); font-size:13.5px; padding:8px 2px 2px; }
  .kb-add:focus{ outline:none; }
  .kb-add-horas{ display:flex; align-items:center; gap:6px; padding:4px 2px 2px; flex-wrap:wrap; }
  .kb-add-horas input[type=time], .kb-add-horas input[type=date]{ background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:'Inter', sans-serif; font-size:12px; padding:4px 6px; }

  /* ---------- CONTAGEM / PESOS ---------- */
  .cd-big{ font-family:'Inter', sans-serif; font-size:40px; font-weight:500; }
  .cd-big span{ font-size:14px; color:var(--muted); }
  .cd-big.late{ color:var(--danger); }
  .cd-big.ontime{ color:var(--accent); }
  .cd-big.early{ color:var(--good); }
  .cd-topics{ display:flex; align-items:center; gap:12px; margin-top:8px; }
  .cd-done-inp{ width:52px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:'Inter', sans-serif; font-size:14px; padding:5px 6px; text-align:center; }
  .pc-weights{ display:flex; gap:3px; flex-shrink:0; }
  .pc-w{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Inter', sans-serif; font-size:11.5px; color:var(--muted); }

  /* ---------- PAISAGEM (celular deitado) ----------
     O app é desenhado para retrato; deitado sobra largura e falta altura. Aqui
     o eixo curto vira a referência (vh no lugar de vw), a cromagem vertical
     encolhe e o que era empilhado passa a usar a largura: kanban em colunas
     lado a lado e grades com mais colunas. O recorte por max-height deixa
     tablets deitados (altura folgada) com o layout normal. */
  @media (orientation: landscape) and (max-height: 560px){
    :root{ --tabbar-h: 46px; }
    .screen{ padding:0 16px; }
    .home-header{ margin-bottom:12px; align-items:center; }
    .home-header h1{ font-size:23px; }
    .section-label{ margin-top:12px; }

    .tabbar button{ font-size:10.5px; gap:1px; }
    .tabbar button .ic{ font-size:16px; }
    .fab{ width:48px; height:48px; font-size:23px; right:16px; bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 10px); }

    /* player: o mostrador passa a medir pela altura e a coluna inteira rola
       se ainda assim não couber — nunca deixa o botão de concluir fora da tela */
    .player{ justify-content:flex-start; gap:4px; overflow-y:auto; padding:2px 0 8px; }
    .dial-wrap{ width:min(36vh, 190px); height:min(36vh, 190px); margin:0; }
    .player .skip-row{ padding:4px 0 2px !important; }
    .stepper-track{ margin-bottom:0; }
    .dial-time .t{ font-size:34px; }
    .dial-time .label{ font-size:13px; max-width:150px; }
    .step-title{ font-size:12px; }
    .checklist-body{ gap:12px; padding:10px; flex:0 0 auto; }
    .check-circle{ width:72px; height:72px; font-size:30px; border-width:2px; }
    .checklist-body h2{ font-size:20px; }
    .ctrl-btn{ width:46px; height:46px; font-size:16px; }
    .ctrl-btn.big{ width:58px; height:58px; font-size:20px; }
    .player-controls{ gap:14px; }
    .player-controls.four{ gap:10px; }
    .next-task-row, .estimate-row{ padding:4px 2px; }
    .estimate-row b{ font-size:16px; }
    .zen-time{ font-size:min(17vh, 92px); }
    .zen-label{ font-size:17px; }
    .zen-wrap{ gap:4px; }

    /* kanban: deitado cabem as três colunas lado a lado */
    .kb-board{ flex-direction:row; align-items:stretch; gap:8px; }
    .kb-col{ flex:1 1 0; width:auto; min-width:0; max-height:none; }
    .kb-board.kb-inline{ min-height:200px; }
    .kb-card{ padding:7px 8px; }

    /* grades e formulários aproveitam a largura extra */
    .tmpl-new-grid{ grid-template-columns:repeat(4, 1fr); }
    .confirm-overlay{ padding:12px; align-items:flex-start; }
    .confirm-box{ max-height:94vh; overflow-y:auto; max-width:520px; }
    .confirm-overlay.search-overlay{ padding:12px; }
    .search-box{ max-height:94vh; }
  }

  /* ---------- DESKTOP (tela larga) ----------
     Mesmo DOM/JS do celular (renderTabbar, .home-header) — só a CSS muda: a
     tabbar vira uma sidebar fixa à esquerda (coluna em vez de linha) e cada
     .home-header vira uma topbar grudada no topo da PRÓPRIA área que rola
     (sticky, não fixed). Funciona nos dois padrões de tela que já existem:
     onde o header é irmão de uma lista com scroll próprio (Rotinas), o sticky
     não muda nada; onde o header mora DENTRO de .tab-scroll/#diBody (Metas,
     Diário, Modelos, Dados — ver nota de arquitetura sobre cabeçalho não-fixo),
     o sticky é o que faz ele virar uma topbar de verdade ao rolar o conteúdo.
     Layout inspirado em plataformas tipo Estudei/Estratégia Concursos: nav
     lateral + coluna de conteúdo central, sem o vão morto de esticar em
     monitores largos. */
  @media (min-width: 900px){
    /* 196px cabe "Conhecimento Sistêmico"? não — mas nenhum rótulo da nav passa
       de "Modelos". A sidebar existe para navegar, não para preencher pixel. */
    :root{ --sidebar-w: 196px; }
    #app{ padding-top:0; }
    .screen{ margin-left:var(--sidebar-w); max-width:1060px; padding:0 40px; }
    .screen.with-tabbar{ padding-bottom:28px; }

    .tabbar{
      left:0; right:auto; top:0; bottom:0; width:var(--sidebar-w); height:auto;
      flex-direction:column; align-items:stretch; justify-content:flex-start;
      padding:22px 10px; gap:2px; border-top:none; border-right:1px solid var(--line);
      backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--surface);
    }
    .tabbar::before{
      content:"Rotinas"; display:block; font-family:'Fraunces', serif; font-weight:600;
      font-size:18px; padding:0 10px 18px; color:var(--text); letter-spacing:-.01em;
    }
    .tabbar button{
      /* flex:1 vem do mobile (5 abas dividindo a LARGURA). Numa coluna ele passa
         a dividir a ALTURA e espalha os 5 itens pela tela inteira. */
      flex:0 0 auto;
      flex-direction:row; justify-content:flex-start; align-items:center; gap:10px;
      padding:9px 10px; border-radius:var(--radius-sm); font-size:14px;
      transition: background .14s ease, color .14s ease;
    }
    .tabbar button .ic{ font-size:18px; padding:0; border-radius:0; }
    .tabbar button:hover{ background:var(--surface-2); color:var(--text); }
    .tabbar button.active, .tabbar button.active:hover{ background:var(--accent-soft); color:var(--accent); }
    .tabbar button.active .ic{ background:none; }

    .home-header{
      position:sticky; top:0; z-index:10; background:var(--bg);
      padding-top:22px; padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid var(--line);
    }

    /* ---- Ponteiro: o app inteiro foi desenhado para toque (:active) e numa
       tela com mouse fica sem resposta ao passar por cima. Estes :hover são o
       equivalente desktop do afundar-no-toque, sem mexer no comportamento
       tátil. Sob `any-hover` para não pegar tablet/touch em tela larga. */
    @media (any-hover: hover){
      .routine-card:hover, .note-card:hover, .stat-card:hover, .tar-item:hover{
        border-color:var(--accent-dim); box-shadow:var(--shadow-2);
      }
      .icon-btn:hover, .bell-btn:hover, .kb-move-btn:hover:not(:disabled), .ctrl-btn:hover{
        background:var(--surface-2); color:var(--text); border-color:var(--accent-dim);
      }
      .bell-btn.on:hover{ color:var(--accent); }
      .tmpl-new:hover{ border-color:var(--accent); background:var(--surface-2); }
      .kb-card:hover{ border-color:var(--accent-dim); }
      .area-chip:hover{ border-color:var(--accent-dim); color:var(--text); }
      .type-toggle span:hover{ color:var(--text); }
      .live-line:hover{ background:var(--surface); }
      .fab:hover{ transform: scale(1.04); }
      .del-exec:hover{ color:var(--danger); }
    }

    /* ---- Listas em duas colunas: um card de rotina/meta tem título + duas
       linhas de meta; esticado a 1000px sobra tarja vazia à direita. */
    .routine-list, .notes-list{
      display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px; align-content:start; overflow-y:visible;
    }
    #metasBody{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; align-items:start; }
    #metasBody > .stat-card{ margin-bottom:0; }
    /* empty-state e cabeçalhos de seção ocupam a linha inteira, não meia coluna */
    .routine-list > .empty-state, .notes-list > .empty-state,
    #metasBody > .empty-state{ grid-column:1 / -1; }

    /* ---- Modelos: o aspect-ratio 1/1 vira um quadradão de 300px numa grade
       larga. Altura fixa e mais colunas deixam a pasta com cara de pasta. */
    .tmpl-new-grid{ grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
    .tmpl-new{ aspect-ratio:auto; min-height:96px; font-size:13px; }
    .tmpl-ic{ font-size:22px; height:22px; }

    /* ---- FAB rotulado: um "+" flutuante e mudo é linguagem de celular; no
       desktop o mesmo botão diz o que cria, usando o title que já existe. */
    .fab{
      right:40px; bottom:32px; width:auto; height:46px; border-radius:23px;
      padding:0 20px; gap:8px; font-size:20px;
    }
    .fab[title]::after{
      content: attr(title); font-family:'Inter'; font-size:14px; font-weight:500; letter-spacing:-.01em;
    }
    .fab:active{ transform: scale(.96); }

    /* ---- Medida de leitura: uma linha com ~950px cansa de ler e de escrever.
       O seletor filho-direto pega o editor de NOTA (filho do .screen) e deixa
       de fora o do Diário, que já vive numa coluna estreita (.di-pane-body). */
    .screen > .live-editor, .screen > .note-title-input{ max-width:70ch; }
    .empty-state p{ max-width:340px; }

    /* ---- Diário em três colunas (agenda | anotação | kanban).
       Cada painel rola sozinho: a agenda tem 24h de altura e faria a página
       inteira rolar atrás dela. #diBody perde o scroll próprio para não criar
       duas barras concorrentes. */
    .di-body{ overflow:hidden; display:flex; flex-direction:column; }
    .di-body > #diContent{ flex:1; min-height:0; display:flex; flex-direction:column; }
    .di-cols{
      flex:1; min-height:0; display:grid; gap:18px;
      grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);
    }
    .di-pane{ display:flex; flex-direction:column; min-height:0; min-width:0; }
    .di-pane > .section-label{ margin:0 0 8px; }
    .di-pane-body{
      flex:1; min-height:0; overflow-y:auto; padding:12px;
      background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    }
    /* dentro do painel a agenda já tem o respiro do próprio padding */
    .di-pane-body .ag-wrap, .di-pane-body .ag-grupos{ margin:0; }
    .di-pane-body .di-live{ min-height:100%; padding-bottom:0; }
    /* o kanban empilhado é a forma certa numa coluna estreita */
    .di-pane-body .kb-board.kb-inline{ min-height:0; }

    /* ---- Barra de rolagem discreta: a padrão do macOS/Windows corta o
       arredondamento dos painéis e briga com o tema escuro. */
    *{ scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    ::-webkit-scrollbar{ width:10px; height:10px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:3px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover{ background:var(--muted); }

    /* ---- Modais: centralizados num monitor grande ficam pequenos demais no
       centro de um vazio enorme; um teto de largura mantém a proporção. */
    .confirm-box{ max-width:460px; }
    .search-box{ max-width:640px; }

    /* ---- A barra de atalhos markdown existe para o teclado VIRTUAL, que come
       metade da tela e deixa os símbolos longe. Com teclado físico ela vira
       uma faixa flutuante por cima da sidebar, sem função. */
    .md-toolbar{ display:none; }

    /* ---- Segmentado (Prazos|Recorrentes, Dia|Semana|Mês|Ano) abraça o próprio
       conteúdo: esticado por 550px vira uma faixa, e não um controle. */
    .type-toggle{ align-self:flex-start; width:fit-content; font-size:12px; }
    .type-toggle span{ padding:5px 12px; }
  }
</style>
