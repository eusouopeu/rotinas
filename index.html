  }

  /* ---------------- SCHEDULE HELPERS ---------------- */
  function formatHM(min){ min=((min%1440)+1440)%1440; const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
  function computeSchedule(routine){
    if(!routine.schedule || !routine.schedule.enabled || !routine.schedule.time) return null;
    const durMin = Math.round(routineDuration(routine)/60);
    const [h,m] = routine.schedule.time.split(":").map(Number);
    const anchorMin = h*60+m;
    let startMin, endMin;
    if(routine.schedule.anchor === "end"){ endMin = anchorMin; startMin = anchorMin - durMin; }
    else { startMin = anchorMin; endMin = anchorMin + durMin; }
    return { startMin: ((startMin%1440)+1440)%1440, endMin: ((endMin%1440)+1440)%1440, startStr: formatHM(startMin), endStr: formatHM(endMin), durMin };
  }

  /* Busca e Configurações são alcançáveis do topo de TODAS as abas, sempre no
     nível do título e do lado oposto a ele. Um par html+wire para não repetir
     os botões (nem o destino) em cinco telas. */
  function cfgBtnHtml(){
    return `<button class="bell-btn" data-searchbtn="1" title="Buscar em tudo" aria-label="Buscar em tudo">${svgIcon(ICON_D.magnifyingGlass,16)}</button>`
         + `<button class="bell-btn" data-cfgbtn="1" title="Configurações" aria-label="Configurações">${svgIcon(ICON_D.settings, 17)}</button>`;
  }
  function wireCfgBtn(scope){
    scope.querySelectorAll("[data-cfgbtn]").forEach(b=>{
      b.onclick = () => { goTo({ tab:"home", screen:"settings" }); };
    });
    scope.querySelectorAll("[data-searchbtn]").forEach(b=>{
      b.onclick = openGlobalSearch;
    });
    // affordance de descoberta no mobile: a lupa é pequena e passa despercebida —
    // puxar o cabeçalho pra baixo também abre a busca, como um "pull to search".
    const header = scope.querySelector(".home-header");
    if(header) wireSwipeDownSearch(header);
  }
  function wireSwipeDownSearch(header){
    let sy = 0, active = false;
    header.addEventListener("touchstart", e=>{
      if(e.touches.length!==1) return;
      sy = e.touches[0].clientY; active = true;
    }, {passive:true});
    header.addEventListener("touchmove", e=>{
      if(!active) return;
      if(e.touches[0].clientY - sy > 60){ active = false; openGlobalSearch(); }
    }, {passive:true});
    header.addEventListener("touchend", ()=>{ active = false; });
    header.addEventListener("touchcancel", ()=>{ active = false; });
  }

  /* Busca global em overlay: a mesma superfície serve as cinco abas sem que
     cada layout precise reservar espaço para o campo e para os resultados.
     Usa .confirm-overlay para o voltar do Android fechá-la (closeTopOverlay). */
  /* opções de área para o filtro da busca: EIXOS + qualquer área livre já
     usada em rotina/tarefa/cartão, mesma convenção de área-texto-livre das
     metas (metaAreaInfo) */
  function areaOptionsFromData(){
    const out = EIXOS.map(e=>({ id:e.id, label:e.label }));
    const vistos = new Set(out.map(o=>o.id));
    [...routines.map(r=>r.eixo), ...tarefas.map(t=>t.eixo), ...diaKanban.map(c=>c.eixo)].forEach(v=>{
      if(v && !vistos.has(v)){ vistos.add(v); out.push({ id:v, label:v }); }
    });
    return out;
  }
  function openGlobalSearch(){
    const ov = document.createElement("div");
    ov.className = "confirm-overlay search-overlay";
    const areaOpts = areaOptionsFromData();
    ov.innerHTML = `<div class="confirm-box search-box" role="dialog" aria-modal="true" aria-label="Busca" style="text-align:left;">
      <input type="search" id="globalSearch" class="note-search" style="margin-bottom:10px;" placeholder="Buscar rotinas, tarefas, notas, modelos, histórico, diário...">
      <div class="sched-time-row" style="margin:0 0 10px; gap:8px;">
        <select id="gsPeso" style="flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 6px; font-size:13px; color:var(--text);">
          <option value="">peso: todos</option>
          ${Object.entries(TAG_LABELS).map(([k,v])=>`<option value="${k}">peso: ${v}</option>`).join("")}
        </select>
        <select id="gsArea" style="flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 6px; font-size:13px; color:var(--text);">
          <option value="">área: todas</option>
          ${areaOpts.map(a=>`<option value="${escapeHtml(a.id)}">área: ${escapeHtml(a.label)}</option>`).join("")}
        </select>
      </div>
      <div id="globalSearchResults" class="notes-list"></div>
    </div>`;
    document.body.appendChild(ov);
    // mesmo contrato de a11y do confirmModal: foco preso no dialog, Esc fecha,
    // foco volta pra quem abriu a busca.
    const prevFocus = document.activeElement;
    function close(){ ov.remove(); document.removeEventListener("keydown", onKey, true); if(prevFocus && prevFocus.focus) prevFocus.focus(); }
    function onKey(e){ if(e.key === "Escape"){ e.stopPropagation(); close(); } }
    document.addEventListener("keydown", onKey, true);
    ov.onclick = e => { if(e.target===ov) close(); };
    const input = ov.querySelector("#globalSearch");
    const results = ov.querySelector("#globalSearchResults");

    function paint(){
      results.innerHTML = "";
      const q = input.value.trim().toLowerCase();
      if(q.length < 2) return;
      const peso = ov.querySelector("#gsPeso").value;
      const area = ov.querySelector("#gsArea").value;
      const semFiltro = !peso && !area;
      const hits = [];
      routines.forEach(r=>{
        if(peso && (r.tagValor||"medio") !== peso) return;
        if(area && (r.eixo||"") !== area) return;
        if((r.name||"").toLowerCase().includes(q))
          hits.push({ icon:r.icon||svgIcon(ICON_D.play,16), title:r.name, sub:"Rotina", go:()=>{ goTo({tab:"home",screen:"routineDetail",id:r.id}); } }); });
      tarefas.forEach(t=>{
        if(peso && (t.tagValor||"medio") !== peso) return;
        if(area && (t.eixo||"") !== area) return;
        if(((t.tipo||"")+" "+(t.conteudo||"")+" "+(t.area||"")).toLowerCase().includes(q))
          hits.push({ icon:svgIcon(ICON_D.check,13), title:(t.tipo?t.tipo+": ":"")+(t.conteudo||""), sub:"Tarefa"+(t.area?" · "+t.area:""), go:()=>{ tarefaDraft = JSON.parse(JSON.stringify(t)); goTo({tab:"tarefas",screen:"tarefaEditor"}); } }); });
      if(semFiltro){
        notes.forEach(n=>{ if(((n.title||"")+" "+(n.content||"")).toLowerCase().includes(q))
          hits.push({ icon:svgIcon(ICON_D.notes,14), title:n.title||"Sem título", sub:"Nota", go:()=>openNoteEditor(n.id) }); });
        templates.forEach(t=>{ if((t.title||"").toLowerCase().includes(q))
          hits.push({ icon:(TMPL_TYPES.find(x=>x.type===t.type)||{}).icon||svgIcon(ICON_D.templates,14), title:t.title, sub:"Modelo", go:()=>{ goTo({tab:"templates",screen:"templateDoc",id:t.id}); } }); });
        // Histórico: só entra quando a rotina de origem já foi excluída — enquanto
        // ela ainda existir, a busca por rotinas acima já encontra o mesmo nome.
        const rotinasVistas = new Set();
        history.forEach(h=>{
          if(!h.routineName || rotinasVistas.has(h.routineId)) return;
          if(!h.routineName.toLowerCase().includes(q)) return;
          rotinasVistas.add(h.routineId);
          if(routines.some(r=>r.id===h.routineId)) return;
          hits.push({ icon:svgIcon(ICON_D.clock,14), title:h.routineName, sub:"Histórico (rotina excluída)", go:()=>{ goTo({tab:"stats",screen:"stats"}); } });
        });
        // Diário: um resultado por período com texto batendo, abre direto nele.
        Object.keys(diario).forEach(k=>{
          const texto = diario[k];
          if(!texto || !texto.toLowerCase().includes(q)) return;
          const escopo = escopoDoPer(k);
          const iso = k.slice(k.indexOf(":")+1);
          hits.push({ icon:svgIcon(ICON_D.calendar,14), title: diarioRotulo(escopo, iso), sub:"Diário", go:()=>{ diarioEscopo = escopo; diarioData = iso; diarioAgenda = false; goTo({tab:"diario",screen:"diario"}); } });
        });
      }
      // Cartões do kanban do Diário, em qualquer escopo/período.
      diaKanban.forEach(c=>{
        if(peso && (c.tagValor||"nenhum") !== peso) return;
        if(area && (c.eixo||"") !== area) return;
        if(!c.text || !c.text.toLowerCase().includes(q)) return;
        const escopo = escopoDoPer(c.per);
        const iso = c.per.slice(c.per.indexOf(":")+1);
        hits.push({ icon:svgIcon(ICON_D.clipboard,14), title:c.text, sub:"Kanban · "+diarioRotulo(escopo, iso), go:()=>{ diarioEscopo = escopo; diarioData = iso; diarioAgenda = false; goTo({tab:"diario",screen:"diario"}); } });
      });
      if(hits.length === 0){
        results.innerHTML = `<div class="routine-meta" style="padding:8px 2px;">Nada encontrado.</div>`;
        return;
      }
      hits.slice(0, 20).forEach(h=>{
        const card = document.createElement("div");
        card.className = "routine-card";
        card.style.cursor = "pointer";
        card.innerHTML = `<div class="note-info"><h3>${h.icon} ${escapeHtml(h.title)}</h3><div class="routine-meta" style="margin-top:2px;">${escapeHtml(h.sub)}</div></div>`;
        card.onclick = () => { close(); h.go(); };
        results.appendChild(card);
      });
      if(hits.length > 20){
        const more = document.createElement("div");
        more.className = "routine-meta";
        more.style.padding = "8px 2px";
        more.textContent = "+ " + (hits.length - 20) + " resultado(s) — refine a busca";
        results.appendChild(more);
      }
    }
    input.oninput = paint;
    ov.querySelector("#gsPeso").onchange = paint;
    ov.querySelector("#gsArea").onchange = paint;
    input.focus();
  }

  /* Dias em que a rotina roda: mostrados abaixo da linha de horário ("ter/qui"),
     não mais resumidos em "2d/sem" ao lado dela. Semana todo dia não vira chip —
     seria ruído em toda rotina diária. */
  const DIAS_ABREV = ["dom","seg","ter","qua","qui","sex","sáb"];
  function diasDaRotina(r){
    const d = r && r.schedule && r.schedule.days;
    return (d && d.length) ? d : [0,1,2,3,4,5,6];
  }
  function diasChipHtml(r){
    const dias = diasDaRotina(r);
    if(dias.length >= 7) return "";
    return `<div class="sched-chip chip-block" style="color:var(--muted);">${dias.slice().sort((a,b)=>a-b).map(d=>DIAS_ABREV[d]).join("/")}</div>`;
  }
  /* "Deve ser feita hoje" = tem agendamento ativo e hoje está entre os dias.
     Rotina sem agendamento não tem dia devido, então fica fora do filtro. */
  function rotinaOcorreHoje(r){
    if(!r.schedule || !r.schedule.enabled) return false;
    return diasDaRotina(r).includes(new Date().getDay());
  }

  /* A lista de rotinas fica sempre em ordem de horário de início. Rotina sem
     agendamento não tem horário: vai depois das agendadas, mantendo a ordem de
     criação como critério de desempate (ordenação estável em qualquer motor). */
  function rotinasOrdenadas(){
    return routines
      .map((r, i) => ({ r, i, min: (computeSchedule(r) || {}).startMin }))
      .sort((a, b) => {
        if(a.min == null && b.min == null) return a.i - b.i;
        if(a.min == null) return 1;
        if(b.min == null) return -1;
        return a.min - b.min || a.i - b.i;
      })
      .map(x => x.r);
  }

  function checkSchedules(){
    checarNudgeRitmo();
    checarNudgeMetas();
    checarNudgeStreak();
    if(agendaSnoozed()) return;
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const todayStr = localKey(now);
    let alerted = load(K_ALERTED, {});
    let changed = false;
    routines.forEach(r=>{
      const sched = computeSchedule(r);
      if(!sched) return;
      if(r.schedule.days && !r.schedule.days.includes(now.getDay())) return;
      if(alerted[r.id] === todayStr) return;
      const GRACE_MIN = 60;
      const diff = nowMin - sched.startMin;
      if(diff >= 0 && diff <= GRACE_MIN){
        alerted[r.id] = todayStr; changed = true;
        alarmCue(r);
        const msg = diff === 0 ? "Hora de começar: " + r.name : "Rotina atrasada (" + diff + "min): " + r.name;
        showRichNotification(msg, diff===0 ? "Início previsto às " + sched.startStr : "Estava prevista para " + sched.startStr + " — começar agora?", r.id);
        showAlertBanner("⏰ " + msg, ()=>{ startPlayer(r.id); });
      }
    });
    if(changed) save(K_ALERTED, alerted);
  }
  function startScheduler(){ if(schedulerHandle) return; schedulerHandle = setInterval(checkSchedules, 20000); checkSchedules(); }

  /* ---------------- DESKTOP ----------------
     Quase todo o layout de tela larga é CSS pura (ver a media query no fim do
     <style>). Só o Diário precisa saber em JS: no celular a agenda é um TOGGLE
     que substitui a nota, e no desktop as três coisas cabem lado a lado — é
     estrutura diferente, não estilo diferente. Este é o único ponto que
     consulta a largura; qualquer outro ajuste de desktop deve ir para o CSS. */
  /* matchMedia falta no jsdom dos testes (e em WebViews muito antigos): sem o
     guarda, o boot inteiro morre aqui. Sem ele, "não é desktop" é o palpite
     certo — o alvo primário do app é o celular. */
  const DESKTOP_MQ = typeof window.matchMedia === "function" ? window.matchMedia("(min-width: 900px)") : null;
  function ehDesktop(){ return !!DESKTOP_MQ && DESKTOP_MQ.matches; }
  /* Atravessar o breakpoint troca a ESTRUTURA do Diário, então a tela precisa
     ser remontada. Só dispara na virada (o evento do matchMedia já é assim),
     nunca a cada pixel de resize. */
  if(DESKTOP_MQ && DESKTOP_MQ.addEventListener){
    DESKTOP_MQ.addEventListener("change", () => { liveFocado = false; render(); });
  }

  /* ---------------- ROUTER ---------------- */
  function render(){
    app.innerHTML = "";
    atualizarBarraMarkdown(); // esconde a barra markdown se a tela nova não tiver #liveEditor
    // o hook aponta para nós da tela anterior: renderDiario o republica se for o caso
    repintarAgendaDoDiario = null;
    if(view.screen === "home") renderHome();
    else if(view.screen === "notes") renderNotes();
    else if(view.screen === "stats") renderStats();
    else if(view.screen === "agenda") renderAgenda();
    else if(view.screen === "routineStats") renderRoutineStats();
    else if(view.screen === "templates") renderTemplates();
    else if(view.screen === "tmplFolder") renderTmplFolder();
    else if(view.screen === "expenseFolder") renderExpenseFolder();
    else if(view.screen === "diarioFolder") renderDiarioFolder();
    else if(view.screen === "templateDoc") renderTemplateDoc();
    else if(view.screen === "editor") renderEditor();
    else if(view.screen === "noteEditor") renderNoteEditor();
    else if(view.screen === "player") renderPlayer();
    else if(view.screen === "done") renderDone();
    else if(view.screen === "routineDetail") renderRoutineDetail();
    else if(view.screen === "tarefas") renderTarefas();
    else if(view.screen === "tarefaEditor") renderTarefaEditor();
    else if(view.screen === "tarefaTimer") renderTarefaTimer();
    else if(view.screen === "tarefaImportPreview") renderTarefaImportPreview();
    else if(view.screen === "boletim") renderBoletim();
    else if(view.screen === "settings") renderSettings();
    else if(view.screen === "semanaFechada") renderSemanaFechada();
    else if(view.screen === "metas") renderMetas();
    else if(view.screen === "diario") renderDiario();
  }

  /* ---------------- NAVEGAÇÃO (pilha p/ botão físico de voltar do Android) ---------------- */
  function pushView(newView){
    navStack.push(view);
    if(navStack.length > 40) navStack.shift();
    view = newView;
  }
  function goTo(newView){
    pushView(newView);
    render();
  }
  function closeTopOverlay(){
    const ov = document.querySelector(".confirm-overlay");
    if(ov){ ov.remove(); return true; }
    return false;
  }
  function goBack(){
    if(closeTopOverlay()) return;
    if(view.screen === "player"){
      if(playerState && playerState.zen){ playerState.zen = false; render(); return; }
      confirmExitPlayer();
      return;
    }
    if(view.screen === "noteEditor"){
      descartarEdicaoNota();
      view = navStack.length ? navStack.pop() : { tab:"templates", screen:"templates" };
      render();
      return;
    }
    if(navStack.length){ view = navStack.pop(); render(); return; }
    if(isNative && window.Capacitor.Plugins.App) window.Capacitor.Plugins.App.exitApp();
  }

  /* ---- Atalhos de teclado (desktop) ----
     1..5 trocam de aba, "/" abre a busca global, Esc fecha overlay/volta.
     A guarda de digitação é o ponto crítico: o editor contínuo do Diário e das
     notas é um contenteditable, então sem ela um "1" no meio de uma frase
     trocaria de aba. Também respeita modificadores, para não roubar Cmd+1 do
     navegador. */
  const TECLA_ABA = { "1":"metas", "2":"home", "3":"diario", "4":"templates", "5":"stats" };
  function digitandoAgora(){
    const a = document.activeElement;
    if(!a) return false;
    return a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  }
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){ goBack(); return; }
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(digitandoAgora()) return;
    if(e.key === "/"){ e.preventDefault(); openGlobalSearch(); return; }
    const aba = TECLA_ABA[e.key];
    // atalho de navegação de aba não faz sentido durante a execução de uma rotina
    if(aba && view.screen !== "player"){ e.preventDefault(); goTo({ tab:aba, screen:aba }); }
  });

  function renderTabbar(activeTab){
    const bar = document.createElement("div");
    bar.className = "tabbar";
    bar.innerHTML = `
      <button data-tab="metas" class="${activeTab==='metas'?'active':''}"><span class="ic">${svgIcon(ICON_D.countdown)}</span>Metas</button>
      <button data-tab="home" class="${activeTab==='home'?'active':''}"><span class="ic">${svgIcon(ICON_D.home)}</span>Rotinas</button>
      <button data-tab="diario" class="${activeTab==='diario'?'active':''}"><span class="ic">${svgIcon(ICON_D.notes)}</span>Diário</button>
      <button data-tab="templates" class="${activeTab==='templates'||activeTab==='notes'?'active':''}"><span class="ic">${svgIcon(ICON_D.templates)}</span>Modelos</button>
      <button data-tab="stats" class="${activeTab==='stats'?'active':''}"><span class="ic">${svgIcon(ICON_D.stats)}</span>Dados</button>
    `;
    bar.querySelectorAll("[data-tab]").forEach(b=>{
      b.onclick = () => { goTo({ tab:b.dataset.tab, screen:b.dataset.tab }); };
    });
    return bar;
  }

  /* ================= HOME (ROUTINES) ================= */
  function renderHome(){
    const el = document.createElement("div");
    el.className = "screen with-tabbar";
    // Cabeçalho + cards fixados + lista moram todos DENTRO de .tab-scroll (mesmo
    // padrão de Metas/Modelos), para que o título e os cards fixados rolem junto
    // com a lista em vez de comer espaço fixo da tela — só o FAB e a tabbar
    // (ambos position:fixed) ficam fora, direto em `el`.
    const scroll = document.createElement("div");
    scroll.className = "tab-scroll";
    scroll.innerHTML = `
      <div class="home-header" style="margin-bottom:10px;">
        <h1>Rotinas</h1>
        <div class="header-right">${cfgBtnHtml()}</div>
      </div>
      ${rodaVidaResumoHtml()}
      <div class="header-right" style="margin-bottom:18px; flex-wrap:wrap;">
        <button class="bell-btn di-hoje ${homeSoHoje?'on':''}" id="soHojeBtn" title="Mostrar só as rotinas de hoje" aria-pressed="${homeSoHoje?'true':'false'}">hoje</button>
        <button class="bell-btn di-hoje" id="agendaBtn" title="Agenda da semana" aria-label="Agenda da semana">${svgIcon(ICON_D.calendar,14)} agenda</button>
        <button class="bell-btn" id="importRoutineBtn" title="Importar rotina" aria-label="Importar rotina">${svgIcon(ICON_D.arrowUpTray,14)}</button>
        <button class="bell-btn" id="tplLibraryBtn" title="Modelos prontos" aria-label="Modelos prontos">${svgIcon(ICON_D.templates,14)}</button>
        <button class="bell-btn" id="boletimBtn" title="Boletim da semana" aria-label="Boletim da semana">${svgIcon(ICON_D.trophy, 17)}</button>
        <input type="file" id="importRoutineFile" accept="application/json" style="display:none">
      </div>
      ${areaFiltroChipsHtml()}
    `;
    el.appendChild(scroll);
    wireAreaFiltroChips(scroll);
    // aviso de backup vem antes de tudo: é o único card cujo custo de ignorar
    // é perda de dados
    if(backupOverdue()){
      const bk = document.createElement("div");
      bk.className = "notice-card";
      bk.innerHTML = `<span>${svgIcon(ICON_D.arrowDownTray,14)} Faz mais de 30 dias sem backup. Seus dados vivem só neste navegador.</span>
        <div class="notice-actions"><button id="doBackupNow">Exportar</button><button id="dismissBackup" class="ghost">Depois</button></div>`;
      scroll.appendChild(bk);
      bk.querySelector("#doBackupNow").onclick = () => { exportBackup(); render(); };
      bk.querySelector("#dismissBackup").onclick = () => { dismissedBackupNotice = true; render(); };
    }

    const carga = previsaoCargaSemana();
    if(carga.nivel === "alta"){
      const cg = document.createElement("div");
      cg.className = "notice-card";
      const h = Math.floor(carga.minutosRotinas/60), m = carga.minutosRotinas%60;
      cg.innerHTML = `<span>${svgIcon(ICON_D.exclamationTriangle,14)} Semana carregada: ${h>0?h+"h":""}${m>0?m+"min":""} de rotinas planejadas${carga.cartoesPendentes?` · ${carga.cartoesPendentes} pendência(s)`:""}${carga.metasVencendo?` · ${carga.metasVencendo} meta(s) vencendo`:""} nos próximos ${carga.diasRestantes} dia(s).</span>`;
      scroll.appendChild(cg);
    }

    const semFechada = semanaFechadaPendente();
    if(semFechada){
      const fc = document.createElement("div");
      fc.className = "routine-card resume-card pinned-card";
      fc.style.cursor = "pointer";
      fc.innerHTML = `
        <div class="routine-info">
          <h3>Semana fechada${semFechada.badge?` · <span style="color:${BADGE_COR[semFechada.badge]};">${BADGE_CHAR[semFechada.badge]} ${BADGE_NOME[semFechada.badge]}</span>`:""}</h3>
          <div class="routine-meta">Nota ${semFechada.nota.toFixed(1)} — toque para ver o fechamento</div>
        </div>`;
      fc.onclick = () => { goTo({ tab:"home", screen:"semanaFechada" }); };

    if(gam.semanaAtual.totalBrutoAgendado > 0){

        <div class="routine-info">

    const snap = getPlayerSnapshot();
    if(snap){
      const sr = routines.find(r=>r.id===snap.routineId);
      if(sr){

          <div class="routine-info">
            <h3>Rotina em andamento</h3>

          </div>
          <div class="routine-actions">
            <button class="icon-btn" id="discardResume" title="Descartar rotina em andamento" aria-label="Descartar rotina em andamento">${svgIcon(ICON_D.xmark,14)}</button>
            <button class="play-btn" id="doResume" title="Retomar rotina" aria-label="Retomar rotina">${svgIcon(ICON_D.play,16)}</button>
          </div>
        `;
        scroll.appendChild(resumeCard);
        resumeCard.querySelector("#doResume").onclick = resumePlayer;
        resumeCard.querySelector("#discardResume").onclick = () => {
          confirmModal("Descartar a rotina em andamento?", "Descartar", ()=>{ clearPlayerSnapshot(); render(); });
        };
      } else { clearPlayerSnapshot(); }
    }

    const visiveis = rotinasOrdenadas()
      .filter(r => !homeSoHoje || rotinaOcorreHoje(r))
      .filter(r => passaFiltroArea(areaDaRotina(r)));
    if(routines.length===0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = emptyStateActionHtml("Nenhuma rotina ainda", "Crie sua primeira sequência de etapas com tempo — igual um ritual de prática.", "emptyNewRoutine", "+ Nova rotina")
        + `<button class="link-btn" id="emptyTplLibrary" style="margin-top:8px;">ou escolher um modelo pronto</button>`;
      scroll.appendChild(empty);
      empty.querySelector("#emptyNewRoutine").onclick = () => openEditor(null);
      empty.querySelector("#emptyTplLibrary").onclick = abrirBibliotecaModelos;
    } else if(visiveis.length===0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = homeAreaFiltro.length
        ? `<h2>Nenhuma rotina nessa área</h2><p>Troque o filtro de área para ver outras rotinas.</p>`
        : `<h2>Nada agendado para hoje</h2><p>Desligue o "hoje" para ver todas as rotinas.</p>`;
      scroll.appendChild(empty);
    } else {
      const list = document.createElement("div");
      // já mora dentro de um .tab-scroll que rola a tela inteira — sem isto a
      // lista abriria uma SEGUNDA barra de rolagem aninhada (flex:1;overflow-y:auto
      // duplicado, herdado da regra compartilhada com .notes-list).
      list.className = "routine-list";
      list.style.flex = "0 0 auto";
      list.style.overflow = "visible";
      visiveis.forEach((r,vi)=>{
        const dur = routineDuration(r);
        const sched = computeSchedule(r);
        const rStreak = computeStreakFor(r.id);
        const rPend = naoFeitasDe(r.id).length;
        const card = document.createElement("div");
        card.className = "routine-card";
        card.innerHTML = `
          <div class="routine-info" data-detail="${r.id}" style="cursor:pointer;">
            <h3><span class="r-dot" style="background:${fillStyle(corDaRotina(r))}"></span>${r.icon?escapeHtml(r.icon)+" ":""}${escapeHtml(r.name)}</h3>
            <div class="routine-meta">${r.steps.length} etapa${r.steps.length!==1?'s':''} · ${dur>0?fmtTime(dur).replace('+',''):"sem tempo fixo"}${rStreak>0?` · &#9679; ${rStreak}d`:""}${rotinaEhHabito(r)?`<span class="habito-chip" title="Hábito consolidado: vale ${Math.round((gam.config.habito.fator||0.6)*100)}% do peso, para abrir espaço ao que ainda não pegou">hábito</span>`:""}</div>

  function duplicateRoutine(id){
    const src = routines.find(r=>r.id===id);
    if(!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid();
    copy.name = src.name + " (cópia)";
    copy.steps.forEach(s=>{ s.id = uid(); });
    if(copy.schedule) copy.schedule.enabled = false;
    routines.push(copy);
    save(K_ROUTINES, routines);
    render();
  }

  function importarRotinaPronta(tpl){
    const r = JSON.parse(JSON.stringify(tpl));
    r.id = uid();
    let criouExercicio = false;
    r.steps.forEach(s=>{
      s.id = uid();
      if(s.type === "exercicio" && s._exNome){
        let ex = exercicios.find(x=>x.nome.toLowerCase() === s._exNome.toLowerCase());
        if(!ex){ ex = novoExercicio(s._exNome, s._exGrupo||"", 0); criouExercicio = true; }
        s.exercicioId = ex.id;
        s.name = ex.nome;
        delete s._exNome; delete s._exGrupo;
      }
    });
    if(criouExercicio) saveExercicios();
    r.schedule = { enabled:false, anchor:"start", time:"07:00", days:[0,1,2,3,4,5,6] };
    r.restSeconds = tpl.restSeconds != null ? tpl.restSeconds : 0;
    if(routines.some(x=>x.name===r.name)) r.name += " (importada)";
    routines.push(r);
    save(K_ROUTINES, routines);
    showAlertBanner("Rotina \"" + r.name + "\" adicionada ✓");
    render();
  }

    ov.innerHTML = `<div class="confirm-box" style="text-align:left; max-height:80vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

  function deleteRoutineWithUndo(id){
    const idx = routines.findIndex(r=>r.id===id);
    if(idx===-1) return;
    const removed = routines[idx];
    routines = routines.filter(r=>r.id!==id);
    save(K_ROUTINES, routines);
    render();
    showUndoBanner("Rotina excluída", ()=>{
      routines.splice(Math.min(idx, routines.length), 0, removed); save(K_ROUTINES, routines); render();
    });
  }

  function renderRoutineDetail(){
    const r = routines.find(x=>x.id===view.id);
    const el = document.createElement("div");
    el.className = "screen";
    if(!r){
      el.innerHTML = `<div class="topbar"><button class="link-btn muted" id="rdBack">&larr; Rotinas</button></div><div class="empty-state"><h2>Rotina não encontrada</h2></div>`;
      app.appendChild(el);
      document.getElementById("rdBack").onclick = () => { goTo({tab:"home",screen:"home"}); };
      return;
    }
    const dur = routineDuration(r);
    const sched = computeSchedule(r);
    el.innerHTML = `
      <div class="topbar">
        <button class="link-btn muted" id="rdBack">&larr; Rotinas</button>
      </div>
      <div class="routine-list" id="rdSteps" style="flex:1; overflow-y:auto; padding-bottom:110px;">
        <div class="home-header" style="margin-bottom:14px;">
          <h1 style="font-size:26px;"><span class="r-dot" style="background:${fillStyle(corDaRotina(r))}"></span>${r.icon?escapeHtml(r.icon)+" ":""}${escapeHtml(r.name)}</h1>
        </div>
        <div class="routine-meta" style="margin-bottom:4px;">${r.steps.length} etapa${r.steps.length!==1?'s':''} · ${dur>0?fmtTime(dur).replace('+',''):"sem tempo fixo"}</div>
        ${sched ? `<div class="sched-chip">${svgIcon(ICON_D.clock,13)} ${sched.startStr} &rarr; ${sched.endStr}</div>${diasChipHtml(r)}<div style="height:10px;"></div>` : ""}
        <div class="section-label">Etapas</div>

      <div class="bottom-actions">

        <button class="btn-primary" id="rdStart">${svgIcon(ICON_D.play,16)} Começar</button>
      </div>
    `;
    app.appendChild(el);

    const stepsBox = document.getElementById("rdSteps");
    r.steps.forEach((s,i)=>{
      const card = document.createElement("div");
      card.className = "routine-card";
      card.style.gap = "10px";
      const icon = s.type==="timer" ? svgIcon(ICON_D.clock,13) : (s.type==="exercicio" ? svgIcon(ICON_D.trophy,13) : svgIcon(ICON_D.check,13));
      let metaTxt = "";
      if(s.type==="timer") metaTxt = fmtTime(s.seconds).replace("+","");
      else if(s.type==="exercicio") metaTxt = (s.sets||1)+"x"+(s.reps||"?")+" · "+(r.restSeconds||120)+"s descanso";
      else metaTxt = "checklist";
      if(s.journaling) metaTxt += ` · ${svgIcon(ICON_D.notes,13)} anotações`;
      card.innerHTML = `
        <span class="drag-handle" data-drag="${i}">${svgIcon(ICON_D.bars3,15)}</span>
        <div class="routine-info" style="flex:1; min-width:0; display:flex; align-items:flex-start; gap:10px;">
          <span style="flex:0 0 auto; font-size:16px; color:var(--muted);">${i+1}.</span>
          <div style="flex:1; min-width:0;">
            <h3 style="font-size:15px;">${icon} ${escapeHtml(s.name || "sem nome")}</h3>
            <div class="routine-meta" style="margin-top:2px;">${metaTxt}</div>
          </div>
        </div>
        <button class="icon-btn" data-stepedit="${i}" title="Editar etapa" aria-label="Editar etapa">${svgIcon(ICON_D.notes,14)}</button>`;
      stepsBox.appendChild(card);
    });
    if(r.steps.length===0) stepsBox.insertAdjacentHTML("beforeend", `<div class="empty-state" style="min-height:20vh;"><p>Esta rotina não tem etapas.</p></div>`);

    stepsBox.querySelectorAll("[data-stepedit]").forEach(b=> b.onclick = () => openStepEditor(r, +b.dataset.stepedit));
    stepsBox.querySelectorAll("[data-drag]").forEach(handle=>{
      handle.onpointerdown = ev => {
        ev.preventDefault();
        const from = +handle.dataset.drag;
        const rows = [...stepsBox.querySelectorAll(".routine-card")];
        const dragRow = rows[from];
        dragRow.classList.add("dragging");
        handle.setPointerCapture(ev.pointerId);
        let target = from;
        const move = e2 => {
          const y = e2.clientY;
          target = from;
          rows.forEach((row,j)=>{
            const rect = row.getBoundingClientRect();
            const mid = rect.top + rect.height/2;
            row.classList.remove("drop-above","drop-below");
            if(j !== from){
              if(y < mid && j < from) target = Math.min(target, j);
              if(y > mid && j > from) target = Math.max(target, j);
            }
          });
          if(target !== from && rows[target]){
            rows[target].classList.add(target < from ? "drop-above" : "drop-below");
          }
        };
        const up = () => {
          handle.releasePointerCapture(ev.pointerId);
          handle.onpointermove = null; handle.onpointerup = null; handle.onpointercancel = null;
          dragRow.classList.remove("dragging");
          rows.forEach(row=>row.classList.remove("drop-above","drop-below"));
          if(target !== from){
            const [moved] = r.steps.splice(from,1);
            r.steps.splice(target,0,moved);
            save(K_ROUTINES, routines);
            render();
          }
        };
        handle.onpointermove = move;
        handle.onpointerup = up;
        handle.onpointercancel = up;
      };
    });
    document.getElementById("rdBack").onclick = () => { goTo({tab:"home",screen:"home"}); };
    document.getElementById("rdStart").onclick = () => startPlayer(r.id);
    document.getElementById("rdEdit").onclick = () => openEditor(r.id);
  }

  /* edição restrita a uma única etapa da rotina (a partir da página de detalhe) */
  function openStepEditor(r, idx){

    const ov = document.createElement("div");

      <div class="confirm-box" style="text-align:left; max-height:86vh; overflow-y:auto;">

          <span data-t="checklist" class="${s.type==='checklist'?'active':''}">check</span>
          <span data-t="exercicio" class="${s.type==='exercicio'?'active':''}">exercício</span>

        </div>
        <div id="seTimerWrap" style="${s.type==='timer'?'':'display:none;'}">
          <div class="section-label" style="margin:12px 0 6px;">Duração</div>
          <div class="sched-time-row" style="margin-top:0;">
            <input class="dur-input" style="width:60px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="0" id="seMin" value="${Math.floor((s.seconds||0)/60)}"> min
            <input class="dur-input" style="width:60px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="0" max="59" id="seSec" value="${(s.seconds||0)%60}"> seg
          </div>
        </div>
        <div id="seExWrap" style="${s.type==='exercicio'?'':'display:none;'}">
          <div class="section-label" style="margin:12px 0 6px;">Exercício</div>
          <div id="seExPickWrap"></div>
          <div class="section-label" style="margin:12px 0 6px;">Séries / repetições</div>
          <div class="sched-time-row" style="margin-top:0; flex-wrap:wrap;">
            <input class="dur-input" style="width:56px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="1" id="seSets" value="${s.sets||3}"> séries de
            <input type="text" id="seReps" style="width:64px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" value="${escapeHtml(s.reps||'10')}"> reps
          </div>
          <div class="dev-n" style="margin-top:6px;">Descanso entre séries e entre exercícios: um único valor por rotina, na seção "Descanso entre etapas" do editor.</div>
        </div>
        <div id="seNoteWrap">
          <label class="switch-row" style="margin-top:12px;"><input type="checkbox" id="seJournal" ${s.journaling?'checked':''}><span>Anotações</span></label>
        </div>
        <div class="section-label" style="margin:12px 0 6px;">Nota da etapa (opcional)</div>
        <div id="seNotaWrap"></div>
        <div id="seTagWrap" style="${(s.type==='timer'||s.type==='exercicio')?'':'display:none;'}">
          <div class="section-label" style="margin:12px 0 6px;">Peso no boletim</div>
          ${tagValorPillsHtml(s.tagValor, true)}
          <div class="dev-n" style="margin-top:6px;">"Nenhum" faz a etapa rodar normalmente sem pontuar no boletim.</div>
        </div>
        <div class="confirm-actions" style="margin-top:18px;">
          <button class="btn-cancel" id="seCancel">Cancelar</button>
          <button class="btn-confirm" id="seSave" style="background:var(--grad);">Salvar</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    wireTagValorPills(ov);
    ov.onclick = e => { if(e.target===ov) ov.remove(); };

    /* nada é escrito em `s` até "Salvar" — mesma convenção do resto do editor
       (cancelar não deve deixar rastro), então o vínculo de nota também fica
       num rascunho local até lá */
    let stepNoteId = s.noteId || null;
    function pintarNotaEtapa(){
      const wrap = ov.querySelector("#seNotaWrap");
      const nota = stepNoteId ? notes.find(n=>n.id===stepNoteId) : null;
      if(nota){
        wrap.innerHTML = `<div class="qa-idea-row" style="flex-direction:row; align-items:center; justify-content:space-between;">
          <span class="qa-idea-nome" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(nota.title||"(sem título)")}</span>

    }
    /* lista para escolher uma nota já existente ou criar uma em branco na
       hora (o conteúdo é preenchido depois, em Modelos → Notas simples —
       mesmo padrão "cria vazia, preenche depois" do lançamento rápido) */
    function abrirEscolhaNotaEtapa(){
      const pick = document.createElement("div");
      pick.className = "confirm-overlay";
      const lista = notes.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      const linhas = lista.map(n=>`<button class="qa-idea-row" data-picknota="${n.id}">

      </div>`;

        notes.push(nova); save(K_NOTES, notes);
        stepNoteId = nova.id;
        pick.remove();
        pintarNotaEtapa();
      };
    }
    pintarNotaEtapa();
    /* mesma convenção do vínculo de nota: nada é escrito em `s` até "Salvar" */
    let stepExercicioId = s.exercicioId || null;
    function pintarExercicioEtapa(){
      const wrap = ov.querySelector("#seExPickWrap");
      const ex = stepExercicioId ? exercicios.find(x=>x.id===stepExercicioId) : null;
      if(ex){
        wrap.innerHTML = `<div class="qa-idea-row" style="flex-direction:row; align-items:center; justify-content:space-between;">

        </div>`;

      } else {
        wrap.innerHTML = `<button class="tmpl-new qa-idea-nova" id="seExPick" style="margin-top:0;">
          <span class="tmpl-ic">${svgIcon(ICON_D.trophy)}</span><span>+ Escolher exercício</span>
        </button>`;
        wrap.querySelector("#seExPick").onclick = () => abrirEscolhaExercicioEtapa(ex=>{
          stepExercicioId = ex.id;
          pintarExercicioEtapa();
          const nameInput = ov.querySelector("#seName");
          if(nameInput && !nameInput.value.trim()) nameInput.value = ex.nome;

      ov.querySelector("#seNameWrap").style.display = type==='exercicio' ? 'none' : '';

      ov.querySelector("#seExWrap").style.display = type==='exercicio' ? '' : 'none';
      ov.querySelector("#seTagWrap").style.display = (type==='timer'||type==='exercicio') ? '' : 'none';
      ov.querySelectorAll("#seType [data-t]").forEach(x=>x.classList.toggle("active", x.dataset.t===type));
    }
    ov.querySelectorAll("#seType [data-t]").forEach(sp=> sp.onclick = () => { type = sp.dataset.t; syncType(); });
    ov.querySelector("#seCancel").onclick = () => ov.remove();
    ov.querySelector("#seSave").onclick = () => {
      s.type = type;
      s.journaling = ov.querySelector("#seJournal").checked;
      if(type==='timer'){
        const mins = Math.max(0, +ov.querySelector("#seMin").value || 0);
        const secs = Math.min(59, Math.max(0, +ov.querySelector("#seSec").value || 0));
        s.seconds = Math.max(5, mins*60 + secs);
        s.tagValor = readTagValorPills(ov);
      }
      if(type==='exercicio'){
        if(!stepExercicioId){ showAlertBanner("Escolha um exercício"); return; }
        s.exercicioId = stepExercicioId;
        const ex = exercicios.find(x=>x.id===stepExercicioId);
        s.name = ex ? ex.nome : (s.name||"");
        s.sets = Math.max(1, +ov.querySelector("#seSets").value || 3);
        s.reps = ov.querySelector("#seReps").value.trim() || "10";
        // descanso é único por rotina (r.restSeconds) — a primeira etapa de
        // exercício de uma rotina ainda no padrão (0/sem descanso) puxa o
        // universal para 120s, sem sobrescrever um valor já customizado
        if(!r.restSeconds) r.restSeconds = 120;
        s.tagValor = readTagValorPills(ov);
      } else {
        s.name = ov.querySelector("#seName").value.trim() || s.name || "";
      }
      s.noteId = stepNoteId || undefined;
      save(K_ROUTINES, routines);
      ov.remove();
      render();
    };
  }

  /* ---------------- BIBLIOTECA DE EXERCÍCIOS ---------------- */
  // reaproveitada pelas etapas de rotina do tipo "exercicio" (s.exercicioId)
  function novoExercicio(nome, grupo, pesoAtual){
    const ex = { id: uid(), nome: nome.trim(), grupo: grupo||"", pesoAtual: pesoAtual||0 };
    exercicios.push(ex);
    return ex;
  }
  function abrirEditorExercicio(ex, onSaved){
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    const editing = !!ex;
    ov.innerHTML = `
      <div class="confirm-box" style="text-align:left;">
        <p style="margin-bottom:10px;">${editing?'Editar':'Novo'} exercício</p>
        <div class="section-label" style="margin:6px 0 6px;">Nome</div>
        <input type="text" id="exNome" class="mk-e-name" value="${escapeHtml((ex&&ex.nome)||'')}" placeholder="Ex.: Supino reto">
        <div class="section-label" style="margin:12px 0 6px;">Grupo muscular (opcional)</div>
        <input type="text" id="exGrupo" class="mk-e-name" value="${escapeHtml((ex&&ex.grupo)||'')}" placeholder="Ex.: Peito">
        <div class="section-label" style="margin:12px 0 6px;">Carga atual (kg)</div>
        <input class="dur-input" style="width:90px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="decimal" min="0" step="0.5" id="exPeso" value="${(ex&&ex.pesoAtual)||0}">
        <div class="confirm-actions" style="margin-top:18px;">
          ${editing?'<button class="btn-danger-outline" id="exDelete">Excluir</button>':''}
          <button class="btn-cancel" id="exCancel">Cancelar</button>
          <button class="btn-confirm" id="exSave" style="background:var(--grad);">Salvar</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.querySelector("#exCancel").onclick = () => ov.remove();
    if(editing){
      ov.querySelector("#exDelete").onclick = () => {
        exercicios = exercicios.filter(x=>x.id!==ex.id);
        saveExercicios();
        ov.remove();
        if(onSaved) onSaved(null);
      };
    }
    ov.querySelector("#exSave").onclick = () => {
      const nome = ov.querySelector("#exNome").value.trim();
      if(!nome) return;
      const grupo = ov.querySelector("#exGrupo").value.trim();
      const pesoAtual = Math.max(0, +ov.querySelector("#exPeso").value || 0);
      let saved;
      if(editing){ ex.nome=nome; ex.grupo=grupo; ex.pesoAtual=pesoAtual; saved=ex; }
      else saved = novoExercicio(nome, grupo, pesoAtual);
      saveExercicios();
      ov.remove();
      if(onSaved) onSaved(saved);
    };
  }
  function abrirEscolhaExercicioEtapa(onPick){
    const pick = document.createElement("div");
    pick.className = "confirm-overlay";
    const lista = exercicios.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
    const linhas = lista.map(ex=>`<div class="qa-idea-row" style="flex-direction:row; align-items:center; justify-content:space-between; gap:6px;">
        <button data-pickex="${ex.id}" style="flex:1; text-align:left; background:none; border:none; color:inherit; font:inherit; padding:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          <span class="qa-idea-nome">${escapeHtml(ex.nome)}</span>${ex.grupo?`<span style="color:var(--muted); font-size:12px;"> · ${escapeHtml(ex.grupo)}</span>`:''}
        </button>
        <button class="icon-btn" data-editex="${ex.id}" title="Editar" aria-label="Editar" style="width:28px; height:28px; flex:0 0 auto;">${svgIcon(ICON_D.notes,12)}</button>
      </div>`).join("");
    pick.innerHTML = `<div class="confirm-box" style="text-align:left; max-height:80vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <p style="margin:0;">Escolher exercício</p>
        <button class="icon-btn" id="pickExClose">${svgIcon(ICON_D.xmark,14)}</button>
      </div>
      ${lista.length ? `<div class="qa-idea-list">${linhas}</div>` : `<div class="dev-n" style="margin-bottom:10px;">Nenhum exercício cadastrado ainda.</div>`}
      <button class="tmpl-new qa-idea-nova" id="pickExNova"><span class="tmpl-ic">${svgIcon(ICON_D.trophy)}</span><span>+ Novo exercício</span></button>
    </div>`;
    document.body.appendChild(pick);
    pick.onclick = e => { if(e.target===pick) pick.remove(); };
    pick.querySelector("#pickExClose").onclick = () => pick.remove();
    pick.querySelectorAll("[data-pickex]").forEach(b=>{
      b.onclick = () => { const ex=exercicios.find(x=>x.id===b.dataset.pickex); pick.remove(); if(ex) onPick(ex); };
    });
    pick.querySelectorAll("[data-editex]").forEach(b=>{
      b.onclick = (e) => { e.stopPropagation(); const ex=exercicios.find(x=>x.id===b.dataset.editex); pick.remove(); abrirEditorExercicio(ex, saved=>{ if(saved) abrirEscolhaExercicioEtapa(onPick); }); };
    });
    pick.querySelector("#pickExNova").onclick = () => {
      pick.remove();
      abrirEditorExercicio(null, saved=>{ if(saved) onPick(saved); else abrirEscolhaExercicioEtapa(onPick); });
    };
  }

  /* ================= EDITOR (ROUTINE) ================= */
  function openEditor(id){
    if(id){
      const r = routines.find(x=>x.id===id);
      editorDraft = JSON.parse(JSON.stringify(r));
    } else {
      editorDraft = { id: uid(), name:"", sound:"mudo", steps:[{id:uid(), name:"", seconds:60, type:"timer"}], schedule:{enabled:false, anchor:"start", time:"07:00", days:[0,1,2,3,4,5,6]}, restSeconds:0, tagValor:"medio" };
    }
    if(!editorDraft.schedule) editorDraft.schedule = { enabled:false, anchor:"start", time:"07:00", days:[0,1,2,3,4,5,6] };
    if(!editorDraft.schedule.days) editorDraft.schedule.days = [0,1,2,3,4,5,6];
    if(editorDraft.restSeconds === undefined) editorDraft.restSeconds = 0;
    if(editorDraft.tagValor === undefined) editorDraft.tagValor = "medio";
    goTo({ tab:"home", screen:"editor" });
  }

  function renderEditor(){
    const el = document.createElement("div");
    el.className = "screen";
    const isNew = !routines.find(r=>r.id===editorDraft.id);

    const top = document.createElement("div");
    top.className = "topbar";
    top.innerHTML = `<button class="link-btn muted" id="cancelEdit">Cancelar</button><button class="link-btn" id="shareRoutineTop">Exportar</button>`;
    el.appendChild(top);

    const nameInput = document.createElement("input");
    nameInput.className = "name-input"; nameInput.type = "text"; nameInput.placeholder = "Nome da rotina";
    nameInput.value = editorDraft.name;
    nameInput.oninput = e => editorDraft.name = e.target.value;

    if(editorDraft.weeklyGoalTimes === undefined) editorDraft.weeklyGoalTimes = 0;

    const tagRow = document.createElement("div");
    tagRow.className = "ident-row";
    tagRow.style.marginTop = "-8px";
    tagRow.innerHTML = `<span style="color:var(--muted); font-size:13px;">peso no boletim:</span>` + tagValorPillsHtml(editorDraft.tagValor, false);
    tagRow.querySelectorAll("[data-tagval]").forEach(sp=>{
      sp.onclick = () => {
        editorDraft.tagValor = sp.dataset.tagval;
        tagRow.querySelectorAll("[data-tagval]").forEach(x=>x.classList.remove("active"));
        sp.classList.add("active");
        atualizarVagaHint();
      };
    });

    /* Aviso de vaga: o limite só é COBRADO no salvar (aqui ele apenas informa
       quem já ocupa o nível). Rebaixar outra rotina no clique da pílula mexeria
       no dado dela por causa de uma edição que ainda pode ser cancelada. */
    const vagaRow = document.createElement("div");
    vagaRow.className = "dev-n";
    vagaRow.style.cssText = "margin:-4px 0 2px; padding:0 2px;";
    function atualizarVagaHint(){ vagaRow.innerHTML = vagaHintHtml(editorDraft); }
    atualizarVagaHint();

    // área da roda da vida: define com quem esta rotina divide os pontos da semana
    const areaRow = document.createElement("div");
    areaRow.className = "ident-row";
    areaRow.style.cssText = "margin-top:-4px; flex-wrap:wrap;";
    areaRow.innerHTML = `<span style="color:var(--muted); font-size:13px;">área:</span><div id="edAreaWrap" style="flex:1;"></div>`;
    const areaPreviewRow = document.createElement("div");
    areaPreviewRow.className = "dev-n";
    areaPreviewRow.style.cssText = "margin:-4px 0 2px; padding:0 2px;";
    function atualizarAreaPreview(){ areaPreviewRow.innerHTML = areaPreviewHtml(editorDraft.eixo); }
    atualizarAreaPreview();
    pintarAreaChips(areaRow.querySelector("#edAreaWrap"), editorDraft.eixo, v => { editorDraft.eixo = v; atualizarVagaHint(); atualizarAreaPreview(); });

    // opt-out do desconto de hábito, rotina a rotina
    const habRow = document.createElement("div");
    habRow.className = "ident-row";
    habRow.style.cssText = "margin-top:-4px;";
    habRow.innerHTML = `<label class="switch-row" style="flex:1; padding:0;">
        <span style="font-size:13px; color:var(--muted);">descontar quando virar hábito</span>
        <input type="checkbox" id="edHabito" ${editorDraft.semHabito?'':'checked'}>
      </label>`;
    habRow.querySelector("#edHabito").onchange = e => { editorDraft.semHabito = !e.target.checked; };

    /* Nota anexada: material de apoio da rotina (roteiro, checklist, letra de
       música…) que o player abre num popup sem interromper a execução.
       Guarda só o id — a nota continua vivendo em K_NOTES e pode ser editada
       normalmente pela aba Modelos. */
    const notaRow = document.createElement("div");
    notaRow.className = "ident-row";
    notaRow.style.cssText = "margin-top:-4px; flex-wrap:wrap; gap:8px;";
    function opcoesNota(){
      const sel = editorDraft.notaId;
      const existe = notes.some(n=>n.id===sel);
      return `<option value="">— nenhuma —</option>` + notes
        .slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))
        .map(n=>`<option value="${n.id}" ${existe && n.id===sel?'selected':''}>${escapeHtml(n.title || "(sem título)")}</option>`).join("");
    }
    notaRow.innerHTML = `<span style="color:var(--muted); font-size:13px;">nota anexada:</span>
      <select id="edNota" class="ed-nota-sel">${opcoesNota()}</select>
      <button type="button" class="link-btn" id="edNotaNova">+ criar nota</button>`;
    notaRow.querySelector("#edNota").onchange = e => { editorDraft.notaId = e.target.value || null; };
    notaRow.querySelector("#edNotaNova").onclick = () => {
      const nova = { id: uid(), title: nomeAutoDoc(), content:"", updatedAt: Date.now(), createdAt: Date.now() };
      notes.push(nova); save(K_NOTES, notes);
      editorDraft.notaId = nova.id;
      const sel = notaRow.querySelector("#edNota");
      sel.innerHTML = opcoesNota(); sel.value = nova.id;
      showAlertBanner("Nota \"" + nova.title + "\" criada e anexada ✓");
    };

    const stepsWrap = document.createElement("div");
    stepsWrap.style.overflowY = "auto";
    stepsWrap.style.flex = "1";
    stepsWrap.style.paddingBottom = "230px";
    el.appendChild(stepsWrap);

    stepsWrap.appendChild(tagRow);
    stepsWrap.appendChild(vagaRow);
    stepsWrap.appendChild(areaRow);
    stepsWrap.appendChild(areaPreviewRow);
    stepsWrap.appendChild(habRow);
    stepsWrap.appendChild(notaRow);
    stepsWrap.appendChild(nameInput);

    const stepsLabel = document.createElement("div");
    stepsLabel.className = "section-label"; stepsLabel.textContent = "Etapas";
    stepsWrap.appendChild(stepsLabel);

    const stepsList = document.createElement("div");
    stepsList.className = "steps-list";
    stepsWrap.appendChild(stepsList);

    function renderSteps(){
      stepsList.innerHTML = "";
      editorDraft.steps.forEach((s,i)=>{
        const row = document.createElement("div");
        row.className = "step-row";
        row.innerHTML = `
          <div class="step-num">${i+1}</div>
          <div class="step-fields">
            <input type="text" placeholder="Nome da etapa" value="${escapeHtml(s.name)}" data-field="name" data-idx="${i}">
            <div class="step-sub">
              <div class="type-toggle">
                <span data-type="timer" data-idx="${i}" class="${s.type==='timer'?'active':''}">tempo</span>
                <span data-type="checklist" data-idx="${i}" class="${s.type==='checklist'?'active':''}">check</span>
                <span data-type="exercicio" data-idx="${i}" class="${s.type==='exercicio'?'active':''}">exercício</span>
              </div>
            </div>
            ${s.type==='timer' ? `
            <div class="step-sub">
              <input class="dur-input" type="number" inputmode="numeric" min="0" value="${Math.floor(s.seconds/60)}" data-field="min" data-idx="${i}"> min
              <input class="dur-input" type="number" inputmode="numeric" min="0" max="59" value="${s.seconds%60}" data-field="sec" data-idx="${i}"> seg
            </div>` : ""}
            ${s.type==='exercicio' ? `
            <div class="step-sub">
              <span class="dev-n">${s.exercicioId ? (s.sets||1)+"x"+(s.reps||"?") : "exercício não escolhido"}</span>
              <button class="link-btn" style="padding:0;" data-stepeditinline="${i}">editar</button>
            </div>` : ""}
            <div class="step-sub">
              <label class="switch-row" style="margin-bottom:0; flex:1;">
                <input type="checkbox" data-journal="${i}" ${s.journaling?'checked':''}>
                <span>Anotações</span>
              </label>
            </div>
          </div>
          <div class="step-side">
            <span class="drag-handle" data-drag="${i}">${svgIcon(ICON_D.bars3,15)}</span>
          </div>
        `;
        stepsList.appendChild(wrapSwipeActions(row, {
          onLeft: () => removeStepAt(i), leftLabel: "Excluir",
          onRight: () => duplicateStepAt(i), rightLabel: "Duplicar"
        }));
      });
      function duplicateStepAt(i){
        const copy = JSON.parse(JSON.stringify(editorDraft.steps[i]));
        copy.id = uid();
        editorDraft.steps.splice(i+1, 0, copy);
        renderSteps(); renderSchedComputed();
      }
      function removeStepAt(idx){
        editorDraft.steps.splice(idx,1);
        if(editorDraft.steps.length===0) editorDraft.steps.push({id:uid(), name:"", seconds:60, type:"timer"});
        renderSteps(); renderSchedComputed();
      }
      const addBtn = document.createElement("button");
      addBtn.className = "add-step-btn"; addBtn.textContent = "+ adicionar etapa";
      addBtn.onclick = () => { editorDraft.steps.push({id:uid(), name:"", seconds:60, type:"timer"}); renderSteps(); };
      stepsList.appendChild(addBtn);
      const pomoBtn = document.createElement("button");
      pomoBtn.className = "add-step-btn"; pomoBtn.textContent = "+ Pomodoro";
      pomoBtn.onclick = abrirConfigPomodoro;
      stepsList.appendChild(pomoBtn);
      /* Pomodoro não é um tipo de etapa novo: gera uma sequência real de etapas
         "tempo" (foco, manual) + "tempo com isRest" (pausa, avança sozinha) —
         reaproveita 100% do motor de timer/descanso que já existe, em vez de um
         terceiro sub-loop no player (como o de exercício). */
      function abrirConfigPomodoro(){
        const ov = document.createElement("div");
        ov.className = "confirm-overlay";
        ov.innerHTML = `
          <div class="confirm-box" style="text-align:left;">
            <p style="margin-bottom:10px;">Pomodoro</p>
            <div class="section-label" style="margin:6px 0 6px;">Foco (min)</div>
            <input class="dur-input" style="width:70px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="1" id="pmFoco" value="25">
            <div class="section-label" style="margin:12px 0 6px;">Pausa (min)</div>
            <input class="dur-input" style="width:70px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="1" id="pmPausa" value="5">
            <div class="section-label" style="margin:12px 0 6px;">Ciclos</div>
            <input class="dur-input" style="width:70px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:16px; color:var(--text);" type="number" inputmode="numeric" min="1" max="12" id="pmCiclos" value="4">
            <div class="confirm-actions" style="margin-top:18px;">
              <button class="btn-cancel" id="pmCancel">Cancelar</button>
              <button class="btn-confirm" id="pmSave" style="background:var(--grad);">Adicionar</button>
            </div>
          </div>`;
        document.body.appendChild(ov);
        ov.onclick = e => { if(e.target===ov) ov.remove(); };
        ov.querySelector("#pmCancel").onclick = () => ov.remove();
        ov.querySelector("#pmSave").onclick = () => {
          const foco = Math.max(1, +ov.querySelector("#pmFoco").value || 25);
          const pausa = Math.max(1, +ov.querySelector("#pmPausa").value || 5);
          const ciclos = Math.max(1, Math.min(12, +ov.querySelector("#pmCiclos").value || 4));
          for(let c=1;c<=ciclos;c++){
            editorDraft.steps.push({ id:uid(), name:"Foco "+c+"/"+ciclos, seconds: foco*60, type:"timer" });
            if(c<ciclos) editorDraft.steps.push({ id:uid(), name:"Pausa "+c+"/"+ciclos, seconds: pausa*60, type:"timer", isRest:true });
          }
          ov.remove();
          renderSteps(); renderSchedComputed();
          showAlertBanner(ciclos+" ciclo(s) de pomodoro adicionados ✓");
        };
      }

      stepsList.querySelectorAll("[data-field='name']").forEach(inp=> inp.oninput = e => editorDraft.steps[+e.target.dataset.idx].name = e.target.value);
      function updateDur(idx){
        const minInp = stepsList.querySelector(`[data-field='min'][data-idx='${idx}']`);
        const secInp = stepsList.querySelector(`[data-field='sec'][data-idx='${idx}']`);
        const mins = Math.max(0, +(minInp && minInp.value) || 0);
        const secs = Math.min(59, Math.max(0, +(secInp && secInp.value) || 0));
        editorDraft.steps[idx].seconds = Math.max(5, mins*60 + secs);
        renderSchedComputed();
      }
      stepsList.querySelectorAll("[data-field='min'],[data-field='sec']").forEach(inp=> inp.oninput = e => updateDur(+e.target.dataset.idx));
      stepsList.querySelectorAll("[data-type]").forEach(sp=> sp.onclick = e => {
        const idx = +e.target.dataset.idx;
        const t = e.target.dataset.type;
        editorDraft.steps[idx].type = t;
        renderSteps(); renderSchedComputed();
        // séries/reps/descanso/exercício da biblioteca têm formulário próprio
        // (mesmo overlay usado a partir do detalhe da rotina) — reaproveita em
        // vez de duplicar o picker de exercício aqui na lista inline
        if(t === "exercicio") openStepEditor(editorDraft, idx);
      });
      stepsList.querySelectorAll("[data-stepeditinline]").forEach(b=> b.onclick = () => openStepEditor(editorDraft, +b.dataset.stepeditinline));
      stepsList.querySelectorAll("[data-journal]").forEach(cb=> cb.onchange = e => {
        editorDraft.steps[+e.target.dataset.journal].journaling = e.target.checked;
      });
      // arrastar para reordenar (alça ${svgIcon(ICON_D.bars3,15)})
      stepsList.querySelectorAll("[data-drag]").forEach(handle=>{
        handle.onpointerdown = ev => {
          ev.preventDefault();
          const from = +handle.dataset.drag;
          const rows = [...stepsList.querySelectorAll(".step-row")];
          const dragRow = rows[from];
          dragRow.classList.add("dragging");
          handle.setPointerCapture(ev.pointerId);
          let target = from;
          const move = e2 => {
            const y = e2.clientY;
            target = from;
            rows.forEach((row,j)=>{
              const rect = row.getBoundingClientRect();
              const mid = rect.top + rect.height/2;
              row.classList.remove("drop-above","drop-below");
              if(j !== from){
                if(y < mid && j < from) target = Math.min(target, j);
                if(y > mid && j > from) target = Math.max(target, j);
              }
            });
            if(target !== from && rows[target]){
              rows[target].classList.add(target < from ? "drop-above" : "drop-below");
            }
          };
          const up = () => {
            handle.releasePointerCapture(ev.pointerId);
            handle.onpointermove = null; handle.onpointerup = null; handle.onpointercancel = null;
            dragRow.classList.remove("dragging");
            rows.forEach(r=>r.classList.remove("drop-above","drop-below"));
            if(target !== from){
              const [moved] = editorDraft.steps.splice(from,1);
              editorDraft.steps.splice(target,0,moved);
              renderSteps(); renderSchedComputed();
            }
          };
          handle.onpointermove = move;
          handle.onpointerup = up;
          handle.onpointercancel = up;
        };
      });
    }
    renderSteps();

    // descanso entre etapas — mesmo valor vale para o descanso entre séries
    // dentro de uma etapa de exercício (não é mais configurado por exercício)
    const restLabel = document.createElement("div");
    restLabel.className = "section-label"; restLabel.textContent = "Descanso entre etapas";
    stepsWrap.appendChild(restLabel);
    const restBox = document.createElement("div");
    restBox.className = "schedule-box";

  function stripMdForSnippet(content){
    return content.replace(/^#+\s*/gm,"").replace(/[*_~`]/g,"").replace(/(-\s*)?\[[ xX>]?\]\s*/g,"").replace(/\n+/g," ").trim().slice(0,90);
  }
  function relativeTime(ts){
    const diff = Date.now() - ts;
    const min = Math.floor(diff/60000);
    if(min < 1) return "agora";
    if(min < 60) return min+"min";
    const h = Math.floor(min/60);
    if(h < 24) return h+"h";
    const d = Math.floor(h/24);
    return d+"d";
  }

    return `<div class="created-stamp">criada em ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} às ${p(d.getHours())}:${p(d.getMinutes())}</div>`;
  }

  function extractTags(n){
    const src = (n.title||"") + " " + (n.content||"");
    const out = new Set();
    const re = /(^|\s)#([\p{L}0-9_\-]+)/gu;
    let m;
    while((m = re.exec(src))) out.add(m[2].toLowerCase());
    return [...out];
  }
  function allTags(){
    const t = new Set();
    notes.forEach(n=> extractTags(n).forEach(x=>t.add(x)));
    return [...t].sort();
  }
