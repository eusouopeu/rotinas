  /* ---- Parser do formato .md de toggle-list (pool / trilha) ----
     Convenção: "&gt;" no início da linha = toggle list; nível de aninhamento = nº de "&gt;" repetidos.
     Nível 1 = "Eixo — Área". Pool: nível 2 = duração, nível 3 = tipo + tabela Tarefa|Peso.
     Trilha: nível 2 = bloco (tipo) + tabela #|Tarefa|Tipo, direto (sem nível 3). */
  function parseTarefasToggleMd(text){
    const lines = String(text).split(/\r?\n/);
    const warnings = [];
    let level1 = null; // { titleRaw, eixoLabel, area, eixoMatch, notes:[] }
    let level2 = null, level3 = null;
    const level2Nodes = [];

    function boldText(s){ const m = s.match(/^\*\*(.+?)\*\*/); return m ? m[1].trim() : null; }
    function flushLevel3(){ if(level3 && level2) level2.level3s.push(level3); level3 = null; }
    function flushLevel2(){ flushLevel3(); if(level2) level2Nodes.push(level2); level2 = null; }

    lines.forEach(raw=>{
      const lm = raw.match(/^\s*((?:>\s*)+)/);
      if(!lm) return; // fora do toggle-list, ignora (linha de prosa solta)
      const level = (lm[1].match(/>/g)||[]).length;
      const content = raw.slice(lm[0].length).trim();
      if(!content) return;

      if(level === 1){
        const b = boldText(content);
        if(b !== null){
          flushLevel2();
          const parts = b.split(/\s+[—–-]\s+/);
          level1 = { titleRaw:b, eixoLabel:(parts[0]||b).trim(), area:(parts[1]||"").trim(), eixoMatch: matchEixo(parts[0]||b), notes:[] };
        } else if(level1 && !level2){
          level1.notes.push(content);
        } else if(!level1){
          warnings.push('Conteúdo de nível 1 antes de qualquer título de eixo, ignorado: "'+content.slice(0,60)+'"');
        }
        return;
      }
      if(!level1){ warnings.push('Linha de nível '+level+' encontrada antes do título do eixo (nível 1), ignorada: "'+content.slice(0,60)+'"'); return; }

      if(level === 2){
        const b = boldText(content);
        if(b !== null){ flushLevel2(); level2 = { title:b, level3s:[], tableLines:[] }; }
        else if(content.startsWith("|")){
          if(!level2){ warnings.push('Linha de tabela em nível 2 sem bloco aberto, ignorada: "'+content.slice(0,60)+'"'); return; }
          level2.tableLines.push(content);
        }
        return;
      }
      if(level === 3){
        if(!level2){ warnings.push('Linha de nível 3 sem bloco de nível 2 aberto, ignorada: "'+content.slice(0,60)+'"'); return; }
        const b = boldText(content);
        if(b !== null){ flushLevel3(); level3 = { title:b, tableLines:[] }; }
        else if(content.startsWith("|")){
          if(!level3){ warnings.push('Linha de tabela em nível 3 sem tipo aberto, ignorada: "'+content.slice(0,60)+'"'); return; }
          level3.tableLines.push(content);
        }
        return;
      }
      warnings.push('Nível de aninhamento '+level+' não suportado (máx. 3), ignorado: "'+content.slice(0,60)+'"');
    });
    flushLevel2();

    if(!level1){
      return { error:'Não foi encontrado o título de eixo (nível 1, ex: "Idiomas — Mandarim").', warnings };
    }

    function parseTableLines(rawTableLines){
      const rows = rawTableLines
        .map(l=> l.split("|").slice(1,-1).map(c=>c.trim()))
        .filter(cells => !cells.every(c=>/^:?-+:?$/.test(c)));
      if(rows.length===0) return { header:null, dataRows:[] };
      return { header:rows[0], dataRows:rows.slice(1) };
    }
    function detectFormat(header){
      if(!header) return null;
      const norm = header.map(normalizeStr);
      if(norm.length===2 && norm[0]==="tarefa" && norm[1]==="peso") return "pool";
      // trilha: "# | Tarefa | Tipo" (3 col.) ou a variação com coluna extra "Detalhe" (4 col.)
      if(norm.length>=3 && norm[0]==="#" && norm[1]==="tarefa" && norm[2]==="tipo") return "trilha";
      return null;
    }
    function parseDurTitle(title){ const m = title.match(/(\d+)/); return m ? +m[1] : null; }
    // coluna "Detalhe": bullet list separada por "<br>• " → texto multi-linha (um item por linha)
    function parseDetalheCell(raw){
      if(!raw) return "";
      return String(raw).split(/<br\s*\/?>/i)
        .map(s => s.replace(/^\s*[-*•]\s*/,"").replace(/\*\*(.+?)\*\*/g,"$1").trim())
        .filter(Boolean)
        .join("\n");
    }

    const items = [];
    const blockSummary = [];
    let genero = null;

    level2Nodes.forEach(l2=>{
      if(l2.level3s.length > 0){
        // esperado: pool (nível 3 = tipo, tabela Tarefa|Peso)
        const dur = parseDurTitle(l2.title);
        l2.level3s.forEach(l3=>{
          const { header, dataRows } = parseTableLines(l3.tableLines);
          const fmt = detectFormat(header);
          if(fmt === null){
            if(header || dataRows.length) warnings.push('Tabela em "'+l3.title+'" com cabeçalho não reconhecido ('+(header?header.join(" | "):"vazio")+'), bloco ignorado.');
            return;
          }
          if(fmt !== "pool"){
            warnings.push('Tabela em "'+l3.title+'" tem cabeçalho de trilha mas está aninhada em nível 3 (esperado pool) — bloco ignorado.');
            return;
          }
          if(genero===null) genero = "pool";
          else if(genero !== "pool") warnings.push('Arquivo mistura pool e trilha — isso não é suportado; mantendo apenas os blocos pool já processados.');
          if(genero !== "pool") return;
          let count = 0;
          dataRows.forEach((cells, ri)=>{
            if(cells.length < 2){ warnings.push('Linha de tabela mal formada em "'+l3.title+'" (linha '+(ri+1)+'), ignorada.'); return; }
            const conteudo = cells[0], pesoRaw = cells[1];
            if(!conteudo){ warnings.push('Linha de tabela sem conteúdo em "'+l3.title+'" (linha '+(ri+1)+'), ignorada.'); return; }
            const pm = (pesoRaw||"").match(/(\d+)/);
            if(!pm) warnings.push('Peso não reconhecido ("'+pesoRaw+'") em "'+conteudo+'", assumindo 1×.');
            const peso = pm ? Math.min(9, Math.max(1, +pm[1])) : 1;
            for(let c=0;c<peso;c++){ items.push({ tipo:l3.title, conteudo, dur, genero:"pool" }); count++; }
          });
          if(count>0) blockSummary.push({ group:l3.title, sub:(dur!==null?dur+" min":"?"), count });
        });
      } else {
        // esperado: trilha (tabela direto no nível 2)
        const { header, dataRows } = parseTableLines(l2.tableLines);
        const fmt = detectFormat(header);
        if(fmt === null){
          if(header || dataRows.length) warnings.push('Tabela em "'+l2.title+'" com cabeçalho não reconhecido ('+(header?header.join(" | "):"vazio")+'), bloco ignorado.');
          return;
        }
        if(fmt !== "trilha"){
          warnings.push('Tabela em "'+l2.title+'" tem cabeçalho de pool mas não tem nível 3 (esperado trilha) — bloco ignorado.');
          return;
        }
        if(genero===null) genero = "trilha";
        else if(genero !== "trilha"){ warnings.push('Arquivo mistura pool e trilha — isso não é suportado; mantendo apenas os blocos trilha já processados.'); return; }
        const tipo = l2.title;
        let count = 0;
        dataRows.forEach((cells, ri)=>{
          if(cells.length < 3){ warnings.push('Linha de tabela mal formada em "'+tipo+'" (linha '+(ri+1)+'), ignorada.'); return; }
          const numero = cells[0], conteudo = cells[1], tipoRaw = cells[2], detalheRaw = cells[3] || "";
          if(!conteudo){ warnings.push('Linha de tabela sem conteúdo em "'+tipo+'" (linha '+(ri+1)+'), ignorada.'); return; }
          const tipoNorm = normalizeStr(tipoRaw);
          // Tipos aceitos: "trilha"/"simulado" (3 col.) e "Aula"/"Questões" (variação 4 col.).
          // Aula e Questões sequenciam como trilha (não reciclam); só "simulado" muda a natureza.
          const conhecidos = ["trilha","simulado","aula","questoes","questao"];
          if(!conhecidos.includes(tipoNorm)) warnings.push('Tipo de linha não reconhecido ("'+tipoRaw+'") em "'+conteudo+'", assumindo "trilha".');
          const natureza = tipoNorm === "simulado" ? "simulado" : "trilha";
          const it = { tipo, conteudo, numero, natureza, genero:"trilha" };
          // preserva o rótulo original do Tipo (Aula/Questões/simulado) quando não for o genérico "trilha"
          if(tipoRaw && tipoNorm !== "trilha") it.tipoTarefa = tipoRaw;
          const detalhes = parseDetalheCell(detalheRaw);
          if(detalhes) it.detalhes = detalhes;
          items.push(it);
          count++;
        });
        if(count>0) blockSummary.push({ group:tipo, sub:null, count });
      }
    });

    let suggestedDur = null;
    if(genero === "trilha"){
      const dm = level1.notes.join(" ").match(/(\d+)\s*min/i);
      suggestedDur = dm ? +dm[1] : null;
    }

    return {
      eixoLabel: level1.eixoLabel,
      area: level1.area,
      eixoMatch: level1.eixoMatch,
      notes: level1.notes,
      genero, items, blockSummary, suggestedDur, warnings
    };
  }

  function tarefaKey(m){ return (m.tipo||"")+"‖"+(m.conteudo||"")+"‖"+(m.numero||""); }

  function importTarefasMd(file){
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseTarefasToggleMd(String(reader.result));
      if(parsed.error){
        showAlertBanner("Não foi possível importar: " + parsed.error + (parsed.warnings.length ? ` · ${parsed.warnings.length} aviso(s)` : ""));
        return;
      }
      tarefaImportDraft = { parsed, fileName: file.name };
      goTo({ tab:"tarefas", screen:"tarefaImportPreview" });
    };
    reader.readAsText(file);
  }

  function confirmImportTarefas(mode, eixoId, area, trilhaDur){
    const d = tarefaImportDraft;
    if(!d) return;
    const parsed = d.parsed;
    if(parsed.items.length === 0){ showAlertBanner("Nada pra importar"); return; }
    if(!eixoId){ showAlertBanner("Escolha um eixo antes de importar"); return; }
    const finalArea = (area||"").trim() || eixoInfo(eixoId).area;

    if(mode === "replace"){
      tarefas = tarefas.filter(m => !(m.eixo===eixoId && m.area===finalArea));
    }
    let ord = tarefas.length ? Math.max(...tarefas.map(m=>m.ord||0))+1 : 0;
    const novos = parsed.items.map(it=>{
      const base = { id:uid(), eixo:eixoId, area:finalArea, tipo:it.tipo, conteudo:it.conteudo, lastDone:null, ord:ord++, genero:parsed.genero };
      if(parsed.genero === "trilha"){ base.dur = trilhaDur; base.numero = it.numero; base.natureza = it.natureza; }
      else { base.dur = it.dur; }
      if(it.tipoTarefa) base.tipoTarefa = it.tipoTarefa;
      if(it.detalhes) base.detalhes = it.detalhes;
      return base;
    });

    let added = novos.length, skippedDup = 0;
    if(mode === "merge"){
      const existingKeys = new Set(tarefas.map(tarefaKey));
      const toAdd = novos.filter(it => !existingKeys.has(tarefaKey(it)));
      skippedDup = novos.length - toAdd.length;
      added = toAdd.length;
      tarefas.push(...toAdd);
    } else {
      tarefas.push(...novos);
    }
    saveTarefas();
    tarefaImportDraft = null;
    pushView({ tab:"tarefas", screen:"tarefas" });
    const warnCount = parsed.warnings.length;
    showAlertBanner(
      added + " tarefa(s) importada(s) ✓" +
      (skippedDup ? ` · ${skippedDup} já existiam` : "") +
      (warnCount ? ` · ${warnCount} aviso(s) de parsing` : "")
    );
    render();
  }

  function renderTarefaImportPreview(){
    const d = tarefaImportDraft;
    if(!d){ goTo({ tab:"tarefas", screen:"tarefas" }); return; }
    const p = d.parsed;
    const el = document.createElement("div");
    el.className = "screen";
    el.style.paddingBottom = "24px";

    const matchedEixo = p.eixoMatch;
    const totalItems = p.items.length;
    const genero = p.genero;
    const eixoOptions = EIXOS.map(e=>`<option value="${e.id}" ${matchedEixo && matchedEixo.id===e.id ? 'selected':''}>${escapeHtml(e.label)}</option>`).join("");

    el.innerHTML = `
      <div class="home-header">
        <h1>Importar tarefas</h1>
        <button class="bell-btn" id="tiCancel">${svgIcon(ICON_D.xmark,14)}</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:14px; overflow-y:auto;">
        <div class="stat-card">
          <div class="routine-meta" style="margin-bottom:6px;">${escapeHtml(d.fileName)}</div>
          <h3 style="font-size:16px; margin-bottom:4px;">${escapeHtml(p.eixoLabel)}${p.area?' — '+escapeHtml(p.area):''}</h3>
          <div class="routine-meta">Formato detectado: <b>${genero==='trilha'?'trilha (sequencial, não recicla)':genero==='pool'?'pool (fila cíclica)':'não identificado'}</b> · ${totalItems} tarefa(s)</div>
        </div>

        ${!matchedEixo ? `<div class="stat-card" style="border-color:var(--danger);">
          <div style="font-size:13px; color:var(--danger); margin-bottom:8px;">${svgIcon(ICON_D.exclamationTriangle,14)} Eixo "${escapeHtml(p.eixoLabel)}" não bate com nenhum eixo existente. Escolha manualmente:</div>
          <select id="tiEixo" class="routine-select">${eixoOptions}</select>
        </div>` : `<div>
          <div class="section-label">Eixo detectado</div>
          <select id="tiEixo" class="routine-select">${eixoOptions}</select>
        </div>`}

        <div>
          <div class="section-label">Área</div>
          <input type="text" id="tiArea" class="mk-e-name" value="${escapeHtml(p.area || (matchedEixo?matchedEixo.area:''))}" placeholder="Ex: Contabilidade">
        </div>

        ${genero === 'trilha' ? `<div>
          <div class="section-label">Duração por sessão (min) — o arquivo não define isso por linha, confirme</div>
          <input type="number" id="tiDur" class="mk-e-name" min="1" value="${p.suggestedDur || 60}">
        </div>` : ''}

        ${p.notes.length ? `<div>
          <div class="section-label">Notas do cabeçalho do arquivo</div>
          <div class="stat-card" style="font-size:13px; line-height:1.6; color:var(--muted);">${p.notes.map(n=>escapeHtml(n)).join("<br>")}</div>
        </div>` : ''}

        <div>
          <div class="section-label">Tarefas por bloco</div>
          <div class="stat-card" style="padding:10px 16px;">
            ${p.blockSummary.length===0 ? `<div class="routine-meta" style="padding:6px 0;">Nenhuma tarefa reconhecida.</div>` : p.blockSummary.map(b=>`
              <div style="display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px;">
                <span>${escapeHtml(b.group)}${b.sub?' · '+escapeHtml(String(b.sub)):''}</span>
                <span style="color:var(--muted); flex:0 0 auto;">${b.count}</span>
              </div>`).join("")}
          </div>
        </div>

        ${p.warnings.length ? `<div>
          <div class="section-label">Avisos de parsing (${p.warnings.length})</div>
          <div class="stat-card" style="font-size:12.5px; line-height:1.6; color:var(--muted); max-height:180px; overflow-y:auto;">
            ${p.warnings.map(w=>escapeHtml(w)).join("<br>")}
          </div>
        </div>` : ''}

        <div style="display:flex; flex-direction:column; gap:10px; margin-top:6px;">
          <button class="btn-primary" id="tiMerge" ${totalItems===0?'disabled':''}>Mesclar com a fila atual</button>
          <button class="btn-cancel" id="tiReplace" ${totalItems===0?'disabled':''}>Substituir tarefas deste eixo + área</button>
        </div>
      </div>`;
    app.appendChild(el);

    document.getElementById("tiCancel").onclick = () => { tarefaImportDraft = null; goTo({ tab:"tarefas", screen:"tarefas" }); };

    function readForm(){
      const eixoId = document.getElementById("tiEixo").value;
      const area = document.getElementById("tiArea").value;
      const durEl = document.getElementById("tiDur");
      const trilhaDur = durEl ? Math.max(1, +durEl.value || 60) : null;
      return { eixoId, area, trilhaDur };
    }
    const mergeBtn = document.getElementById("tiMerge");
    const replaceBtn = document.getElementById("tiReplace");
    if(mergeBtn) mergeBtn.onclick = () => { const f = readForm(); confirmImportTarefas("merge", f.eixoId, f.area, f.trilhaDur); };
    if(replaceBtn) replaceBtn.onclick = () => {
      const f = readForm();
      confirmModal("Remover as tarefas existentes de <b>"+escapeHtml(eixoInfo(f.eixoId).label)+" · "+escapeHtml(f.area||eixoInfo(f.eixoId).area)+"</b> e substituir pelas "+totalItems+" importadas?", "Substituir", () => {
        confirmImportTarefas("replace", f.eixoId, f.area, f.trilhaDur);
      });
    };
  }

  function concludeTarefa(m){
    const prev = m.lastDone;
    const prevReview = m.reviewAt;
    m.lastDone = Date.now();
    delete m.reviewAt; // revisão vencida (ou nunca marcada): o ciclo recomeça
    saveTarefas();
    const histEntry = { id:uid(), tarefaId:m.id, eixo:m.eixo, area:m.area, tipo:m.tipo, conteudo:m.conteudo, dur:m.dur, ts:m.lastDone };
    tarefasHist.push(histEntry); saveTarefasHist();
    // o eixo da tarefa é a mesma chave de área da roda da vida (ids semeados dos EIXOS)
    const gamEntry = registrarConclusao("tarefa", { tarefaId:m.id, tag: tarefaTagEfetiva(m), minutos:m.dur, data:new Date(m.lastDone), area: rodaAreas().some(a=>a.id===m.eixo) ? m.eixo : "", rotulo: m.area || m.tipo || "Tarefas" });
    finishCue();
    showUndoBanner("Tarefa concluída ✓", ()=>{
      m.lastDone = prev;
      if(prevReview !== undefined) m.reviewAt = prevReview;
      saveTarefas();
      tarefasHist = tarefasHist.filter(h=>h.id!==histEntry.id); saveTarefasHist();
      desfazerConclusao(gamEntry);
      render();
    });
    if(tarefaGenero(m)==='trilha') askReviewTarefa(m);
  }

  /* Revisão espaçada (só trilha): a tarefa concluída reaparece na fila na data. */
  function askReviewTarefa(m){
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box" role="dialog" aria-modal="true">
        <p>Revisar <b>${escapeHtml(m.conteudo)}</b> em:</p>
        <div class="confirm-actions" style="flex-direction:column;">
          <button class="btn-confirm" data-rev="1">1 dia</button>
          <button class="btn-confirm" data-rev="7">7 dias</button>
          <button class="btn-confirm" data-rev="30">30 dias</button>
          <button class="btn-cancel" data-rev="">Sem revisão</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if(e.target === ov) ov.remove(); };
    ov.querySelectorAll("[data-rev]").forEach(b=> b.onclick = () => {
      const d = +b.dataset.rev;
      if(d > 0){ m.reviewAt = Date.now() + d * 86400000; saveTarefas(); }
      ov.remove();
      render();
    });
  }

  function deleteTarefaComUndo(m){
    const idx = tarefas.findIndex(x=>x.id===m.id);
    if(idx===-1) return;
    tarefas.splice(idx,1);
    saveTarefas();
    render();
    showUndoBanner("Tarefa excluída", ()=>{
      tarefas.splice(Math.min(idx, tarefas.length), 0, m);
      saveTarefas();
      render();
    });
  }

  function notifyTarefaTimeUp(m){
    const title = "\u23F1 Tempo esgotado";
    const body = m.tipo + ": " + m.conteudo + " (" + m.dur + " min)";
    if(isNative){ notifyNative(title, body, {}, notifIdFor("tarefa-" + m.id, 0)); return; }
    if(isDesktop){ notifyDesktop(title, body); return; }
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    if("serviceWorker" in navigator){
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification(title, { body, tag:"tarefa-"+m.id, vibrate:[200,100,200] })
          .catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
      });
    } else { try{ new Notification(title,{body}); }catch(e){} }
  }

  function tarefaAgo(m){
    if(!m.lastDone) return "nunca feita";
    const days = Math.floor((Date.now()-m.lastDone)/86400000);
    if(days<=0) return "feita hoje";
    if(days===1) return "feita ontem";
    return "há "+days+" dias";
  }

  function tarefaAtiva(m){
    if(tarefaGenero(m)!=='trilha' || !m.lastDone) return true;
    // trilha concluída volta à fila quando a revisão espaçada vence
    return !!(m.reviewAt && Date.now() >= m.reviewAt);
  }
  // "detalhes" (texto multi-linha) → lista com marcadores, uma linha por item
  function tarefaDetalhesHtml(detalhes){
    if(!detalhes) return "";
    const items = String(detalhes).split(/\r?\n/).map(l=>l.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean);
    if(!items.length) return "";
    return `<ul class="tar-detalhes">${items.map(l=>`<li>${escapeHtml(l)}</li>`).join("")}</ul>`;
  }

  function renderTarefas(){
    const el = document.createElement("div");
    el.className = "screen with-tabbar";
    const durValues = Array.from(new Set(tarefas.map(m=>m.dur))).sort((a,b)=>a-b);
    const durChips = `<span data-dur="0" class="${tarefaDurFilter===0?'active':''}">todas</span>` +
      durValues.map(d=>`<span data-dur="${d}" class="${tarefaDurFilter===d?'active':''}">${d} min</span>`).join("");
    el.innerHTML = `
      <div class="tab-scroll">
        <div class="home-header"><h1>Tarefas ${svgIcon(ICON_D.bars3,15)}</h1>
          <div class="header-right">
            <button class="bell-btn" id="tarImportBtn" title="Importar tarefas (.md)" aria-label="Importar tarefas (.md)">${svgIcon(ICON_D.arrowUpTray,14)}</button>
            <input type="file" id="tarImportFile" accept=".md,.txt,text/markdown,text/plain" style="display:none">
          </div>
        </div>
        <div class="type-toggle" id="tarDurChips" style="margin-bottom:14px;">${durChips}</div>
        <div class="routine-list" id="tarList" style="flex:0 0 auto; overflow:visible;"></div>
      </div>`;
    const fab = document.createElement("button");
    fab.className = "fab"; fab.textContent = "+"; fab.title = "Nova tarefa";
    fab.onclick = () => { tarefaDraft = null; goTo({ tab:"tarefas", screen:"tarefaEditor" }); };
    el.appendChild(fab);
    el.appendChild(renderTabbar("tarefas"));
    app.appendChild(el);

    el.querySelectorAll("[data-dur]").forEach(sp=> sp.onclick = () => { tarefaDurFilter = +sp.dataset.dur; render(); });
    const impFile = document.getElementById("tarImportFile");
    document.getElementById("tarImportBtn").onclick = () => impFile.click();
    impFile.onchange = e => { if(e.target.files && e.target.files[0]){ importTarefasMd(e.target.files[0]); e.target.value=""; } };

    const list = document.getElementById("tarList");

    if(tarefas.length===0){
      list.innerHTML = `<div class="empty-state"><h2>Fila vazia</h2><p>Importe um arquivo .md (${svgIcon(ICON_D.arrowUpTray,14)} acima) ou adicione tarefas com o botão +.</p>
        <div class="stat-card" style="text-align:left; margin-top:14px; font-family:'Inter', sans-serif; font-size:11.5px; line-height:1.6; color:var(--muted); white-space:pre;">&gt; **Idiomas — Mandarim**
&gt;
&gt; &gt; **15 minutos**
&gt; &gt;
&gt; &gt; &gt; **Revisão Anki**
&gt; &gt; &gt;
&gt; &gt; &gt; | Tarefa | Peso |
&gt; &gt; &gt; |---|---|
&gt; &gt; &gt; | Substantivos | 3× |</div>
        <p style="font-size:12px; color:var(--muted); margin-top:8px;">Formato pool (fila cíclica) acima, ou trilha (sequencial) com tabela # | Tarefa | Tipo direto no nível 2 — a importação detecta pelo cabeçalho da tabela.</p>
      </div>`;
      return;
    }

    const filteredByDur = tarefas.filter(m=> tarefaDurFilter===0 || m.dur===tarefaDurFilter);
    if(filteredByDur.length===0){
      list.innerHTML = `<div class="empty-state"><h2>Nada aqui</h2><p>Nenhuma tarefa com essa duração.</p></div>`;
      return;
    }

    EIXOS.forEach(ex=>{
      const eixoItems = filteredByDur.filter(m=>m.eixo===ex.id);
      if(eixoItems.length===0) return;
      const areas = [];
      eixoItems.forEach(m=>{ if(!areas.includes(m.area)) areas.push(m.area); });
      areas.forEach(area=>{
        const areaItems = eixoItems.filter(m=>m.area===area);
        const active = areaItems.filter(tarefaAtiva).sort((a,b)=> (a.lastDone||0)-(b.lastDone||0) || a.ord-b.ord);
        const done = areaItems.filter(m=>!tarefaAtiva(m)).sort((a,b)=> (b.lastDone||0)-(a.lastDone||0));
        if(active.length===0 && done.length===0) return;
        const secKey = ex.id+"|"+area;
        const collapsed = !!tarefaCollapsed[secKey];
        const sec = document.createElement("div");
        sec.innerHTML = `<div class="section-label" style="display:flex; align-items:center; gap:8px; cursor:pointer; color:${ex.color};" data-eixosec="${escapeHtml(secKey)}">
          <span>${collapsed?svgIcon(ICON_D.chevronRight,13):svgIcon(ICON_D.chevronDown,13)}</span><span style="flex:1;">${ex.label} · ${escapeHtml(area)}</span><span style="color:var(--muted); font-weight:400;">${active.length}</span>
        </div>`;
        sec.querySelector("[data-eixosec]").onclick = () => { tarefaCollapsed[secKey] = !collapsed; save("rotinas_v2_tar_collapsed", tarefaCollapsed); render(); };
        list.appendChild(sec);
        if(collapsed) return;

        // a "próxima" da área é a primeira ativa (competição por área, não por bloco)
        const nextId = active.length ? active[0].id : null;

        // monta um card de conteúdo em bullet, com hierarquia de fonte (bloco = cabeçalho, conteúdo = bullet)
        function bulletCard(m, dim){
          const isNext = m.id===nextId;
          const card = document.createElement("div");
          card.className = "tar-item";
          if(dim) card.style.opacity = "0.55";
          card.style.borderLeft = "3px solid " + (isNext ? ex.color : "transparent");
          const numeroTag = m.numero ? escapeHtml(m.numero)+' · ' : '';
          const tipoTag = m.tipoTarefa ? escapeHtml(m.tipoTarefa)+' · ' : '';
          const revTag = m.reviewAt ? (Date.now() >= m.reviewAt ? ' · revisão pendente' : ' · revisão em ' + new Date(m.reviewAt).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit"})) : '';
          const metaBits = `${numeroTag}${tipoTag}${m.dur} min · ${tarefaAgo(m)}${m.natureza==='simulado'?' · simulado':''}${revTag}`;
          const detalhesHtml = tarefaDetalhesHtml(m.detalhes);
          card.innerHTML = `
            <div class="tar-item-info" data-medit="${m.id}">
              <span class="tar-bullet" style="${isNext?`color:${ex.color};`:''}">${isNext?svgIcon(ICON_D.arrowRight,13):'&bull;'}</span>
              <div style="flex:1; min-width:0;">
                <div class="tar-conteudo">${escapeHtml(m.conteudo)}</div>
                <div class="routine-meta tar-item-meta">${metaBits}</div>
                ${detalhesHtml}
              </div>
            </div>
            ${dim?'':`<div class="tar-item-actions">
              <button class="bell-btn" data-mplay="${m.id}" title="Iniciar timer" aria-label="Iniciar timer" style="color:${ex.color};">${svgIcon(ICON_D.play,16)}</button>
              <button class="bell-btn" data-mdone="${m.id}" title="Marcar feita hoje" aria-label="Marcar feita hoje">${svgIcon(ICON_D.check,14)}</button>
            </div>`}`;
          return wrapSwipeDelete(card, () => deleteTarefaComUndo(m));
        }

        // agrupa as ativas por bloco (tipo), preservando a ordem de leitura
        const blocks = [];
        active.forEach(m=>{
          let b = blocks.find(x=>x.tipo===m.tipo);
          if(!b){ b = { tipo:m.tipo, items:[] }; blocks.push(b); }
          b.items.push(m);
        });
        blocks.forEach(block=>{
          const hasNext = block.items.some(m=>m.id===nextId);
          const blocoKey = secKey+"||"+block.tipo;
          const stored = tarefaBlocoCollapsed[blocoKey];
          const blocoCollapsed = stored === undefined ? !hasNext : stored; // padrão: colapsado, exceto o bloco da próxima
          const bh = document.createElement("div");
          bh.className = "tar-bloco-head";
          bh.dataset.bloco = blocoKey;
          bh.innerHTML = `<span class="tar-bloco-arrow">${blocoCollapsed?svgIcon(ICON_D.chevronRight,13):svgIcon(ICON_D.chevronDown,13)}</span>
            <span class="tar-bloco-title">${escapeHtml(block.tipo)}</span>
            <span class="tar-bloco-count">${block.items.length}</span>`;
          bh.onclick = () => { tarefaBlocoCollapsed[blocoKey] = !blocoCollapsed; save("rotinas_v2_tar_bloco_collapsed", tarefaBlocoCollapsed); render(); };
          list.appendChild(bh);
          if(blocoCollapsed) return;
          block.items.forEach(m=> list.appendChild(bulletCard(m, false)));
        });

        if(done.length){
          const doneKey = secKey+"|done";
          const doneCollapsed = tarefaConcluidasCollapsed[doneKey] !== false; // colapsada por padrão
          const doneSec = document.createElement("div");
          doneSec.innerHTML = `<div class="section-label" style="display:flex; align-items:center; gap:8px; cursor:pointer;" data-donesec="${escapeHtml(doneKey)}">
            <span>${doneCollapsed?svgIcon(ICON_D.chevronRight,13):svgIcon(ICON_D.chevronDown,13)}</span><span style="flex:1;">${svgIcon(ICON_D.check,14)} Concluídas</span><span style="color:var(--muted); font-weight:400;">${done.length}</span>
          </div>`;
          doneSec.querySelector("[data-donesec]").onclick = () => { tarefaConcluidasCollapsed[doneKey] = !doneCollapsed; save("rotinas_v2_tar_concl_collapsed", tarefaConcluidasCollapsed); render(); };
          list.appendChild(doneSec);
          if(!doneCollapsed){
            // concluídas também agrupadas por bloco
            const doneBlocks = [];
            done.forEach(m=>{
              let b = doneBlocks.find(x=>x.tipo===m.tipo);
              if(!b){ b = { tipo:m.tipo, items:[] }; doneBlocks.push(b); }
              b.items.push(m);
            });
            doneBlocks.forEach(block=>{
              const bh = document.createElement("div");
              bh.className = "tar-bloco-head done";
              bh.innerHTML = `<span class="tar-bloco-arrow" style="visibility:hidden;">${svgIcon(ICON_D.chevronDown,13)}</span>
                <span class="tar-bloco-title" style="color:var(--muted);">${escapeHtml(block.tipo)}</span>
                <span class="tar-bloco-count">${block.items.length}</span>`;
              list.appendChild(bh);
              block.items.forEach(m=> list.appendChild(bulletCard(m, true)));
            });
          }
        }
      });
    });
    list.querySelectorAll("[data-mplay]").forEach(b=> b.onclick = () => startTarefaTimer(b.dataset.mplay));
    list.querySelectorAll("[data-mdone]").forEach(b=> b.onclick = () => {
      const m = tarefas.find(x=>x.id===b.dataset.mdone);
      if(!m) return;
      concludeTarefa(m);
      render();
    });
    list.querySelectorAll("[data-medit]").forEach(d=> d.onclick = () => {
      tarefaDraft = JSON.parse(JSON.stringify(tarefas.find(x=>x.id===d.dataset.medit)));
      goTo({ tab:"tarefas", screen:"tarefaEditor" });
    });
  }

    const el = document.createElement("div");
    el.className = "screen";
    el.innerHTML = `

        <input type="text" id="mTipoTarefa" class="mk-e-name" value="${escapeHtml(d.tipoTarefa||'')}" placeholder="Ex: Leitura, Revisão, Simulado">
        <div class="section-label">Detalhes (um por linha)</div>
        <textarea id="mDetalhes" class="mk-e-name" rows="4" placeholder="Um item por linha — vira lista com marcadores" style="line-height:1.5;">${escapeHtml(d.detalhes||'')}</textarea>

        <div class="section-label">Peso no boletim</div>
        ${tagValorPillsHtml(d.tagValor||"medio", false)}
        ${isNew?`<div class="section-label">Cópias na fila (peso)</div>
        <input type="number" id="mCopias" class="dur-input" inputmode="numeric" min="1" max="9" value="1" style="width:80px;">`:""}
        <button class="btn-primary" id="mSave" style="margin-top:10px;">${isNew?'Adicionar à fila':'Salvar'}</button>
        ${!isNew?`<button class="btn-cancel" id="mDel" style="color:var(--danger);">Excluir esta tarefa</button>`:""}
      </div>`;
    app.appendChild(el);

  let statsView = "semanal";     // semanal | mensal | anual

  function median(arr){
    if(!arr.length) return 0;
    const s = [...arr].sort((a,b)=>a-b);
    const mid = Math.floor(s.length/2);
    return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }
  function dateKey(d){ return localKey(d); }
  function startTsOf(h){ return h.ts - ((h.actualSec||0)+(h.pausedSec||0))*1000; }

  /* ---- Insights proativos: cruza o que a aba Dados já calcula separadamente
     (pontualidade, dia da semana, desvio planejado×real) em vez de deixar o
     Pedro juntar os pontos sozinho olhando três gráficos diferentes. Cada
     regra só fala se tiver pelo menos 3 execuções — abaixo disso é ruído, não
     padrão. Função pura (recebe as execuções do período, devolve texto),
     testada em test/insights.cjs. */
  function gerarInsights(rich){
    const insights = [];
    const DOW_NOME = ["domingos","segundas","terças","quartas","quintas","sextas","sábados"];

    // rotina com atraso mediano alto no início
    const porRotinaAtraso = {};
    rich.forEach(h=>{
      if(h.schedDelayMin === undefined) return;
      (porRotinaAtraso[h.routineName] = porRotinaAtraso[h.routineName] || []).push(h.schedDelayMin);
    });
    Object.entries(porRotinaAtraso).forEach(([nome, arr])=>{
      if(arr.length < 3) return;
      const med = median(arr);
      if(med > 10) insights.push(`<b>${escapeHtml(nome)}</b> atrasa em média ${Math.round(med)}min pra começar — considere mudar o horário agendado.`);
    });

    // dia da semana com atraso bem acima da mediana geral
    const comDelay = rich.filter(h=>h.schedDelayMin !== undefined);
    if(comDelay.length >= 6){
      const porDow = Array.from({length:7}, ()=>[]);
      comDelay.forEach(h=> porDow[new Date(h.ts).getDay()].push(h.schedDelayMin));
      const medGeral = median(comDelay.map(h=>h.schedDelayMin));
      let pior = null;
      porDow.forEach((arr,dow)=>{
        if(arr.length < 3) return;
        const med = median(arr);
        if(med - medGeral >= 10 && (!pior || med > pior.med)) pior = { dow, med };
      });
      if(pior) insights.push(`Você atrasa mais às <b>${DOW_NOME[pior.dow]}</b> — média de ${Math.round(pior.med)}min, contra ${Math.round(medGeral)}min nos outros dias.`);
    }

    // rotina que estoura (ou sobra folga) do tempo planejado com frequência
    const porRotinaDur = {};
    rich.forEach(h=>{
      if(!h.plannedSec) return;
      (porRotinaDur[h.routineName] = porRotinaDur[h.routineName] || []).push(h);
    });
    Object.entries(porRotinaDur).forEach(([nome, arr])=>{
      if(arr.length < 3) return;
      const med = median(arr.map(h=> (h.actualSec - h.plannedSec) / h.plannedSec));
      if(med >= 0.25) insights.push(`<b>${escapeHtml(nome)}</b> costuma estourar o tempo planejado em ${Math.round(med*100)}% — talvez valha ajustar a duração.`);
      else if(med <= -0.25) insights.push(`<b>${escapeHtml(nome)}</b> costuma terminar bem antes do planejado (${Math.round(-med*100)}% mais rápido) — talvez valha encurtar o tempo agendado.`);
    });

    // rotina cujas execuções vêm com humor sistematicamente mais baixo que a média geral
    const comMood = rich.filter(h=>h.mood != null);
    if(comMood.length >= 6){
      const medGeralMood = median(comMood.map(h=>h.mood));
      const porRotinaMood = {};
      comMood.forEach(h=>{ (porRotinaMood[h.routineName] = porRotinaMood[h.routineName] || []).push(h.mood); });
      Object.entries(porRotinaMood).forEach(([nome, arr])=>{
        if(arr.length < 3) return;
        const med = median(arr);
        if(medGeralMood - med >= 1) insights.push(`<b>${escapeHtml(nome)}</b> costuma vir com humor mais baixo (${med.toFixed(1)} contra ${medGeralMood.toFixed(1)} da média) — vale olhar se ela está pesando mais do que deveria.`);
      });
    }

    // dias de humor baixo puxam mais etapas puladas do que dias de humor alto
    const comMoodSkip = rich.filter(h=>h.mood != null && h.skippedCount != null);
    if(comMoodSkip.length >= 6){
      const baixos = comMoodSkip.filter(h=>h.mood<=2);
      const altos = comMoodSkip.filter(h=>h.mood>=4);
      if(baixos.length>=3 && altos.length>=3){
        const medBaixo = median(baixos.map(h=>h.skippedCount));
        const medAlto = median(altos.map(h=>h.skippedCount));
        if(medBaixo - medAlto >= 1) insights.push(`Em dias de humor mais baixo você costuma pular ${Math.round(medBaixo-medAlto)} etapa(s) a mais do que em dias de humor alto.`);
      }
    }

    return insights.slice(0, 5); // no máximo 5, pra não afogar a tela
  }

  /* Cache pelo tamanho de `entries`: renderWeekView/renderMonthView/renderYearView
     chamam isto com o `history` inteiro a cada visita à aba Dados, e ele só
     cresce por push() (mesma referência) — recontar do zero a cada troca de
     sub-view (semanal/mensal/anual) era um scan O(history.length) redundante e
     repetido sem necessidade. Não cachear por referência: push() não troca a
     referência do array, e é justamente o caso mais comum a invalidar. */
  let _minutesByDateCache = { len: -1, map: null };
  function minutesByDate(entries){
    if(entries === history && _minutesByDateCache.len === entries.length) return _minutesByDateCache.map;
    const map = {};
    entries.forEach(h=>{ map[h.date] = (map[h.date]||0) + Math.round((h.actualSec||0)/60); });
    if(entries === history) _minutesByDateCache = { len: entries.length, map };
    return map;
  }
  function intensityClass(min){
    if(!min) return "lv0";
    if(min < 15) return "lv1";
    if(min < 45) return "lv2";
    if(min < 90) return "lv3";
    return "lv4";
  }

  function exportStatsCsv(){
    const rich = history.filter(h=>h.ts);
    if(rich.length === 0){ showAlertBanner("Sem execuções detalhadas para exportar"); return; }
    const rows = [["data","hora","rotina","planejado_s","real_s","desvio_s","pausas","pausado_s","etapas_puladas","atraso_min","humor_1a5"]];
    rich.forEach(h=>{
      const d = new Date(h.ts);
      rows.push([
        h.date, fmtClock(d), h.routineName,
        h.plannedSec != null ? h.plannedSec : "",
        h.actualSec != null ? h.actualSec : "",
        (h.plannedSec != null && h.actualSec != null) ? (h.actualSec - h.plannedSec) : "",
        h.pauses != null ? h.pauses : 0,
        h.pausedSec != null ? h.pausedSec : 0,
        h.skippedCount != null ? h.skippedCount : 0,
        h.schedDelayMin != null ? h.schedDelayMin : "",
        h.mood != null ? h.mood : ""
      ]);
    });
    const csv = "\ufeff" + rows.map(r=>r.map(v=>String(v).replace(/;/g,",")).join(";")).join("\n");
    downloadFile("rotinas-estatisticas.csv", csv, "text/csv;charset=utf-8", "Dados");
    showAlertBanner("CSV exportado para Downloads ✓");
  }

  /* ---- painel de detalhe do dia tocado ---- */
  function dayDetailHtml(key){
    const d = new Date(key + "T12:00:00");
    const dow = d.getDay();
    const executed = history.filter(h=>h.date === key);
    const isPastOrToday = key <= dateKey(new Date());
    const planned = routines.filter(r=>r.schedule && r.schedule.enabled && r.schedule.days.includes(dow));
    let out = `<div class="section-label">${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}</div><div class="stat-card">`;
    if(executed.length === 0 && planned.length === 0){
      out += `<div class="dev-row"><span class="dev-n">Nada executado nem agendado.</span></div>`;
    } else {
      executed.forEach(h=>{
        const t = h.ts ? fmtClock(new Date(h.ts)) : "";
        const dur = h.actualSec != null ? fmtTime(h.actualSec).replace("+","") : "";
        out += `<div class="dev-row"><span>${svgIcon(ICON_D.check,14)} ${escapeHtml(h.routineName)}</span><span class="dev-n">${dur}</span><span class="dev-n">${t}</span></div>`;
      });
      planned.forEach(r=>{
        const done = executed.some(h=>h.routineId === r.id);
        if(done) return;
        if(r.createdAt && d.getTime() < new Date(new Date(r.createdAt).setHours(0,0,0,0)).getTime()) return; // antes da criação
        if(snoozedOn(d)) return; // agenda pausada nesse dia
        const sched = computeSchedule(r);
        const status = isPastOrToday && key < dateKey(new Date()) ? '<b class="late">não feita</b>' : '<span class="dev-n">agendada</span>';
        out += `<div class="dev-row"><span>&#9675; ${escapeHtml(r.name)}</span><span class="dev-n">${sched?sched.startStr:""}</span>${status}</div>`;
      });
    }
    return out + `</div>`;
  }

  /* ---- heatmap estilo GitHub ---- */
  function heatmapHtml(fromDate, toDate, byDate){
    // alinhar início ao dia configurado como começo da semana
    const start = isoToDate(inicioSemanaISO(fromDate)); start.setHours(12,0,0,0);
    const end = new Date(toDate); end.setHours(12,0,0,0);
    const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    let cols = "", monthLabels = "";
    let cur = new Date(start);
    let lastMonth = -1;
    while(cur <= end){
      let colCells = "";
      const weekStartMonth = cur.getMonth();
      for(let dow=0; dow<7; dow++){
        const key = dateKey(cur);
        const inRange = cur >= fromDate && cur <= toDate;
        const min = byDate[key] || 0;
        colCells += inRange
          ? `<span class="hm-cell ${intensityClass(min)} ${key===selectedDay?'hm-sel':''}" data-day="${key}" title="${key}: ${min}min"></span>`
          : `<span class="hm-cell hm-void"></span>`;
        cur.setDate(cur.getDate()+1);
      }
      monthLabels += `<span class="hm-mlabel">${weekStartMonth !== lastMonth ? MONTHS[weekStartMonth] : ""}</span>`;
      lastMonth = weekStartMonth;
      cols += `<div class="hm-col">${colCells}</div>`;
    }
    return `<div class="hm-scroll"><div class="hm-months">${monthLabels}</div><div class="hm-grid">${cols}</div></div>
      <div class="hm-legend"><span>menos</span><span class="hm-cell lv0"></span><span class="hm-cell lv1"></span><span class="hm-cell lv2"></span><span class="hm-cell lv3"></span><span class="hm-cell lv4"></span><span>mais</span></div>`;
  }

  function wireHeatmapTaps(container, rerender){
    container.querySelectorAll("[data-day]").forEach(cell=>{
      cell.onclick = () => { selectedDay = selectedDay === cell.dataset.day ? null : cell.dataset.day; rerender(); };
    });
  }

  function renderStats(){
    const el = document.createElement("div");
    el.className = "screen with-tabbar";
    /* Cabeçalho e navegação ficam DENTRO da área que rola (em #statsHead, um
       irmão do conteúdo): fixados no topo eles comiam a altura útil da tela.
       O conteúdo mora em #statsBody porque as seções são montadas com
       `innerHTML +=` — se o cabeçalho estivesse no mesmo nó, cada seção nova
       recriaria os botões e derrubaria os handlers. */
    const scroll = document.createElement("div");
    scroll.style.cssText = "overflow-y:auto; flex:1; min-height:0;";
    scroll.innerHTML = `
      <div id="statsHead">
        <div class="home-header">
          <h1>Dados</h1>
          <div class="header-right">
            <button class="bell-btn" id="statsBackupBtn" title="Exportar backup completo" aria-label="Exportar backup completo">${svgIcon(ICON_D.arrowDownTray,14)}</button>
            <button class="bell-btn" id="statsImportBtn" title="Importar backup" aria-label="Importar backup">${svgIcon(ICON_D.arrowUpTray,14)}</button>
            <input type="file" id="statsImportFile" accept="application/json" style="display:none">
            <button class="bell-btn" id="csvBtn" title="Exportar CSV" aria-label="Exportar CSV" style="width:auto; padding:0 10px; font-size:12px; font-family:'Inter', sans-serif;">CSV</button>
            ${cfgBtnHtml()}
          </div>
        </div>
        ${rodaVidaResumoHtml()}
        <div class="stats-nav">
          <div class="type-toggle view-toggle">
            <span data-sview="semanal" class="${statsView==='semanal'?'active':''}">semanal</span>
            <span data-sview="mensal" class="${statsView==='mensal'?'active':''}">mensal</span>
            <span data-sview="anual" class="${statsView==='anual'?'active':''}">anual</span>
          </div>
        </div>
      </div>
      <div id="statsBody"></div>
    `;
    el.appendChild(scroll);
    const body = scroll.querySelector("#statsBody");
    el.appendChild(renderTabbar("stats"));
    app.appendChild(el);
    wireCfgBtn(el);

    document.getElementById("csvBtn").onclick = exportStatsCsv;
    document.getElementById("statsBackupBtn").onclick = exportBackup;
    const statsImpFile = document.getElementById("statsImportFile");
    document.getElementById("statsImportBtn").onclick = () => statsImpFile.click();
    statsImpFile.onchange = e => { if(e.target.files && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=""; } };
    el.querySelectorAll("[data-sview]").forEach(sp=> sp.onclick = () => { statsView = sp.dataset.sview; selectedDay = null; render(); });

    if(history.length === 0 && tarefasHist.length === 0){
      body.innerHTML = `<div class="empty-state" style="min-height:50vh;"><h2>Sem dados ainda</h2><p>Conclua rotinas para ver seu histórico, desvios de tempo e pontualidade aqui.</p></div>`;
      return;
    }

    if(statsView === "mensal"){ renderMonthView(body); return; }
    if(statsView === "anual"){ renderYearView(body); return; }
    renderTarefasResumo(body);
    if(history.length) renderWeekView(body);
  }

  /* ============ RESUMO DAS TAREFAS (fila 🍱) ============ */
  function renderTarefasResumo(body){
    if(tarefasHist.length === 0) return;
    const now = Date.now();
    const d7 = now - 7*86400000, d30 = now - 30*86400000;
    const last7 = tarefasHist.filter(h=>h.ts>=d7);
    const last30 = tarefasHist.filter(h=>h.ts>=d30);
    const min7 = last7.reduce((a,h)=>a+(h.dur||0),0);
    let rows = "";
    EIXOS.forEach(ex=>{
      const n7 = last7.filter(h=>h.eixo===ex.id).length;
      const n30 = last30.filter(h=>h.eixo===ex.id).length;
      if(n30===0) return;
      const pct = last7.length ? Math.round(n7/Math.max(1,last7.length)*100) : 0;
      rows += `<div class="bar-row"><div class="bar-name" style="color:${ex.color};">${ex.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,pct)}%; background:${ex.color};"></div></div><div class="bar-val">${n7} / 7d · ${n30} / 30d</div></div>`;
    });
    body.innerHTML += `<div class="section-label">Tarefas ${svgIcon(ICON_D.bars3,15)}</div>
      <div class="stat-card">${rows || '<div class="dev-n">sem conclusões nos últimos 30 dias</div>'}
      <div class="stat-foot">${last7.length} tarefa(s) e ${min7} min na última semana · ${tarefasHist.length} no total</div></div>`;
  }

  /* ============ VISÃO RESUMO ============ */
  /* ============ SEÇÕES DE PERÍODO (mensal = 30d, anual = ano) ============
     Era o conteúdo da antiga aba "resumo" quando o period-toggle estava em
     30d/ano — cada aba embute agora a sua janela fixa, sem seletor visível.
     Tudo aqui respeita statsRoutineFilter (dropdown logo acima, abaixo do
     calendário/heatmap daquela aba). */
  function renderPeriodExtras(period){
    // As ~9 seções abaixo eram concatenadas com body.innerHTML += cada uma —
    // cada += reserializa e reparseia TODO o HTML já acumulado, custo O(n²)
    // no número de seções. Um array + 1 innerHTML no final evita isso.
    const partes = [];
    const rich = richParaPeriodo(period);
    const allRich = statsRoutineFiltered(history.filter(h=>h.ts));
    const periodLbl = period === "30d" ? "30d" : "ano";

    /* --- insights: cruza pontualidade × dia da semana × desvio de duração --- */
    const insights = gerarInsights(rich);
    if(insights.length){
      partes.push(`<div class="section-label">Insights (${periodLbl})</div><div class="stat-card">
        ${insights.map((txt,i)=>`<div style="display:flex; align-items:flex-start; gap:8px; ${i?'margin-top:10px; padding-top:10px; border-top:1px solid var(--line);':''}"><span style="flex:0 0 auto; color:var(--accent); margin-top:1px;">${svgIcon(ICON_D.exclamationTriangle,14)}</span><span class="routine-meta" style="font-size:13.5px; color:var(--text);">${txt}</span></div>`).join("")}
      </div>`);
    }

    /* --- metas: semana-calendário (janela configurada) com pró-rata --- */
    const weekStart = isoToDate(inicioSemanaISO(new Date()));
    const elapsedDays = Math.min(7, Math.floor((Date.now() - weekStart.getTime())/86400000) + 1);
    const weekEntries = statsRoutineFiltered(history.filter(h=>h.ts && h.ts >= weekStart.getTime()));
    const goalRoutines = routines.filter(r=>r.weeklyGoalTimes > 0 && (!statsRoutineFilter || r.id===statsRoutineFilter));
    if(goalRoutines.length){
      let goalsHtml = goalRoutines.map(r=>{
        const doneCount = weekEntries.filter(h=>h.routineId===r.id).length;
        const pct = Math.min(100, Math.round(doneCount / r.weeklyGoalTimes * 100));
        const expCount = r.weeklyGoalTimes * elapsedDays / 7;
        const expPct = Math.min(100, Math.round(expCount / r.weeklyGoalTimes * 100));
        const onPace = doneCount >= expCount;
        return `
        <div class="bar-row tappable" data-rstats="${r.id}">
          <div class="bar-name">${r.icon?escapeHtml(r.icon)+" ":""}${escapeHtml(r.name)}</div>
          <div class="bar-track goal-track"><div class="bar-fill" style="width:${Math.max(3,pct)}%; background:${fillStyle(corDaRotina(r))}"></div><span class="goal-marker" style="left:${expPct}%"></span></div>
          <div class="bar-val ${onPace?'early':'late'}" style="color:${onPace?'var(--good)':'var(--danger)'}">${doneCount}/${r.weeklyGoalTimes}x</div>
        </div>`;
      }).join("");
      partes.push(`<div class="section-label">Metas da semana (${janelaSemanaLabel()}) · | = esperado até hoje</div><div class="stat-card">${goalsHtml}</div>`);
    }

    /* --- distribuição por dia da semana, empilhada por rotina --- */
    const DOWL = ["D","S","T","Q","Q","S","S"];
    const dowStack = Array.from({length:7}, ()=> ({}));
    rich.forEach(h=>{
      const dow = new Date(h.ts).getDay();
      dowStack[dow][h.routineId] = (dowStack[dow][h.routineId]||0) + (h.actualSec||0);
    });
    const dowTotals = dowStack.map(o=>Object.values(o).reduce((a,b)=>a+b,0));
    const maxDow = Math.max(...dowTotals, 1);
    if(dowTotals.some(t=>t>0)){
      // colunas na ordem do dia de início configurado, não sempre domingo primeiro
      let stackHtml = `<div class="stack-chart">` + ordemDiasSemana().map(dow=>{
        const o = dowStack[dow];
        const segs = Object.entries(o).map(([rid,sec])=>{
          const r = routines.find(x=>x.id===rid);
          const h = Math.max(2, sec/maxDow*80);
          return `<div class="stack-seg" style="height:${h}px; background:${solidColor(corDaRotina(r))}" title="${r?escapeHtml(r.name):''}: ${Math.round(sec/60)}min"></div>`;
        }).join("");
        return `<div class="stack-col"><span class="trend-val">${dowTotals[dow]?Math.round(dowTotals[dow]/60)+"m":""}</span><div class="stack-bars">${segs}</div><span class="trend-lbl">${DOWL[dow]}</span></div>`;
      }).join("") + `</div>`;
      partes.push(`<div class="section-label">Por dia da semana (${periodLbl})</div><div class="stat-card">${stackHtml}</div>`);
    }

    /* --- histograma de horário de início --- */
    const hourCounts = new Array(24).fill(0);
    rich.forEach(h=>{ hourCounts[new Date(startTsOf(h)).getHours()]++; });
    const maxHour = Math.max(...hourCounts, 1);
    if(hourCounts.some(c=>c>0)){
      let hHtml = `<div class="hour-chart">` + hourCounts.map((c,hh)=>{
        const bh = c ? Math.max(3, c/maxHour*54) : 0;
        return `<div class="hour-col">${hh%3===0?`<span class="trend-lbl">${hh}h</span>`:'<span class="trend-lbl"></span>'}<div class="hour-bar-area"><div class="hour-bar" style="height:${bh}px"></div></div></div>`;
      }).join("") + `</div>`;
      partes.push(`<div class="section-label">Horário real de início (${periodLbl})</div><div class="stat-card">${hHtml}</div>`);
    }

    /* --- taxa de cumprimento do agendado --- */
    const startPer = period === "30d" ? Date.now() - 30*86400000 : Date.now() - 365*86400000;
    const schedRoutines = routines.filter(r=>r.schedule && r.schedule.enabled && (!statsRoutineFilter || r.id===statsRoutineFilter));
    if(schedRoutines.length){
      let compHtml = schedRoutines.map(r=>{
        let plannedDays = 0, doneDays = 0;
        const effStart = Math.max(startPer, r.createdAt || 0);
        const d = new Date(effStart); d.setHours(12,0,0,0);
        const today = new Date(); today.setHours(12,0,0,0);
        const doneSet = new Set(history.filter(h=>h.routineId===r.id).map(h=>h.date));
        let guard = 0;
        while(d <= today && guard++ < 400){
          if(r.schedule.days.includes(d.getDay()) && !snoozedOn(d)){
            plannedDays++;
            if(doneSet.has(dateKey(d))) doneDays++;
          }
          d.setDate(d.getDate()+1);
        }
        if(plannedDays === 0) return "";
        const pct = Math.round(doneDays/plannedDays*100);
        const cls = pct >= 80 ? "early" : (pct >= 50 ? "ontime" : "late");
        return `<div class="dev-row tappable" data-rstats="${r.id}"><span>${r.icon?escapeHtml(r.icon)+" ":""}${escapeHtml(r.name)}</span><b class="${cls}">${pct}%</b><span class="dev-n">${doneDays}/${plannedDays} dias</span></div>`;
      }).join("");
      if(compHtml) partes.push(`<div class="section-label">Cumprimento do agendado (${periodLbl})</div><div class="stat-card">${compHtml}</div>`);
    }

    /* --- sequências por rotina --- */
    const streakRoutines = statsRoutineFilter ? routines.filter(r=>r.id===statsRoutineFilter) : routines;
    const streakRows = streakRoutines.map(r=>({id:r.id, name:r.name, icon:r.icon, s:computeStreakFor(r.id)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    if(streakRows.length){
      let sHtml = streakRows.map(x=>`<div class="dev-row tappable" data-rstats="${x.id}"><span>${x.icon?escapeHtml(x.icon)+" ":""}${escapeHtml(x.name)}</span><b class="ontime">${x.s} dia${x.s>1?'s':''}</b></div>`).join("");
      partes.push(`<div class="section-label">Sequências por rotina</div><div class="stat-card">${sHtml}</div>`);
    }

    /* --- pontualidade --- */
    const punc = rich.filter(h=>h.schedDelayMin !== undefined);
    if(punc.length){
      const byR = {};
      punc.forEach(h=>{ (byR[h.routineName] = byR[h.routineName]||[]).push(h.schedDelayMin); });
      let puncHtml = Object.entries(byR).map(([name,arr])=>{
        const med = Math.round(median(arr));
        const cls = med > 5 ? "late" : (med < -5 ? "early" : "ontime");
        const label = fmtMinLabel(med);
        return `<div class="dev-row"><span>${escapeHtml(name)}</span><b class="${cls}">${label}</b><span class="dev-n">${arr.length}x</span></div>`;
      }).join("");
      partes.push(`<div class="section-label">Pontualidade mediana (${periodLbl})</div><div class="stat-card">${puncHtml}</div>`);
    }

    /* --- tendência 8 semanas com n --- */
    function weekKey(ts){
      return isoToDate(inicioSemanaISO(new Date(ts))).getTime();
    }
    const now8 = weekKey(Date.now());
    const weeks = [];
    for(let w=7; w>=0; w--) weeks.push(now8 - w*7*86400000);
    const devByWeek = {}, delayByWeek = {};
    allRich.forEach(h=>{
      const wk = weekKey(h.ts);
      if(h.plannedSec) (devByWeek[wk] = devByWeek[wk]||[]).push((h.actualSec - h.plannedSec)/60);
      if(h.schedDelayMin !== undefined) (delayByWeek[wk] = delayByWeek[wk]||[]).push(h.schedDelayMin);
    });
    function trendBars(byWeek, unit){
      const buckets = weeks.map(wk => byWeek[wk] || null);
      const vals = buckets.map(b => b ? median(b) : null);
      const maxAbs = Math.max(1, ...vals.filter(v=>v!==null).map(v=>Math.abs(v)));
      return `<div class="trend-chart">` + vals.map((v,i)=>{
        const d = new Date(weeks[i]);
        const lbl = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
        if(v === null) return `<div class="trend-col"><div class="trend-bar-area"></div><span class="trend-lbl">${lbl}</span></div>`;
        const h = Math.max(6, Math.abs(v)/maxAbs*46);
        const cls = v > 0.5 ? "late" : (v < -0.5 ? "early" : "ontime");
        const valLbl = (v>=0?"+":"&minus;") + Math.abs(v).toFixed(1).replace(".",",");
        return `<div class="trend-col"><div class="trend-bar-area"><span class="trend-val">${valLbl}</span><div class="trend-bar ${cls}" style="height:${h}px"></div></div><span class="trend-lbl">${lbl}</span></div>`;
      }).join("") + `</div><div class="stat-foot">${unit} · mediana semanal</div>`;
    }
    if(Object.keys(delayByWeek).length){
      partes.push(`<div class="section-label">Tendência da pontualidade (8 semanas)</div><div class="stat-card">${trendBars(delayByWeek, "minutos de atraso no início")}</div>`);
    }

    /* --- execuções recentes --- */
    const recent = [...rich].sort((a,b)=>b.ts-a.ts).slice(0,8);
    if(recent.length){
      let recHtml = recent.map(h=>{
        const d = new Date(h.ts);
        const dateStr = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
        const timeStr = fmtClock(d);
        const plannedStr = h.plannedSec ? fmtTime(h.plannedSec).replace("+","") : "—";
        const actualStr = fmtTime(h.actualSec||0).replace("+","");
        const cls = h.plannedSec ? (h.actualSec > h.plannedSec ? "late" : (h.actualSec < h.plannedSec ? "early" : "ontime")) : "";
        // nome em cima, dados da execução na linha de baixo — o nome da rotina
        // costuma ser longo e brigava por espaço com os números na mesma linha
        return `<div class="dev-row exec-row"><span class="exec-name">${escapeHtml(h.routineName)}</span><span class="dev-n">${dateStr} · ${timeStr} | <b>${plannedStr}</b> &rarr; <b class="${cls}">${actualStr}</b></span></div>`;
      }).join("");
      partes.push(`<div class="section-label">Execuções recentes (${periodLbl})</div><div class="stat-card">${recHtml}</div>`);
    }

    return partes;
  }
  function wirePeriodExtras(body){
    body.querySelectorAll("[data-rstats]").forEach(row=>{
      row.onclick = () => { goTo({ tab:"stats", screen:"routineStats", id: row.dataset.rstats }); };
    });
  }

  /* ============ VISÃO SEMANAL ============ */
  function renderWeekView(body){
    const weekStart = isoToDate(inicioSemanaISO(calWeek));
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
    const todayK = dateKey(new Date());
    const DOWL = ["D","S","T","Q","Q","S","S"];
    const fmtDM = d => String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");

    let nav = `
      <div class="cal-nav">
        <button class="bell-btn" id="prevWeek">&lsaquo;</button>
        <span class="cal-title">${fmtDM(weekStart)} &ndash; ${fmtDM(weekEnd)}</span>
        <button class="bell-btn" id="nextWeek">&rsaquo;</button>
      </div>`;

    // colunas na ordem do dia de início configurado, mesmo padrão do mensal
    let grid = `<div class="mcal-grid">` + ordemDiasSemana().map(dow=>`<span class="mcal-dowlbl">${DOWL[dow]}</span>`).join("");
    let plannedTotal = 0, doneTotal = 0, missedTotal = 0;
    for(let i=0; i<7; i++){
      const d = new Date(weekStart); d.setDate(d.getDate()+i); d.setHours(12,0,0,0);
      const key = dateKey(d);
      const dow = d.getDay();
      const executed = history.filter(h=>h.date === key);
      const execIds = new Set(executed.map(h=>h.routineId));
      const planned = routines.filter(r=>{
        if(!(r.schedule && r.schedule.enabled && r.schedule.days.includes(dow))) return false;
        if(r.createdAt && d.getTime() < new Date(new Date(r.createdAt).setHours(0,0,0,0)).getTime()) return false;
        if(snoozedOn(d)) return false;
        return true;
      });
      const isPast = key < todayK;
      const missed = isPast ? planned.filter(r=>!execIds.has(r.id)).length : 0;
      if(isPast || key === todayK){ plannedTotal += planned.length; doneTotal += planned.filter(r=>execIds.has(r.id)).length; missedTotal += missed; }

      let dots = [...execIds].slice(0,3).map(id=>{
        const r = routines.find(x=>x.id===id);
        return `<span class="mcal-dot" style="background:${solidColor(corDaRotina(r))}"></span>`;
      }).join("");
      if(executed.length > 0 && execIds.size === 0) dots = `<span class="mcal-dot" style="background:var(--muted)"></span>`;

      grid += `<span class="mcal-cell ${key===todayK?'mcal-today':''} ${key===selectedDay?'mcal-sel':''}" data-day="${key}">
        <span class="mcal-num">${d.getDate()}</span>
        <span class="mcal-dots">${dots}</span>
        ${missed>0?`<span class="mcal-missed">${missed}</span>`:""}
      </span>`;
    }
    grid += `</div>`;

    const rate = plannedTotal > 0 ? Math.round(doneTotal/plannedTotal*100) : null;
    const partes = [nav, `<div class="stat-card">${grid}
      <div class="stat-foot">&#9679; executada &nbsp; <span class="late" style="font-weight:600;">n</span> agendadas não feitas${rate!==null?` &nbsp;·&nbsp; cumprimento da semana: ${rate}% (${doneTotal}/${plannedTotal})`:""}</div></div>`];
    partes.push(routineFilterSelectHtml());
    if(selectedDay) partes.push(dayDetailHtml(selectedDay));
    partes.push(`<div style="height:20px"></div>`);
    // += (não =): renderTarefasResumo já pode ter escrito na mesma `body` antes.
    body.innerHTML += partes.join("");

    document.getElementById("prevWeek").onclick = () => { calWeek = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()-7); selectedDay = null; render(); };
    document.getElementById("nextWeek").onclick = () => { calWeek = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()+7); selectedDay = null; render(); };
    wireRoutineFilterSelect(body);
    body.querySelectorAll("[data-day]").forEach(cell=>{
      cell.onclick = () => { selectedDay = selectedDay === cell.dataset.day ? null : cell.dataset.day; render(); };
    });
  }

  /* ============ VISÃO MENSAL ============ */
  function renderMonthView(body){
    const MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const y = calMonth.getFullYear(), mo = calMonth.getMonth();
    const first = new Date(y, mo, 1, 12);
    const daysInMonth = new Date(y, mo+1, 0).getDate();
    const todayK = dateKey(new Date());
    const byDate = minutesByDate(history);

    let nav = `
      <div class="cal-nav">
        <button class="bell-btn" id="prevMonth">&lsaquo;</button>
        <span class="cal-title">${MONTH_NAMES[mo]} ${y}</span>
        <button class="bell-btn" id="nextMonth">&rsaquo;</button>
      </div>`;

    const DOWL = ["D","S","T","Q","Q","S","S"];
    // colunas na ordem do dia de início configurado, e o padding do 1º dia do
    // mês acompanha a mesma ordem (senão a grade destoaria do cabeçalho)
    let grid = `<div class="mcal-grid">` + ordemDiasSemana().map(dow=>`<span class="mcal-dowlbl">${DOWL[dow]}</span>`).join("");
    for(let b=0; b<offsetSemana(first.getDay()); b++) grid += `<span class="mcal-cell mcal-void"></span>`;

    let plannedTotal = 0, doneTotal = 0, missedTotal = 0;
    for(let day=1; day<=daysInMonth; day++){
      const d = new Date(y, mo, day, 12);
      const key = dateKey(d);
      const dow = d.getDay();
      const executed = history.filter(h=>h.date === key);
      const execIds = new Set(executed.map(h=>h.routineId));
      const planned = routines.filter(r=>{
        if(!(r.schedule && r.schedule.enabled && r.schedule.days.includes(dow))) return false;
        if(r.createdAt && d.getTime() < new Date(new Date(r.createdAt).setHours(0,0,0,0)).getTime()) return false;
        if(snoozedOn(d)) return false;
        return true;
      });
      const isPast = key < todayK;
      const missed = isPast ? planned.filter(r=>!execIds.has(r.id)).length : 0;
      if(isPast || key === todayK){ plannedTotal += planned.length; doneTotal += planned.filter(r=>execIds.has(r.id)).length; missedTotal += missed; }

      let dots = [...execIds].slice(0,3).map(id=>{
        const r = routines.find(x=>x.id===id);
        return `<span class="mcal-dot" style="background:${solidColor(corDaRotina(r))}"></span>`;
      }).join("");
      if(executed.length > 0 && execIds.size === 0) dots = `<span class="mcal-dot" style="background:var(--muted)"></span>`;

      grid += `<span class="mcal-cell ${key===todayK?'mcal-today':''} ${key===selectedDay?'mcal-sel':''}" data-day="${key}">
        <span class="mcal-num">${day}</span>
        <span class="mcal-dots">${dots}</span>
        ${missed>0?`<span class="mcal-missed">${missed}</span>`:""}
      </span>`;
    }
    grid += `</div>`;

    const rate = plannedTotal > 0 ? Math.round(doneTotal/plannedTotal*100) : null;
    const partes = [nav, `<div class="stat-card">${grid}
      <div class="stat-foot">&#9679; executada &nbsp; <span class="late" style="font-weight:600;">n</span> agendadas não feitas${rate!==null?` &nbsp;·&nbsp; cumprimento do mês: ${rate}% (${doneTotal}/${plannedTotal})`:""}</div></div>`];
    partes.push(routineFilterSelectHtml());
    if(selectedDay) partes.push(dayDetailHtml(selectedDay));
    partes.push(...renderPeriodExtras("30d"));
    partes.push(`<div style="height:20px"></div>`);
    body.innerHTML = partes.join("");

    document.getElementById("prevMonth").onclick = () => { calMonth = new Date(y, mo-1, 1); selectedDay = null; render(); };
    document.getElementById("nextMonth").onclick = () => { calMonth = new Date(y, mo+1, 1); selectedDay = null; render(); };
    wireRoutineFilterSelect(body);
    wirePeriodExtras(body);
    body.querySelectorAll("[data-day]").forEach(cell=>{
      cell.onclick = () => { selectedDay = selectedDay === cell.dataset.day ? null : cell.dataset.day; render(); };
    });
  }

  /* ============ VISÃO ANUAL ============ */
  function renderYearView(body){
    const byDateAll = minutesByDate(history);
    let nav = `
      <div class="cal-nav">
        <button class="bell-btn" id="prevYear">&lsaquo;</button>
        <span class="cal-title">${calYear}</span>
        <button class="bell-btn" id="nextYear">&rsaquo;</button>
      </div>`;

    const from = new Date(calYear, 0, 1, 12);
    const to = calYear === new Date().getFullYear() ? new Date() : new Date(calYear, 11, 31, 12);
    to.setHours(12,0,0,0);

    const partes = [nav, `<div class="stat-card" id="yearHm">${heatmapHtml(from, to, byDateAll)}</div>`];
    partes.push(routineFilterSelectHtml());
    if(selectedDay) partes.push(dayDetailHtml(selectedDay));

    /* horas por mês — abaixo do dropdown, então já respeita statsRoutineFilter */
    const MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    const monthMin = new Array(12).fill(0);
    statsRoutineFiltered(history).forEach(h=>{
      if(!h.date.startsWith(String(calYear))) return;
      monthMin[+h.date.slice(5,7)-1] += Math.round((h.actualSec||0)/60);
    });
    const totalYear = monthMin.reduce((a,b)=>a+b,0);
    if(totalYear > 0){
      const maxM = Math.max(...monthMin, 1);
      let mHtml = monthMin.map((min,i)=>`
        <div class="bar-row">
          <div class="bar-name">${MONTHS[i]}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${min?Math.max(3,min/maxM*100):0}%"></div></div>
          <div class="bar-val">${min>=60 ? (min/60).toFixed(1).replace(".",",")+"h" : min+"m"}</div>
        </div>`).join("");
      partes.push(`<div class="section-label">Tempo por mês · total ${(totalYear/60).toFixed(1).replace(".",",")}h</div><div class="stat-card">${mHtml}</div>`);
    } else {
      partes.push(`<div class="stat-card"><div class="dev-n">Sem execuções em ${calYear}.</div></div>`);
    }
    partes.push(...renderPeriodExtras("ano"));
    partes.push(`<div style="height:20px"></div>`);
    body.innerHTML = partes.join("");

    document.getElementById("prevYear").onclick = () => { calYear--; selectedDay = null; render(); };
    document.getElementById("nextYear").onclick = () => { calYear++; selectedDay = null; render(); };
    wireHeatmapTaps(body, render);
    wireRoutineFilterSelect(body);
    wirePeriodExtras(body);
  }

  /* ============ DETALHE POR ROTINA ============ */
  function renderRoutineStats(){
    const r = routines.find(x=>x.id===view.id);
    const el = document.createElement("div");
    el.className = "screen";
    if(!r){
      el.innerHTML = `<div class="topbar"><button class="link-btn muted" id="backStats">&larr; Dados</button></div><div class="empty-state"><h2>Rotina não encontrada</h2></div>`;
      app.appendChild(el);
      document.getElementById("backStats").onclick = () => { goTo({tab:"stats",screen:"stats"}); };
      return;
    }
    el.innerHTML = `
      <div class="topbar">
        <button class="link-btn muted" id="backStats">&larr; Dados</button>
        <span class="section-label" style="margin:0;">${r.icon?escapeHtml(r.icon)+" ":""}${escapeHtml(r.name)}</span>
      </div>`;
    const body = document.createElement("div");
    body.style.cssText = "overflow-y:auto; flex:1; padding-bottom:20px;";
    el.appendChild(body);
    app.appendChild(el);
    document.getElementById("backStats").onclick = () => { goTo({tab:"stats",screen:"stats"}); };

    const entries = history.filter(h=>h.routineId===r.id && h.ts);
    const all = history.filter(h=>h.routineId===r.id);
    if(all.length === 0){
      body.innerHTML = `<div class="empty-state" style="min-height:40vh;"><h2>Sem execuções</h2><p>Conclua esta rotina para gerar dados.</p></div>`;
      return;
    }
    // mesma lógica de renderResumo: array + 1 innerHTML no fim em vez de várias
    // concatenações — cada += reparseia o HTML já acumulado (O(n²)).
    const partes = [];

    /* resumo */
    const totalMin = Math.round(entries.reduce((a,h)=>a+(h.actualSec||0),0)/60);
    const devs = entries.filter(h=>h.plannedSec).map(h=>h.actualSec-h.plannedSec);
    const delays = entries.filter(h=>h.schedDelayMin!==undefined).map(h=>h.schedDelayMin);
    const fmtS = v => (v>=0?"+":"&minus;") + fmtTime(Math.abs(v)).replace("+","");
    partes.push(`<div class="section-label">Resumo geral</div><div class="stat-card">
      <div class="dev-row"><span>Execuções</span><b class="ontime">${all.length}</b></div>
      <div class="dev-row"><span>Tempo total registrado</span><b class="ontime">${totalMin>=60?(totalMin/60).toFixed(1).replace(".",",")+"h":totalMin+"min"}</b></div>
      <div class="dev-row"><span>Sequência atual</span><b class="ontime">${computeStreakFor(r.id)} dia(s)</b></div>
      ${devs.length?`<div class="dev-row"><span>Desvio mediano</span><b class="${median(devs)>30?'late':median(devs)<-30?'early':'ontime'}">${fmtS(Math.round(median(devs)))}</b><span class="dev-n">${devs.length}x</span></div>`:""}
      ${(()=>{ const moods = entries.filter(h=>h.mood).map(h=>h.mood); if(!moods.length) return ""; const m = Math.round(median(moods)); return `<div class="dev-row"><span>Humor mediano</span><b class="ontime">${["&#9733;&#9734;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9733;"][m-1]}</b><span class="dev-n">${moods.length}x</span></div>`; })()}
      ${delays.length?`<div class="dev-row"><span>Atraso mediano no início</span><b class="${median(delays)>5?'late':'ontime'}">${Math.round(median(delays))}min</b><span class="dev-n">${delays.length}x</span></div>`:""}
    </div>`);

    /* análise por etapa */
    const stepAgg = {};
    entries.forEach(h=> (h.steps||[]).forEach(s=>{
      if(s.isRest || s.skipped || s.planned == null) return;
      const base = s.name.replace(/ · volta \d+\/\d+$/,"");
      const a = stepAgg[base] = stepAgg[base] || {n:0, acts:[], plan:s.planned};
      a.n++; a.acts.push(s.actual); a.plan = s.planned;
    }));
    const stepRows = Object.entries(stepAgg)
      .map(([name,a])=>({name, n:a.n, medAct: Math.round(median(a.acts)), plan:a.plan}))
      .map(s=>Object.assign(s, {medDev: s.medAct - s.plan}))
      .sort((a,b)=>b.medDev-a.medDev);
    if(stepRows.length){
      let sHtml = stepRows.map((s,si)=>{
        const cls = s.medDev > 15 ? "late" : (s.medDev < -15 ? "early" : "ontime");
        // sugerir ajuste: n>=3 e desvio mediano >= 30s e >= 20% do planejado
        const suggest = s.n >= 3 && Math.abs(s.medDev) >= 30 && Math.abs(s.medDev) >= s.plan*0.2
          && r.steps.some(st=>st.name===s.name && st.type==="timer");
        return `<div class="dev-row"><span>${escapeHtml(s.name)}</span><b class="${cls}">${fmtS(s.medDev)}</b><span class="dev-n">${fmtTime(s.plan).replace("+","")}&rarr;${fmtTime(s.medAct).replace("+","")} · ${s.n}x</span></div>
        ${suggest ? `<div class="suggest-row"><span class="dev-n">A mediana real é ${fmtTime(s.medAct).replace("+","")}.</span><button class="suggest-btn" data-adjust="${si}">ajustar para ${Math.ceil(s.medAct/30)*30/60 % 1 === 0 ? (Math.ceil(s.medAct/30)*30/60)+"min" : fmtTime(Math.ceil(s.medAct/30)*30).replace("+","")}</button></div>` : ""}`;
      }).join("");
      partes.push(`<div class="section-label">Por etapa (desvio mediano)</div><div class="stat-card">${sHtml}</div>`);

      /* Duração planejada x real, média e mediana lado a lado. Aqui o sinal é
         planejado &minus; real (o oposto do desvio acima): positivo = sobrou
         tempo, negativo = a etapa estourou o planejado. */
      const durRows = Object.entries(stepAgg).map(([name,a])=>{
        const soma = a.acts.reduce((s,v)=>s+v, 0);
        const media = soma / a.acts.length;
        return {
          name, n: a.n, plan: a.plan,
          difMedia: a.plan - media,
          difMediana: a.plan - median(a.acts)
        };
      }).sort((x,y)=> x.difMedia - y.difMedia); // quem mais estoura primeiro
      const clsDif = v => v < -15 ? "late" : (v > 15 ? "early" : "ontime");
      const dHtml = durRows.map(s=>`
        <div class="dev-row">
          <span>${escapeHtml(s.name)}</span>
          <b class="${clsDif(s.difMedia)}">${fmtS(Math.round(s.difMedia))}</b>
          <b class="${clsDif(s.difMediana)}">${fmtS(Math.round(s.difMediana))}</b>
        </div>`).join("");
      partes.push(`<div class="section-label">Planejado &minus; real (média · mediana)</div>
        <div class="stat-card">
          <div class="dev-row dev-head"><span>tarefa</span><b>média</b><b>mediana</b></div>
          ${dHtml}
          <div class="stat-foot">Positivo sobrou tempo, negativo estourou o planejado.</div>
        </div>`);
    }

    /* carga por exercício: maior peso e volume (reps×carga) por sessão, ao
       longo do histórico desta rotina — mesma fonte (h.steps) do bloco acima,
       só que agrupado por exercicioId em vez de nome da etapa. */
    const exAgg = {};
    entries.forEach(h=> (h.steps||[]).forEach(s=>{
      if(!s.exercicioId || !s.series || !s.series.length) return;
      const a = exAgg[s.exercicioId] = exAgg[s.exercicioId] || { nome:s.name, sessions:[] };
      const maxPeso = Math.max(0, ...s.series.map(x=>x.peso||0));
      a.sessions.push({ ts:h.ts, maxPeso });
    }));
    const exRows = Object.values(exAgg).filter(a=>a.sessions.length);
    if(exRows.length){
      const dmy = ts => { const d=new Date(ts); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); };
      let exHtml = exRows.map(a=>{
        const ord = a.sessions.slice().sort((x,y)=>x.ts-y.ts);
        const ultima = ord[ord.length-1], primeira = ord[0];
        const evolucao = ultima.maxPeso - primeira.maxPeso;
        const evoTxt = ord.length>1 ? `<span class="dev-n">${evolucao>=0?'+':'&minus;'}${Math.abs(evolucao)}kg desde ${dmy(primeira.ts)}</span>` : "";
        const serie = ord.slice(-8).map(s=>s.maxPeso+"kg").join(" &rarr; ");
        return `<div class="dev-row"><span>${escapeHtml(a.nome)}</span><b class="ontime">${ultima.maxPeso}kg</b><span class="dev-n">${a.sessions.length}x</span></div>
          <div class="suggest-row"><span class="dev-n">${serie}</span>${evoTxt}</div>`;
      }).join("");
      partes.push(`<div class="section-label">Carga por exercício</div><div class="stat-card">${exHtml}</div>`);
    }

    /* horário de início desta rotina */
    const hourCounts = new Array(24).fill(0);
    entries.forEach(h=>{ hourCounts[new Date(startTsOf(h)).getHours()]++; });
    if(hourCounts.some(c=>c>0)){
      const maxHour = Math.max(...hourCounts, 1);
      let hHtml = `<div class="hour-chart">` + hourCounts.map((c,hh)=>{
        const bh = c ? Math.max(3, c/maxHour*54) : 0;
        return `<div class="hour-col">${hh%3===0?`<span class="trend-lbl">${hh}h</span>`:'<span class="trend-lbl"></span>'}<div class="hour-bar-area"><div class="hour-bar" style="height:${bh}px; ${c?`background:${fillStyle(corDaRotina(r))};`:""}"></div></div></div>`;
      }).join("") + `</div>`;
      partes.push(`<div class="section-label">Horário real de início</div><div class="stat-card">${hHtml}</div>`);
    }

    /* execuções */
    const recent = [...entries].sort((a,b)=>b.ts-a.ts).slice(0,15);
    if(recent.length){
      let recHtml = recent.map(h=>{
        const d = new Date(h.ts);
        const dateStr = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + " " + fmtClock(d);
        const cmp = h.plannedSec ? `${fmtTime(h.plannedSec).replace("+","")} &rarr; ${fmtTime(h.actualSec).replace("+","")}` : fmtTime(h.actualSec||0).replace("+","");
        const mood = h.mood ? ["&#9733;&#9734;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9733;"][h.mood-1] : "";
        return `<div class="dev-row"><span class="dev-n">${dateStr}</span><span class="dev-n">${cmp} ${mood}</span><button class="del-exec" data-delexec="${h.ts}">${svgIcon(ICON_D.xmark,14)}</button></div>`;
      }).join("");
      partes.push(`<div class="section-label">Últimas execuções · ${svgIcon(ICON_D.xmark,14)} apaga o registro</div><div class="stat-card">${recHtml}</div>`);
    }

    body.innerHTML = partes.join("");

    // religados aqui fora (não logo após cada seção): agora que tudo entra
    // num só innerHTML no fim, os elementos só existem na DOM depois dele.
    body.querySelectorAll("[data-adjust]").forEach(b=>{
      b.onclick = () => {
        const s = stepRows[+b.dataset.adjust];
        const newSec = Math.ceil(s.medAct/30)*30;
        confirmModal("Ajustar a etapa <b>"+escapeHtml(s.name)+"</b> de "+fmtTime(s.plan).replace("+","")+" para "+fmtTime(newSec).replace("+","")+"?", "Ajustar", ()=>{
          r.steps.forEach(st=>{ if(st.name===s.name && st.type==="timer") st.seconds = newSec; });
          save(K_ROUTINES, routines);
          showAlertBanner("Etapa ajustada ✓");
          render();
        });
      };
    });
    body.querySelectorAll("[data-delexec]").forEach(b=>{
      b.onclick = () => {
        confirmModal("Apagar este registro de execução?<br><small>Ele sai de todas as estatísticas.</small>", "Apagar", ()=>{
          history = history.filter(h=>String(h.ts) !== b.dataset.delexec);
          save(K_HISTORY, history);
          render();
        });
      };
    });
  }

  /* ================= MODELOS ================= */
  const K_MKFREQ = "rotinas_v2_mkfreq";
  let mkFreq = load(K_MKFREQ, {});

  const GROCERY_DB = {
    "Hortifrúti": ["banana","maçã","laranja","limão","mamão","abacate","manga","uva","tomate","cebola","alho","batata","batata doce","cenoura","abobrinha","abóbora","chuchu","pimentão","alface","couve","brócolis","espinafre","coentro","cebolinha","salsinha","gengibre","aipim","macaxeira","inhame","pepino","beterraba","repolho","quiabo","maracujá","melancia","abacaxi"],
