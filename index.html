  /* ================= PLAYER ================= */
  function expandSteps(r, visited){
    visited = visited || new Set();
    if(visited.has(r.id)) return [];
    visited.add(r.id);
    let out = [];
    r.steps.forEach(s=>{
      if(s.type==="routine"){
        const ref = routines.find(x=>x.id===s.refId);
        if(ref) out = out.concat(expandSteps(ref, visited));
      } else {
        out.push(Object.assign({}, s));
      }
    });
    return out;
  }
  function applyCycle(base, cycle){
    if(!cycle || !cycle.enabled || cycle.times < 2) return base;
    const from = Math.max(1, cycle.from) - 1;
    const to = Math.min(base.length, cycle.to) - 1;
    if(from > to || from >= base.length) return base;
    const block = base.slice(from, to+1);
    const out = base.slice(0, from);
    for(let k=1; k<=cycle.times; k++){
      block.forEach(s=>{
        const c = Object.assign({}, s);
        c.id = s.id + "-c" + k;
        if(cycle.times > 1) c.name = s.name + " · volta " + k + "/" + cycle.times;
        out.push(c);
      });
    }
    return out.concat(base.slice(to+1));
  }
  function playbackSteps(r){
    let base = expandSteps(r);
    base = applyCycle(base, r.cycle);
    const rest = r.restSeconds || 0;
    if(!rest || base.length < 2) return base;
    const out = [];
    base.forEach((s,i)=>{
      out.push(s);
      if(i < base.length-1) out.push({ id:"rest-"+i, name:"Descanso", type:"timer", seconds:rest, isRest:true });
    });
    return out;
  }
  /* Depois de filtrar etapas, os descansos podem ter sobrado nas pontas ou
     grudado um no outro: mantém no máximo um descanso entre duas tarefas. */
  function podarDescansos(steps){
    const out = [];
    steps.forEach(s=>{
      if(s.isRest && (!out.length || out[out.length-1].isRest)) return;
      out.push(s);
    });
    while(out.length && out[out.length-1].isRest) out.pop();
    return out;
  }
  function currentStep(){ return playerState.steps[playerState.idx]; }

  /* ---- Etapas marcadas como "não feita" (repescagem do dia) ----
     Uma etapa pode ser encerrada sem concluir e sem pontuar. Ela fica anotada
     como pendente do dia; reabrir a rotina hoje traz só as pendentes. Vira o
     dia, o registro é descartado — a repescagem não atravessa a meia-noite.
     As voltas do ciclo (`-c1`, `-c2`...) compartilham o id base da etapa. */
  let naoFeitas = load(K_NAOFEITAS, {});
  function idBaseEtapa(id){ return String(id||"").replace(/-c\d+$/, ""); }
  (function podarNaoFeitasDeOutrosDias(){
    const hoje = localKey();
    let mudou = false;
    Object.keys(naoFeitas).forEach(rid=>{
      const rec = naoFeitas[rid];
      if(!rec || rec.date !== hoje || !(rec.ids||[]).length){ delete naoFeitas[rid]; mudou = true; }
    });
    if(mudou) save(K_NAOFEITAS, naoFeitas);
  })();
  function naoFeitasDe(routineId){
    const rec = naoFeitas[routineId];
    return (rec && rec.date === localKey()) ? (rec.ids || []) : [];
  }
  function marcarNaoFeita(routineId, stepId){
    const hoje = localKey();
    const rec = (naoFeitas[routineId] && naoFeitas[routineId].date === hoje)
      ? naoFeitas[routineId] : { date: hoje, ids: [] };
    const bid = idBaseEtapa(stepId);
    if(!rec.ids.includes(bid)) rec.ids.push(bid);
    naoFeitas[routineId] = rec;
    save(K_NAOFEITAS, naoFeitas);
  }
  function limparNaoFeita(routineId, stepId){
    const rec = naoFeitas[routineId];
    if(!rec || rec.date !== localKey()) return;
    const i = rec.ids.indexOf(idBaseEtapa(stepId));
    if(i === -1) return;
    rec.ids.splice(i, 1);
    if(!rec.ids.length) delete naoFeitas[routineId];
    save(K_NAOFEITAS, naoFeitas);
  }

  /* ---- Wake Lock ---- */
  let wakeLock = null;
  async function acquireWakeLock(){
    try{ if("wakeLock" in navigator){ wakeLock = await navigator.wakeLock.request("screen"); } }catch(e){ wakeLock = null; }
  }
  function releaseWakeLock(){
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  }

  /* ---- Persistência do estado de execução ---- */
  let lastSnapTs = 0;
  function savePlayerSnapshot(force){
    if(!playerState) return;
    const now = Date.now();
    if(!force && now - lastSnapTs < 5000) return;
    lastSnapTs = now;
    const p = playerState;
    save(K_PLAYER, {
      routineId:p.routine.id, steps:p.steps, idx:p.idx,
      stepEndTs:p.stepEndTs, stepStart:p.stepStart,
      paused:p.paused, pausedAt:p.pausedAt, pauseCount:p.pauseCount, pausedTotalMs:p.pausedTotalMs,
      startedAt:p.startedAt, schedStartMin:p.schedStartMin, actualStartMin:p.actualStartMin,
      stepActuals:p.stepActuals, overtimeCueFired:p.overtimeCueFired, journalTexts:p.journalTexts,
      pontosGanhos:p.pontosGanhos || 0, ex:p.ex || null
    });
  }
  function clearPlayerSnapshot(){ try{ removeKey(K_PLAYER); }catch(e){} }
  function getPlayerSnapshot(){ return load(K_PLAYER, null); }

  function computeRemaining(){
    const step = currentStep();
    if(step.type !== "timer" || !playerState.stepEndTs) return 0;
    const ref = (playerState.paused && playerState.pausedAt) ? playerState.pausedAt : Date.now();
    return Math.round((playerState.stepEndTs - ref)/1000);
  }

  /* ---- Etapa "exercicio": sub-loop de séries dentro de uma única etapa ---- */
  function freshExState(){ return { setIdx:0, phase:"set", results:[], restEndTs:null }; }
  function parseRepsRange(reps){
    const m = String(reps||"").match(/(\d+)\s*-\s*(\d+)/);
    if(m) return { min:+m[1], max:+m[2] };
    const n = parseInt(reps, 10);
    return { min: n||0, max: n||0 };
  }

  function startPlayer(id){
    const r = routines.find(x=>x.id===id);
    if(!r) return;
    let steps = playbackSteps(r);
    if(steps.length === 0) return;
    // repescagem: se hoje alguma etapa ficou como "não feita", a rotina volta
    // só com as pendentes
    const pendentes = naoFeitasDe(r.id);
    let repescagem = false;
    if(pendentes.length){
      const filtrados = podarDescansos(steps.filter(s => s.isRest || pendentes.includes(idBaseEtapa(s.id))));
      if(filtrados.some(s => !s.isRest)){ steps = filtrados; repescagem = true; }
    }
    const now = new Date();
    let schedStartMin = null;
    const sched = computeSchedule(r);
    if(sched && (!r.schedule.days || r.schedule.days.includes(now.getDay()))) schedStartMin = sched.startMin;
    const first = steps[0];
    playerState = {
      routine: r, steps, idx: 0,
      paused:false, pausedAt:null, pauseCount:0, pausedTotalMs:0,
      overtimeCueFired:false, zen:false,
      stepStart: Date.now(),
      stepEndTs: first.type==="timer" ? Date.now() + first.seconds*1000 : null,
      ex: first.type==="exercicio" ? freshExState() : null,
      stepActuals: [], startedAt: Date.now(),
      schedStartMin, actualStartMin: now.getHours()*60 + now.getMinutes(),
      journalTexts: {}, pontosGanhos: 0
    };
    goTo({ tab:"home", screen:"player" });
    acquireWakeLock();
    savePlayerSnapshot(true);
    if(first.type==="timer") startTicking();
    sincronizarPlayerBackground();
    if(repescagem){
      const n = steps.filter(s=>!s.isRest).length;
      showAlertBanner("Repescagem: só " + n + " etapa" + (n>1?"s":"") + " não feita" + (n>1?"s":"") + " de hoje");
    }
  }

  function resumePlayer(){
    const snap = getPlayerSnapshot();
    if(!snap) return;
    const r = routines.find(x=>x.id===snap.routineId);
    if(!r){ clearPlayerSnapshot(); render(); return; }
    playerState = Object.assign({ zen:false }, snap, { routine:r });
    if(!playerState.journalTexts) playerState.journalTexts = {};
    pushView({ tab:"home", screen:"player" });
    catchUpSteps();
    if(view.screen !== "player") return; // terminou durante o catch-up
    render();
    acquireWakeLock();
    if(currentStep().type==="timer" && !playerState.paused) startTicking();
    if(currentStep().type==="exercicio" && playerState.ex && playerState.ex.phase==="rest" && !playerState.paused) startExRestTicking();
    sincronizarPlayerBackground();
  }

  function clearTicking(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

  /* Timer de descanso entre séries — independente do ticking genérico de etapa
     (que só se aplica a step.type==="timer"), pois o "tempo" aqui é interno à
     etapa de exercício e não avança o índice da etapa sozinho. */
  let exRestHandle = null;
  function clearExRestTicking(){ if(exRestHandle){ clearInterval(exRestHandle); exRestHandle=null; } }
  function updateExRestDisplay(){
    if(!playerState || !playerState.ex || playerState.ex.phase !== "rest") return;
    const rem = Math.max(0, Math.round((playerState.ex.restEndTs - Date.now())/1000));
    document.querySelectorAll(".ex-rest-time").forEach(t=> t.textContent = fmtTime(rem));
  }
  function startExRestTicking(){
    clearExRestTicking();
    exRestHandle = setInterval(()=>{
      if(!playerState || playerState.paused) return;
      if(!playerState.ex || playerState.ex.phase !== "rest"){ clearExRestTicking(); return; }
      const rem = Math.round((playerState.ex.restEndTs - Date.now())/1000);
      if(rem <= 0){
        clearExRestTicking();
        timeUpCue();
        playerState.ex.phase = "set";
        playerState.ex.restEndTs = null;
        render();
        savePlayerSnapshot(true);
        return;
      }
      updateExRestDisplay();
    }, 1000);
  }
  function concluirSerieExercicio(reps, peso){
    const step = currentStep();
    if(step.type !== "exercicio" || !playerState.ex || playerState.ex.phase !== "set") return;
    const pesoUsado = Math.max(0, +peso||0);
    playerState.ex.results.push({ reps: Math.max(0, Math.round(+reps||0)), peso: pesoUsado });
    // a carga digitada vira a nova predefinição do exercício — sem isso o
    // campo "kg" ficava travado no valor antigo e tinha que ser redigitado a
    // cada série/execução; o "Aplicar" da sugestão de progressão continua
    // existindo à parte para o salto de +2,5kg ao bater o topo da faixa
    if(pesoUsado > 0 && step.exercicioId){
      const ex = exercicios.find(x=>x.id===step.exercicioId);
      if(ex && ex.pesoAtual !== pesoUsado){ ex.pesoAtual = pesoUsado; saveExercicios(); }
    }
    const isLast = playerState.ex.setIdx >= (step.sets||1) - 1;
    if(isLast){ advanceStep(false); return; }
    playerState.ex.setIdx += 1;
    playerState.ex.phase = "rest";
    playerState.ex.restEndTs = Date.now() + (playerState.routine.restSeconds || 120)*1000;
    stepTransitionCue();
    render();
    savePlayerSnapshot(true);
    startExRestTicking();
  }
  function pularDescansoExercicio(){
    if(!playerState || !playerState.ex || playerState.ex.phase !== "rest") return;
    clearExRestTicking();
    playerState.ex.phase = "set";
    playerState.ex.restEndTs = null;
    render();
    savePlayerSnapshot(true);
  }

  function startTicking(){
    clearTicking();
    timerHandle = setInterval(()=>{
      if(playerState.paused) return;
      const step = currentStep();
      if(step.type !== "timer") return;
      const rem = computeRemaining();
      const manual = !step.isRest;
      if(rem <= 0 && !manual){ advanceStep(false); return; }
      if(rem <= 0 && manual && !playerState.overtimeCueFired){ timeUpCue(); playerState.overtimeCueFired = true; }
      updateTicker();
      savePlayerSnapshot();
    }, 1000);
  }

  /* Consome etapas que expiraram enquanto o app estava fechado/oculto */
  function catchUpSteps(){
    let guard = 0;
    while(guard++ < 100){
      const step = currentStep();
      if(step.type !== "timer" || playerState.paused) return;
      const manual = !step.isRest;
      const rem = Math.round((playerState.stepEndTs - Date.now())/1000);
      if(rem > 0 || manual) return;
      const caughtUp = {
        id: step.id, tag: stepTagEfetiva(step, playerState.routine),
        name: step.name, isRest: !!step.isRest, planned: step.seconds,
        actual: Math.round((playerState.stepEndTs - playerState.stepStart)/1000), skipped:false
      };
      playerState.stepActuals[playerState.idx] = caughtUp;
      pontuarEtapaConcluida(caughtUp);
      if(playerState.idx >= playerState.steps.length - 1){
        clearTicking(); finishCue(); finishRoutine(); return;
      }
      playerState.idx += 1;
      playerState.overtimeCueFired = false;
      const ns = currentStep();
      playerState.stepStart = playerState.stepEndTs;
      playerState.stepEndTs = ns.type==="timer" ? playerState.stepStart + ns.seconds*1000 : null;
      playerState.ex = ns.type==="exercicio" ? freshExState() : null;
      if(ns.type !== "timer"){ clearTicking(); savePlayerSnapshot(true); return; }
    }
  }

  function togglePause(){
    if(!playerState.paused){
      playerState.paused = true;
      playerState.pausedAt = Date.now();
      playerState.pauseCount += 1;
    } else {
      const delta = Date.now() - playerState.pausedAt;
      playerState.pausedTotalMs += delta;
      if(playerState.stepEndTs) playerState.stepEndTs += delta;
      if(playerState.ex && playerState.ex.restEndTs) playerState.ex.restEndTs += delta;
      playerState.stepStart += delta;
      playerState.paused = false;
      playerState.pausedAt = null;
    }
    savePlayerSnapshot(true);
    sincronizarPlayerBackground();
    render();
  }

  function endPauseIfAny(){
    if(playerState.paused && playerState.pausedAt){
      const delta = Date.now() - playerState.pausedAt;
      playerState.pausedTotalMs += delta;
      playerState.paused = false;
      playerState.pausedAt = null;
    }
  }

  /* Pontua a etapa no instante em que ela é concluída — e não em lote no fim da
     rotina — para que sair no meio preserve o que já foi feito (plano §3.4) e
     para que um encerramento abrupto do app não perca os pontos. */
  function pontuarEtapaConcluida(actual){
    if(!actual || actual.skipped || actual.isRest || !actual.planned) return;
    const g = registrarConclusao("step", {
      routineId: playerState.routine.id, stepId: actual.id,
      tag: actual.tag, minutos: actual.planned/60,
      area: areaDaRotina(playerState.routine),
      rotulo: playerState.routine.name
    });
    if(g){
      actual.gamItemId = g.itemId;
      playerState.pontosGanhos = (playerState.pontosGanhos || 0) + g.pontos;
    }
  }

  /* Sugestão de progressão de carga: se a execução atual e a anterior (já no
     histórico) bateram o topo da faixa de reps em TODAS as séries planejadas,
     sugere subir 2,5kg no pesoAtual do exercício na biblioteca. Não aplica
     nada sozinho — só um toast com um botão "Aplicar". */
  function sugerirProgressaoExercicio(actual){
    if(!actual || !actual.exercicioId || !actual.series || !actual.series.length) return;
    const range = parseRepsRange(currentStep().reps);
    const alvo = range.max || range.min || 0;
    if(!alvo) return;
    const bateuTopo = (series, setsPlanejados) => series.length >= (setsPlanejados||1) && series.every(s => s.reps >= alvo);
    if(!bateuTopo(actual.series, actual.setsPlanejados)) return;
    let anterior = null;
    for(let i=history.length-1; i>=0 && !anterior; i--){
      const s = (history[i].steps||[]).find(s=> s.exercicioId === actual.exercicioId);
      if(s) anterior = s;
    }
    if(!anterior || !bateuTopo(anterior.series||[], anterior.setsPlanejados)) return;
    const ex = exercicios.find(x=>x.id===actual.exercicioId);
    if(!ex) return;
    const sugestao = Math.round((ex.pesoAtual + 2.5)*2)/2;
    mostrarSugestaoProgressao(ex, sugestao);
  }
  function mostrarSugestaoProgressao(ex, sugestao){
    const banner = document.createElement("div");
    banner.className = "alert-banner undo-banner";
    banner.innerHTML = `<span>${escapeHtml(ex.nome)} bateu o topo da faixa de novo — subir para ${sugestao}kg?</span><button class="undo-btn" id="aplicarProgressao">Aplicar</button>`;
    document.body.appendChild(banner);
    banner.querySelector("#aplicarProgressao").onclick = () => {
      ex.pesoAtual = sugestao;
      saveExercicios();
      banner.remove();
      showAlertBanner("Carga de " + ex.nome + " atualizada para " + sugestao + "kg ✓");
    };
    attachSwipeDismiss(banner, ()=>{});
  }

  function recordStepActual(skipped, naoFeita){
    const step = currentStep();
    const endRef = (playerState.paused && playerState.pausedAt) ? playerState.pausedAt : Date.now();
    const elapsed = Math.round((endRef - playerState.stepStart)/1000);
    let actual;
    if(step.type === "exercicio"){
      /* Pontuação proporcional a séries COMPLETAS, não a tempo gasto: cada série
         "vale" o descanso planejado, então planned/actual em segundos reaproveita
         pesoBruto/pontuarEtapaConcluida sem nenhuma fórmula de pontuação nova. */
      const results = (playerState.ex && playerState.ex.results) || [];
      const rest = playerState.routine.restSeconds || 120;
      actual = {
        id: step.id, tag: stepTagEfetiva(step, playerState.routine),
        name: step.name, isRest: false,
        planned: (step.sets||1) * rest,
        actual: skipped ? 0 : results.length * rest,
        skipped: !!skipped, naoFeita: !!naoFeita,
        exercicioId: step.exercicioId, series: results, setsPlanejados: step.sets
      };
    } else {
      actual = {
        id: step.id, tag: stepTagEfetiva(step, playerState.routine),
        name: step.name, isRest: !!step.isRest,
        planned: step.type==="timer" ? step.seconds : null,
        actual: skipped ? 0 : elapsed,
        skipped: !!skipped, naoFeita: !!naoFeita
      };
    }
    playerState.stepActuals[playerState.idx] = actual;
    // concluir de verdade tira a etapa da repescagem do dia
    if(!skipped && !step.isRest) limparNaoFeita(playerState.routine.id, step.id);
    pontuarEtapaConcluida(actual);
    if(step.type === "exercicio" && !skipped) sugerirProgressaoExercicio(actual);
  }

  function advanceStep(skipped, naoFeita){
    recordStepActual(skipped, naoFeita);
    endPauseIfAny();
    clearExRestTicking();
    if(playerState.idx >= playerState.steps.length - 1){
      clearTicking(); finishCue(); finishRoutine(); return;
    }
    stepTransitionCue();
    playerState.idx += 1;
    playerState.overtimeCueFired = false;
    playerState.stepStart = Date.now();
    const step = currentStep();
    playerState.stepEndTs = step.type==="timer" ? Date.now() + step.seconds*1000 : null;
    playerState.ex = step.type==="exercicio" ? freshExState() : null;
    render();
    savePlayerSnapshot(true);
    if(step.type==="timer") startTicking(); else clearTicking();
    sincronizarPlayerBackground();
  }

  /* "Não fazer": encerra a etapa sem concluir e sem pontuar, e a deixa anotada
     como pendente do dia — reabrir a rotina hoje traz só as pendentes. Existe
     para qualquer etapa, opcional ou não; diferente de "pular etapa
     (opcional)", que descarta a etapa de vez, sem repescagem. */
  function naoFazerEtapa(){
    const step = currentStep();
    if(step.isRest) return;
    marcarNaoFeita(playerState.routine.id, step.id);
    const nome = step.name;
    advanceStep(true, true);
    showAlertBanner("“" + nome + "” ficou como não feita — refaça hoje pela rotina");
  }

  /* Adia a etapa atual: ela troca de lugar com a próxima e passa a ser executada
     depois dela. Não conclui nem pontua nada — diferente de "pular etapa
     (opcional)", que descarta a etapa de vez. */
  /* Painel com TODAS as etapas da rotina em andamento. Reordenar só é liberado
     da etapa atual para a frente: `stepActuals` é indexado por posição e as
     posições já executadas guardam o que de fato aconteceu — mexer nelas
     reescreveria o histórico. É a mesma invariante que `adiarEtapa` usa. */
  /* Nota anexada à rotina (r.notaId). Devolve null se a nota foi apagada —
     o id fica órfão de propósito, sem migração: some o botão e pronto. */
  function notaDaRotina(r){
    if(!r || !r.notaId) return null;
    return notes.find(n => n.id === r.notaId) || null;
  }
  /* Popup de leitura da nota anexada, por cima do player: a rotina continua
     rodando atrás (o timer não é interrompido, nada de navegação). Abre em
     modo leitura, com markdown renderizado e checklist clicável; o lápis troca
     para uma textarea. É textarea, e não o editor contínuo, pela mesma razão
     das anotações de journaling: só existe uma instância de liveCtx por vez e
     ela pertence ao Diário/Notas. */
  function openPlayerNotaOverlay(){
    const nota = notaDaRotina(playerState && playerState.routine);
    if(!nota){ showAlertBanner("Nenhuma nota anexada a esta rotina"); return; }
    let editando = false;
    const ov = document.createElement("div");
    ov.className = "confirm-overlay search-overlay";
    document.body.appendChild(ov);
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    const chaveToggle = "rotnota:" + nota.id;

    function paint(){
      ov.innerHTML = `<div class="confirm-box search-box nota-rot-box" style="text-align:left;">
        <div class="nota-rot-top">
          <span class="nota-rot-titulo">${escapeHtml(nota.title || "(sem título)")}</span>
          <button class="icon-btn" id="nrEdit" title="${editando?'Ver formatado':'Editar'}" aria-label="${editando?'Ver formatado':'Editar'}">${editando?svgIcon(ICON_D.eye,15):svgIcon(ICON_D.notes,14)}</button>
          <button class="icon-btn" id="nrClose" title="Fechar" aria-label="Fechar">${svgIcon(ICON_D.xmark,14)}</button>
        </div>
        <div class="nota-rot-corpo">${editando
          ? `<textarea class="mk-e-name nota-rot-ta" id="nrTa" placeholder="Escreva em markdown…">${escapeHtml(nota.content||"")}</textarea>`
          : renderMdBlock(nota.content, chaveToggle, "Nota vazia — toque no lápis para escrever.")}</div>
      </div>`;
      ov.querySelector("#nrClose").onclick = () => ov.remove();
      ov.querySelector("#nrEdit").onclick = () => {
        if(editando) salvar();
        editando = !editando;
        paint();
      };
      if(editando){
        const ta = ov.querySelector("#nrTa");
        autoGrowTextarea(ta);
        ta.oninput = e => { autoGrowTextarea(ta, e); salvar(); };
        ta.focus();
      } else {
        // checklist e toggle funcionam direto na leitura, como no card da meta
        ov.querySelectorAll("[data-ovcheck]").forEach(box=>{
          box.onclick = () => {
            nota.content = toggleCheckLineInText(nota.content || "", +box.dataset.ovcheck);
            nota.updatedAt = Date.now(); save(K_NOTES, notes);
            paint();
          };
        });
        ov.querySelectorAll("[data-ovtoggle]").forEach(sp=>{
          sp.onclick = () => { flipToggle(chaveToggle, +sp.dataset.ovtoggle); paint(); };
        });
      }
    }
    function salvar(){
      const ta = ov.querySelector("#nrTa");
      if(!ta) return;
      nota.content = ta.value;
      nota.updatedAt = Date.now();
      save(K_NOTES, notes);
    }
    paint();
  }

  function openPlayerStepsOverlay(){
    const ov = document.createElement("div");
    ov.className = "confirm-overlay search-overlay";
    document.body.appendChild(ov);
    ov.onclick = e => { if(e.target===ov) fechar(); };
    function fechar(){ ov.remove(); }

    function commitMover(){
      render();                 // o player fica atrás do overlay e precisa acompanhar
      savePlayerSnapshot(true);
      sincronizarPlayerBackground();     // a bolha nativa consome a fila das próximas etapas
      pintar();
    }

    function pintar(){
      // pintar() troca o innerHTML inteiro do overlay a cada mover(): sem
      // guardar/restaurar o scroll da lista, o popup voltava pro topo a
      // cada subir/descer, já que o novo nó nasce com scrollTop 0.
      const listaAntiga = ov.querySelector(".pl-steps");
      const scrollAnterior = listaAntiga ? listaAntiga.scrollTop : 0;
      const steps = playerState.steps;
      const idx = playerState.idx;
      /* Pausas e voltas repetidas de ciclo só atrapalham a decisão de ordem —
         quem decide a ordem quer ver as tarefas base. Agrupa cada tarefa com a
         pausa que vem logo depois dela (bloco contíguo, sempre movido junto —
         é o que preserva o padrão tarefa→pausa ao reordenar) e esconde: (1)
         pausas, que nunca aparecem como linha própria; (2) voltas de ciclo
         além da primeira ocorrência de cada id-base (`-c<n>`). */
      const grupos = [];
      for(let i=0; i<steps.length; i++){
        if(steps[i].isRest) continue; // absorvida pelo grupo anterior
        const reais = [i];
        if(steps[i+1] && steps[i+1].isRest) reais.push(i+1);
        grupos.push({ reais, objs: reais.map(k=>steps[k]), s: steps[i] });
      }
      const vistos = new Set();
      grupos.forEach(g=>{
        const baseId = g.s.id.replace(/-c\d+$/, "");
        g.visivel = !vistos.has(baseId);
        vistos.add(baseId);
        g.nome = g.s.name.replace(/\s*·\s*volta\s+\d+\/\d+$/, "");
      });
      const grupoAtual = grupos.findIndex(g => g.reais.includes(idx));

      function mover(gi, alvoGi){
        if(alvoGi < 0 || alvoGi >= grupos.length) return;
        const tmp = grupos[gi]; grupos[gi] = grupos[alvoGi]; grupos[alvoGi] = tmp;
        playerState.steps = grupos.reduce((acc,g)=>acc.concat(g.objs), []);
        commitMover();
      }

      const linhas = grupos.map((g,gi)=>{
        if(!g.visivel) return "";
        const primeiraReal = g.reais[0];
        const estado = gi < grupoAtual ? "feita" : (gi === grupoAtual ? "atual" : "futura");
        const podeSubir = gi > grupoAtual + 1;           // não passa por cima da etapa atual
        const podeDescer = gi > grupoAtual && gi < grupos.length - 1;
        const s = g.s;
        const dur = s.type === "timer" ? fmtTime(s.seconds) : (s.type === "exercicio" ? (s.sets||1)+"x"+(s.reps||"") : "livre");
        return `<div class="pl-step ${estado}">
          <span class="pl-step-i">${estado==="feita" ? svgIcon(ICON_D.check,14) : primeiraReal+1}</span>
          <span class="pl-step-nome">${escapeHtml(g.nome)}</span>
          <span class="pl-step-dur">${dur}</span>
          <span class="pl-step-moves">

  function adiarEtapa(){
    const i = playerState.idx;
    if(i >= playerState.steps.length - 1){ showAlertBanner("Não há próxima etapa para adiar"); return; }
    // stepActuals não precisa de ajuste: da posição atual em diante ainda está vazio
    const [adiada] = playerState.steps.splice(i, 1);
    playerState.steps.splice(i+1, 0, adiada);
    endPauseIfAny();
    playerState.overtimeCueFired = false;
    playerState.stepStart = Date.now();
    const s = currentStep();
    playerState.stepEndTs = s.type==="timer" ? Date.now() + s.seconds*1000 : null;
    render();
    savePlayerSnapshot(true);
    if(s.type==="timer") startTicking(); else clearTicking();
    sincronizarPlayerBackground();
    showAlertBanner("“"+adiada.name+"” vem depois de “"+s.name+"”");
  }

  function goPrevStep(){
    if(playerState.idx<=0) return;
    endPauseIfAny();
    playerState.idx -= 1;
    playerState.overtimeCueFired = false;
    playerState.stepStart = Date.now();
    // voltar desfaz a etapa: estorna os pontos para ela poder ser refeita ou pulada
    const desfeita = playerState.stepActuals[playerState.idx];
    // voltar numa etapa marcada como não feita também apaga a anotação da repescagem
    if(desfeita && desfeita.naoFeita) limparNaoFeita(playerState.routine.id, desfeita.id);
    if(desfeita && desfeita.gamItemId){
      const c = gam.semanaAtual.concluidos.find(x=>x.itemId===desfeita.gamItemId);
      if(c) playerState.pontosGanhos = Math.max(0, (playerState.pontosGanhos||0) - c.pontos);
      desfazerConclusao(desfeita.gamItemId);
    }
    playerState.stepActuals[playerState.idx] = undefined;
    const s = currentStep();
    playerState.stepEndTs = s.type==="timer" ? Date.now() + s.seconds*1000 : null;
    render();
    savePlayerSnapshot(true);
    if(s.type==="timer") startTicking(); else clearTicking();
    sincronizarPlayerBackground();
  }

  function finishRoutine(){
    releaseWakeLock();
    pararOverlay();
    clearPlayerSnapshot();
    const now = new Date();
    const stepsDone = playerState.stepActuals.filter(Boolean);
    const skippedPlanned = stepsDone.filter(a=>a.skipped && a.planned).reduce((s,a)=>s+a.planned,0);
    const restRotina = playerState.routine.restSeconds || 120;
    const totalPlanned = playerState.steps.reduce((a,s)=> a + (s.type==="timer"?s.seconds:(s.type==="exercicio"?(s.sets||1)*restRotina:0)), 0);
    const plannedSec = totalPlanned - skippedPlanned;
    const grossSec = Math.round((Date.now() - playerState.startedAt)/1000);
    const actualSec = Math.max(0, grossSec - Math.round(playerState.pausedTotalMs/1000));
    const entry = {
      date: localKey(now),
      ts: Date.now(),
      routineId: playerState.routine.id,
      routineName: playerState.routine.name,
      plannedSec, actualSec,
      pauses: playerState.pauseCount,
      pausedSec: Math.round(playerState.pausedTotalMs/1000),
      skippedCount: stepsDone.filter(a=>a.skipped).length,
      steps: stepsDone
    };
    if(playerState.schedStartMin !== null && playerState.schedStartMin !== undefined){
      let delay = playerState.actualStartMin - playerState.schedStartMin;
      if(delay > 720) delay -= 1440; if(delay < -720) delay += 1440;
      entry.schedDelayMin = delay;
    }
    history.push(entry);
    save(K_HISTORY, history);

    // os pontos já foram creditados etapa a etapa (pontuarEtapaConcluida)
    ultimosPontosGanhos = playerState.pontosGanhos || 0;

    const journalSteps = (playerState.steps||[]).filter(s=> s.journaling && !s.isRest && (playerState.journalTexts[s.id]||"").trim());
    if(journalSteps.length){
      const routineId = playerState.routine.id, routineName = playerState.routine.name;
      const journalDoc = {
        id: uid(), type:"journal", updatedAt: Date.now(), createdAt: Date.now(),
        routineId, routineName,
        title: routineName + " — " + entry.date,
        executedAt: Date.now(),
        sections: journalSteps.map(s => ({ taskName: s.name, text: playerState.journalTexts[s.id] }))
      };
      templates.push(journalDoc);
      save(K_TEMPLATES, templates);
      syncDocMd(journalDoc);
    }

    // sem isso, sincronizarOverlay() ainda enxergava a última etapa desta
    // rotina como "atual" e religava a bolha ao sair do app depois de concluir
    playerState = null;
    goTo({ tab:"home", screen:"done" });
  }

  function updateTicker(){
    const step = currentStep();
    const rem = computeRemaining();
    const timeEls = document.querySelectorAll(".dial-time .t, .zen-time");
    const dialWrap = document.querySelector(".dial-wrap");
    const arc = document.getElementById("dialArc");
    timeEls.forEach(t=>{
      t.textContent = fmtTime(rem);
      t.classList.toggle("overtime", rem < 0);
    });
    if(dialWrap) dialWrap.classList.toggle("overtime", rem < 0);
    if(arc && step.type==="timer"){
      const frac = Math.max(rem,0) / step.seconds;
      const circumference = 2*Math.PI*116;
      arc.style.strokeDashoffset = circumference * frac;
    }
    const segs = document.querySelectorAll(".stepper-track .seg");
    if(segs[playerState.idx] && step.type==="timer"){
      const fill = segs[playerState.idx].querySelector(".fill");
      if(fill){ const doneFrac = 1 - (Math.max(rem,0) / step.seconds); fill.style.width = (doneFrac*100)+"%"; }
    }
    const nextBtn = document.getElementById("nextStep");
    if(nextBtn) nextBtn.classList.toggle("pulse", rem < 0);
    updateEstimate();
  }

  function updateEstimate(){
    const el = document.getElementById("estimateTime");
    if(!el) return;
    const step = currentStep();
    let currentRemaining = step.type==="timer" ? Math.max(computeRemaining(),0) : 0;
    let future = 0;
    for(let i=playerState.idx+1;i<playerState.steps.length;i++){
      const fs = playerState.steps[i];
      if(fs.type==="timer") future += fs.seconds;
      else if(fs.type==="exercicio") future += (fs.sets||1) * (playerState.routine.restSeconds || 120);
    }
    const finish = new Date(Date.now() + (currentRemaining+future)*1000);
    el.textContent = fmtClock(finish);
  }

    if(step.isRest) return "";
    return `<button class="skip-btn" id="undoneStep" title="Encerrar sem concluir e sem pontuar">não fazer</button>`;

    const un = scope.querySelector("#undoneStep"); if(un) un.onclick = naoFazerEtapa;

  function renderDone(){

    if(last && last.plannedSec){
      const diff = last.actualSec - last.plannedSec;
      const sign = diff >= 0 ? "+" : "&minus;";
      detail = `<p>Planejado ${fmtTime(last.plannedSec)} · real ${fmtTime(last.actualSec)} (${sign}${fmtTime(Math.abs(diff))})</p>`;
      if(last.pauses > 0) detail += `<p>${last.pauses} pausa(s) · ${fmtTime(last.pausedSec).replace("+","")} pausado</p>`;
      if(last.skippedCount > 0) detail += `<p>${last.skippedCount} etapa(s) pulada(s)</p>`;
    }
    if(ultimosPontosGanhos > 0) detail += `<p style="color:var(--accent);">+${ultimosPontosGanhos.toFixed(1)} pontos no boletim da semana</p>`;
    const MOODS = ["&#9733;&#9734;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9734;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9734;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9734;","&#9733;&#9733;&#9733;&#9733;&#9733;"];

  /* ================= DIÁRIO (nota do dia / semana / mês / ano) =================
     Um texto markdown por período, guardado em K_DIARIO sob uma chave por escopo.
     Na nota do dia, linhas de checklist que começam com um horário viram blocos
     na visão de agenda (time-blocking, no espírito do day-planner do Obsidian):
     arrastar a página para a direita troca a nota pela agenda. */
  const DIARIO_ESCOPOS = [["dia","Dia"],["semana","Semana"],["mes","Mês"],["ano","Ano"]];
  const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const DIAS_PT = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  let diarioEscopo = "dia";
  let diarioData = localKey();
  let diarioAgenda = false;    // visão de agenda (só existe no escopo "dia")
  /* o texto do período é a fonte do editor contínuo (mesmo editor das notas) */
  function agendarRepinturaDaAgenda(){
    if(!repintarAgendaDoDiario) return;
    clearTimeout(agendaRepaintTimer);
    agendaRepaintTimer = setTimeout(()=>{ if(repintarAgendaDoDiario) repintarAgendaDoDiario(); }, 220);
  }
  function diarioLiveCtx(){
    const k = diarioChave(diarioEscopo, diarioData);
    return {
      id: () => "diario:" + k,
      getText: () => diario[k] || "",
      setText: t => { if(t.trim()) diario[k] = t; else delete diario[k]; saveDiario(); agendarRepinturaDaAgenda(); marcarLiveSalvo(); },
      sinkChecked: () => false
    };
  }

  function diarioChave(escopo, iso){
    if(escopo === "semana") return "semana:" + inicioSemanaISO(isoToDate(iso));
    if(escopo === "mes")    return "mes:" + iso.slice(0,7);
    if(escopo === "ano")    return "ano:" + iso.slice(0,4);
    return "dia:" + iso;
  }
  function diarioRotulo(escopo, iso){
    const d = isoToDate(iso);
    const dm = x => String(x.getDate()).padStart(2,"0") + "/" + String(x.getMonth()+1).padStart(2,"0");
    if(escopo === "semana"){
      const dom = isoToDate(inicioSemanaISO(d));
      const sab = isoToDate(addDaysISO(localKey(dom), 6));
      return "semana de " + dm(dom) + " a " + dm(sab);
    }
    if(escopo === "mes") return MESES_PT[d.getMonth()] + " de " + d.getFullYear();
    if(escopo === "ano") return "ano de " + d.getFullYear();
    return DIAS_PT[d.getDay()];
  }

  /* ---- Kanban por escopo do Diário (dia / semana / mês / ano) ----
     Cada cartão guarda em `per` a chave do período a que pertence, no mesmo
     formato de `diarioChave` ("dia:2026-07-27", "mes:2026-07"...): um campo só
     que já carrega o escopo e o período, e ordena por comparação de string
     dentro do mesmo escopo.

     Cartão em "Feito" fica cravado no período em que foi concluído — é registro
     do que aconteceu ali. Cartão em "A fazer"/"Fazendo" é pendência, e pendência
     não fica no passado: ao abrir o período corrente, tudo que ficou para trás
     naquele escopo é trazido para cá. Navegar pelo histórico não move nada. */
  const DIA_KB_COLS = [["todo","A fazer"],["doing","Fazendo"],["done","Feito"]];
  const KB_ESCOPO_LABEL = { dia:"do dia", semana:"da semana", mes:"do mês", ano:"do ano" };
  /* Escopo mais longo vale mais: um marco do mês não pode pesar igual a um
     recado do dia. Multiplica o peso do cartão. */
  const KB_ESCOPO_MULT = { dia:1, semana:2, mes:3, ano:4 };
  /* Tarefa pontual do kanban custa mais energia mental que uma etapa de rotina
     ou uma meta do mesmo peso nominal (que são recorrentes/planejadas com
     antecedência) — por isso pontua um pouco acima do multiplicador padrão. */
  const KB_PESO_BONUS = 1.15;
  function escopoDoPer(per){ return String(per||"").split(":")[0] || "dia"; }
  function perAtual(escopo){ return diarioChave(escopo, localKey()); }
  // só faz sentido "amanhã" no escopo dia — semana/mês/ano não têm granularidade de dia
  function perDiaSeguinte(per){ return "dia:" + addDaysISO(per.slice(per.indexOf(":")+1), 1); }
  function rolarPendenciasPara(per){
    if(per !== perAtual(escopoDoPer(per))) return; // só o período corrente puxa
    let mudou = false;
    diaKanban.forEach(c=>{
      if(c.col !== "done" && escopoDoPer(c.per) === escopoDoPer(per) && c.per < per){ c.per = per; mudou = true; }
    });
    if(mudou) saveDiaKanban();
  }
  function colunasKanban(per){
    return DIA_KB_COLS.map(([key,title])=>({
      key, title,
      items: diaKanban.filter(c=> c.per === per && c.col === key)
                      .sort((a,b)=> (a.ord||0) - (b.ord||0))
    }));
  }
  /* ---- Pontuação dos cartões ----
     O cartão não tem duração, então vale um bloco da duração de referência:
     `pesoBruto(tag, divisorDuracao)` dá sqrt(1)=1 e o peso bruto acaba sendo o
     próprio multiplicador. Multiplicado pelo fator da semana e pelo peso do
     escopo, o cartão entra na MESMA escala normalizada das etapas e tarefas.
     Peso "nenhum" (o padrão) não pontua: a pontuação é opcional. */
  function pontosCartao(tag, per, area){
    const mult = KB_ESCOPO_MULT[escopoDoPer(per)] || 1;
    // dia/semana entram na semana e respeitam a fatia da área (roda da vida);
    // mês/ano viram bônus fora da semana, sem repartição por área
    const fator = cartaoVaiParaSemana(per) ? fatorDaArea(area) : gam.semanaAtual.fatorNormalizacao;
    return pesoBruto(tag || "nenhum", gam.config.divisorDuracao) * fator * mult * KB_PESO_BONUS;
  }
  /* Onde o cartão pontua depende do escopo: dia e semana entram na nota da
     SEMANA (é o que a semana mede); mês e ano entram no bônus do período
     correspondente em gam.metasPontos, junto das metas — é lá que o fechamento
     mensal/anual lê. */
  function cartaoVaiParaSemana(per){
    const e = escopoDoPer(per);
    return e === "dia" || e === "semana";
  }
  function periodoBonusDoCartao(per){
    const e = escopoDoPer(per), sufixo = String(per).slice(e.length+1);
    return e === "mes" ? sufixo : sufixo.slice(0,4); // "2026-07" ou "2026"
  }
  function sincronizarPontosCartao(c){
    const feito = c.col === "done";
    const jaCreditado = !!c.gamItemId || !!c.gamPeriodo;
    if(feito === jaCreditado) return;
    if(!feito){ descreditarCartao(c); return; }
    if(cartaoVaiParaSemana(c.per)){
      const g = registrarConclusao("kanban", {
        cardId: c.id, tag: c.tagValor || "nenhum",
        minutos: gam.config.divisorDuracao,
        mult: KB_ESCOPO_MULT[escopoDoPer(c.per)] || 1,
        area: areaDaRotina(c),
        rotulo: "Kanban " + KB_ESCOPO_LABEL[escopoDoPer(c.per)]
      });
      if(g) c.gamItemId = g.itemId;
    } else {
      const pts = pontosCartao(c.tagValor, c.per, areaDaRotina(c));
      if(pts <= 0) return;
      const periodo = periodoBonusDoCartao(c.per);
      gam.metasPontos[periodo] = (gam.metasPontos[periodo] || 0) + pts;
      c.gamPeriodo = periodo; c.gamPontos = pts;
      save(K_GAMIFICACAO, gam);
    }
  }
  function descreditarCartao(c){
    if(c.gamItemId){ desfazerConclusao(c.gamItemId); delete c.gamItemId; }
    if(c.gamPeriodo){
      const p = c.gamPeriodo;
      gam.metasPontos[p] = Math.max(0, (gam.metasPontos[p] || 0) - (c.gamPontos || 0));
      if(gam.metasPontos[p] < 1e-9) delete gam.metasPontos[p];
      delete c.gamPeriodo; delete c.gamPontos;
      save(K_GAMIFICACAO, gam);
    }
  }

  /* As colunas são a verdade depois de arrastar/mover/excluir: reescreve coluna,
     período e ordem de cada cartão, adota os recém-criados e descarta os que
     saíram da tela (os cartões dos outros períodos nem estão aqui). */
  function gravarKanban(cols, per){
    const naTela = new Set();
    cols.forEach(col=>{
      col.items.forEach((it,i)=>{
        it.col = col.key; it.per = per; it.ord = i;
        naTela.add(it.id);
        if(diaKanban.indexOf(it) === -1) diaKanban.push(it);
        sincronizarPontosCartao(it);
      });
    });
    // cartão excluído leva embora os pontos que tinha creditado
    diaKanban.filter(c => c.per === per && !naTela.has(c.id)).forEach(descreditarCartao);
    diaKanban = diaKanban.filter(c => c.per !== per || naTela.has(c.id));
    saveDiaKanban();
    // cartão com horário é bloco na agenda: mexeu no cartão, a agenda ao lado (desktop) desatualiza
    agendarRepinturaDaAgenda();
  }
  /* Clique num bloco de cartão dentro da agenda: alterna entre "Feito" e a
     primeira coluna, espelhando o que o clique num bloco da nota faz (marcar/
     desmarcar). Passa por gravarKanban para os pontos serem reconciliados. */
  function alternarCartaoFeitoNaAgenda(cardId, per){
    const c = diaKanban.find(x => x.id === cardId);
    if(!c) return;
    c.col = c.col === "done" ? DIA_KB_COLS[0][0] : "done";
    const cols = colunasKanban(per);
    gravarKanban(cols, per);
  }

  /* ---- time-blocking: "- [ ] 08:00 tarefa" ou "- [ ] 08:00 - 09:30 tarefa" ---- */
  const RE_TIMEBLOCK = /^\s*[-*]\s*\[([ xX>])\]\s*(\d{1,2}):(\d{2})(?:\s*[-–—]\s*(\d{1,2}):(\d{2}))?\s*(.*)$/;
  function parseTimeBlocks(texto){
    const blocos = [];
    (texto||"").split("\n").forEach((raw, i)=>{
      const m = raw.match(RE_TIMEBLOCK);
      if(!m) return;
      const ini = (+m[2])*60 + (+m[3]);
      if(ini >= 24*60) return;
      blocos.push({
        linha: i, ini,
        fim: m[4] !== undefined ? (+m[4])*60 + (+m[5]) : null,
        feito: m[1].toLowerCase() === "x",
        adiado: m[1] === ">",
        texto: (m[6]||"").trim()
      });
    });
    blocos.sort((a,b)=> a.ini - b.ini || a.linha - b.linha);
    // sem hora de fim explícita, a atividade é entendida como 1h — fixo, não
    // "até o próximo bloco": um horário solto não é um compromisso do tamanho
    // que sobrar até o item seguinte.
    blocos.forEach(b=>{ if(b.fim == null || b.fim <= b.ini) b.fim = b.ini + 60; });
    return blocos;
  }
  /* blocos que se sobrepõem dividem a largura em colunas, como numa agenda */
  function distribuirColunas(blocos){
    let grupo = [], fimGrupo = -1;
    const fecharGrupo = () => {
      const cols = grupo.reduce((n,b)=>Math.max(n, b.col+1), 0);
      grupo.forEach(b=> b.cols = cols);
      grupo = [];
    };
    blocos.forEach(b=>{
      if(grupo.length && b.ini >= fimGrupo) fecharGrupo();
      const ocupadas = grupo.filter(g=> g.fim > b.ini).map(g=>g.col);
      let c = 0; while(ocupadas.includes(c)) c++;
      b.col = c;
      grupo.push(b);
      fimGrupo = Math.max(fimGrupo, b.fim);
    });
    if(grupo.length) fecharGrupo();
  }
  /* Cartões do kanban do dia que ganharam horário entram na MESMA agenda das
     linhas de time-blocking da nota. Não têm `linha` no texto (não vêm de lá),
     então carregam `cardId` e são identificados por data-agcard. */
  function blocosDoKanban(iso){
    const per = "dia:" + iso;
    return diaKanban.filter(c => c.per === per && horaParaMin(c.hIni) != null).map(c=>{
      const ini = horaParaMin(c.hIni);
      let fim = c.hFim ? horaParaMin(c.hFim) : null;
      if(fim == null || fim <= ini) fim = ini + 60; // mesma regra da nota: sem fim = 1h
      return { cardId: c.id, ini, fim, feito: c.col === "done", adiado: false, texto: c.text, kb: true };
    });
  }
  /* Compromissos avulsos com horário entram na mesma agenda do dia, igual aos
     cartões do kanban com hora — não vêm da nota (sem `linha`), então levam
     `compromissoId` e são identificados por data-agcompromisso. Sem duração
     própria (só um horário-alvo), então valem um bloco de 30min na grade. */
  function blocosDoCompromisso(iso){
    return compromissos.filter(c => c.date === iso && horaParaMin(c.time) != null).map(c=>{
      const ini = horaParaMin(c.time);
      return { compromissoId: c.id, ini, fim: ini + 30, feito:false, adiado:false, texto: c.title, cp:true };
    });
  }
  const AG_PX_MIN = 1.15; // pixels por minuto de altura
  function agendaHtml(texto, iso){
    const blocos = parseTimeBlocks(texto).concat(blocosDoKanban(iso)).concat(blocosDoCompromisso(iso));
    if(!blocos.length){
      return `<div class="empty-state" style="min-height:30vh;"><h2>Sem blocos de horário</h2>
        <p>Na nota do dia, escreva linhas como<br><b>- [ ] 08:00 - 09:30 Estudar</b><br>e elas viram blocos aqui.<br>Cartões do kanban com horário também aparecem.</p></div>`;
    }
    // reordenar: distribuirColunas assume a lista em ordem de início
    blocos.sort((a,b)=> a.ini - b.ini || (a.linha||0) - (b.linha||0));
    distribuirColunas(blocos);
    const hIni = Math.max(0, Math.floor(Math.min(...blocos.map(b=>b.ini))/60) - 1);
    // Nunca para logo depois do último bloco: sem o piso de 21h a grade parava
    // no meio da tela em dias com poucos compromissos à tarde.
    const hFim = Math.min(24, Math.max(Math.ceil(Math.max(...blocos.map(b=>b.fim))/60) + 1, 21));
    const topo = min => (min - hIni*60) * AG_PX_MIN;
    const hhmm = min => String(Math.floor(min/60)).padStart(2,"0") + ":" + String(min%60).padStart(2,"0");
    let horas = "";
    for(let h = hIni; h <= hFim; h++){
      horas += `<div class="ag-hora" style="top:${topo(h*60)}px;"><span>${String(h).padStart(2,"0")}:00</span></div>`;
    }
    const blocosHtml = blocos.map(b=>{
      const larg = 100 / b.cols;
      const ref = b.kb ? `data-agcard="${escapeHtml(b.cardId)}"` : (b.cp ? `data-agcompromisso="${escapeHtml(b.compromissoId)}"` : `data-agline="${b.linha}"`);
      return `<div class="ag-bloco ${b.kb?'ag-kb':''} ${b.cp?'ag-cp':''} ${b.feito?'feito':''} ${b.adiado?'adiado':''}" ${ref}
        style="top:${topo(b.ini)}px; height:${Math.max(24,(b.fim-b.ini)*AG_PX_MIN - 3)}px; left:calc(${b.col*larg}% + 2px); width:calc(${larg}% - 4px);">
        <span class="ag-hh">${hhmm(b.ini)}&ndash;${hhmm(b.fim)}${b.adiado?' · adiado':''}</span>
        <span class="ag-txt">${escapeHtml(b.texto)}</span>
      </div>`;
    }).join("");
    const agora = new Date();
    const minAgora = agora.getHours()*60 + agora.getMinutes();
    const linhaAgora = (iso === localKey() && minAgora >= hIni*60 && minAgora <= hFim*60)
      ? `<div class="ag-agora" style="top:${topo(minAgora)}px;"></div>` : "";
    return `<div class="ag-wrap" style="height:${topo(hFim*60)+24}px;">${horas}${linhaAgora}<div class="ag-blocos">${blocosHtml}</div></div>`;
  }

  /* ---- agenda de semana/mês/ano: mesmo espírito do time-blocking do dia, mas
     sem grade de minuto — cada escopo tem seu próprio marcador (dia da semana,
     dia do mês, mês do ano) em vez de HH:MM, e os itens viram uma lista
     agrupada em vez de um bloco posicionado por pixel. */
  const RE_WEEKBLOCK  = /^\s*[-*]\s*\[([ xX>])\]\s*(dom|seg|ter|qua|qui|sex|s[aá]b)\b(?:\s+(\d{1,2}):(\d{2}))?\s*(.*)$/i;
  const RE_MONTHBLOCK = /^\s*[-*]\s*\[([ xX>])\]\s*(\d{1,2})(?!\s*[:\d])\s+(.*)$/;
  const RE_YEARBLOCK  = /^\s*[-*]\s*\[([ xX>])\]\s*(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\b\s*(.*)$/i;
  const MESES_ABREV = MESES_PT.map(m=>m.slice(0,3));
  function parseWeekBlocks(texto){
    const out = [];
    (texto||"").split("\n").forEach((raw,i)=>{
      const m = raw.match(RE_WEEKBLOCK);
      if(!m) return;
      const dow = DIAS_ABREV.findIndex(d=>normalizeStr(d)===normalizeStr(m[2]));
      if(dow === -1) return;
      out.push({ linha:i, grupo:dow, hora: m[3]!==undefined ? (+m[3])*60+(+m[4]) : null,
        feito: m[1].toLowerCase()==="x", adiado: m[1]===">", texto:(m[5]||"").trim() });
    });
    return out;
  }
  function parseMonthBlocks(texto){
    const out = [];
    (texto||"").split("\n").forEach((raw,i)=>{
      const m = raw.match(RE_MONTHBLOCK);
      if(!m) return;
      const dia = +m[2];
      if(dia < 1 || dia > 31) return;
      out.push({ linha:i, grupo:dia, hora:null,
        feito: m[1].toLowerCase()==="x", adiado: m[1]===">", texto:(m[3]||"").trim() });
    });
    return out;
  }
  function parseYearBlocks(texto){
    const out = [];
    (texto||"").split("\n").forEach((raw,i)=>{
      const m = raw.match(RE_YEARBLOCK);
      if(!m) return;
      const mes = MESES_ABREV.findIndex(a=>normalizeStr(a)===normalizeStr(m[2]));
      if(mes === -1) return;
      out.push({ linha:i, grupo:mes, hora:null,
        feito: m[1].toLowerCase()==="x", adiado: m[1]===">", texto:(m[3]||"").trim() });
    });
    return out;
  }
  /* Grupos já vêm prontos (label + itens ordenados); só falta desenhar. Reusa
     data-agline, .feito/.adiado — o mesmo toque-para-concluir e arraste-para-
     adiar da agenda do dia funcionam aqui sem código extra. */
  function agendaGrupoHtml(grupos, dica){
    if(!grupos.length){
      return `<div class="empty-state" style="min-height:30vh;"><h2>Sem itens de agenda</h2><p>${dica}</p></div>`;
    }
    return `<div class="ag-grupos">` + grupos.map(g=>`
      <div class="ag-grupo">
        <div class="ag-grupo-titulo">${escapeHtml(g.label)}</div>
        ${g.itens.map(b=>`<div class="ag-item ${b.feito?'feito':''} ${b.adiado?'adiado':''}" data-agline="${b.linha}">
          ${b.hora!=null ? `<span class="ag-item-hora">${String(Math.floor(b.hora/60)).padStart(2,"0")}:${String(b.hora%60).padStart(2,"0")}</span>` : ""}
          <span class="ag-item-txt">${escapeHtml(b.texto)}</span>
        </div>`).join("")}
      </div>`).join("") + `</div>`;
  }
  function agendaSemanaHtml(texto){
    const itens = parseWeekBlocks(texto);
    const grupos = ordemDiasSemana().map(dow=>({
      label: DIAS_PT[dow].charAt(0).toUpperCase()+DIAS_PT[dow].slice(1),
      itens: itens.filter(b=>b.grupo===dow).sort((a,b)=> (a.hora??9999)-(b.hora??9999) || a.linha-b.linha)
    })).filter(g=>g.itens.length);
    return agendaGrupoHtml(grupos, "Na nota da semana, escreva linhas como<br><b>- [ ] seg 08:00 Reunião</b> ou <b>- [ ] qui Levar carro à revisão</b><br>e elas viram a agenda da semana aqui.");
  }
  function agendaMesHtml(texto){
    const itens = parseMonthBlocks(texto);
    const porDia = {};
    itens.forEach(b=>{ (porDia[b.grupo] = porDia[b.grupo]||[]).push(b); });
    const grupos = Object.keys(porDia).map(Number).sort((a,b)=>a-b).map(dia=>({
      label: "dia " + String(dia).padStart(2,"0"),
      itens: porDia[dia].sort((a,b)=>a.linha-b.linha)
    }));
    return agendaGrupoHtml(grupos, "Na nota do mês, escreva linhas como<br><b>- [ ] 05 Consulta médica</b><br>e elas viram a agenda do mês aqui.");
  }
  function agendaAnoHtml(texto){
    const itens = parseYearBlocks(texto);
    const porMes = {};
    itens.forEach(b=>{ (porMes[b.grupo] = porMes[b.grupo]||[]).push(b); });
    const grupos = Object.keys(porMes).map(Number).sort((a,b)=>a-b).map(mes=>({
      label: MESES_PT[mes].charAt(0).toUpperCase()+MESES_PT[mes].slice(1),
      itens: porMes[mes].sort((a,b)=>a.linha-b.linha)
    }));
    return agendaGrupoHtml(grupos, "Na nota do ano, escreva linhas como<br><b>- [ ] mar Renovar CNH</b><br>e elas viram a agenda do ano aqui.");
  }
  function agendaHtmlPara(escopo, texto, iso){
    if(escopo === "semana") return agendaSemanaHtml(texto);
    if(escopo === "mes") return agendaMesHtml(texto);
    if(escopo === "ano") return agendaAnoHtml(texto);
    return agendaHtml(texto, iso);
  }

  /* Arrasto de ida só para a direita: alterna o estado "adiado" do bloco. Um
     movimento predominantemente vertical é rolagem e cancela o gesto; quando o
     arrasto conclui, o clique que viria em seguida (marcar como feito) é
     descartado pelo sinalizador data-swiped. */
  function attachSwipeAdiar(el, onAdiar, ignoreSelector){
    const THRESH = 56;
    let startX = 0, startY = 0, arrastando = false, horizontal = false;
    el.addEventListener("pointerdown", e=>{
      if(ignoreSelector && e.target.closest(ignoreSelector)) return;
      startX = e.clientX; startY = e.clientY; arrastando = true; horizontal = false;
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", e=>{
      if(!arrastando) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(!horizontal){
        if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ arrastando = false; return; }
        if(dx > 8) horizontal = true; else return;
      }
      const d = Math.max(0, Math.min(dx, 120));
      el.style.transform = `translateX(${d}px)`;
      el.style.opacity = String(1 - d/320);
    });
    function soltar(e){
      if(!arrastando) return;
      arrastando = false;
      const dx = (e.clientX != null ? e.clientX : startX) - startX;
      el.style.transition = "transform .18s ease, opacity .18s ease";
      el.style.transform = "translateX(0)";
      el.style.opacity = "1";
      if(horizontal && dx > THRESH){
        el.dataset.swiped = "1";
        setTimeout(onAdiar, 60);
      }
    }
    el.addEventListener("pointerup", soltar);
    el.addEventListener("pointercancel", soltar);
  }

  function renderDiario(){
    const el = document.createElement("div");
    el.className = "screen with-tabbar";
    /* Cabeçalho, escopos e data ficam DENTRO da área que rola: fixados no topo
       eles comiam a altura útil de uma tela de celular. */
    el.innerHTML = `
      <div class="di-body" id="diBody">
        <div class="home-header" style="margin-bottom:10px;">
          <h1>Diário</h1>
          <div class="header-right">
            <button class="icon-btn" id="diNovoCompromisso" title="Novo compromisso" aria-label="Novo compromisso">${svgIcon(ICON_D.plus,16)}</button>
            ${cfgBtnHtml()}
          </div>
        </div>
        <div class="di-escopo-row">
          <div class="type-toggle di-badge" id="diEscopos" style="margin-bottom:0;">
            ${DIARIO_ESCOPOS.map(([v,l])=>`<span data-diesc="${v}" class="${diarioEscopo===v?'active':''}">${l}</span>`).join("")}
          </div>
          ${!ehDesktop() ? `<button class="bell-btn di-hoje di-agenda-inline" id="diAgendaToggle" title="${diarioAgenda?'Voltar para a nota':'Ver a agenda'}">${diarioAgenda?svgIcon(ICON_D.arrowLeft,15)+' nota':svgIcon(ICON_D.calendar,14)+' agenda'}</button>` : ""}
        </div>
        <div class="di-daterow">
          <input type="date" id="diData" value="${diarioData}">
        </div>
        <div class="dev-n di-daterow-label">${diarioRotulo(diarioEscopo, diarioData)}</div>
        ${rodaVidaResumoHtml()}
        <div id="diContent"></div>
      </div>
    `;
    el.appendChild(renderTabbar("diario"));
    app.appendChild(el);
    wireCfgBtn(el);

    // paint() só reescreve #diContent — o cabeçalho e seus handlers ficam de pé
    const body = el.querySelector("#diContent");
    const chave = () => diarioChave(diarioEscopo, diarioData);
    const texto = () => diario[chave()] || "";
    function gravar(t){
      const k = chave();
      if(t.trim()) diario[k] = t; else delete diario[k];
      saveDiario();
    }

    /* tocar num bloco marca/desmarca a linha correspondente na nota; arrastar
       para a direita marca (ou desmarca) como adiada. Vale para a agenda em
       tela cheia (celular) e para a coluna de agenda (desktop). */
    function wireAgendaBlocos(){
      body.querySelectorAll("[data-agline]").forEach(bl=>{
        bl.onclick = () => {
          if(bl.dataset.swiped){ delete bl.dataset.swiped; return; } // o arrasto já resolveu
          gravar(toggleCheckLineInText(texto(), +bl.dataset.agline)); paint();
        };
        attachSwipeAdiar(bl, () => {
          const linha = +bl.dataset.agline;
          const eraAdiado = bl.classList.contains("adiado");
          gravar(setCheckStateInText(texto(), linha, ">"));
          paint();
          showAlertBanner(eraAdiado ? "Bloco reativado" : "Bloco marcado como adiado");
        });
      });
      // blocos vindos de cartões do kanban: o clique conclui/reabre o cartão
      body.querySelectorAll("[data-agcard]").forEach(bl=>{
        bl.onclick = () => {
          const feito = bl.classList.contains("feito");
          alternarCartaoFeitoNaAgenda(bl.dataset.agcard, chave());
          paint();
          showAlertBanner(feito ? "Cartão reaberto" : "Cartão concluído ✓");
        };
      });
      // bloco de compromisso avulso: o clique oferece excluir (não tem
      // conclusão — é só um lembrete de horário)
      body.querySelectorAll("[data-agcompromisso]").forEach(bl=>{
        bl.onclick = () => {
          const c = compromissos.find(x=>x.id===bl.dataset.agcompromisso);
          confirmModal("Excluir o compromisso <b>"+escapeHtml((c&&c.title)||"")+"</b>?", "Excluir", ()=>{
            compromissos = compromissos.filter(x=>x.id!==bl.dataset.agcompromisso);
            saveCompromissos();
            paint();
            showAlertBanner("Compromisso excluído");
          });
        };
      });
    }
    function pintarKanbanDoPeriodo(){
      const per = chave();
      rolarPendenciasPara(per);
      const cols = colunasKanban(per);
      // horários só no escopo "dia": semana/mês/ano não têm granularidade de hora na agenda
      pintarKanban(body.querySelector("#diKanban"), cols, () => gravarKanban(cols, per),
        { pesos:true, per, abas:true, horarios: true });
    }

    function paint(){
      const esc = diarioEscopo;
      /* Desktop: agenda, nota e kanban lado a lado. No celular a agenda é um
         toggle porque não cabem as três — aqui cabem, então o botão "agenda"
         some e `diarioAgenda` é ignorado (o estado fica intacto para quando a
         janela voltar a ser estreita). */
      if(ehDesktop()){
        body.innerHTML = `
          <div class="di-cols">
            <section class="di-pane">
              <div class="section-label">Agenda</div>
              <div class="di-pane-body" id="diAgendaPane">${agendaHtmlPara(esc, texto(), diarioData)}</div>
            </section>
            <section class="di-pane">
              <div class="section-label">Kanban ${KB_ESCOPO_LABEL[esc]}</div>
              <div class="di-pane-body">
                <div class="kb-board kb-inline" id="diKanban"></div>
              </div>
            </section>
            <section class="di-pane">
              <div class="section-label">Anotação ${KB_ESCOPO_LABEL[esc]} <span class="live-saved-badge dev-n"></span></div>
              <div class="di-pane-body"><div class="live-editor di-live" id="liveEditor"></div></div>
            </section>
          </div>`;
        liveCtx = diarioLiveCtx();
        renderLiveEditor();
        pintarKanbanDoPeriodo();
        wireAgendaBlocos();
        // só o painel da agenda é reescrito: o editor ao lado não pode perder o foco
        repintarAgendaDoDiario = () => {
          const pane = body.querySelector("#diAgendaPane");
          if(!pane) return;
          const topo = pane.scrollTop;
          pane.innerHTML = agendaHtmlPara(diarioEscopo, texto(), diarioData);
          pane.scrollTop = topo;
          wireAgendaBlocos();
        };
        return;
      }
      repintarAgendaDoDiario = null;
      if(diarioAgenda){
        body.innerHTML = agendaHtmlPara(esc, texto(), diarioData);
        wireAgendaBlocos();
        return;
      }
      // fora da agenda, a nota do período é o editor contínuo — sempre editável
      body.innerHTML = `
        <div class="kb-board kb-inline" id="diKanban"></div>
        <div class="section-label">Anotação ${KB_ESCOPO_LABEL[esc]} <span class="live-saved-badge dev-n"></span></div>
        <div class="live-editor di-live" id="liveEditor"></div>`;
      liveCtx = diarioLiveCtx();
      renderLiveEditor();
      pintarKanbanDoPeriodo();
    }
    paint();

    function trocarPeriodo(fn){
      liveFocado = false;
      liveCaret = { line:0, col:0 };
      liveSavedAt = null;
      kbEdit = null; // o índice de cartão em edição não vale para o outro dia
      fn();
      render();
    }
    el.querySelectorAll("[data-diesc]").forEach(sp=>{
      sp.onclick = () => trocarPeriodo(() => { diarioEscopo = sp.dataset.diesc; });
    });
    el.querySelector("#diData").onchange = e => {
      trocarPeriodo(() => { diarioData = e.target.value || localKey(); });
    };
    el.querySelector("#diNovoCompromisso").onclick = () => abrirNovoCompromisso({ date: diarioData });
    const agendaToggleBtn = el.querySelector("#diAgendaToggle");
    if(agendaToggleBtn) agendaToggleBtn.onclick = () => { liveFocado = false; diarioAgenda = !diarioAgenda; render(); };

    /* arrastar a página para a direita abre a agenda do período; para a esquerda, volta */
    let tx0 = null, ty0 = null;
    el.addEventListener("touchstart", e => {
      // escrevendo: o arrasto é do cursor/seleção, não da navegação.
      // no kanban: o arrasto é do cartão, e passaria dos 70px do gesto de página
      // no desktop as três colunas convivem: não há toggle de agenda para o gesto acionar
      if(e.touches.length !== 1 || liveFocado || ehDesktop() || e.target.closest(".kb-board")){ tx0 = null; return; }
      tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY;
    }, { passive:true });
    el.addEventListener("touchend", e => {
      if(tx0 == null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - tx0, dy = t.clientY - ty0;
      tx0 = null;
      if(Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
      if(dx > 0 && !diarioAgenda){ diarioAgenda = true; render(); }
      else if(dx < 0 && diarioAgenda){ diarioAgenda = false; render(); }
    }, { passive:true });
  }

  /* ---------------- BOLETIM (gamificação) ---------------- */

  /* ---------------- FECHAMENTO DE SEMANA ----------------
     Ritual: ao abrir o app depois da virada, mostra a nota fechada, o que puxou
     a semana e um campo de reflexão que vira nota comum — fecha o ciclo entre o
     journaling que já existia e a gamificação. */
  function semanaFechadaPendente(){
    const ultima = gam.historico.semanas[gam.historico.semanas.length-1];
    if(!ultima) return null;
    return gam.ultimaSemanaVista === ultima.inicioISO ? null : ultima;
  }
  function marcarSemanaVista(){
    const ultima = gam.historico.semanas[gam.historico.semanas.length-1];
    if(ultima){ gam.ultimaSemanaVista = ultima.inicioISO; save(K_GAMIFICACAO, gam); }
  }
  function renderSemanaFechada(){
    const sem = semanaFechadaPendente() || gam.historico.semanas[gam.historico.semanas.length-1];
    if(!sem){ goTo({tab:"home", screen:"home"}); return; }
    const anteriores = gam.historico.semanas.filter(s=>!s.dispensada && s.inicioISO < sem.inicioISO);
    const anterior = anteriores[anteriores.length-1];
    const delta = anterior ? sem.nota - anterior.nota : null;
    const ini = isoToDate(sem.inicioISO), fim = isoToDate(addDaysISO(sem.inicioISO, 6));
    const dd = d => String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    const cor = sem.dispensada ? "var(--muted)" : (sem.nota >= gam.config.notaMinima ? "var(--good)" : "var(--danger)");
    const el = document.createElement("div");
    el.className = "screen";
    el.innerHTML = `
      <div class="topbar"><button class="link-btn muted" id="sfSkip">Depois</button></div>
      <div style="overflow-y:auto; flex:1; padding-bottom:24px;">
        <div class="home-header" style="margin-bottom:2px;"><h1>Semana fechada</h1></div>
        <div class="routine-meta" style="margin-bottom:12px;">${dd(ini)} a ${dd(fim)}</div>
        <div class="stat-card" style="text-align:center;">
          <div style="font-family:'Inter', sans-serif; font-size:48px; font-weight:600; color:${cor};">${sem.nota.toFixed(1)}</div>
          ${sem.dispensada
            ? `<div class="routine-meta">semana dispensada — não entra na média do mês</div>`
            : `<div class="routine-meta">${sem.nota >= gam.config.notaMinima ? "aprovado" : "abaixo da nota mínima ("+gam.config.notaMinima+")"}</div>`}
          ${sem.badge ? `<div style="margin-top:10px; font-size:18px; color:${BADGE_COR[sem.badge]};">${BADGE_CHAR[sem.badge]} ${BADGE_NOME[sem.badge]}</div>` : ""}
          ${delta !== null ? `<div class="dev-n" style="margin-top:6px;">${delta>=0?'+':''}${delta.toFixed(1)} em relação à semana anterior</div>` : ""}
        </div>
        ${(sem.destaques||[]).length ? `<div class="section-label">O que mais somou</div>
        <div class="stat-card">
          ${sem.destaques.map(d=>`<div class="bar-row"><div class="bar-name" style="width:auto; flex:1;">${escapeHtml(d.nome)}</div><div class="bar-val">${d.pontos.toFixed(1)}</div></div>`).join("")}
        </div>` : ""}
        <div class="section-label">O que você leva dessa semana</div>
        <textarea id="sfReflexao" class="mk-e-name" rows="1" placeholder="O que funcionou, o que atrapalhou, o que muda na semana que começa..." style="width:100%; resize:none; overflow:hidden; line-height:1.5;"></textarea>
        <button class="btn-primary" id="sfSalvar" style="width:100%; margin-top:14px;">Começar a semana</button>
      </div>
    `;
    app.appendChild(el);
    const ta = document.getElementById("sfReflexao");
    autoGrowTextarea(ta);
    ta.oninput = e => autoGrowTextarea(ta, e);
    document.getElementById("sfSkip").onclick = () => { marcarSemanaVista(); goTo({tab:"home", screen:"home"}); };
    document.getElementById("sfSalvar").onclick = () => {
      const txt = ta.value.trim();
      if(txt){
        notes.push({
          id: uid(),
          title: "Semana " + dd(ini) + "–" + dd(fim) + " · nota " + sem.nota.toFixed(1),
          content: txt, updatedAt: Date.now(), pinned:false, sinkChecked:false
        });
        save(K_NOTES, notes);
      }
      marcarSemanaVista();
      goTo({tab:"home", screen:"home"});
    };
  }

  /* Aviso de ritmo: nos dias escolhidos em Configurações, se estiver atrás do
     esperado. O padrão continua sendo só a sexta. Dispara no máximo uma vez por
     dia escolhido (a marca é semana+dia, não só a semana). */
  function nudgeDias(){
    const v = load(K_NUDGEDAYS, null);
    return Array.isArray(v) && v.length ? v : [5]; // sexta por padrão
  }
  /* Entrega compartilhada pelos três avisos proativos (ritmo, metas, streak):
     nativo agenda notificação local; navegador com permissão concedida usa o
     service worker (ou Notification direta como fallback); sem permissão,
     degrada para o banner in-app — igual ao aviso de ritmo original. */
  function dispararNudge(title, body, tag){
    if(isNative){ try{ notifyNative(title, body, {}, notifIdFor(tag, 0)); }catch(e){} return; }
    if(isDesktop){ if(!notifyDesktop(title, body)) showAlertBanner(body); return; }
    if(!("Notification" in window) || Notification.permission !== "granted"){ showAlertBanner(body); return; }
    if("serviceWorker" in navigator){
      navigator.serviceWorker.ready.then(reg=>{
        reg.showNotification(title, { body, tag }).catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
      });
    } else { try{ new Notification(title,{body}); }catch(e){} }
  }
  function checarNudgeRitmo(){
    if(!load(K_NUDGE, true)) return;
    const hoje = new Date();
    if(!nudgeDias().includes(hoje.getDay()) || hoje.getHours() < 9) return; // a partir das 9h
    const marca = gam.semanaAtual.inicioISO + ":" + hoje.getDay();
    if(load(K_NUDGEDONE, "") === marca) return;
    if(gam.semanaAtual.dispensada) return;
    if(!gam.semanaAtual.totalBrutoAgendado) return;
    const r = ritmoInfo();
    if(r.saldo >= -5) return; // no ritmo ou adiantado: não incomodar
    save(K_NUDGEDONE, marca);
    const title = r.diasRestantes > 1
      ? "⏱ Faltam " + r.diasRestantes + " dias na semana"
      : "⏱ Último dia da semana";
    const body = "Nota " + r.nota.toFixed(0) + "/100 · " + r.porDia60.toFixed(1) + " pontos/dia para aprovar";
    dispararNudge(title, body, "nudge-ritmo");
  }
  const K_NUDGEMETASDONE = "rotinas_v2_nudge_metas_done"; // dia (localKey) do último aviso de meta perto do prazo
  /* Avisa no máximo 1x por dia quando alguma meta com prazo (doc.targets) está
     a 0-2 dias do vencimento e ainda não foi concluída. Reusa o mesmo
     interruptor K_NUDGE do aviso de ritmo em vez de criar uma tela nova em
     Configurações só para isto. */
  function checarNudgeMetas(){
    if(!load(K_NUDGE, true)) return;
    const hojeKey = localKey();
    if(load(K_NUDGEMETASDONE, "") === hojeKey) return;
    const doc = metaDoc();
    const proximas = (doc.targets||[])
      .filter(t => !metaConcluida(t) && daysUntil(t.date) >= 0 && daysUntil(t.date) <= 2)
      .sort((a,b)=>daysUntil(a.date)-daysUntil(b.date));
    if(!proximas.length) return;
    save(K_NUDGEMETASDONE, hojeKey);
    const perto = proximas[0];
    const d = daysUntil(perto.date);
    const title = d === 0 ? "🎯 Meta vence hoje" : "🎯 Meta perto do prazo";
    const quando = d === 0 ? "hoje" : "em " + d + " dia" + (d > 1 ? "s" : "");
    const body = proximas.length > 1
      ? perto.title + " vence " + quando + " e mais " + (proximas.length-1) + " meta(s) perto do prazo"
      : perto.title + " vence " + quando;
    dispararNudge(title, body, "nudge-metas");
  }
  const K_NUDGESTREAKDONE = "rotinas_v2_nudge_streak_done"; // dia (localKey) do último aviso de streak em risco
  /* Avisa no máximo 1x por dia (a partir das 18h, pra dar o dia inteiro antes
     de incomodar) quando uma rotina de hoje ainda não foi feita e sua
     sequência já está perto do limiar de hábito consolidado (ou já passou
     dele) — é quando quebrar dói mais. */
  function checarNudgeStreak(){
    if(!load(K_NUDGE, true)) return;
    const hoje = new Date();
    if(hoje.getHours() < 18) return;
    const hojeKey = localKey();
    if(load(K_NUDGESTREAKDONE, "") === hojeKey) return;
    const min = gam.config.habito.streakMin || 21;
    const limiar = Math.max(3, min - 3);
    const emRisco = routines.filter(r=>{
      if(!rotinaOcorreHoje(r)) return false;
      if(history.some(h=>h.routineId===r.id && h.date===hojeKey)) return false; // já feita hoje
      return computeStreakFor(r.id) >= limiar;
    });
    if(!emRisco.length) return;
    save(K_NUDGESTREAKDONE, hojeKey);
    const r0 = [...emRisco].sort((a,b)=>computeStreakFor(b.id)-computeStreakFor(a.id))[0];
    const s0 = computeStreakFor(r0.id);
    const title = "🔥 Sequência em risco";
    const body = emRisco.length > 1
      ? r0.name + " está em " + s0 + " dia(s) seguidos e mais " + (emRisco.length-1) + " rotina(s) ainda não feita(s) hoje"
      : r0.name + " está em " + s0 + " dia(s) seguidos — não quebre hoje";
    dispararNudge(title, body, "nudge-streak");
  }

          <input class="dur-input" type="number" min="1" max="10" data-rodapeso="${a.id}" value="${a.peso}">
          <button class="icon-btn" data-rodadel="${a.id}" title="Remover área" aria-label="Remover área">${svgIcon(ICON_D.xmark,14)}</button>
        </div>`).join("") || `<div class="dev-n">Nenhuma área — adicione abaixo.</div>`;
      lista.querySelectorAll("[data-rodapeso]").forEach(inp=> inp.onchange = () => {
        const a = rodaAreas().find(x=>x.id===inp.dataset.rodapeso);
        if(a){ a.peso = Math.max(1, Math.min(10, +inp.value || 5)); save(K_GAMIFICACAO, gam); }
      });
      // cor da área: usada também como cor das rotinas designadas a ela (o
      // editor de rotina não escolhe mais cor própria)
      lista.querySelectorAll("[data-rodacolor]").forEach(inp=> inp.onchange = () => {
        const a = rodaAreas().find(x=>x.id===inp.dataset.rodacolor);
        if(a){ a.color = inp.value; save(K_GAMIFICACAO, gam); pintarRodaLista(); render(); }
      });
      function moverArea(id, delta){
        const arr = gam.config.roda.areas;
        const i = arr.findIndex(a=>a.id===id);
        const j = i + delta;
        if(i<0 || j<0 || j>=arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        save(K_GAMIFICACAO, gam);
        pintarRodaLista();
      }
      lista.querySelectorAll("[data-rodaup]").forEach(b=> b.onclick = () => moverArea(b.dataset.rodaup, -1));
      lista.querySelectorAll("[data-rodadown]").forEach(b=> b.onclick = () => moverArea(b.dataset.rodadown, 1));
      lista.querySelectorAll("[data-rodadel]").forEach(b=> b.onclick = () => {
        const id = b.dataset.rodadel;
        const usadas = routines.filter(r=>r.eixo===id).length;
        confirmModal("Remover a área?" + (usadas ? " <b>"+usadas+"</b> rotina(s) ficam sem área." : ""), "Remover", ()=>{
          gam.config.roda.areas = rodaAreas().filter(a=>a.id!==id);
          routines.forEach(r=>{ if(r.eixo===id) r.eixo = null; });
          save(K_ROUTINES, routines); save(K_GAMIFICACAO, gam);
          pintarRodaLista();
        });
      });
    }
    pintarRodaLista();
    document.getElementById("cfgRodaAtiva").onchange = e => {
      gam.config.roda.ativa = e.target.checked;
      // a semana em curso já está congelada: recongelar aqui faria a repartição
      // valer de imediato, mas jogaria fora o que já foi pontuado nela
      save(K_GAMIFICACAO, gam);
      showAlertBanner(e.target.checked ? "Roda da vida ligada — vale a partir do próximo domingo" : "Roda da vida desligada");
      render();
    };
    document.getElementById("cfgRodaAdd").onclick = () => {
      const inp = document.getElementById("cfgRodaNova");
      const label = inp.value.trim();
      if(!label){ inp.focus(); return; }
      const CORES = ["#C9B23E","#E0619E","#5B8DEF","#6B8F71","#B25B4C","#9C7BB8"];
      gam.config.roda.areas.push({ id: uid(), label, color: CORES[rodaAreas().length % CORES.length], peso: 5 });
      save(K_GAMIFICACAO, gam);
      inp.value = "";
      pintarRodaLista();
    };
    document.getElementById("cfgRodaSemArea").onchange = e => {
      gam.config.roda.pesoSemArea = Math.max(1, Math.min(10, +e.target.value || 5));
      save(K_GAMIFICACAO, gam);
    };
    document.getElementById("cfgHabAtivo").onchange = e => { gam.config.habito.ativo = e.target.checked; save(K_GAMIFICACAO, gam); render(); };
    document.getElementById("cfgHabStreak").onchange = e => { gam.config.habito.streakMin = Math.max(3, Math.min(365, Math.round(+e.target.value || 21))); save(K_GAMIFICACAO, gam); };
    document.getElementById("cfgHabFator").onchange = e => { gam.config.habito.fator = Math.max(0.1, Math.min(1, +e.target.value || 0.6)); save(K_GAMIFICACAO, gam); };
    [["cfgVagaAlto","alto"],["cfgVagaMedio","medio"],["cfgVagaBaixo","baixo"]].forEach(([id,nivel])=>{
      document.getElementById(id).onchange = e => {
        gam.config.vagas[nivel] = Math.max(0, Math.min(99, Math.round(+e.target.value || 0)));
        save(K_GAMIFICACAO, gam);
      };
    });

    if(isDesktop) refreshMcpCard();
    if(isDesktop || isNative) refreshSyncCard();
  }

  /* ---- Configurações → Integrações (MCP), só no desktop ----

  function mcpConfigJson(status){
    return JSON.stringify({
      mcpServers: { brita: { url: `http://127.0.0.1:${status.port}/mcp`, headers: { Authorization: `Bearer ${status.token}` } } }

  function mcpCardHtml(status){

  function wireMcpCard(card){

  async function refreshMcpCard(){
    const card = document.getElementById("cfgMcpCard");

    try{ status = await window.electronBridge.mcp.getStatus(); }
    catch(e){ card.innerHTML = `<div class="routine-meta">Não foi possível carregar o status do MCP.</div>`; return; }
