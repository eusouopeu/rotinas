  /* ---- Configurações → Backup → Sincronização com nuvem (Google Drive), só no desktop ----
     Mesmo padrão de auto-refresh do card do MCP, sem passar por render(). A resolução de
     conflito é uma UI própria (manter local / usar remoto) em vez do modal de import de
     backup: aquele modal foi desenhado para "mesclar ou substituir tudo" de um arquivo
     inteiro, não para escolher um lado numa única chave — forçar esse encaixe ficaria
     confuso, então o conflito por chave ganhou os dois botões diretos. */
  /* Ponte comum entre desktop (electronBridge.sync, IPC) e celular (plugin
     Capacitor DriveSync) — os dois expõem os mesmos métodos, só a forma de
     empacotar os argumentos difere (posicional vs. objeto único, convenção do
     Capacitor). No celular a credencial já vem embutida (mesmo Client ID/Secret
     do desktop — ver sync/oauth-client.js e a nota de segurança lá: client
     secret de app instalado não é segredo de verdade), então getStatus()
     sempre reporta hasClientCreds:true e a UI nunca cai no branch de digitar
     credencial. */
  function syncBridge(){
    if(isDesktop && window.electronBridge && window.electronBridge.sync) return window.electronBridge.sync;
    if(isNative && window.Capacitor.Plugins.DriveSync){
      const P = window.Capacitor.Plugins.DriveSync;
      return {
        saveClientCreds: () => Promise.resolve(),
        connect: () => P.connect(),
        disconnect: () => P.disconnect(),
        syncNow: () => P.syncNow(),
        getStatus: () => P.getStatus(),
        resolveConflict: (key, choice) => P.resolveConflict({ key, choice })
      };
    }
    return null;
  }
  let syncForceEditCreds = false;
  function syncCardHtml(status){
    if(!status.hasClientCreds || syncForceEditCreds){
      return `
        <div class="bar-row"><div class="bar-name" style="width:auto; flex:1;">Google Drive</div>
          <div class="bar-val" style="width:auto; color:var(--muted);">não configurado</div></div>
        <div class="stat-foot" style="margin-top:8px;">Exige um Client ID OAuth (tipo "App para computador") de um projeto seu no Google Cloud Console, com a Drive API ativada. Fica guardado só neste computador, nunca no repositório.</div>
        <div class="section-label" style="margin:14px 0 4px;">Client ID</div>
        <input type="text" id="syncClientId" class="mk-e-name" placeholder="xxxxxxxx.apps.googleusercontent.com">
        <div class="section-label" style="margin:14px 0 4px;">Client Secret</div>
        <input type="text" id="syncClientSecret" class="mk-e-name" placeholder="GOCSPX-...">
        <button class="btn-primary" id="syncSaveCreds" style="width:100%; margin-top:12px;">Salvar credenciais</button>
      `;
    }
    if(!status.connected){
      return `
        <div class="bar-row"><div class="bar-name" style="width:auto; flex:1;">Google Drive</div>
          <div class="bar-val" style="width:auto; color:var(--muted);">desconectado</div></div>
        <div class="stat-foot" style="margin-top:8px;">Cria uma pasta "brita-sync" no seu Drive. ${isDesktop ? "Sincroniza a cada 10 minutos com o app aberto." : "Sincroniza sozinho ao abrir o app (se fizer um tempo desde o último) e quando você tocar em \"sincronizar agora\"."} Escopo mínimo (drive.file): o app só enxerga o que ele mesmo criar.</div>
        <button class="btn-primary" id="syncConnect" style="width:100%; margin-top:12px;">Conectar ao Google Drive</button>
        ${isDesktop ? `<button class="btn-cancel" id="syncEditCreds" style="width:100%; margin-top:8px;">Trocar credenciais</button>` : ""}
      `;
    }
    const ultimo = status.lastSyncAt ? new Date(status.lastSyncAt).toLocaleString("pt-BR") : "ainda não sincronizou";
    const conflitos = status.pendingConflicts || [];
    const conflitosHtml = conflitos.length ? conflitos.map(k=>`
      <div class="bar-row" style="padding:6px 0; align-items:center;">
        <span style="flex:1;">${escapeHtml(k)}</span>
        <button class="btn-cancel" data-resolve="${escapeHtml(k)}" data-choice="local" style="padding:4px 10px; font-size:12px;">manter local</button>
        <button class="btn-cancel" data-resolve="${escapeHtml(k)}" data-choice="remote" style="padding:4px 10px; font-size:12px; margin-left:6px;">usar remoto</button>
      </div>`).join("") : "";
    return `
      <div class="bar-row"><div class="bar-name" style="width:auto; flex:1;">Google Drive</div>
        <div class="bar-val" style="width:auto; color:var(--good);">conectado</div></div>
      <div class="stat-foot" style="margin-top:6px;">Último sync: ${ultimo}.</div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn-primary" id="syncNow" style="flex:1;">Sincronizar agora</button>
        <button class="btn-cancel" id="syncDisconnect" style="flex:1;">Desconectar</button>
      </div>
      ${conflitos.length ? `<div class="section-label" style="margin:14px 0 4px;">Conflitos pendentes — os dois lados mudaram desde o último sync</div>${conflitosHtml}` : ""}
    `;
  }
  function wireSyncCard(card){
    const bridge = syncBridge();
    if(!bridge) return;
    const saveCreds = card.querySelector("#syncSaveCreds");
    if(saveCreds) saveCreds.onclick = async () => {
      const id = card.querySelector("#syncClientId").value.trim();
      const secret = card.querySelector("#syncClientSecret").value.trim();
      if(!id){ showAlertBanner("Cole o Client ID"); return; }
      await bridge.saveClientCreds(id, secret);
      syncForceEditCreds = false;
      showAlertBanner("Credenciais salvas ✓");
      refreshSyncCard();
    };
    const editCreds = card.querySelector("#syncEditCreds");
    if(editCreds) editCreds.onclick = () => { syncForceEditCreds = true; refreshSyncCard(); };
    const connectBtn = card.querySelector("#syncConnect");
    if(connectBtn) connectBtn.onclick = async () => {
      connectBtn.disabled = true; connectBtn.textContent = "Abrindo o navegador...";
      try{
        await bridge.connect();
        showAlertBanner("Google Drive conectado ✓");
      }catch(e){ showAlertBanner("Não deu para conectar: " + e.message); }
      refreshSyncCard();
    };
    const nowBtn = card.querySelector("#syncNow");
    if(nowBtn) nowBtn.onclick = async () => {
      nowBtn.disabled = true; nowBtn.textContent = "Sincronizando...";
      try{
        const r = await bridge.syncNow();
        if(isNative) await aplicarChavesSincronizadasNative(r.downloaded);
        showAlertBanner(`Sync: ${r.uploaded.length} enviado(s), ${r.downloaded.length} recebido(s)` + (r.conflicts.length ? `, ${r.conflicts.length} conflito(s)` : ""));
      }catch(e){ showAlertBanner("Falha no sync: " + e.message); }
      refreshSyncCard();
    };
    const discBtn = card.querySelector("#syncDisconnect");
    if(discBtn) discBtn.onclick = () => {
      confirmModal("Desconectar do Google Drive? O sync automático para até reconectar.", "Desconectar", async ()=>{
        await bridge.disconnect();
        refreshSyncCard();
      });
    };
    card.querySelectorAll("[data-resolve]").forEach(btn=>{
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          await bridge.resolveConflict(btn.dataset.resolve, btn.dataset.choice);
          if(isNative && btn.dataset.choice === "remote") await aplicarChavesSincronizadasNative([btn.dataset.resolve]);
          showAlertBanner("Conflito resolvido ✓");
        }catch(e){ showAlertBanner("Falha ao resolver: " + e.message); }
        refreshSyncCard();
      };
    });
  }
  async function refreshSyncCard(){
    const card = document.getElementById("cfgSyncCard");
    if(!card) return;
    const bridge = syncBridge();
    if(!bridge) return;
    let status;
    try{ status = await bridge.getStatus(); }
    catch(e){ card.innerHTML = `<div class="routine-meta">Não foi possível carregar o status da sincronização.</div>`; return; }
    if(!document.getElementById("cfgSyncCard")) return;
    card.innerHTML = syncCardHtml(status);
    wireSyncCard(card);
  }

  if(badgesGanhasNoBoot.length){

  /* ---- Sync com Google Drive: aplica no app o que o motor de sync já baixou
     e gravou em disco (desktop: main process; celular: SyncEngine nativo).
     Espelha exatamente o branch "Substituir tudo" do import de backup — é
     sempre a chave inteira, nunca item a item (fase 2 do plano, mesclagem
     granular, ainda não existe). Top-level (não só dentro de isDesktop) porque
     o celular também precisa dela. */
  function applySyncedKey(key, value){
    switch(key){
      case K_ROUTINES: routines = value; save(K_ROUTINES, routines); break;
      case K_NOTES: notes = value; save(K_NOTES, notes); break;
      case K_HISTORY: history = value; save(K_HISTORY, history); break;
      case K_TEMPLATES: templates = value; save(K_TEMPLATES, templates); break;
      case K_SNOOZES: snoozes = value; save(K_SNOOZES, snoozes); break;
      case K_TAREFAS: tarefas = value; saveTarefas(); break;
      case K_TAREFAS_HIST: tarefasHist = value; saveTarefasHist(); break;
      case K_DIARIO: diario = value; saveDiario(); break;
      case K_DIAKANBAN: diaKanban = value; saveDiaKanban(); break;
      case K_EXERCICIOS: exercicios = value; saveExercicios(); break;
      case K_COMPROMISSOS: compromissos = value; saveCompromissos(); break;
      // preferências de UI (ver nota em sync/engine.js sobre por que elas
      // entraram em SYNCED_KEYS mesmo fora de backupData()): aplicam o efeito
      // ao vivo, não só gravam a chave.
      case K_THEME: save(K_THEME, value); applyTheme(); break;
      case K_WEEKSTART: save(K_WEEKSTART, value); reancorarSemanaAtual(inicioSemanaISO(new Date())); break;
      default: return;
    }
    render();
  }
  /* No celular não existe canal de push (IPC) como no Electron: cada chamada de
     syncNow() já devolve quais chaves baixaram, então aplica ali mesmo, logo
     depois do syncNow() resolver — em vez de esperar um evento assíncrono. Lê
     de volta o MESMO arquivo que o SyncEngine (Java) acabou de gravar
     (Directory.Data/brita/<chave>.json, igual ao storageBackend nativo). */
  async function aplicarChavesSincronizadasNative(keys){
    if(!isNative || !keys || !keys.length) return;
    const FS = window.Capacitor.Plugins.Filesystem;
    for(const key of keys){
      try{
        const r = await FS.readFile({ path:"brita/"+key+".json", directory:"DATA", encoding:"utf8" });
        applySyncedKey(key, JSON.parse(r.data));
      }catch(e){ console.error("Falha ao aplicar chave sincronizada", key, e); }
    }
  }

  /* ---------------- Bridge para o servidor MCP embutido (desktop) ----------------
     Registrado só no Electron (isDesktop). O servidor MCP roda no main process e
     não conhece a lógica de negócio do app — cada tool cai aqui e reaproveita as
     mesmas funções que a UI já usa (registrarConclusao via concludeTarefa,
     sincronizarPontosCartao, saveTarefas, saveDiario, etc.), nunca reimplementa. */
  if(isDesktop){
    function mcpTagValor(v){ return ["nenhum","baixo","medio","alto"].includes(v) ? v : undefined; }
    const britaMCP = {
      list_routines(args){
        const apenasHoje = !!(args && args.apenas_hoje);
        return rotinasOrdenadas()
          .filter(r => !apenasHoje || rotinaOcorreHoje(r))
          .map(r => {
            const sch = computeSchedule(r) || {};
            return {
              id: r.id, name: r.name, icon: r.icon || "",
              agendada: !!(r.schedule && r.schedule.enabled),
              dias: (r.schedule && r.schedule.days) || [],
              horario: sch.startStr || null,
              passos: (r.steps||[]).length
            };
          });
      },
      get_today_agenda(){
        const iso = localKey();
        const chaveDia = diarioChave("dia", iso);
        return {
          data: iso,
          rotinas_hoje: rotinasOrdenadas().filter(rotinaOcorreHoje).map(r=>{
            const sch = computeSchedule(r) || {};
            return { id:r.id, name:r.name, horario: sch.startStr || null };
          }),
          diario: diario[chaveDia] || "",
          kanban: colunasKanban(perAtual("dia")).map(c=>({
            col:c.key, title:c.title,
            items:c.items.map(it=>({ id:it.id, texto:it.text, tagValor:it.tagValor||"nenhum" }))
          }))
        };
      },
      list_tasks(args){
        const eixo = args && args.eixo;
        const apenasAtivas = !args || args.apenas_ativas !== false;
        return tarefas
          .filter(m => !eixo || m.eixo === eixo)
          .filter(m => !apenasAtivas || tarefaAtiva(m))
          .map(m => ({
            id:m.id, eixo:m.eixo, area:m.area, tipo:m.tipo, conteudo:m.conteudo,
            tipoTarefa:m.tipoTarefa||"", dur:m.dur, tagValor:m.tagValor||"medio",
            lastDone:m.lastDone||null, ativa: tarefaAtiva(m)
          }));
      },
      list_metas(){
        const out = [];
        templates.filter(t=>t.type==="countdown").forEach(doc=>{
          (doc.targets||[]).forEach(t=>{
            out.push({
              id:t.id, title:t.title, date:t.date, diasRestantes: daysUntil(t.date),
              topics:t.topics, done:t.done||0, unit:t.unit||"", tagValor:t.tagValor||"alto"
            });
          });
        });
        return out;
      },
      read_note(args){
        const n = notes.find(x=>x.id===(args&&args.id));
        if(!n) throw new Error("nota não encontrada");
        return { id:n.id, title:n.title, content:n.content, createdAt:n.createdAt, updatedAt:n.updatedAt };
      },
      search_notes(args){
        const q = String((args&&args.query)||"").trim().toLowerCase();
        if(!q) return [];
        return notes
          .filter(n => (n.title||"").toLowerCase().includes(q) || (n.content||"").toLowerCase().includes(q))
          .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))
          .map(n => ({ id:n.id, title:n.title, snippet:(n.content||"").slice(0,200) }));
      },
      read_diario(args){
        const escopo = (args && args.escopo) || "dia";
        const iso = (args && args.iso) || localKey();
        const chave = diarioChave(escopo, iso);
        return { chave, texto: diario[chave] || "" };
      },
      get_gamificacao_status(){
        return { notaSemana: notaSemanaAtual(), ritmo: ritmoInfo(), pontosPorArea: pontosPorAreaSemana() };
      },

      create_task(args){
        const t = {
          id: uid(), eixo: args.eixo, area: args.area, tipo: args.tipo, conteudo: args.conteudo,
          tipoTarefa: args.tipo_tarefa || "", detalhes: args.detalhes || "",
          dur: args.dur || 15, tagValor: mcpTagValor(args.tag_valor) || "medio",
          lastDone: null, ord: tarefas.length, genero: "pool"
        };
        tarefas.push(t); saveTarefas(); render();
        return { id: t.id };
      },
      complete_task(args){
        const m = tarefas.find(x=>x.id===(args&&args.id));
        if(!m) throw new Error("tarefa não encontrada");
        concludeTarefa(m);
        render();
        return { id:m.id, lastDone:m.lastDone };
      },
      update_task(args){
        const m = tarefas.find(x=>x.id===(args&&args.id));
        if(!m) throw new Error("tarefa não encontrada");
        if(args.conteudo != null) m.conteudo = args.conteudo;
        if(args.detalhes != null) m.detalhes = args.detalhes;
        if(args.dur != null) m.dur = args.dur;
        if(mcpTagValor(args.tag_valor)) m.tagValor = args.tag_valor;
        saveTarefas(); render();
        return { id:m.id };
      },
      append_diario(args){
        const escopo = args.escopo || "dia";
        const iso = args.iso || localKey();
        const chave = diarioChave(escopo, iso);
        const atual = diario[chave] || "";
        diario[chave] = atual ? atual.replace(/\n*$/, "\n") + args.texto : args.texto;
        saveDiario(); render();
        return { chave };
      },
      add_kanban_card(args){
        const per = perAtual("dia");
        const naColuna = diaKanban.filter(c=>c.per===per && c.col==="todo").length;
        const card = { id: uid(), text: args.texto, col:"todo", per, ord: naColuna, tagValor: mcpTagValor(args.tag_valor) || "baixo" };
        if(args.eixo) card.eixo = args.eixo;
        diaKanban.push(card); saveDiaKanban(); render();
        return { id: card.id };
      },
      create_note(args){
        const n = { id: uid(), title: args.title || "(sem título)", content: args.content || "", subjects:[], createdAt:Date.now(), updatedAt:Date.now() };
        notes.push(n); save(K_NOTES, notes); render();
        return { id: n.id };
      },
      append_note(args){
        const n = notes.find(x=>x.id===(args&&args.id));
        if(!n) throw new Error("nota não encontrada");
        n.content = (n.content||"").replace(/\n*$/, "\n") + args.texto;
        n.updatedAt = Date.now();
        save(K_NOTES, notes); render();
        return { id:n.id };
      }
    };
    window.electronBridge.onMcpCall(async (tool, args) => {
      const fn = britaMCP[tool];
      if(!fn) throw new Error("tool desconhecida: " + tool);
      return fn(args || {});
    });

    // aplica o que o motor de sync (main process) já baixou e gravou em disco —
    // applySyncedKey é top-level agora, o celular também usa (ver mais acima)
    window.electronBridge.onSyncApplied((key, value) => applySyncedKey(key, value));
    window.electronBridge.onSyncConflict(() => {
      showAlertBanner("⚠️ Conflito de sincronização — resolva em Configurações → Backup");
    });
  }

  (function handleStartParam(){
    const params = new URLSearchParams(window.location.search);
    const startId = params.get("start");
    if(startId && routines.find(r=>r.id===startId)){
      startPlayer(startId);
      history_replaceUrl();
      return;
    }
    if(params.get("new") === "note"){
      view = { tab:"templates", screen:"templates" };
      openNoteEditor(null);
      history_replaceUrl();
      return;
    }
    if(params.get("quick") === "start"){
      history_replaceUrl();
      if(getPlayerSnapshot()){ resumePlayer(); return; }
      if(routines.length === 1){ startPlayer(routines[0].id); return; }
      // várias rotinas: fica na home para o usuário escolher
    }
  })();
  function history_replaceUrl(){
    try{ window.history.replaceState({}, "", window.location.pathname); }catch(e){}
  }

  document.addEventListener("visibilitychange", () => {
    if(document.hidden) return;
    if(view.screen === "player" && playerState){
      catchUpSteps();
      if(view.screen === "player"){
        render(); acquireWakeLock();
        if(currentStep().type==="timer" && !playerState.paused) startTicking();
        // o catch-up pode ter trocado a etapa: a bolha precisa saber
        sincronizarPlayerBackground();
      }
    }
    if(view.screen === "templateDoc"){
      const doc = templates.find(t=>t.id===view.id);
      if(doc && doc.type === "countdown") render(); // recalcular dias após virada de dia
    }
    checkSchedules();
  });

})();
</script>
