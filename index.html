      confirmModal("Desmarcar todos os itens para reusar a lista?", "Desmarcar", ()=>{ doc.items.forEach(i=>i.checked=false); saveTemplates(doc); paint(); });
    };
    document.getElementById("tvPdf").onclick = () => {
      let inner = "<h1>" + escapeHtml(doc.title) + "</h1>";
      const byCat = {};
      doc.items.forEach(it=>{ (byCat[it.cat||"Outros"] = byCat[it.cat||"Outros"]||[]).push(it); });
      doc.catOrder.concat(Object.keys(byCat).filter(c=>!doc.catOrder.includes(c))).forEach(cat=>{
        const list = byCat[cat]; if(!list || !list.length) return;
        inner += "<h2>" + escapeHtml(cat) + "</h2><ul>" + list.map(i=>`<li class="${i.checked?'done':''}">${i.checked?'☑':'☐'} ${escapeHtml(i.name)}${i.qty&&i.qty>1?' ×'+i.qty:''}</li>`).join("") + "</ul>";
      });
      exportPdfView(doc.title, inner, "Listas de viagem");
    };
  }

  function openNoteEditor(id){
    if(id){
      noteDraft = notes.find(n=>n.id===id);
      if(!noteDraft.subjects) noteDraft.subjects = [];
      noteDraftOriginal = { title: noteDraft.title, content: noteDraft.content, subjects: [...noteDraft.subjects], sinkChecked: noteDraft.sinkChecked, updatedAt: noteDraft.updatedAt };
    } else {
      noteDraft = { id: uid(), title: nomeAutoDoc(), content:"", subjects:[], updatedAt: Date.now(), createdAt: Date.now() };
      notes.push(noteDraft);
      save(K_NOTES, notes);
      noteDraftOriginal = null; // nota nova: sem versão anterior, "voltar" descarta apagando
    }
    goTo({ tab:"templates", screen:"noteEditor" });
  }
  /* Restaura noteDraft para o estado de quando o editor abriu (ou apaga, se a
     nota é nova) — usado pelo "voltar" do editor de nota, tanto pelo botão
     quanto pelo back nativo do Android, para descartar a sessão de edição. */
  function descartarEdicaoNota(){
    if(!noteDraft) return;
    if(noteDraftOriginal){
      Object.assign(noteDraft, noteDraftOriginal);
      save(K_NOTES, notes);
      syncNoteMd(noteDraft);
    } else {
      notes = notes.filter(n=>n.id!==noteDraft.id);
      save(K_NOTES, notes);
    }
    noteDraftOriginal = null;
  }
  /* sugestões vêm dos assuntos já usados nas outras notas */
  function noteSubjectsPool(excludeId){
    const set = new Set();
    notes.filter(n=>n.id!==excludeId).forEach(n=>(n.subjects||[]).forEach(s=>set.add(s)));
    return [...set];
  }

  /* ---------- Live editor helpers ---------- */
  /* aceita "[]", "[ ]", "[x]", "- []", "- [ ]" e ainda "[>]" — o estado "adiado",
     mesma convenção do plugin Tasks do Obsidian, usado ao arrastar um bloco da
     agenda do Diário para a direita */
  const RE_CHECK = /^(\s*)(-\s*)?\[( |x|X|>)?\]\s?(.*)$/;
  function estadoCheck(m){ const c = (m[3]||" ").toLowerCase(); return c === "x" ? "feito" : (c === ">" ? "adiado" : "aberto"); }
  const RE_HEAD  = /^(#{1,3})\s+(.*)$/;
  const RE_UL    = /^[-*]\s+(.*)$/;
  const RE_OL    = /^(\d+)\.\s+(.*)$/;
  const RE_TOGGLE = /^>\s?(.*)$/;                           // dialeto Notion: "> " cria lista toggle
  /* Indentação em espaços, como o resto do mundo markdown (Obsidian, GitHub).
     Mora aqui junto das outras constantes de parsing porque renderMdBlock
     e renderLiveEditor usam nivelIndent para o recuo visual — declarado lá
     embaixo (na barra de atalhos) ficaria em TDZ para eles. */
  const INDENT_PASSO = "  ";       // 2 espaços por nível
  const INDENT_MAX   = 6;
  function nivelIndent(raw){ return Math.floor((String(raw).match(/^ */)[0].length) / INDENT_PASSO.length); }
  /* Separa recuo do conteúdo: sem isso, alternar lista/título numa linha
     indentada devolveria a linha para a margem (o `.trim()` comia o recuo). */
  function partesIndent(raw){
    const m = String(raw).match(/^( *)([\s\S]*)$/);
    return { pad: m[1], corpo: m[2].trim() };
  }
  const RE_HR     = /^(-{3,}|\*{3,}|_{3,})$/;               // divisor "---"

  // estado de abertura/fechamento dos toggles (por nota, por linha — só na sessão)
  const toggleState = {};
  function toggleKey(noteId, idx){ return noteId + ":" + idx; }
  function isToggleCollapsed(noteId, idx){ return !!toggleState[toggleKey(noteId, idx)]; }
  function flipToggle(noteId, idx){ toggleState[toggleKey(noteId, idx)] = !toggleState[toggleKey(noteId, idx)]; }
  // filhos de um toggle: linhas seguintes até linha vazia, título, divisor ou outro toggle
  function toggleChildrenMap(lines){
    const childOf = {}; // idx da linha filha -> idx do toggle pai
    lines.forEach((raw, i)=>{
      if(!raw.trim().match(RE_TOGGLE)) return;
      for(let j=i+1; j<lines.length; j++){
        const t = lines[j].trim();
        if(t === "" || t.match(RE_TOGGLE) || t.match(RE_HEAD) || t.match(RE_HR)) break;
        childOf[j] = i;
      }
    });
    return childOf;
  }

  function mdInline(t){
    return t.replace(/\[\[([^\[\]]+?)\]\]/g,'<span class="wikilink" data-wikilink="$1">$1</span>')
            .replace(/(^|\s)#([\p{L}0-9_\-]+)/gu,'$1<span class="tag-token">#$2</span>')
            .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
            .replace(/\*(.+?)\*/g,"<em>$1</em>")
            .replace(/~~(.+?)~~/g,"<s>$1</s>")
            .replace(/`(.+?)`/g,"<code>$1</code>");
  }

  /* Renderizador de bloco markdown genérico (negrito/itálico/riscado/código, links,
     tags, cabeçalhos, listas ordenadas/não ordenadas, checklist clicável e toggle) —
     usado tanto pelas notas comuns quanto pelas anotações de journaling de rotina.
     `keyId` identifica o dono do texto (nota ou seção) para o estado de toggles. */
  function renderMdBlock(text, keyId, emptyMsg){
    const lines = text && text.length ? text.split("\n") : [];
    const childOf = toggleChildrenMap(lines);
    let out = "";
    lines.forEach((raw,i)=>{
      if(childOf[i] !== undefined && isToggleCollapsed(keyId, childOf[i])) return;
      const t = raw.trim();
      // mesmo recuo de nível do editor contínuo, para a nota lida bater com a escrita
      const recuo = nivelIndent(raw);
      const est_ = recuo ? ` style="margin-left:${recuo*18}px;"` : "";
      let m;
      if(t === ""){ out += '<div class="live-line empty">&nbsp;</div>'; return; }
      if(t.match(RE_HR)){ out += '<div style="border-top:1px solid var(--border, rgba(128,128,128,.35)); margin:8px 0;"></div>'; return; }
      if((m = t.match(RE_TOGGLE))){
        const collapsed = isToggleCollapsed(keyId, i);
        out += `<div class="live-line li-line"${est_}><span class="li-marker" data-ovtoggle="${i}" style="cursor:pointer; user-select:none;">${collapsed?svgIcon(ICON_D.chevronRight,13):svgIcon(ICON_D.chevronDown,13)}</span> <strong>${mdInline(escapeHtml(m[1]))}</strong></div>`;
        return;
      }
      if((m = t.match(RE_CHECK))){
        const est = estadoCheck(m);
        out += `<div class="checklist-item ${est==='feito'?'checked':''} ${est==='adiado'?'adiado':''}"${est_}><span class="checklist-box" data-ovcheck="${i}">${est==='feito'?svgIcon(ICON_D.check,14):(est==='adiado'?svgIcon(ICON_D.chevronRight,13):'')}</span><span class="txt">${mdInline(escapeHtml(m[4]))}</span></div>`;
        return;
      }
      if((m = t.match(RE_HEAD))){ const lv=m[1].length; out += `<h${lv} class="inline-h">${mdInline(escapeHtml(m[2]))}</h${lv}>`; return; }
      if((m = t.match(RE_OL))){ out += `<div class="live-line li-line"${est_}><span class="li-marker">${m[1]}.</span> ${mdInline(escapeHtml(m[2]))}</div>`; return; }
      if((m = t.match(RE_UL))){ out += `<div class="live-line li-line"${est_}><span class="li-marker">&bull;</span> ${mdInline(escapeHtml(m[1]))}</div>`; return; }
      out += `<div class="live-line">${mdInline(escapeHtml(raw))}</div>`;
    });
    return out || `<p style="color:var(--muted)">${emptyMsg||"Sem conteúdo."}</p>`;
  }
  function toggleCheckLineInText(text, idx){
    const lines = text && text.length ? text.split("\n") : [""];
    const m = (lines[idx]||"").match(RE_CHECK);
    if(!m) return text;
    // adiado também volta para feito ao tocar na caixa — só o "aberto" alterna
    const checked = estadoCheck(m) === "feito";
    lines[idx] = m[1] + (m[2]||"") + "[" + (checked?" ":"x") + "] " + m[4];
    return lines.join("\n");
  }
  /* alterna uma linha de checklist entre um estado e "aberto" (usado por adiar) */
  function setCheckStateInText(text, idx, char){
    const lines = text && text.length ? text.split("\n") : [""];
    const m = (lines[idx]||"").match(RE_CHECK);
    if(!m) return text;
    const atual = (m[3]||" ").toLowerCase();
    const novo = atual === char.toLowerCase() ? " " : char;
    lines[idx] = m[1] + (m[2]||"") + "[" + novo + "] " + m[4];
    return lines.join("\n");
  }

  function openNoteByTitle(title){
    const t = title.trim().toLowerCase();
    let target = notes.find(n => (n.title||"").trim().toLowerCase() === t);
    if(!target){
      target = { id: uid(), title: title.trim(), content: "", updatedAt: Date.now(), pinned:false };
      notes.push(target);
      save(K_NOTES, notes);
    }
    openNoteEditor(target.id);
  }

  /* ============ EDITOR MARKDOWN CONTÍNUO ============
     Uma única superfície contenteditable com todas as linhas: as que não têm o
     cursor aparecem formatadas, a do cursor mostra o markdown cru — é o modelo
     de "live preview" do Obsidian. O texto é a fonte da verdade; edições que
     mudam a estrutura (Enter, Backspace no início, seleção de várias linhas,
     colagem) são interceptadas e aplicadas ao texto, e só então a tela é
     redesenhada. A digitação comum cai direto na linha crua, sem interceptação,
     para não brigar com o teclado/IME do Android.

     A fonte do texto é plugável (liveCtx), então Notas simples, Diário e
     anotações de journaling usam o mesmo editor e o mesmo parser. */
  let liveCtx = null;
  let liveCaret = { line: 0, col: 0 };
  /* "salvo às HH:MM" — não mexe no DOM do editor (que perderia o cursor se
     fosse redesenhado); só atualiza um <span> à parte, fora do contenteditable. */
  let liveSavedAt = null;
  function marcarLiveSalvo(){
    liveSavedAt = Date.now();
    document.querySelectorAll(".live-saved-badge").forEach(b=>{ b.textContent = "salvo às " + fmtClock(new Date(liveSavedAt)); });
  }

  function noteLiveCtx(){
    return {
      id: () => noteDraft.id,
      getText: () => noteDraft.content || "",
      setText: t => { noteDraft.content = t; noteDraft.updatedAt = Date.now(); save(K_NOTES, notes); marcarLiveSalvo(); },
      sinkChecked: () => !!noteDraft.sinkChecked
    };
  }
  function liveLines(){ const t = liveCtx.getText(); return t.length ? t.split("\n") : [""]; }
  function commitLines(lines){ liveCtx.setText(lines.join("\n")); }

  /* conversão entre {linha,coluna} e deslocamento absoluto no texto */
  function liveOffset(lines, pos){
    let o = 0;
    for(let i = 0; i < pos.line && i < lines.length; i++) o += lines[i].length + 1;
    return o + pos.col;
  }
  function livePos(texto, off){
    const lines = texto.length ? texto.split("\n") : [""];
    let o = 0;
    for(let i = 0; i < lines.length; i++){
      if(off <= o + lines[i].length) return { line: i, col: off - o };
      o += lines[i].length + 1;
    }
    return { line: lines.length - 1, col: lines[lines.length - 1].length };
  }
  /* texto cru entre duas posições (para a barra markdown saber o que embrulhar) */
  function liveTextoEntre(a, b){
    const lines = liveLines();
    const t = lines.join("\n");
    const ia = liveOffset(lines, a), ib = liveOffset(lines, b);
    return t.slice(Math.min(ia,ib), Math.max(ia,ib));
  }
  /* substitui o trecho entre duas posições e devolve o cursor resultante */
  function liveAplicar(a, b, texto){
    const lines = liveLines();
    const t = lines.join("\n");
    const ia = liveOffset(lines, a), ib = liveOffset(lines, b);
    const lo = Math.min(ia, ib), hi = Math.max(ia, ib);
    const novo = t.slice(0, lo) + texto + t.slice(hi);
    liveCtx.setText(novo);
    return livePos(novo, lo + texto.length);
  }
  /* prefixo que a lista repassa para a linha seguinte no Enter */
  function livePrefixoContinuacao(raw){
    let m;
    if((m = raw.match(RE_CHECK))) return (m[1] || "") + (m[2] ? "- [ ] " : "[ ] ");
    if((m = raw.match(RE_OL)))    return (+m[1] + 1) + ". ";
    if((m = raw.match(RE_UL)))    return "- ";
    return "";
  }
  /* item de lista vazio: o Enter sai da lista em vez de criar outro item vazio */
  function liveListaVazia(raw){
    let m;
    if((m = raw.match(RE_CHECK))) return m[4].trim() === "";
    if((m = raw.match(RE_OL)))    return m[2].trim() === "";
    if((m = raw.match(RE_UL)))    return m[1].trim() === "";
    return false;
  }

  let undoTimer = null;
  function showUndoBanner(text, onUndo){
    let banner = document.getElementById("undoBanner");
    if(banner) banner.remove();
    if(undoTimer){ clearTimeout(undoTimer); undoTimer = null; }
    banner = document.createElement("div");
    banner.id = "undoBanner";
    banner.style.top = "auto";
    banner.style.bottom = "calc(var(--tabbar-h) + var(--safe-bottom) + 14px)";
    banner.className = "alert-banner undo-banner";
    banner.innerHTML = `<span>${text}</span><button class="undo-btn">Desfazer</button>`;
    document.body.appendChild(banner);
    banner.querySelector(".undo-btn").onclick = () => { banner.remove(); onUndo(); };
    undoTimer = setTimeout(()=>{ banner.classList.add("hide"); setTimeout(()=>{ if(banner.parentNode) banner.remove(); }, 400); }, 6000);
    attachSwipeDismiss(banner, () => { if(undoTimer){ clearTimeout(undoTimer); undoTimer=null; } });
  }

  function toggleCheckLine(idx){
    const ctx = liveCtx;
    const textoAntes = ctx.getText();
    const lines = liveLines();
    const m = (lines[idx]||"").match(RE_CHECK);
    if(!m) return;
    const checked = estadoCheck(m) === "feito";
    lines[idx] = m[1] + (m[2]||"") + "[" + (checked?" ":"x") + "] " + m[4];
    // marcou (não desmarcou) + nota configurada para afundar: move para o fim do bloco de checklist
    if(!checked && ctx.sinkChecked()){
      let end = idx;
      while(end+1 < lines.length && (lines[end+1]||"").match(RE_CHECK)) end++;
      if(end > idx){
        const [moved] = lines.splice(idx,1);
        lines.splice(end,0,moved);
      }
    }
    commitLines(lines);
    renderLiveEditor();
    showUndoBanner(checked ? "Item desmarcado" : "Item marcado", ()=>{
      ctx.setText(textoAntes);
      if(liveCtx === ctx) renderLiveEditor();
    });
  }

  /* ---- leitura da posição do cursor dentro da superfície ---- */
  function liveDivDaLinha(box, node){
    let el = node && node.nodeType === 3 ? node.parentElement : node;
    while(el && el !== box && (!el.dataset || el.dataset.idx === undefined)) el = el.parentElement;
    return el && el !== box ? el : null;
  }
  /* coluna real dentro da linha: o navegador pode ter quebrado o texto em
     vários nós, então soma o comprimento de tudo que vem antes do nó do cursor */
  function liveColunaNoDiv(div, node, offset){
    let col = 0, achou = false;
    (function anda(n){
      if(achou) return;
      if(n === node){
        if(n.nodeType === 3){ col += offset; }
        else { for(let k = 0; k < offset && k < n.childNodes.length; k++) anda(n.childNodes[k]); }
        achou = true; return;
      }
      if(n.nodeType === 3){ col += n.data.length; return; }
      for(const c of n.childNodes){ anda(c); if(achou) return; }
    })(div);
    return col;
  }
  function livePosDe(box, node, offset){
    const div = liveDivDaLinha(box, node);
    if(!div) return null;
    const i = +div.dataset.idx;
    const raw = liveLines()[i] || "";
    const col = liveColunaNoDiv(div, node, offset);
    if(div.classList.contains("live-raw")) return { line: i, col: Math.min(col, raw.length) };
    /* linha formatada: o texto exibido é menor que o cru (sintaxe escondida).
       A diferença fica quase toda no começo da linha, então deslocar o cursor
       por ela acerta o caso comum de clicar no meio de um parágrafo. */
    const delta = raw.length - (div.textContent || "").length;
    return { line: i, col: Math.max(0, Math.min(raw.length, col + delta)) };
  }
  function liveSelecao(box){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return null;
    const a = livePosDe(box, sel.anchorNode, sel.anchorOffset);
    const f = livePosDe(box, sel.focusNode, sel.focusOffset);
    if(!a || !f) return null;
    return { a, f, colapsada: sel.isCollapsed };
  }

  /* ---- desenho ---- */
  let liveFocado = false;
  let liveRedesenhando = false;

  /* Tipografia da linha crua, espelhando o bloco em que ela se transforma quando
     formatada: título continua grande, item de lista continua indentado. É o que
     impede o texto de mudar de tamanho e a página de pular quando o cursor troca
     de linha — sem isso o editor "parece" trabalhar linha a linha. */
  function classeCruaDaLinha(raw){
    const t = raw.trim();
    const h = t.match(RE_HEAD);
    if(h) return " live-raw-h" + h[1].length;
    if(RE_CHECK.test(t) || RE_OL.test(t) || RE_UL.test(t) || RE_TOGGLE.test(t)) return " live-raw-li";
    return "";
  }

  function renderLiveEditor(caret){
    const box = document.getElementById("liveEditor");
    if(!box || !liveCtx) return;
    if(caret) liveCaret = caret;
    const lines = liveLines();
    liveCaret.line = Math.max(0, Math.min(liveCaret.line, lines.length - 1));
    liveCaret.col  = Math.max(0, Math.min(liveCaret.col, lines[liveCaret.line].length));
    // sem foco, tudo aparece formatado — como o Obsidian fora do modo de edição
    const linhaCrua = liveFocado ? liveCaret.line : -1;
    const childOf = toggleChildrenMap(lines);
    const nid = liveCtx.id();

    liveRedesenhando = true;
    box.contentEditable = "true";
    box.innerHTML = "";
    lines.forEach((raw, i)=>{
      // filhos de toggle fechado ficam escondidos, menos a linha do cursor
      if(childOf[i] !== undefined && isToggleCollapsed(nid, childOf[i]) && i !== linhaCrua) return;
      const div = document.createElement("div");
      div.dataset.idx = i;
      /* Recuo visual do nível de indentação. Aplicado TAMBÉM na linha crua, e
         com o mesmo valor: se só a formatada recuasse, o texto pularia para o
         lado toda vez que o cursor entrasse na linha — exatamente o efeito de
         "editor trabalhando linha a linha" que já foi reclamação. */
      const recuo = nivelIndent(raw);
      if(recuo) div.style.marginLeft = (recuo * 18) + "px";
      if(i === linhaCrua){
        // a linha crua PRECISA continuar sendo um único nó de texto:
        // liveColocarCursor posiciona o cursor em div.firstChild
        div.className = "live-line live-raw" + classeCruaDaLinha(raw);
        if(raw === "") div.innerHTML = "<br>"; else div.textContent = raw;
        box.appendChild(div);
        return;
      }
      div.className = "live-line";
      let m;
      if(raw.trim() === ""){
        div.classList.add("empty");
        div.innerHTML = "<br>";
      } else if(raw.trim().match(RE_HR)){
        div.innerHTML = `<div class="live-hr"></div>`;
      } else if((m = raw.trim().match(RE_TOGGLE))){
        const collapsed = isToggleCollapsed(nid, i);
        div.classList.add("li-line");
        div.innerHTML = `<span class="li-marker" data-toggle="${i}">${collapsed?svgIcon(ICON_D.chevronRight,13):svgIcon(ICON_D.chevronDown,13)}</span> <strong>${mdInline(escapeHtml(m[1]))}</strong>`;
      } else if((m = raw.trim().match(RE_CHECK))){
        const est = estadoCheck(m);
        div.className = "checklist-item live-line" + (est==="feito"?" checked":"") + (est==="adiado"?" adiado":"");
        div.dataset.idx = i;
        div.innerHTML = `<span class="checklist-box" data-check="${i}">${est==="feito"?svgIcon(ICON_D.check,14):(est==="adiado"?svgIcon(ICON_D.chevronRight,13):'')}</span><span class="txt">${mdInline(escapeHtml(m[4]))}</span>`;
      } else if((m = raw.trim().match(RE_HEAD))){
        div.innerHTML = `<h${m[1].length} class="inline-h">${mdInline(escapeHtml(m[2]))}</h${m[1].length}>`;
      } else if((m = raw.trim().match(RE_OL))){
        div.classList.add("li-line");
        div.innerHTML = `<span class="li-marker">${m[1]}.</span> ${mdInline(escapeHtml(m[2]))}`;
      } else if((m = raw.trim().match(RE_UL))){
        div.classList.add("li-line");
        div.innerHTML = `<span class="li-marker">&bull;</span> ${mdInline(escapeHtml(m[1]))}`;
      } else {
        div.innerHTML = mdInline(escapeHtml(raw));
      }
      box.appendChild(div);
    });

    if(!box.dataset.wired){ liveWire(box); box.dataset.wired = "1"; }
    if(liveFocado) liveColocarCursor(box);
    liveRedesenhando = false;
    atualizarBarraMarkdown();
  }

  /* ---- barra de atalhos markdown acima do teclado (estilo Obsidian) ----
     Fica fixa no rodapé e some/aparece com o foco do editor contínuo; a
     posição vertical acompanha a altura do teclado via visualViewport, já
     que o WebView/navegador não redimensiona o layout sozinho. */
  const MD_TOOLBAR_BOTOES = [
    { label:"B", cls:"md-tb-b", title:"Negrito", acao: () => mdToolbarEmbrulhar("**") },
    { label:"I", cls:"md-tb-i", title:"Itálico",  acao: () => mdToolbarEmbrulhar("*") },
    { label:"H", title:"Título",  acao: () => mdToolbarPrefixo(raw => {
        const { pad, corpo } = partesIndent(raw);
        return pad + (RE_HEAD.test(corpo) ? corpo.replace(RE_HEAD, "$2") : "## " + corpo);
      }) },
    { label:"&bull;", title:"Lista", acao: () => mdToolbarPrefixo(raw => {
        const { pad, corpo } = partesIndent(raw);
        return pad + (RE_UL.test(corpo) ? corpo.replace(RE_UL, "$1") : "- " + corpo);
      }) },
    { label:"1.", title:"Lista numerada", acao: () => mdToolbarPrefixo(raw => {
        const { pad, corpo } = partesIndent(raw);
        return pad + (RE_OL.test(corpo) ? corpo.replace(RE_OL, "$2") : "1. " + corpo);
      }) },
    { label:"&#9744;", title:"Checklist", acao: () => mdToolbarPrefixo(raw => {
        const { pad, corpo } = partesIndent(raw);
        const m = corpo.match(RE_CHECK);
        return pad + (m ? m[4] : "- [ ] " + corpo);
      }) },
    { label:svgIcon(ICON_D.chevronDoubleLeft,14), title:"Diminuir recuo", acao: () => mdToolbarPrefixo(raw =>
        raw.replace(new RegExp("^ {1," + INDENT_PASSO.length + "}"), "")) },
    { label:svgIcon(ICON_D.chevronDoubleRight,14), title:"Aumentar recuo", acao: () => mdToolbarPrefixo(raw =>
        // linha vazia não ganha recuo: viraria só espaço solto no texto
        raw.trim() === "" || nivelIndent(raw) >= INDENT_MAX ? raw : INDENT_PASSO + raw) }
  ];
  function ensureMdToolbar(){
    let bar = document.getElementById("mdToolbar");
    if(bar) return bar;
    bar = document.createElement("div");
    bar.id = "mdToolbar";
    bar.className = "md-toolbar";
    bar.innerHTML = MD_TOOLBAR_BOTOES.map((b,i)=>
      `<button type="button" class="md-tb-btn ${b.cls||''}" data-mdtb="${i}" title="${b.title}" aria-label="${b.title}">${b.label}</button>`
    ).join("");
    /* Um só caminho, `pointerdown`, para mouse e toque.
       Era aqui o bug do celular: o preventDefault do `touchstart` (necessário
       para o editor não perder o foco e a seleção) TAMBÉM cancela os eventos
       de compatibilidade que o navegador sintetiza depois — inclusive o
       `click`. No desktop o preventDefault do `mousedown` não cancela o click,
       então os botões funcionavam lá e só lá. Agindo no próprio pointerdown a
       ação acontece antes de qualquer disputa de foco, nos dois ambientes. */
    bar.addEventListener("pointerdown", e => {
      const btn = e.target.closest("[data-mdtb]");
      e.preventDefault(); // segura o foco no editor mesmo em toque fora de botão
      if(!btn) return;
      MD_TOOLBAR_BOTOES[+btn.dataset.mdtb].acao();
    });
    document.body.appendChild(bar);
    return bar;
  }
  function atualizarBarraMarkdown(){
    const editorNaTela = !!document.getElementById("liveEditor");
    const bar = ensureMdToolbar();
    if(!editorNaTela || !liveFocado){ bar.classList.remove("show"); return; }
    bar.classList.add("show");
    const vv = window.visualViewport;
    bar.style.bottom = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px" : "0px";
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", atualizarBarraMarkdown);
    window.visualViewport.addEventListener("scroll", atualizarBarraMarkdown);
  }
  /* embrulha a seleção (ou insere o par com o cursor no meio, sem seleção) */
  function mdToolbarEmbrulhar(marker){
    const box = document.getElementById("liveEditor");
    if(!box || !liveCtx) return;
    const p = liveSelecao(box);
    if(!p) return;
    const selText = liveTextoEntre(p.a, p.f);
    const pos = liveAplicar(p.a, p.f, marker + selText + marker);
    if(p.colapsada){
      const lines = liveLines();
      const off = liveOffset(lines, pos) - marker.length;
      renderLiveEditor(livePos(lines.join("\n"), off));
    } else {
      renderLiveEditor(pos);
    }
  }
  /* aplica um prefixo/estrutura de linha (título, lista, checklist) a cada
     linha selecionada — alterna se já estiver aplicado, igual ao editor. */
  function mdToolbarPrefixo(fn){
    const box = document.getElementById("liveEditor");
    if(!box || !liveCtx) return;
    const p = liveSelecao(box);
    if(!p) return;
    const lines = liveLines();
    const l1 = Math.min(p.a.line, p.f.line), l2 = Math.max(p.a.line, p.f.line);
    for(let i = l1; i <= l2; i++) lines[i] = fn(lines[i]);
    commitLines(lines);
    renderLiveEditor({ line: p.f.line, col: lines[p.f.line].length });
  }

  /* Enter: quebra a linha e repassa o marcador da lista para a linha nova —
     é o que dá a sensação de continuidade ao escrever listas. */
  function liveEnter(p){
    const lines = liveLines();
    const raw = lines[p.f.line] || "";
    const multi = p.a.line !== p.f.line;
    // item de lista vazio + Enter: sai da lista em vez de repetir o marcador
    if(!multi && p.colapsada && liveListaVazia(raw)){
      renderLiveEditor(liveAplicar({ line:p.f.line, col:0 }, { line:p.f.line, col:raw.length }, ""));
      return;
    }
    const prefixo = (multi || !p.colapsada) ? "" : livePrefixoContinuacao(raw.slice(0, p.f.col));
    renderLiveEditor(liveAplicar(p.a, p.f, "\n" + prefixo));
  }

  /* entra em edição com o cursor no ponto tocado (aproximado em linha formatada) */
  function liveFocarNoPonto(box, x, y){
    let pos = null;
    if(document.caretRangeFromPoint){
      const r = document.caretRangeFromPoint(x, y);
      if(r) pos = livePosDe(box, r.startContainer, r.startOffset);
    } else if(document.caretPositionFromPoint){
      const c = document.caretPositionFromPoint(x, y);
      if(c) pos = livePosDe(box, c.offsetNode, c.offset);
    }
    liveFocado = true;
    renderLiveEditor(pos || liveCaret);
  }
  function liveColocarCursor(box){
    const div = box.querySelector(`[data-idx="${liveCaret.line}"]`);
    if(!div) return;
    // redesenhar o innerHTML destrói o nó focado: o foco precisa voltar aqui,
    // no mesmo ciclo, senão o blur derruba o modo de edição
    if(document.activeElement !== box){
      try{ box.focus({ preventScroll:true }); }catch(e){ box.focus(); }
    }
    const sel = window.getSelection();
    const range = document.createRange();
    const node = div.firstChild;
    if(node && node.nodeType === 3) range.setStart(node, Math.min(liveCaret.col, node.data.length));
    else range.setStart(div, 0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* ---- eventos: ligados uma vez por superfície ---- */
  function liveWire(box){
    /* Alvos de ação dentro de uma linha formatada (checkbox, toggle, wikilink)
       não podem mover o cursor nem tirar o foco — daí o preventDefault no
       mousedown, antes de o navegador reposicionar a seleção. */
    const alvoAcao = t => t && t.dataset &&
      (t.dataset.check !== undefined || t.dataset.toggle !== undefined || t.dataset.wikilink !== undefined);
    box.addEventListener("mousedown", e => { if(alvoAcao(e.target)) e.preventDefault(); });
    box.addEventListener("touchstart", e => { if(alvoAcao(e.target)) e.preventDefault(); }, { passive:false });

    box.addEventListener("click", e => {
      const t = e.target;
      if(t && t.dataset){
        if(t.dataset.toggle !== undefined){ flipToggle(liveCtx.id(), +t.dataset.toggle); renderLiveEditor(); return; }
        if(t.dataset.check !== undefined){ toggleCheckLine(+t.dataset.check); return; }
        if(t.dataset.wikilink){ openNoteByTitle(t.dataset.wikilink); return; }
      }
      // Tocar no texto entra em edição naquele ponto. Não dá para depender só do
      // foco nativo do contenteditable: em linha formatada ele nem sempre vem.
      // Mas esse "click" também dispara depois de um arrastar-para-selecionar
      // (mousedown e mouseup no mesmo alvo) — se já existe uma seleção de
      // verdade nesse momento, é isso, e reposicionar o cursor aqui colapsaria
      // a seleção que acabou de ser feita.
      const selAtual = window.getSelection();
      if(selAtual && !selAtual.isCollapsed) return;
      liveFocarNoPonto(box, e.clientX, e.clientY);
    });

    box.addEventListener("focus", () => {
      if(liveFocado) return;
      liveFocado = true;
      const p = liveSelecao(box);
      if(p) liveCaret = p.f;
      renderLiveEditor();
    });
    box.addEventListener("blur", () => {
      // o blur também acontece durante o redesenho; só conta se o foco de fato
      // saiu do editor depois que a poeira baixou
      setTimeout(()=>{
        if(liveRedesenhando || document.activeElement === box) return;
        if(!document.body.contains(box)) return;
        liveFocado = false;
        renderLiveEditor(); // fora de foco tudo volta a aparecer formatado
      }, 80);
    });

    /* O cursor mudou de linha: a linha nova precisa virar crua e a antiga,
       formatada. Só redesenha quando a linha muda, para não atrapalhar a
       digitação nem a seleção dentro da mesma linha.
       Enquanto a seleção não está colapsada (arrastando para selecionar,
       inclusive atravessando linhas), NÃO redesenha: recriar o DOM no meio
       de um arrastar derruba a âncora da seleção nativa do navegador — era
       isso que limitava a seleção a uma linha por vez. Sem redesenhar, a
       seleção sobre linhas formatadas fica sobre o texto renderizado (sem a
       sintaxe markdown), o que já basta para copiar; editar (apagar/colar)
       nela continua funcionando via liveSelecao, que mapeia a posição de
       volta pro texto cru mesmo em linha formatada. */
    document.addEventListener("selectionchange", () => {
      if(liveRedesenhando || !liveFocado) return;
      if(!document.getElementById("liveEditor")) return;
      const b = document.getElementById("liveEditor");
      if(!b.contains(document.activeElement) && document.activeElement !== b) return;
      const p = liveSelecao(b);
      if(!p) return;
      if(!p.colapsada){ liveCaret = p.f; return; }
      if(p.f.line !== liveCaret.line) renderLiveEditor(p.f);
      else liveCaret = p.f;
    });

    /* Enter/Backspace/Delete vêm pelo keydown: é o caminho confiável em todos os
       motores. O beforeinput continua tratando os mesmos casos para teclados que
       só emitem inputType (Android costuma fazer isso na tecla de envio). */
    box.addEventListener("keydown", e => {
      const p = liveSelecao(box);
      if(!p) return;
      const lines = liveLines();
      if(e.key === "Enter"){
        e.preventDefault();
        liveEnter(p);
        return;
      }
      if(e.key === "Backspace" && p.colapsada && p.f.col === 0 && p.f.line > 0){
        e.preventDefault();
        renderLiveEditor(liveAplicar(
          { line: p.f.line - 1, col: lines[p.f.line-1].length },
          { line: p.f.line, col: 0 }, ""));
        return;
      }
      if(e.key === "Delete" && p.colapsada && p.f.col >= lines[p.f.line].length && p.f.line < lines.length - 1){
        e.preventDefault();
        renderLiveEditor(liveAplicar(p.f, { line: p.f.line + 1, col: 0 }, ""));
        return;
      }
      // seleção cruzando linhas: aplicamos no texto, o navegador não sabe o cru
      if(!p.colapsada && p.a.line !== p.f.line && (e.key === "Backspace" || e.key === "Delete")){
        e.preventDefault();
        renderLiveEditor(liveAplicar(p.a, p.f, ""));
        return;
      }
      if(e.key === "Home"){ e.preventDefault(); renderLiveEditor({ line:p.f.line, col:0 }); return; }
      if(e.key === "End"){ e.preventDefault(); renderLiveEditor({ line:p.f.line, col:lines[p.f.line].length }); return; }
      if(e.key === "ArrowUp" && p.colapsada && p.f.line > 0){
        e.preventDefault();
        renderLiveEditor({ line: p.f.line - 1, col: Math.min(p.f.col, lines[p.f.line-1].length) });
      } else if(e.key === "ArrowDown" && p.colapsada && p.f.line < lines.length - 1){
        e.preventDefault();
        renderLiveEditor({ line: p.f.line + 1, col: Math.min(p.f.col, lines[p.f.line+1].length) });
      } else if(e.key === "ArrowLeft" && p.colapsada && p.f.col === 0 && p.f.line > 0){
        e.preventDefault();
        renderLiveEditor({ line: p.f.line - 1, col: lines[p.f.line-1].length });
      } else if(e.key === "ArrowRight" && p.colapsada && p.f.col >= lines[p.f.line].length && p.f.line < lines.length - 1){
        e.preventDefault();
        renderLiveEditor({ line: p.f.line + 1, col: 0 });
      } else if(e.key === "Escape"){
        e.preventDefault(); box.blur();
      }
    });

    box.addEventListener("paste", e => {
      const texto = (e.clipboardData || window.clipboardData).getData("text");
      if(texto == null) return;
      e.preventDefault();
      const p = liveSelecao(box);
      if(!p) return;
      renderLiveEditor(liveAplicar(p.a, p.f, texto.replace(/\r/g, "")));
    });

    box.addEventListener("beforeinput", e => {
      const p = liveSelecao(box);
      if(!p) return;
      const tipo = e.inputType || "";
      const multi = p.a.line !== p.f.line;

      if(tipo === "insertParagraph" || tipo === "insertLineBreak"){
        e.preventDefault();
        liveEnter(p);
        return;
      }
      if(tipo === "insertFromPaste" || tipo === "insertFromDrop"){ e.preventDefault(); return; }

      // seleção cruzando linhas, ou cursor fora da linha crua: aplicamos no texto
      if(multi || p.f.line !== liveCaret.line || p.a.line !== liveCaret.line){
        e.preventDefault();
        if(tipo.startsWith("delete")){
          let a = p.a, f = p.f;
          if(p.colapsada){
            if(tipo.indexOf("Forward") >= 0) f = livePos(liveCtx.getText(), liveOffset(liveLines(), f) + 1);
            else a = livePos(liveCtx.getText(), Math.max(0, liveOffset(liveLines(), a) - 1));
          }
          renderLiveEditor(liveAplicar(a, f, ""));
        } else if(tipo.startsWith("insert")){
          renderLiveEditor(liveAplicar(p.a, p.f, e.data || ""));
        }
        return;
      }

      // Backspace no começo da linha: junta com a anterior
      if(tipo === "deleteContentBackward" && p.colapsada && p.f.col === 0 && p.f.line > 0){
        e.preventDefault();
        const lines = liveLines();
        renderLiveEditor(liveAplicar(
          { line: p.f.line - 1, col: lines[p.f.line-1].length },
          { line: p.f.line, col: 0 }, ""));
        return;
      }
      // Delete no fim da linha: puxa a seguinte
      if(tipo === "deleteContentForward" && p.colapsada && p.f.col >= (liveLines()[p.f.line]||"").length && p.f.line < liveLines().length - 1){
        e.preventDefault();
        renderLiveEditor(liveAplicar(p.f, { line: p.f.line + 1, col: 0 }, ""));
        return;
      }
      // resto (digitação, IME, autocorreção) segue nativo na linha crua
    });

    /* Digitação nativa: só a linha crua pode ter mudado, então basta relê-la.
       Nada de redesenhar aqui — isso mataria o cursor e a composição do IME. */
    box.addEventListener("input", () => {
      if(liveRedesenhando) return;
      const div = box.querySelector(".live-raw");
      if(!div) return;
      const i = +div.dataset.idx;
      const texto = div.textContent || "";
      const lines = liveLines();
      if(texto.indexOf("\n") >= 0){ // segurança: navegador quebrou a linha por conta própria
        const partes = texto.split("\n");
        lines.splice(i, 1, ...partes);
        commitLines(lines);
        renderLiveEditor({ line: i + partes.length - 1, col: partes[partes.length-1].length });
        return;
      }
      if(lines[i] === texto) return;
      lines[i] = texto;
      commitLines(lines);
      const p = liveSelecao(box);
      if(p) liveCaret = p.f;
    });
  }

  function slugify(s){
    return (s||"nota").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"").toLowerCase() || "nota";
  }
  /* Sufixo de desambigua\u00e7\u00e3o do espelho markdown: s\u00f3 existe quando o slug do
     t\u00edtulo colide com outro documento do mesmo tipo \u2014 "-2", "-3"... pela ordem
     de cria\u00e7\u00e3o, nunca um id aleat\u00f3rio aparente. Sem colis\u00e3o, sem sufixo nenhum. */
  function mdDedupSuffix(entries, objId){
    const dedup = entries.slice().sort((a,b)=> (a.createdAt||0)-(b.createdAt||0) || (a.id<b.id?-1:(a.id>b.id?1:0)));
    const idx = dedup.findIndex(e=>e.id===objId);
    return idx<=0 ? "" : "-"+(idx+1);
  }
  /* Nome da subpasta em Documentos onde backup/exports/espelho markdown são
     gravados (nativo) — configurável em Configurações → Backup. Sanitizado na
     escrita (sem "/" nem caracteres que o Android rejeita em nome de pasta). */
  function dataFolderName(){ return load(K_DATAFOLDER, "Rotinas"); }
  function sanitizeFolderName(s){
    return (s||"").trim().replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g," ").slice(0,60) || "Rotinas";
  }
  /* Subpastas conhecidas onde o app grava algo (ver TIPO_SUBPASTA, mais as que
     não são "modelo": Rotinas/Backups/Dados). "Notas" entra por compatibilidade
     — é a pasta única que o espelho markdown usava antes desta versão passar a
     separar por tipo; arquivos velhos que ainda estejam lá continuam migrando
     junto quando o Pedro troca o nome da pasta. */
  function subpastasConhecidas(){
    return [...new Set(Object.values(TIPO_SUBPASTA))].concat(["Rotinas", "Backups", "Dados", "Notas"]);
  }
  /* Move os arquivos da pasta antiga para a nova (raiz + cada subpasta conhecida),
     best-effort. Lê como texto e regrava — os únicos arquivos que este app
     escreve aqui são JSON/markdown próprios, nunca binário. */
  async function migrarPastaDados(antigo, novo){
    if(!isNative || antigo === novo) return 0;
    const FS = window.Capacitor.Plugins.Filesystem;
    let movidos = 0;
    async function moverConteudo(sub){
      const de = antigo + (sub ? "/" + sub : "");
      const para = novo + (sub ? "/" + sub : "");
      let nomes = [];
      try{
        const r = await FS.readdir({ path: de, directory: "DOCUMENTS" });
        nomes = (r.files || []).map(f => typeof f === "string" ? f : f.name);
      }catch(e){ return; } // pasta ainda não existe — nada a mover
      for(const nome of nomes){
        try{
          const lido = await FS.readFile({ path: de + "/" + nome, directory: "DOCUMENTS", encoding: "utf8" });
          await FS.writeFile({ path: para + "/" + nome, directory: "DOCUMENTS", encoding: "utf8", data: lido.data, recursive: true });
          await FS.deleteFile({ path: de + "/" + nome, directory: "DOCUMENTS" });
          movidos++;
        }catch(e){} // provavelmente uma subpasta — tratada à parte, no seu próprio moverConteudo
      }
    }
    await moverConteudo("");           // exports soltos na raiz (legado)
    for(const sub of subpastasConhecidas()) await moverConteudo(sub);
    return movidos;
  }
  /* No APK, blob + <a download> não funciona (WebView sem DownloadListener):
     grava em Documentos/<pasta> via Filesystem e confirma só após a escrita real.
     `subpasta` é opcional — omitido, grava na raiz (compatibilidade). */
  async function nativeWriteExport(filename, text, subpasta){
    const path = dataFolderName() + (subpasta ? "/" + subpasta : "") + "/" + filename;
    const r = await window.Capacitor.Plugins.Filesystem.writeFile({
      path, directory: "DOCUMENTS", encoding: "utf8", data: text, recursive: true
    });
    return r.uri;
  }

  /* ---- Espelho em Markdown (estilo cofre do Obsidian) ----
     Cada nota/documento vira um .md legível em Documentos/<pasta>/Notas/,
     sobrevive à desinstalação do app e pode ser lido sem nenhum programa.
     doc._mdPath guarda o último caminho gravado, pra renomear o arquivo
     no disco em vez de deixar cópias órfãs quando o título muda. */
  function mdTypeLabel(type){
    return {
      market:"mercado", matrix:"matriz", kanban:"kanban", countdown:"contagem",
      expense:"despesa", proscons:"pros-contras", travel:"viagem",
      thoughtrecord:"pensamento", journal:"diario", note:"nota", scoreboard:"pontos"
    }[type] || type || "nota";
  }
  /* Subpasta em Documentos/<pasta>/ onde cada tipo de arquivo gerado pelo app
     é gravado — uma por modelo de nota (espelha os nomes das pastas em
     Modelos), mais Rotinas/Backups/Dados pros exports que não são um "modelo".
     Tudo em um mapa só: usado tanto pelo espelho markdown (syncMdFile) quanto
     pelos exports avulsos (CSV, PDF, JSON de rotina, backup). */
  const TIPO_SUBPASTA = {
    note:"Notas simples", market:"Listas de mercado", matrix:"Matrizes 2x2",
    kanban:"Kanbans", countdown:"Metas", expense:"Despesas",
    proscons:"Pros e Contras", travel:"Listas de viagem", thoughtrecord:"RPD",
    scoreboard:"Registros de pontos", journal:"Anotações de Rotinas"
  };
  function subpastaDoTipo(type){ return TIPO_SUBPASTA[type] || "Notas simples"; }
  function noteMd(note){
    let md = "# " + (note.title||"Sem título") + "\n\n" + (note.content||"") + "\n";
    if((note.subjects||[]).length) md += "\n## Assunto\n" + note.subjects.map(s=>"#"+s.replace(/\s+/g,"-")).join(" ") + "\n";
    return md;
  }
  function marketMdSingle(doc){
    const byAisle = {};
    (doc.items||[]).forEach(it=>{ (byAisle[it.aisle||"Outros"] = byAisle[it.aisle||"Outros"]||[]).push(it); });
    let md = "# " + doc.title + "\n";
    (doc.aisleOrder||[]).concat(Object.keys(byAisle).filter(a=>!(doc.aisleOrder||[]).includes(a))).forEach(a=>{
      if(!byAisle[a] || !byAisle[a].length) return;
      md += "\n## " + a + "\n" + byAisle[a].map(it=>"- " + (it.checked?"[x] ":"[ ] ") + it.name + " — " + it.qty + (it.unit==="un"?" un":it.unit) + (it.price?" — "+brl(it.price):"")).join("\n") + "\n";
    });
    return md;
  }
  function expenseEntryMd(doc){
    return "# " + (doc.desc||"Despesa") + "\n\n- Valor: " + brl(doc.value||0) + "\n- Categoria: " + (doc.cat||"") + "\n- Data: " + (doc.date||"") + (doc.time?" "+doc.time:"") + "\n";
  }
  function thoughtRecordMd(doc){
    return "# " + (doc.title||"Registro de pensamentos") + "\n\n## Gatilho\n" + (doc.trigger||"") +
      "\n\n## Emoções\n" + (doc.emotions||"") +
      "\n\n## Distorção cognitiva\n" + (doc.distortion||"—") +
      "\n\n## Pensamentos alternativos\n" + (doc.altThoughts||"") +
      "\n\n## Resultados\n" + (doc.results||"") + "\n";
  }
  function journalDocMd(doc){
    let md = "# " + (doc.title||"Diário") + "\n";
    (doc.sections||[]).forEach(sec=>{ md += "\n## " + sec.taskName + "\n" + (sec.text||"") + "\n"; });
    return md;
  }
  function docToMarkdown(doc){
    switch(doc.type){
      case "market": return marketMdSingle(doc);
      case "matrix": return matrixMd(doc);
      case "kanban": return kanbanMd(doc);
      case "countdown": return countdownMd(doc);
      case "expense": return expenseEntryMd(doc);
      case "proscons": return prosconsMd(doc);
      case "travel": return travelMd(doc);
      case "thoughtrecord": return thoughtRecordMd(doc);
      case "scoreboard": return scoreboardMd(doc);
      case "journal": return journalDocMd(doc);
      default: return "# " + (doc.title||"Documento") + "\n";
    }
  }
  async function syncMdFile(obj, mdText, typeLabel, tipo, titleForSlug, suffix){
    if(!isNative || !window.Capacitor.Plugins.Filesystem) return;
    const FS = window.Capacitor.Plugins.Filesystem;
    const newPath = dataFolderName() + "/" + subpastaDoTipo(tipo) + "/" + typeLabel + "-" + slugify(titleForSlug).slice(0,40) + (suffix||"") + ".md";
    try{
      if(obj._mdPath && obj._mdPath !== newPath){
        try{ await FS.deleteFile({ path: obj._mdPath, directory:"DOCUMENTS" }); }catch(e){}
      }
      await FS.writeFile({ path:newPath, directory:"DOCUMENTS", encoding:"utf8", data:mdText, recursive:true });
      obj._mdPath = newPath;
    }catch(e){ console.error("syncMdFile falhou:", e); }
  }
  function syncNoteMd(note){
    const titleForSlug = note.title || "sem-titulo";
    const base = slugify(titleForSlug).slice(0,40);
    const dupes = notes.filter(n => slugify(n.title||"sem-titulo").slice(0,40) === base).map(n=>({id:n.id, createdAt:n.createdAt||0}));
    syncMdFile(note, noteMd(note), "nota", "note", titleForSlug, mdDedupSuffix(dupes, note.id));
  }
  function syncDocMd(doc){
    const typeLabel = mdTypeLabel(doc.type);
    const titleForSlug = doc.title || doc.trigger || doc.desc || typeLabel;
    const base = slugify(titleForSlug).slice(0,40);
    const dupes = templates.filter(d=>{
      if(mdTypeLabel(d.type) !== typeLabel) return false;
      const dTitle = d.title || d.trigger || d.desc || typeLabel;
      return slugify(dTitle).slice(0,40) === base;
    }).map(d=>({id:d.id, createdAt:d.createdAt||0}));
    syncMdFile(doc, docToMarkdown(doc), typeLabel, doc.type, titleForSlug, mdDedupSuffix(dupes, doc.id));
  }

  /* `subpasta` é opcional — organiza os exports por categoria dentro de
     Documentos/<pasta>/ (ver TIPO_SUBPASTA). Omitido, grava na raiz. */
  function downloadFile(filename, text, mime, subpasta){
    if(isNative){
      nativeWriteExport(filename, text, subpasta)
        .then(() => showAlertBanner("Salvo em Documentos/" + dataFolderName() + (subpasta?"/"+subpasta:"") + "/" + filename + " ✓"))
        .catch(e => { console.error("Export falhou:", e); showAlertBanner("⚠️ Não foi possível salvar " + filename); });
      return;
    }
    const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }
  async function shareOrDownload(filename, text, mime, subpasta){
    if(isNative){
      try{
        const uri = await nativeWriteExport(filename, text, subpasta);
        try{ await window.Capacitor.Plugins.Share.share({ title: filename, files: [uri] }); }catch(e){} // cancelar o share é ok, o arquivo já está salvo
        return true;
      }catch(e){
        console.error("Export falhou:", e);
        showAlertBanner("⚠️ Não foi possível salvar " + filename);
        return false;
      }
    }
    try{
      if(navigator.canShare && navigator.share){
        const file = new File([text], filename, { type: mime });
        if(navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: filename });
          return true;
        }
      }
    }catch(e){ if(e && e.name === "AbortError") return true; }
    downloadFile(filename, text, mime, subpasta);
    return true;
  }

  /* Exporta rotinas com horário como eventos .ics recorrentes (RRULE semanal
     pelos dias agendados). Horário "floating" (sem Z/TZID) — o mesmo horário
     de parede em qualquer fuso, suficiente para um único usuário. */
  function icsEscape(s){
    return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }
  function exportAgendaIcs(){
    const comHorario = routines.filter(r=>computeSchedule(r));
    if(comHorario.length===0){ showAlertBanner("Nenhuma rotina com horário agendado para exportar"); return; }
    const ICS_DOW = ["SU","MO","TU","WE","TH","FR","SA"];
    const now = new Date();
    const dtstamp = now.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    const fmtLocal = d => {
      const p = n => String(n).padStart(2,"0");
      return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";
    };
    const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Brita//Rotinas//PT","CALSCALE:GREGORIAN"];
    comHorario.forEach(r=>{
      const sched = computeSchedule(r);
      const dias = (r.schedule.days && r.schedule.days.length) ? r.schedule.days.slice().sort() : [0,1,2,3,4,5,6];
      let delta = 0;
      while(!dias.includes((now.getDay()+delta)%7)) delta++;
      const dtStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()+delta);
      dtStart.setHours(Math.floor(sched.startMin/60), sched.startMin%60, 0, 0);
      const dtEnd = new Date(dtStart.getTime() + Math.max(sched.durMin,15)*60000);
      lines.push("BEGIN:VEVENT");
      lines.push("UID:"+r.id+"@brita");
      lines.push("DTSTAMP:"+dtstamp);
      lines.push("DTSTART:"+fmtLocal(dtStart));
      lines.push("DTEND:"+fmtLocal(dtEnd));
      lines.push("RRULE:FREQ=WEEKLY;BYDAY="+dias.map(d=>ICS_DOW[d]).join(","));
      lines.push("SUMMARY:"+icsEscape(r.name));
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    downloadFile("rotinas-agenda.ics", lines.join("\r\n"), "text/calendar;charset=utf-8", "Dados");
    showAlertBanner("Agenda exportada ✓");
  }

  function backupData(){
    // v5 passou a levar o diário e o kanban do dia; v6 passou a levar a biblioteca de
    // exercícios; v7 passou a levar os compromissos avulsos
    return { version: 7, exportedAt: new Date().toISOString(), routines, notes, history, templates, snoozes, tarefas, tarefasHist, diario, diaKanban, exercicios, compromissos };
  }
  async function exportBackup(){
    const ok = await shareOrDownload("rotinas-backup-" + localKey() + ".json", JSON.stringify(backupData(), null, 2), "application/json", "Backups");
    if(!ok) return; // banner de erro já foi mostrado
    save(K_LASTBACKUP, Date.now());
    showAlertBanner(isNative ? "Backup salvo em Documentos/" + dataFolderName() + "/Backups ✓" : "Backup exportado ✓");
  }

  /* Auto-backup no APK: cópia de segurança silenciosa em Documentos/<pasta>/Backups
     a cada 3 dias — sobrevive à desinstalação do app (Directory.Data não).
     Arquivos datados, com retenção dos 5 mais recentes: um backup corrompido
     ou vazio não destrói mais o único backup existente. */
  async function autoBackupNative(){
    if(!isNative) return;
    if(routines.length + notes.length + tarefas.length + templates.length === 0) return; // nunca sobrescrever com dados vazios
    if(Date.now() - load(K_AUTOBAK, 0) < 3 * 86400000) return;
    try{
      await nativeWriteExport("rotinas-backup-auto-" + localKey() + ".json", JSON.stringify(backupData(), null, 2), "Backups");
      save(K_AUTOBAK, Date.now());
      // retenção: mantém só os 5 auto-backups mais recentes (nome contém a data)
      const FS = window.Capacitor.Plugins.Filesystem;
      const r = await FS.readdir({ path:dataFolderName()+"/Backups", directory:"DOCUMENTS" });
      const autos = (r.files || []).map(f => typeof f === "string" ? f : f.name)
        .filter(n => /^rotinas-backup-auto-.*\.json$/.test(n)).sort();
      for(const old of autos.slice(0, Math.max(0, autos.length - 5))){
        try{ await FS.deleteFile({ path:dataFolderName() + "/Backups/" + old, directory:"DOCUMENTS" }); }catch(e){}
      }
    }catch(e){ console.error("Auto-backup falhou:", e); }
  }

  /* Auto-backup no navegador (PWA): o usuário escolhe UMA vez um arquivo real no
     disco e o app regrava nele sozinho. O IndexedDB pode ser despejado pelo
     navegador sob pressão de disco, e o aviso de 30 dias depende de disciplina —
     isto tira o backup do caminho crítico da memória do usuário. */
  const K_BAKHANDLE = "rotinas_v2_bakhandle";
  const K_BAKWEB    = "rotinas_v2_bakweb_ts";
  const K_BAKSEENAT = "rotinas_v2_bakseenat"; // exportedAt do backup mais recente já visto/gravado neste handle
  let bakWriting = false;
  let bakChecking = false;
  function supportsFileBackup(){ return !isNative && typeof window.showSaveFilePicker === "function"; }
  function backupHandle(){ return load(K_BAKHANDLE, null); }
  async function backupHandlePermitido(pedir){
    const h = backupHandle();
    if(!h) return false;
    try{
      const opts = { mode:"readwrite" };
      if((await h.queryPermission(opts)) === "granted") return true;
      // requestPermission só funciona dentro de um gesto do usuário
      if(pedir && (await h.requestPermission(opts)) === "granted") return true;
    }catch(e){}
    return false;
  }
  async function escolherArquivoBackup(){
    if(!supportsFileBackup()){ showAlertBanner("Este navegador não permite backup automático em arquivo"); return false; }
    try{
      const h = await window.showSaveFilePicker({
        suggestedName: "rotinas-backup.json",
        types: [{ description:"Backup do Rotinas", accept:{ "application/json":[".json"] } }]
      });
      saveRaw(K_BAKHANDLE, h);
      const ok = await gravarBackupArquivo(true);
      if(ok) showAlertBanner("Backup automático ativado ✓");
      return ok;
    }catch(e){
      if(e && e.name === "AbortError") return false;
      console.error("Escolha de arquivo de backup falhou:", e);
      showAlertBanner("Não foi possível ativar o backup automático");
      return false;
    }
  }
  function desligarBackupArquivo(){
    removeKey(K_BAKHANDLE);
    removeKey(K_BAKSEENAT);
    showAlertBanner("Backup automático desativado");
  }
  async function gravarBackupArquivo(forcar){
    if(bakWriting) return false;
    const h = backupHandle();
    if(!h) return false;
    if(routines.length + notes.length + tarefas.length + templates.length === 0) return false; // nunca sobrescrever com dados vazios
    if(!forcar && Date.now() - load(K_BAKWEB, 0) < 5 * 60000) return false; // no máximo a cada 5 min
    if(!(await backupHandlePermitido(!!forcar))) return false;
    bakWriting = true;
    try{
      const dados = backupData();
      const w = await h.createWritable();
      await w.write(JSON.stringify(dados, null, 2));
      await w.close();
      save(K_BAKWEB, Date.now());
      save(K_BAKSEENAT, dados.exportedAt); // é a nossa própria escrita: não é "mais recente de outro aparelho"
      save(K_LASTBACKUP, Date.now()); // conta como backup para o aviso de 30 dias
      return true;
    }catch(e){
      console.error("Backup automático em arquivo falhou:", e);
      return false;
    }finally{ bakWriting = false; }
  }
  /* Sincronização "de graça" com o mesmo arquivo do backup automático: se o
     Pedro apontar esse arquivo para uma pasta sincronizada pelo cliente do
     Google Drive/Dropbox no computador, um outro aparelho que grave no MESMO
     arquivo (por ex. o celular exportando para a mesma pasta sincronizada)
     aparece aqui como "backup mais recente" ao reabrir a aba — sem OAuth, sem
     servidor, só lendo o arquivo de novo antes de sobrescrevê-lo. */
  async function checarBackupMaisRecente(){
    if(bakChecking || bakWriting) return;
    const h = backupHandle();
    if(!h) return;
    bakChecking = true;
    try{
      if(!(await backupHandlePermitido(false))) return;
      const file = await h.getFile();
      const dados = JSON.parse(await file.text());
      if(!dados || !dados.exportedAt) return;
      const visto = load(K_BAKSEENAT, null);
      // primeira vez vendo este handle nesta sessão: só passa a rastrear, não assume "mais recente"
      if(!visto){ save(K_BAKSEENAT, dados.exportedAt); return; }
      if(new Date(dados.exportedAt).getTime() <= new Date(visto).getTime()) return;
      mostrarAvisoBackupMaisRecente(dados);
    }catch(e){ /* arquivo pode ter sido movido/apagado, ou permissão negada em silêncio */ }
    finally{ bakChecking = false; }
  }
  function mostrarAvisoBackupMaisRecente(dados){
    const banner = document.createElement("div");
    banner.className = "alert-banner undo-banner";
    banner.innerHTML = `<span>Backup mais recente encontrado (de outro aparelho)</span><button class="undo-btn" id="bakSyncImportar">Importar</button>`;
    document.body.appendChild(banner);
    const marcarVisto = () => save(K_BAKSEENAT, dados.exportedAt);
    banner.querySelector("#bakSyncImportar").onclick = () => {
      banner.remove();
      oferecerImportarBackup(dados, () => marcarVisto());
    };
    attachSwipeDismiss(banner, marcarVisto);
  }
  // grava ao sair/minimizar (momento natural de fim de sessão) e checa por uma
  // versão mais nova ao voltar — mesmo par leitura/escrita do outro lado da sincronização
  if(supportsFileBackup()){
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "hidden") gravarBackupArquivo(false);
      else checarBackupMaisRecente();
    });
    checarBackupMaisRecente(); // também checa uma vez ao abrir a aba, não só ao voltar
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(data.type === "rotina-share" && data.routine){
          const r = data.routine;
          r.id = uid();
          r.steps.forEach(s=>{ s.id = uid(); if(s.type==="routine") s.type = "checklist"; s.noteId = undefined; });
          if(!r.schedule) r.schedule = { enabled:false, anchor:"start", time:"07:00", days:[0,1,2,3,4,5,6] };
          r.schedule.enabled = false;
          if(routines.some(x=>x.name===r.name)) r.name += " (importada)";
          routines.push(r);
          save(K_ROUTINES, routines);
          showAlertBanner("Rotina \"" + r.name + "\" importada ✓");
          render();
          return;
        }
        if(data.type === "modelo-share" && data.doc){
          const doc = data.doc;
          doc.id = uid();
          doc._mdPath = undefined;
          if(templates.some(t=>t.title===doc.title && t.type===doc.type)) doc.title = (doc.title||"") + " (importado)";
          templates.push(doc);
          save(K_TEMPLATES, templates);
          showAlertBanner("Modelo \"" + (doc.title||mdTypeLabel(doc.type)) + "\" importado ✓");
          goTo({ tab:"templates", screen:"templateDoc", id: doc.id });
          return;
        }
        oferecerImportarBackup(data);
      }catch(e){ showAlertBanner("Arquivo inválido"); }
    };
    reader.readAsText(file);
  }
  /* Confirmação de merge/substituição de um backup completo já parseado —
     compartilhada entre o import manual (arquivo escolhido no <input>) e a
     sincronização automática (arquivo do handle de backup, lido sozinho). */
  function oferecerImportarBackup(data, onResolvido){
    const COLLS = ["routines","notes","history","templates","snoozes","tarefas","tarefasHist","exercicios"];
    if(!data || typeof data !== "object" || !COLLS.some(k => Array.isArray(data[k]))){
      showAlertBanner("Arquivo não parece um backup do Rotinas");
      return;
    }
    COLLS.forEach(k => { if(Array.isArray(data[k])) data[k] = data[k].filter(x => x && typeof x === "object"); });
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box">
        <p>Importar backup:<br><small>${(data.routines||[]).length} rotina(s), ${(data.notes||[]).length} nota(s), ${(data.history||[]).length} execução(ões), ${(data.tarefas||[]).length} tarefa(s).</small></p>
        <div class="confirm-actions" style="flex-direction:column;">
          <button class="btn-confirm" id="impMerge" style="background:var(--grad);">Mesclar com os dados atuais</button>
          <button class="btn-confirm" id="impReplace">Substituir tudo</button>
          <button class="btn-cancel" id="impCancel">Cancelar</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector("#impCancel").onclick = () => { ov.remove(); if(onResolvido) onResolvido(false); };
    ov.onclick = e => { if(e.target===ov){ ov.remove(); if(onResolvido) onResolvido(false); } };
    ov.querySelector("#impReplace").onclick = () => {
      ov.remove();
      if(Array.isArray(data.routines)) { routines = data.routines; save(K_ROUTINES, routines); }
      if(Array.isArray(data.notes)) { notes = data.notes; save(K_NOTES, notes); }
      if(Array.isArray(data.history)) { history = data.history; save(K_HISTORY, history); }
      if(Array.isArray(data.templates)) { templates = data.templates; save(K_TEMPLATES, templates); }
      if(Array.isArray(data.snoozes)) { snoozes = data.snoozes; save(K_SNOOZES, snoozes); }
      if(Array.isArray(data.tarefas)) { tarefas = data.tarefas; saveTarefas(); }
      if(Array.isArray(data.tarefasHist)) { tarefasHist = data.tarefasHist; saveTarefasHist(); }
      if(data.diario && typeof data.diario === "object") { diario = data.diario; saveDiario(); }
      if(Array.isArray(data.diaKanban)) { diaKanban = data.diaKanban; saveDiaKanban(); }
      if(Array.isArray(data.exercicios)) { exercicios = data.exercicios; saveExercicios(); }
      if(Array.isArray(data.compromissos)) { compromissos = data.compromissos; saveCompromissos(); }
      showAlertBanner("Backup importado (substituição) ✓");
      render();
      if(onResolvido) onResolvido(true);
    };
    ov.querySelector("#impMerge").onclick = () => {
      ov.remove();
      (data.routines||[]).forEach(r=>{ if(!routines.some(x=>x.id===r.id)) routines.push(r); });
      (data.notes||[]).forEach(n=>{ if(!notes.some(x=>x.id===n.id)) notes.push(n); });
      (data.templates||[]).forEach(t=>{ if(!templates.some(x=>x.id===t.id)) templates.push(t); });
      const tsSet = new Set(history.map(h=>h.ts));
      (data.history||[]).forEach(h=>{ if(!h.ts || !tsSet.has(h.ts)) history.push(h); });
      (data.tarefas||[]).forEach(t=>{ if(!tarefas.some(x=>x.id===t.id)) tarefas.push(t); });
      (data.tarefasHist||[]).forEach(h=>{ if(!tarefasHist.some(x=>x.id===h.id)) tarefasHist.push(h); });
      (data.diaKanban||[]).forEach(c=>{ if(c && c.id && !diaKanban.some(x=>x.id===c.id)) diaKanban.push(c); });
      (data.exercicios||[]).forEach(ex=>{ if(ex && ex.id && !exercicios.some(x=>x.id===ex.id)) exercicios.push(ex); });
      (data.compromissos||[]).forEach(c=>{ if(c && c.id && !compromissos.some(x=>x.id===c.id)) compromissos.push(c); });
      // no diário, período já escrito aqui ganha: mesclar textos criaria duplicata
      Object.keys(data.diario || {}).forEach(k=>{ if(!diario[k]) diario[k] = data.diario[k]; });
      save(K_ROUTINES, routines); save(K_NOTES, notes); save(K_HISTORY, history); save(K_TEMPLATES, templates); saveTarefas(); saveTarefasHist(); saveDiario(); saveDiaKanban(); saveExercicios(); saveCompromissos();
      showAlertBanner("Backup mesclado ✓");
      render();
      if(onResolvido) onResolvido(true);
    };
  }

  /* ---- Avisos: armazenamento e backup ---- */
  let warnedStorage = false, dismissedBackupNotice = false;
  function storageBytes(){
    let total = 0;
    try{ mem.forEach((v, k) => { total += (JSON.stringify(v).length + k.length) * 2; }); }catch(e){}
    return total;
  }
  function checkStorageWarning(){
    if(warnedStorage) return;
    const mb = storageBytes()/1048576;
    if(mb > 100){
      warnedStorage = true;
      showAlertBanner("Dados ocupando " + mb.toFixed(0) + " MB. Exporte um backup e considere apagar histórico/notas antigas.");
    }
  }
  function agendaSnoozed(){
    const now = Date.now();
    return snoozes.some(s=>now >= s.from && now <= s.to);
  }
  function snoozedOn(dateObj){
    const t = dateObj.getTime();
    return snoozes.some(s=>t >= s.from && t <= s.to);
  }
  function backupOverdue(){
    if(dismissedBackupNotice) return false;
    if(routines.length === 0 && notes.length === 0) return false;
    const last = load(K_LASTBACKUP, null);
    return !last || (Date.now() - last) > 30*86400000;
  }
