<div id="app"></div>

<script>
/* Overlay de erro de boot: se algo quebrar antes do primeiro render (tela
   ficaria vazia, sem console no APK), o erro é mostrado na própria tela. */
window.__britaBooted = false;
function __britaShowFatal(msg){
  if(window.__britaBooted) return;
  var el = document.getElementById("bootError");
  if(!el){
    el = document.createElement("div");
    el.id = "bootError";
    el.style.cssText = "position:fixed;inset:0;z-index:99999;background:#1C1B1A;color:#EDE7DD;padding:24px 20px;font:14px/1.5 monospace;overflow:auto;white-space:pre-wrap;word-break:break-word;";
    (document.body || document.documentElement).appendChild(el);
    el.textContent = "O app encontrou um erro ao iniciar. Tire um print desta tela.\n\n";
  }
  el.textContent += "\n" + msg;
}
window.addEventListener("error", function(e){
  __britaShowFatal((e.message || "erro") + (e.filename ? "\n  em " + e.filename + ":" + e.lineno + ":" + e.colno : ""));
});
window.addEventListener("unhandledrejection", function(e){
  var r = e.reason;
  __britaShowFatal("Promise rejeitada: " + (r && r.stack ? r.stack : String(r)));
});
</script>
<script>
(async function(){
  "use strict";

  /* ---------------- STORAGE ---------------- */
  const K_ROUTINES = "rotinas_v2_routines";
  const K_HISTORY  = "rotinas_v2_history";
  const K_NOTES    = "rotinas_v2_notes";
  const K_ALERTED  = "rotinas_v2_alerted";
  const K_PLAYER   = "rotinas_v2_player";
  const K_THEME    = "rotinas_v2_theme";
  const K_LASTBACKUP = "rotinas_v2_lastbackup";
  const K_TEMPLATES = "rotinas_v2_templates";
  const K_SNOOZES   = "rotinas_v2_snoozes";
  const K_TAREFAS  = "rotinas_v2_tarefas";
  const K_TAREFAS_HIST = "rotinas_v2_tarefas_hist";
  const K_AUTOBAK  = "rotinas_v2_autobackup";
  const K_MIGRATED = "rotinas_v2_migrated";
  const K_GAMIFICACAO = "rotinas_v2_gamificacao";
  const K_NUDGE    = "rotinas_v2_nudge";      // aviso de ritmo na sexta
  const K_OVERLAY  = "rotinas_v2_overlay";    // cronômetro sobre outros apps
  const K_NUDGEDONE = "rotinas_v2_nudge_done"; // "<semana>:<dia>" do último aviso
  const K_NUDGEDAYS = "rotinas_v2_nudge_days"; // dias da semana que recebem o aviso
  const K_DIARIO   = "rotinas_v2_diario";     // notas de dia/semana/mês/ano
  const K_NAOFEITAS = "rotinas_v2_naofeitas"; // etapas marcadas como não feitas hoje
  const K_DIAKANBAN = "rotinas_v2_diakanban"; // kanban do diário, por dia
  const K_SOHOJE   = "rotinas_v2_so_hoje";    // filtro "só as rotinas de hoje" na aba Rotinas
  const K_HOMEAREA = "rotinas_v2_home_area";  // filtro de área da roda da vida nas abas Rotinas/Metas
  const FILTRO_SEM_AREA = "__sem_area__";     // sentinela do filtro de área: rotinas/metas sem área (distinto de "" = todas)
  const K_DATAFOLDER = "rotinas_v2_datafolder"; // nome da subpasta em Documentos onde backup/exports/markdown são gravados (nativo)
  const K_WEEKSTART = "rotinas_v2_weekstart"; // dia (0=domingo..6=sábado) em que a semana começa a contar
  const K_FONTSCALE = "rotinas_v2_fontscale"; // escala de texto do app (acessibilidade)
  const K_DIGESTSEMANAL = "rotinas_v2_digest_semanal"; // notificação de resumo ao fechar a semana
  const K_PIN = "rotinas_v2_pin"; // hash SHA-256 (hex) do PIN de bloqueio, null = sem bloqueio
  const K_EXERCICIOS = "rotinas_v2_exercicios"; // biblioteca de exercícios (séries/reps/carga) reaproveitada por etapas de rotina
  const K_COMPROMISSOS = "rotinas_v2_compromissos"; // compromissos avulsos: dia+horário+notificação, independentes de rotina/kanban

  const mqLight = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  function resolvedTheme(){
    const t = load(K_THEME, "auto");
    if(t === "auto") return (mqLight && mqLight.matches) ? "light" : "dark";
    return t;
  }
  function applyTheme(){
    const eff = resolvedTheme();
    document.body.classList.toggle("light", eff === "light");
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", eff === "light" ? "#F3F5F8" : "#1C1B1A");
  }
  function themeIcon(){
    const t = load(K_THEME, "auto");
    return t === "auto" ? svgIcon(ICON_D.computerDesktop,16) : (t === "light" ? svgIcon(ICON_D.sun,16) : svgIcon(ICON_D.moon,16));
  }
  function toggleTheme(){
    const order = ["auto","light","dark"];
    const cur = load(K_THEME, "auto");
    const next = order[(order.indexOf(cur)+1) % 3];
    save(K_THEME, next);
    applyTheme();
    showAlertBanner("Tema: " + (next==="auto"?"automático (sistema)":next==="light"?"claro":"escuro"));
    render();
  }
  if(mqLight && mqLight.addEventListener) mqLight.addEventListener("change", ()=>{ if(load(K_THEME,"auto")==="auto") applyTheme(); });

  function applyFontScale(){
    document.documentElement.style.setProperty("--font-scale", load(K_FONTSCALE, 1));
  }

  /* ---- PIN de bloqueio (Configurações → Privacidade) ----
     Guarda só o hash SHA-256 (hex) em K_PIN, nunca o PIN em texto puro. A tela
     de bloqueio é montada direto no document.body — antes do primeiro render()
     do app — e só resolve a Promise (deixando o boot continuar) com o hash
     batendo. crypto.subtle exige contexto seguro; sem ele (raríssimo: WebView
     muito antigo) o recurso fica indisponível em vez de travar o app. */
  const CRYPTO_OK = typeof crypto !== "undefined" && !!crypto.subtle;
  function sha256Hex(str){

    d = d || new Date();
    const p = n => String(n).padStart(2,"0");
    return p(d.getFullYear() % 100) + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
         + "-" + p(d.getHours()) + p(d.getMinutes());
  }

  function routineDuration(r){ return playbackSteps(r).reduce((acc,s)=> acc + (s.type==="timer" ? (s.seconds||0) : 0), 0); }

  // normalizar dados de versões anteriores
  routines.forEach(r=>{
    if(!r.schedule) r.schedule = { enabled:false, anchor:"start", time:"07:00" };
    if(!r.schedule.days) r.schedule.days = [0,1,2,3,4,5,6];
    if(r.restSeconds === undefined) r.restSeconds = 0;
    /* Descanso de exercício deixou de ser por etapa (s.restSeconds) e virou um
       único valor por rotina (r.restSeconds, também usado entre etapas) — sem
       essa migração, rotinas antigas perderiam o descanso configurado e
       cairiam silenciosamente para o novo padrão (120s) na primeira execução. */
    if(!r._restMigrado){
      const exSteps = (r.steps||[]).filter(s=>s.type==="exercicio" && s.restSeconds!=null);
      if(exSteps.length && !r.restSeconds) r.restSeconds = Math.max(...exSteps.map(s=>s.restSeconds));
      r._restMigrado = true;
    }
    if(r.color === undefined || r.color === "#C98A3E") r.color = "grad";
    if(r.icon === undefined) r.icon = "";
    if(r.weeklyGoalTimes === undefined) r.weeklyGoalTimes = 0;
    if(r.sound === undefined) r.sound = "normal";
    if(r.tagValor === undefined) r.tagValor = "medio";
    (r.steps||[]).forEach(s=>{ if(s.tagValor === undefined) s.tagValor = null; });
    if(r.createdAt === undefined){
      const firstRun = history.filter(h=>h.routineId===r.id && h.ts).sort((a,b)=>a.ts-b.ts)[0];
      r.createdAt = firstRun ? firstRun.ts : Date.now();
    }
  });
  notes.forEach(n=>{ if(n.pinned === undefined) n.pinned = false; if(n.sinkChecked === undefined) n.sinkChecked = false; });
  /* Data de criação: registro automático e imutável de toda nota/documento. Nos
     itens antigos não existe nada anterior a updatedAt, então é ele que vira a
     melhor aproximação — para quem nunca editou, é exatamente a criação. */
  notes.forEach(n=>{ if(!n.createdAt) n.createdAt = n.updatedAt || Date.now(); });
  templates.forEach(t=>{ if(!t.createdAt) t.createdAt = t.updatedAt || Date.now(); });
  save(K_NOTES, notes);
  save(K_TEMPLATES, templates);
  save(K_ROUTINES, routines);

  /* ---------------- GAMIFICAÇÃO (boletim semanal) ----------------
     Modelo: cada semana vale 100 pontos, distribuídos entre as etapas de
     rotina agendadas (schedule.days) proporcionalmente a peso×duração.
     A semana vai de domingo a sábado. O fator de normalização é congelado no
     domingo — recalcular durante a semana permitiria inflar a nota removendo
     itens da agenda. */
  function criarEstadoGamificacaoInicial(){
    return {
      config: {
        // "nenhum" é fixo em 0: a rotina/etapa roda mas não conta no boletim
        multiplicadores:{ nenhum:0, baixo:1.0, medio:1.75, alto:3.0 }, divisorDuracao:30, notaMinima:60,
        faixas:{ bronze:60, prata:75, ouro:90, diamante:100 },
        // bônus por meta concluída, no escopo definido pelo prazo dela
        pontosMeta:{ mensal:10, trimestral:20, anual:40 },
        /* Roda da vida: com ela ativa os 100 pontos da semana são repartidos
           ENTRE as áreas antes de serem repartidos dentro de cada uma. É o que
           tira as rotinas de áreas diferentes da mesma disputa. */
        roda:{ ativa:false, areas:[], pesoSemArea:5 },
        /* Rotina que já virou hábito não precisa mais valer tanto: depois de
           `streakMin` execuções seguidas o peso dela cai por `fator`, abrindo
           espaço para o que ainda não está consolidado. */
        habito:{ ativo:true, streakMin:21, fator:0.6 },
        // quantas rotinas podem ocupar cada nível de peso (0 = sem limite)
        vagas:{ alto:1, medio:3, baixo:0 }
      },
      semanaAtual: null,
      historico: { semanas:[], meses:[], trimestres:[], anos:[] },
      // bônus acumulado de metas por período: { "2026-07":n, "2026-T3":n, "2026":n }
      metasPontos: {},
      badges: []
    };
  }
  let gam = load(K_GAMIFICACAO, null);
  if(!gam) gam = criarEstadoGamificacaoInicial();
  // migrações de estados salvos por versões anteriores
  if(!gam.config.pontosMeta) gam.config.pontosMeta = { mensal:10, trimestral:20, anual:40 };
  if(!gam.historico.trimestres) gam.historico.trimestres = [];
  if(!gam.metasPontos) gam.metasPontos = {};
  gam.config.multiplicadores.nenhum = 0; // não é editável: peso "nenhum" é sempre 0
  if(!gam.config.habito) gam.config.habito = { ativo:true, streakMin:21, fator:0.6 };
  if(!gam.config.vagas)  gam.config.vagas  = { alto:1, medio:3, baixo:0 };
  if(!gam.config.roda)   gam.config.roda   = { ativa:false, areas:[], pesoSemArea:5 };
  /* As áreas da roda nascem dos EIXOS: as tarefas de estudo já são classificadas
     por eixo, então semear com os mesmos ids faz rotina e tarefa caírem na mesma
     área sem migração nenhuma. Depois disso a lista é do Pedro (editável). */
  if(!gam.config.roda.areas || !gam.config.roda.areas.length){
    gam.config.roda.areas = EIXOS.map(e=>({ id:e.id, label:e.label, color:e.color, peso:5 }));
  }
  if(gam.config.roda.pesoSemArea === undefined) gam.config.roda.pesoSemArea = 5;

  function rodaAtiva(){ return !!gam.config.roda.ativa; }
  function rodaAreas(){ return gam.config.roda.areas || []; }
  function areaInfoRoda(id){
    return rodaAreas().find(a=>a.id===id) || { id:"", label:"Sem área", color:"var(--muted)", peso:gam.config.roda.pesoSemArea };
  }
  function pesoDaArea(id){
    const a = rodaAreas().find(x=>x.id===id);
    return a ? Math.max(0.1, +a.peso || 0.1) : Math.max(0.1, +gam.config.roda.pesoSemArea || 0.1);
  }
  // chave de bucket da rotina na roda: "" é o bucket "sem área"
  function areaDaRotina(r){
    const id = r && r.eixo ? r.eixo : "";
    return rodaAreas().some(a=>a.id===id) ? id : "";
  }
  /* Preview de quanto a área escolhida já reserva da semana congelada — só faz
     sentido com a roda ativa (desligada, tudo cai no fator único, sem fatia
     própria). Lê agendaCongelada direto, sem recalcular nada: é só leitura,
     então não corre risco de descasar do que o boletim vai mostrar depois. */
  function areaPreviewHtml(eixoId){
    if(!rodaAtiva()) return "";
    const k = eixoId || "";
    const info = areaInfoRoda(k);
    const congelada = gam.semanaAtual.agendaCongelada || [];
    const previsto = congelada.filter(a=>(a.area||"")===k).reduce((s,a)=>s+a.pontos,0);
    const totalPrevisto = congelada.reduce((s,a)=>s+a.pontos,0);
    if(totalPrevisto <= 0) return `<span>${escapeHtml(info.label)}: ainda sem pontos previstos nesta semana.</span>`;
    const pct = Math.round(previsto/totalPrevisto*100);
    return `<span style="color:${info.color};">${escapeHtml(info.label)}</span> já reserva <b>${previsto.toFixed(0)}</b> dos ${totalPrevisto.toFixed(0)} pontos previstos nesta semana (${pct}%).`;
  }
  /* Chips de área da roda da vida — mesmo seletor no editor de rotina, no
     cartão do kanban do Diário e no lançamento rápido, para não desenhar a
     mesma pílula três vezes. `atual` é o id da área (ou null/"" = sem área);
     onChange(idOuNull) roda a cada escolha. */
  function pintarAreaChips(wrap, atual, onChange){
    wrap.innerHTML = `<div class="area-chips">`
      + `<span class="area-chip ${!atual?'sel':''}" data-rarea="" style="--chip:var(--muted);">sem área</span>`
      + rodaAreas().map(a=>`<span class="area-chip ${atual===a.id?'sel':''}" data-rarea="${a.id}" style="--chip:${a.color};">${escapeHtml(a.label)}</span>`).join("")
      + `</div>`;
    wrap.querySelectorAll("[data-rarea]").forEach(ch=>{
      ch.onclick = () => {
        const v = ch.dataset.rarea || null;
        pintarAreaChips(wrap, v, onChange);
        onChange(v);
      };
    });
  }

  /* Dia da semana em que a semana começa a contar (0=domingo..6=sábado),
     configurável em Configurações. Tudo que precisa saber "que dia abre a
     semana" passa por aqui — nunca reescrever "d.getDay()===0" solto de novo. */
  function weekStartDow(){ const v = load(K_WEEKSTART, 0); return (v>=0 && v<=6) ? v : 0; }
  /* Dia que abre a semana da data dada, respeitando weekStartDow(). */
  function inicioSemanaISO(date){
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const diff = (d.getDay() - weekStartDow() + 7) % 7;
    d.setDate(d.getDate() - diff);
    return localKey(d);
  }
  function addDaysISO(iso, n){
    const [y,m,dd] = iso.split("-").map(Number);
    const d = new Date(y, m-1, dd);
    d.setDate(d.getDate()+n);
    return localKey(d);
  }
  function isoToDate(iso){
    const [y,m,dd] = iso.split("-").map(Number);
    return new Date(y, m-1, dd);
  }
  function diaSemanaHoje(){ return new Date().getDay(); } // 0=domingo..6=sábado (literal, não é offset)
  /* Converte um dia literal (getDay(), 0=domingo) para o offset dentro da
     semana configurada (0=primeiro dia da semana..6=último). É essa segunda
     convenção que agendaCongelada, esperadoAte etc. usam — nunca literal. */
  function offsetSemana(dowLiteral){ return (dowLiteral - weekStartDow() + 7) % 7; }
  // ordem de exibição dos dias da semana (gráficos, calendário) — offset -> literal
  function ordemDiasSemana(){
    const s = weekStartDow();
    return Array.from({length:7}, (_,i)=>(s+i)%7);
  }
  function janelaSemanaLabel(){
    const s = weekStartDow();
    return DIAS_ABREV[s] + "&ndash;" + DIAS_ABREV[(s+6)%7];
  }

  function tagMultiplicador(tag){
    const m = gam.config.multiplicadores;
    return m[tag] !== undefined ? m[tag] : m.medio;
  }
  function pesoBruto(tag, minutos){
    if(!minutos || minutos <= 0) return 0;
    return tagMultiplicador(tag) * Math.sqrt(minutos / gam.config.divisorDuracao);
  }
  function rotinaTagEfetiva(r){ return r.tagValor || "medio"; }
  function stepTagEfetiva(s, r){ return s.tagValor || rotinaTagEfetiva(r); }
  function tarefaTagEfetiva(t){ return t.tagValor || "medio"; }

  /* ---- HÁBITO CONSOLIDADO ----
     Uma rotina que já emendou `streakMin` execuções não precisa mais valer o
     mesmo: o desconto abre espaço no boletim para o que ainda não pegou. O
     estado é decidido UMA vez, no congelamento de domingo, e guardado em
     `semanaAtual.habitos` — se dependesse do streak vivo, o peso de cada etapa
     mudaria no meio da semana e a agenda congelada deixaria de bater. */
  function rotinaEhHabitoAgora(r){
    const h = gam.config.habito;
    if(!h.ativo || r.semHabito) return false;
    return computeStreakFor(r.id) >= (h.streakMin || 21);
  }
  function mapaHabitos(){
    const m = {};
    routines.forEach(r=>{ if(rotinaEhHabitoAgora(r)) m[r.id] = true; });
    return m;
  }
  function fatorHabito(routineId, mapa){
    const h = gam.config.habito;
    const m = mapa || (gam.semanaAtual && gam.semanaAtual.habitos) || {};
    return (h.ativo && m[routineId]) ? (h.fator != null ? h.fator : 0.6) : 1;
  }
  // só para a UI: a rotina está descontada na semana em curso?
  function rotinaEhHabito(r){ return !!((gam.semanaAtual && gam.semanaAtual.habitos) || {})[r.id]; }

  function construirAgendaSemana(mapaHab){
    const itens = [];
    let totalBruto = 0;
    const porArea = {};
    const inicio = weekStartDow();
    for(let dia=0; dia<7; dia++){
      const dow = (inicio + dia) % 7; // dia = offset dentro da semana configurada; dow = dia real (getDay())
      routines.forEach(r=>{
        if(!r.schedule || !r.schedule.enabled || !r.schedule.days.includes(dow)) return;
        const fh = fatorHabito(r.id, mapaHab);
        const area = areaDaRotina(r);
        (r.steps||[]).forEach(s=>{
          if(s.isRest || (s.type !== "timer" && s.type !== "exercicio")) return;
          const minutos = s.type==="exercicio" ? ((s.sets||1)*(r.restSeconds||120))/60 : (s.seconds||0)/60;
          const tag = stepTagEfetiva(s, r);
          const pb = pesoBruto(tag, minutos) * fh;
          if(pb <= 0) return;
          totalBruto += pb;
          porArea[area] = (porArea[area] || 0) + pb;
          itens.push({ itemId: r.id+":"+s.id, dia, area, pesoBruto: pb });
        });
      });
    }
    return { itens, totalBruto, porArea };
  }
  /* ---- RODA DA VIDA: repartir os 100 antes de repartir dentro da área ----
     Cada área com trabalho agendado leva uma fatia dos 100 proporcional ao peso
     dela na roda; dentro da fatia, as etapas dividem entre si. Uma rotina longa
     em "Exercícios" deixa de diluir as rotinas de "Idiomas" — que é o ponto.
     Área sem nada agendado não reserva fatia (senão a semana não fecharia 100).
     Com a roda desligada devolve {} e tudo volta ao fator único. */
  function fatoresPorArea(porArea){
    if(!rodaAtiva()) return {};
    const ativas = Object.keys(porArea).filter(k => porArea[k] > 0);
    if(!ativas.length) return {};
    const somaPesos = ativas.reduce((s,k)=> s + pesoDaArea(k), 0);
    if(somaPesos <= 0) return {};
    const out = {};
    ativas.forEach(k=>{ out[k] = (100 * pesoDaArea(k) / somaPesos) / porArea[k]; });
    return out;
  }
  // fator que vale para uma etapa fora da agenda congelada (dia extra, rotina nova)
  function fatorDaArea(area){
    const sem = gam.semanaAtual;
    const fa = (sem && sem.fatoresArea) || {};
    return fa[area] != null ? fa[area] : sem.fatorNormalizacao;
  }
  /* Sem nenhuma etapa agendada na semana o denominador seria 0 e o fator sairia
     0 — o que zera TUDO, inclusive as tarefas de estudo, que nem dependem da
     agenda. Nesse caso a escala cai num padrão fixo: 20 blocos médios de 30 min
     valem os 100 pontos da semana. */
  const BLOCOS_SEMANA_PADRAO = 20;
  function fatorNormalizacaoPara(totalBruto){
    const base = totalBruto > 0 ? totalBruto : BLOCOS_SEMANA_PADRAO * pesoBruto("medio", 30);
    return base > 0 ? 100/base : 0;
  }
  // fator de uma área específica, com fallback pro fator único (roda desligada
  // ou área sem fatia própria) — usado em todo lugar que precisa reescalar
  // entradas já pontuadas (congelar, reparar, reancorar, migração legada)
  function fatorParaArea(area, fatoresArea, fatorPadrao){
    return (area != null && fatoresArea[area] != null) ? fatoresArea[area] : fatorPadrao;
  }
  function congelarSemana(inicioISO){
    const habitos = mapaHabitos();
    const { itens, totalBruto, porArea } = construirAgendaSemana(habitos);
    const fator = fatorNormalizacaoPara(totalBruto);
    const fatoresArea = fatoresPorArea(porArea);
    gam.semanaAtual = {
      inicioISO, fatorNormalizacao: fator, totalBrutoAgendado: totalBruto,
      fatoresArea, habitos,
      agendaCongelada: itens.map(it => ({
        itemId: it.itemId, dia: it.dia, area: it.area,
        pontos: it.pesoBruto * fatorParaArea(it.area, fatoresArea, fator)
      })),
      concluidos: []
    };
  }
  /* Semanas congeladas por versões anteriores podem ter ficado com fator 0 e,
     com ele, tudo pontuando zero. Recalcula o fator e reajusta o que já foi
     concluído nesta semana (as entradas guardam o peso bruto em `pb`). */
  function repararFatorSemanaAtual(){
    const sem = gam.semanaAtual;
    if(!sem || sem.fatorNormalizacao > 0) return;
    // reparo usa o mapa de hábitos JÁ congelado: recalcular o streak agora
    // mudaria o peso das etapas no meio da semana
    const habitos = sem.habitos || {};
    const { itens, totalBruto, porArea } = construirAgendaSemana(habitos);
    const fator = fatorNormalizacaoPara(totalBruto);
    if(fator <= 0) return;
    const fatoresArea = fatoresPorArea(porArea);
    sem.fatorNormalizacao = fator;
    sem.totalBrutoAgendado = totalBruto;
    sem.fatoresArea = fatoresArea;
    sem.agendaCongelada = itens.map(it => ({
      itemId: it.itemId, dia: it.dia, area: it.area,
      pontos: it.pesoBruto * fatorParaArea(it.area, fatoresArea, fator)
    }));
    (sem.concluidos||[]).forEach(c=>{ if(c.pb) c.pontos = c.pb * fatorParaArea(c.area, fatoresArea, fator); });
    save(K_GAMIFICACAO, gam);
  }
  /* Reancoragem INTERATIVA: quando o Pedro troca o dia de início da semana em
     Configurações, a semana congelada precisa mudar de âncora NA HORA (e não
     só a partir da próxima virada) — senão ele ficaria vendo domingo–sábado
     na tela mesmo tendo acabado de escolher segunda. Mesmo formato da migração
     de boot (preserva o que já foi concluído dentro da nova janela, descarta o
     que ficou para trás, reescala pelo novo fator). */
  function reancorarSemanaAtual(novoInicioISO){
    if(!gam.semanaAtual || gam.semanaAtual.inicioISO === novoInicioISO) return;
    const mantidos = (gam.semanaAtual.concluidos || []).filter(c => c.dataISO >= novoInicioISO);
    congelarSemana(novoInicioISO);
    gam.semanaAtual.concluidos = mantidos;
    mantidos.forEach(c=>{ if(c.pb) c.pontos = c.pb * fatorParaArea(c.area, gam.semanaAtual.fatoresArea, gam.semanaAtual.fatorNormalizacao); });
    save(K_GAMIFICACAO, gam);
  }
  if(!gam.semanaAtual) congelarSemana(inicioSemanaISO(new Date()));

  function badgeParaNota(nota){
    const f = gam.config.faixas;
    if(nota < gam.config.notaMinima) return null;
    if(nota < f.prata) return "bronze";
    if(nota < f.ouro) return "prata";
    if(nota < f.diamante) return "ouro";
    return "diamante";
  }
  /* A semana pertence ao mês em que ela termina (sábado). */
  function anoMesDoFimDaSemana(inicioISO){
    const d = isoToDate(addDaysISO(inicioISO, 6));
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  // pontos já ganhos na semana, somados por área — usado tanto pelo boletim da
  // semana em curso (pontosPorAreaSemana) quanto para arquivar o retrato da
  // semana no histórico ao fechar (ver fecharSemanaAtual)
  function pontosGanhosPorArea(sem){
    const out = {};
    (sem.concluidos||[]).forEach(c=>{ const k = c.area || ""; out[k] = (out[k]||0) + c.pontos; });
    return out;
  }
  function fecharSemanaAtual(){
    const sem = gam.semanaAtual;
    const nota = sem.concluidos.reduce((s,c)=>s+c.pontos, 0);
    // semana dispensada (viagem/doença/prova): arquiva o número, mas sem badge
    // e sem entrar na média do mês — o denominador congelado não a representa
    const destaques = destaquesDaSemana(sem);
    const porArea = pontosGanhosPorArea(sem);
    if(sem.dispensada){
      gam.historico.semanas.push({ inicioISO: sem.inicioISO, nota, badge:null, dispensada:true, destaques, porArea });
      return;
    }
    const badge = badgeParaNota(nota);
    gam.historico.semanas.push({ inicioISO: sem.inicioISO, nota, badge, destaques, porArea });
    if(badge) gam.badges.push({ escopo:"semanal", tipo:badge, periodo:sem.inicioISO, nota, emitidaEm: Date.now() });
  }
  // o que mais somou na semana, para o ritual de fechamento
  function destaquesDaSemana(sem){
    const porRotulo = {};
    (sem.concluidos||[]).forEach(c=>{
      const k = c.rotulo || "Outros";
      porRotulo[k] = (porRotulo[k] || 0) + c.pontos;
    });
    return Object.keys(porRotulo)
      .map(nome=>({ nome, pontos: porRotulo[nome] }))
      .sort((a,b)=>b.pontos-a.pontos)
      .slice(0, 5);
  }
  function fecharMesesPendentes(hojeISO){
    const hojeAnoMes = hojeISO.slice(0,7);
    const porMes = {};
    gam.historico.semanas.forEach(s=>{
      if(s.dispensada) return; // fora da média mensal
      const am = anoMesDoFimDaSemana(s.inicioISO);
      (porMes[am] = porMes[am] || []).push(s.nota);
    });
    Object.keys(porMes).sort().forEach(am=>{
      if(am >= hojeAnoMes || gam.historico.meses.some(m=>m.anoMes===am)) return;
      const notas = porMes[am];
      const bonus = gam.metasPontos[am] || 0;
      const nota = notas.reduce((a,b)=>a+b,0) / notas.length + bonus;
      const badge = badgeParaNota(nota);
      gam.historico.meses.push({ anoMes:am, nota, badge, bonusMetas:bonus });
      if(badge) gam.badges.push({ escopo:"mensal", tipo:badge, periodo:am, nota, emitidaEm: Date.now() });
    });
  }
  /* Trimestre: escopo próprio, criado para as metas de médio prazo. A nota é a
     média dos meses já fechados do trimestre mais o bônus das metas trimestrais. */
  function trimestreDe(anoMes){
    const ano = anoMes.slice(0,4), mes = +anoMes.slice(5,7);
    return ano + "-T" + (Math.floor((mes-1)/3) + 1);
  }
  function trimestreAtual(){ return trimestreDe(localKey().slice(0,7)); }
  function fecharTrimestresPendentes(){
    const atual = trimestreAtual();
    const porTri = {};
    gam.historico.meses.forEach(m=>{
      const t = trimestreDe(m.anoMes);
      (porTri[t] = porTri[t] || []).push(m.nota);
    });
    Object.keys(porTri).sort().forEach(t=>{
      if(t >= atual || gam.historico.trimestres.some(x=>x.anoTri===t)) return;
      const notas = porTri[t];
      const bonus = gam.metasPontos[t] || 0;
      const nota = notas.reduce((a,b)=>a+b,0) / notas.length + bonus;
      const badge = badgeParaNota(nota);
      gam.historico.trimestres.push({ anoTri:t, nota, badge, bonusMetas:bonus });
      if(badge) gam.badges.push({ escopo:"trimestral", tipo:badge, periodo:t, nota, emitidaEm: Date.now() });
    });
  }
  function fecharAnosPendentes(hojeISO){
    const hojeAno = +hojeISO.slice(0,4);
    const porAno = {};
    gam.historico.meses.forEach(m=>{
      const ano = +m.anoMes.slice(0,4);
      (porAno[ano] = porAno[ano] || []).push(m.nota);
    });
    Object.keys(porAno).map(Number).sort((a,b)=>a-b).forEach(ano=>{
      if(ano >= hojeAno || gam.historico.anos.some(a=>a.ano===ano)) return;
      const notas = porAno[ano];
      const bonus = gam.metasPontos[String(ano)] || 0;
      const nota = notas.reduce((a,b)=>a+b,0) / notas.length + bonus;
      const badge = badgeParaNota(nota);
      gam.historico.anos.push({ ano, nota, badge, bonusMetas:bonus });
      if(badge) gam.badges.push({ escopo:"anual", tipo:badge, periodo:String(ano), nota, emitidaEm: Date.now() });
    });
  }
  // roda no boot: o app pode ficar dias/semanas fechado, então a virada
  // não pode depender de estar aberto exatamente no domingo 00:00.
  function avancarGamificacaoAteAgora(){
    const hojeISO = inicioSemanaISO(new Date());
    let guard = 0;
    while(gam.semanaAtual.inicioISO < hojeISO && guard < 260){
      fecharSemanaAtual();
      congelarSemana(addDaysISO(gam.semanaAtual.inicioISO, 7));
      guard++;
    }
    fecharMesesPendentes(hojeISO);
    fecharTrimestresPendentes();
    fecharAnosPendentes(hojeISO);
    save(K_GAMIFICACAO, gam);
  }
  /* A semana virou domingo–sábado. A semana em curso estava ancorada numa
     segunda: reancora no domingo desta semana e recongela a agenda (os índices
     de `dia` mudaram de base). O que já foi concluído dentro da nova janela é
     preservado e reescalado pelo novo fator.
     Roda UMA vez só, com o flag `semanaMigradaDomingo`: sem ele, o dia de
     início da semana virar configurável (weekStartDow) faria essa migração
     achar de novo que `inicioISO` está "errado" toda vez que o Pedro escolher
     um início diferente de domingo, e desfazer a preferência dele a cada boot. */
  (function migrarSemanaParaDomingo(){
    if(gam.semanaMigradaDomingo) return;
    gam.semanaMigradaDomingo = true;
    if(gam.semanaAtual && isoToDate(gam.semanaAtual.inicioISO).getDay() !== 0){
      const novoInicio = inicioSemanaISO(new Date());
      const mantidos = (gam.semanaAtual.concluidos || []).filter(c => c.dataISO >= novoInicio);
      congelarSemana(novoInicio);
      gam.semanaAtual.concluidos = mantidos;
      mantidos.forEach(c=>{ if(c.pb) c.pontos = c.pb * fatorParaArea(c.area, gam.semanaAtual.fatoresArea, gam.semanaAtual.fatorNormalizacao); });
    }
    save(K_GAMIFICACAO, gam);
  })();
  const badgesAntesDoBoot = gam.badges.length;
  const semanasAntesDoBoot = gam.historico.semanas.length;
  avancarGamificacaoAteAgora();
  // vira semana/mês pode render badges silenciosamente durante o boot (rollover
  // acontece antes de qualquer render) — guardadas aqui pra celebrar depois que
  // a tela já estiver de pé, em vez de perder o momento.
  let badgesGanhasNoBoot = gam.badges.slice(badgesAntesDoBoot);
  // idem para o resumo semanal: notifica só a última semana fechada no boot
  // (se o app ficou dias fechado e várias viraram de uma vez, uma só basta).
  let semanasFechadasNoBoot = gam.historico.semanas.slice(semanasAntesDoBoot);
  repararFatorSemanaAtual();
  /* Metas ganharam peso (padrão "alto"), o que triplicou o total que cada uma
     vale. Sem reconciliar, uma meta antiga ficaria mostrando o crédito da
     fórmula velha ("8 de 30 pts") até alguém tocar nela. Estampa o peso padrão
     e acerta o crédito no boot, em silêncio. */
  (function reconciliarPesoDasMetas(){
    const doc = templates.filter(t=>t.type==="countdown")[0];
    if(!doc || !doc.targets || !doc.targets.length) return;
    let mudou = false;
    doc.targets.forEach(t=>{
      if(t.tagValor) return;
      t.tagValor = "alto";
      sincronizarPontosMeta(t, true);
      mudou = true;
    });
    if(mudou) save(K_TEMPLATES, templates);
  })();

  /* ---- Metas: pontuam no escopo definido pelo próprio prazo ----
     prazo < 1 mês -> mensal; 1 a 3 meses -> trimestral; > 3 meses -> anual.
     O bônus entra na nota do período em que a meta foi concluída. */
  function metaEscopo(t){
    const ini = t.criadoEm ? new Date(t.criadoEm) : new Date();
    const dias = Math.round((isoToDate(t.date) - ini) / 86400000);
    if(dias < 30) return "mensal";
    if(dias <= 90) return "trimestral";
    return "anual";
  }
  function periodoDeEscopo(escopo, data){
    const anoMes = localKey(data).slice(0,7);
    if(escopo === "mensal") return anoMes;
    if(escopo === "trimestral") return trimestreDe(anoMes);
    return anoMes.slice(0,4);
  }
  const ESCOPO_META_LABEL = { mensal:"mensal", trimestral:"trimestral", anual:"anual" };
  function metaConcluida(t){ return t.topics != null && (t.done||0) >= t.topics; }

  /* ---- Metas: pontuação proporcional, item por item ----
     Cada item concluído credita na hora a SUA fração dos pontos da meta, no
     boletim do escopo que o prazo define (antes só a meta 100% completa pontuava,
     de uma vez). O crédito vai sempre para o período corrente, então uma meta que
     atravessa a virada do mês deixa em cada mês o que foi feito nele — por isso o
     razão é por período (`t.creditos`), e não um número só. */
  /* O peso da meta multiplica a base do escopo. O padrão é "alto" (×3) porque
     uma meta é um compromisso mais longo do que uma etapa de rotina (padrão
     médio, ×1,75) ou um cartão do kanban do dia (padrão nenhum, ×0): por padrão
     ela tem de pesar mais do que eles. */
  function metaPontosTotais(t){
    return (gam.config.pontosMeta[metaEscopo(t)] || 0) * tagMultiplicador(t.tagValor || "alto");
  }
  function metaCreditado(t){
    const c = t.creditos || {};
    return Object.keys(c).reduce((s,k)=> s + c[k], 0);
  }
  function metaPontosDevidos(t){
    if(!t.topics || t.topics <= 0) return 0;
    const frac = Math.max(0, Math.min(1, (t.done||0) / t.topics));
    return metaPontosTotais(t) * frac;
  }
  /* Metas pontuadas pela versão anterior (crédito único ao concluir) viram razão
     por período: nem pontuam de novo, nem perdem o que já contou. */
  function migrarCreditoMeta(t){
    if(!t.pontuadaEm) return;
    t.creditos = t.creditos || {};
    if(t.pontuadaPeriodo && t.pontuadaPontos){
      t.creditos[t.pontuadaPeriodo] = (t.creditos[t.pontuadaPeriodo] || 0) + t.pontuadaPontos;
    }
    delete t.pontuadaEm; delete t.pontuadaEscopo; delete t.pontuadaPeriodo; delete t.pontuadaPontos;
  }
  /* Move `delta` pontos para (ou de) o período corrente. Estorno maior do que o
     período corrente comporta desce para os anteriores, do mais recente para trás,
     para o razão da meta e o acumulado de gam.metasPontos nunca divergirem. */
  function aplicarDeltaMeta(t, delta){
    if(Math.abs(delta) < 1e-9) return;
    t.creditos = t.creditos || {};
    const atual = periodoDeEscopo(metaEscopo(t), new Date());
    if(delta > 0){
      t.creditos[atual] = (t.creditos[atual] || 0) + delta;
      gam.metasPontos[atual] = (gam.metasPontos[atual] || 0) + delta;
    } else {
      let resta = -delta;
      const periodos = [atual].concat(Object.keys(t.creditos).filter(p=>p!==atual).sort().reverse());
      periodos.forEach(p=>{
        if(resta <= 1e-9) return;
        const tira = Math.min(t.creditos[p] || 0, resta);
        if(tira <= 0) return;
        t.creditos[p] -= tira;
        gam.metasPontos[p] = Math.max(0, (gam.metasPontos[p] || 0) - tira);
        if(gam.metasPontos[p] < 1e-9) delete gam.metasPontos[p];
        if(t.creditos[p] < 1e-9) delete t.creditos[p];
        resta -= tira;
      });
    }
    save(K_GAMIFICACAO, gam);
  }
  /* Chamado depois de qualquer mudança em done/topics/prazo. `silencioso` é para
     a reconciliação de boot, que não deve encher a tela de banners. */
  function sincronizarPontosMeta(t, silencioso){
    migrarCreditoMeta(t);
    const devido = metaPontosDevidos(t);
    const delta = devido - metaCreditado(t);
    if(Math.abs(delta) < 0.05) return; // ruído de arredondamento não vira banner
    aplicarDeltaMeta(t, delta);
    if(silencioso) return;
    if(delta > 0){
      const esc = ESCOPO_META_LABEL[metaEscopo(t)];
      if(metaConcluida(t)){
        showCelebrationBanner(`Meta <b>${escapeHtml(t.title)}</b> concluída · +${delta.toFixed(1)} pts (${devido.toFixed(1)} no total) no boletim ${esc}`);
      } else {
        showAlertBanner(`+${delta.toFixed(1)} pontos no boletim ${esc}`);
      }
    }
  }
  /* Meta apagada: devolve tudo que ela creditou. */
  function estornarMetaConcluida(t){
    migrarCreditoMeta(t);
    const pago = metaCreditado(t);
    if(pago > 0) aplicarDeltaMeta(t, -pago);
    delete t.creditos;
  }

  // tipo: "step" (etapa de rotina), "tarefa" (módulo de estudo) ou "kanban"
  // (cartão do diário). Retorna a entrada criada em concluidos (ou null se não
  // pontuou) para permitir desfazer a conclusão depois.
  function registrarConclusao(tipo, dados){
    avancarGamificacaoAteAgora();
    const data = dados.data || new Date();
    const dataISO = localKey(data);
    const dia = offsetSemana(data.getDay()); // offset dentro da semana configurada, mesma convenção de agendaCongelada

    let pb = pesoBruto(dados.tag, dados.minutos);
    if(pb <= 0) return null;
    let itemId, agendado = false, pontos;
    // área da roda da vida: fica na entrada para o boletim somar por área e para
    // repararFatorSemanaAtual saber com que fator reescalar
    let area = dados.area || "";
    if(tipo === "step"){
      const baseStepId = (dados.stepId||"").replace(/-c\d+$/, "");
      itemId = dados.routineId+":"+baseStepId+":"+dataISO;
      if(gam.semanaAtual.concluidos.some(c=>c.itemId===itemId)) return null;
      // rotina consolidada vale menos, com o desconto congelado no domingo
      pb *= fatorHabito(dados.routineId);
      if(pb <= 0) return null;
      const agendaItem = gam.semanaAtual.agendaCongelada.find(a=> a.itemId===(dados.routineId+":"+baseStepId) && a.dia===dia);
      if(agendaItem){ agendado = true; pontos = agendaItem.pontos; if(agendaItem.area != null) area = agendaItem.area; }
      else pontos = pb * fatorDaArea(area);
    } else if(tipo === "kanban"){
      // id estável (sem uid): tirar o cartão de "Feito" precisa achar e estornar
      itemId = "kanban:" + dados.cardId + ":" + dataISO;
      if(gam.semanaAtual.concluidos.some(c=>c.itemId===itemId)) return null;
      // `mult` é o peso do escopo do kanban (dia/semana): o mês e o ano não
      // passam por aqui, vão para gam.metasPontos. Entra no próprio `pb` para
      // que repararFatorSemanaAtual reescale a entrada sem perder o escopo.
      pb *= (dados.mult || 1);
      pontos = pb * fatorDaArea(area);
    } else {
      itemId = "tarefa:"+dados.tarefaId+":"+dataISO+":"+uid();
      pontos = pb * fatorDaArea(area);
    }
    // `pb` fica guardado para permitir reescalar a entrada se o fator da semana
    // precisar ser corrigido depois (repararFatorSemanaAtual)
    const entryGam = { itemId, tipo, dataISO, pontos, pb, agendado, area, rotulo: dados.rotulo || "" };
    gam.semanaAtual.concluidos.push(entryGam);
    save(K_GAMIFICACAO, gam);
    return entryGam;
  }
  // casa por itemId (e não por identidade) porque a entrada pode ter voltado
  // de um snapshot serializado do player
  function desfazerConclusao(entryGam){
    if(!entryGam) return;
    const id = typeof entryGam === "string" ? entryGam : entryGam.itemId;
    const i = gam.semanaAtual.concluidos.findIndex(c=>c.itemId===id);
    if(i === -1) return; // já virou a semana: não desfaz nota fechada
    gam.semanaAtual.concluidos.splice(i,1);
    save(K_GAMIFICACAO, gam);
  }
  function notaSemanaAtual(){ return gam.semanaAtual.concluidos.reduce((s,c)=>s+c.pontos, 0); }
  function esperadoAte(diaIdx){ return gam.semanaAtual.agendaCongelada.filter(a=>a.dia<=diaIdx).reduce((s,a)=>s+a.pontos, 0); }
  function ritmoInfo(){
    const diaIdx = offsetSemana(diaSemanaHoje());
    const nota = notaSemanaAtual();
    const esperado = esperadoAte(diaIdx);
    const saldo = nota - esperado;
    let label, cor;
    if(saldo >= 5){ label = "Adiantado"; cor = "var(--good)"; }
    else if(saldo >= -5){ label = "No ritmo"; cor = "var(--muted)"; }
    else if(saldo >= -15){ label = "Levemente atrasado"; cor = "var(--accent)"; }
    else { label = "Atrasado"; cor = "var(--danger)"; }
    const diasRestantes = 7 - diaIdx; // inclui hoje
    const faltaPara100 = Math.max(0, 100-nota);
    const faltaPara60 = Math.max(0, gam.config.notaMinima-nota);
    return {
      nota, esperado, saldo, label, cor, diasRestantes,
      porDia100: diasRestantes>0 ? faltaPara100/diasRestantes : faltaPara100,
      porDia60: diasRestantes>0 ? faltaPara60/diasRestantes : faltaPara60
    };
  }
  /* Previsão de sobrecarga: soma o que ainda está pela frente na semana
     configurada (rotinas agendadas dos dias restantes + cartões do kanban
     ainda não feitos + metas de prazo vencendo nesses dias) — heurística
     simples, não é gamificação, só um alerta de "semana carregada". */
  function previsaoCargaSemana(){
    const diaIdxHoje = offsetSemana(diaSemanaHoje());
    const diasRestantes = 7 - diaIdxHoje; // inclui hoje
    let minutosRotinas = 0;
    for(let off=0; off<diasRestantes; off++){
      const dow = (diaSemanaHoje() + off) % 7;
      routines.forEach(r=>{
        if(!r.schedule || !r.schedule.enabled || !r.schedule.days.includes(dow)) return;
        (r.steps||[]).forEach(s=>{
          if(s.isRest) return;
          if(s.type==="timer") minutosRotinas += (s.seconds||0)/60;
          else if(s.type==="exercicio") minutosRotinas += ((s.sets||1)*(r.restSeconds||120))/60;
        });
      });
    }
    const hojeKey = localKey();
    const semanaKey = "semana:" + inicioSemanaISO(new Date());
    const cartoesPendentes = diaKanban.filter(c=> c.col !== "done" && (c.per === "dia:"+hojeKey || c.per === semanaKey)).length;
    const doc = getOrCreateCountdownDoc();
    const metasVencendo = (doc.targets||[]).filter(t=>{ const d = daysUntil(t.date); return d>=0 && d<diasRestantes; }).length;
    const nivel = minutosRotinas > 900 ? "alta" : (minutosRotinas > 450 ? "normal" : "baixa");
    return { minutosRotinas: Math.round(minutosRotinas), cartoesPendentes, metasVencendo, diasRestantes, nivel };
  }
  const TAG_LABELS = { nenhum:"Nenhum", baixo:"Baixo", medio:"Médio", alto:"Alto" };
  function tagValorPillsHtml(current, comHerdar){
    const base = [["baixo","Baixo"],["medio","Médio"],["alto","Alto"]];
    const opts = comHerdar ? [["","Herdar"]].concat(base) : base;
    return `<div class="type-toggle tagval-pills">${opts.map(([v,l])=>`<span data-tagval="${v}" class="${(current||"")===v?'active':''}">${l}</span>`).join("")}</div>`;
  }
  function wireTagValorPills(scope){
    scope.querySelectorAll(".tagval-pills [data-tagval]").forEach(sp=>{
      sp.onclick = () => {
        scope.querySelectorAll(".tagval-pills [data-tagval]").forEach(x=>x.classList.remove("active"));
        sp.classList.add("active");
      };
    });
  }
  function readTagValorPills(scope){
    const sel = scope.querySelector(".tagval-pills .active");
    return sel ? (sel.dataset.tagval || null) : null;
  }

  /* ---- VAGAS EXCLUDENTES POR NÍVEL DE PESO ----
     Decidir "o que é alta prioridade" no abstrato é difícil; decidir com uma
     vaga só na mão é fácil, porque obriga a comparar. Cada nível tem um número
     de vagas (0 = sem limite) e o limite é contado DENTRO da área da roda,
     quando ela está ativa — é lá que as rotinas realmente disputam pontos. */
  const NIVEL_ABAIXO = { alto:"medio", medio:"baixo", baixo:"nenhum" };
  function vagasDoNivel(nivel){ return Math.max(0, +(gam.config.vagas||{})[nivel] || 0); }
  function escopoVagaLabel(draft){
    return rodaAtiva() ? "em " + areaInfoRoda(areaDaRotina(draft)).label : "no total";
  }
  function ocupantesDoNivel(nivel, draft){
    const area = areaDaRotina(draft);
    return routines.filter(r => r.id !== draft.id
      && rotinaTagEfetiva(r) === nivel
      && (!rodaAtiva() || areaDaRotina(r) === area));
  }
  function vagaHintHtml(draft){
    const nivel = rotinaTagEfetiva(draft);
    const limite = vagasDoNivel(nivel);
    if(!limite) return "";
    const ocup = ocupantesDoNivel(nivel, draft);
    const rotulo = "peso " + TAG_LABELS[nivel].toLowerCase() + " " + escopoVagaLabel(draft);
    const livres = limite - ocup.length;
    if(livres > 0) return `${limite} vaga(s) de ${rotulo} — ${livres} livre(s).`;
    return `<span style="color:var(--accent);">Sem vaga de ${rotulo}: ocupada por ${ocup.map(r=>escapeHtml(r.name)).join(", ")}. Ao salvar, você escolhe quem cede.</span>`;
  }
  /* Cobrado no salvar (e não no clique da pílula): rebaixar outra rotina por
     causa de uma edição que ainda pode ser cancelada deixaria o dado dela
     errado sem que nada tivesse sido salvo. */
  function validarVagaPeso(draft, onOk){
    const nivel = rotinaTagEfetiva(draft);
    const limite = vagasDoNivel(nivel);
    if(!limite){ onOk(); return; }
    const ocup = ocupantesDoNivel(nivel, draft);
    if(ocup.length < limite){ onOk(); return; }
    const abaixo = NIVEL_ABAIXO[nivel] || "nenhum";
    const ov = document.createElement("div");
    ov.className = "confirm-overlay";
    ov.innerHTML = `
      <div class="confirm-box" style="text-align:left;">
        <p style="margin-bottom:8px;">Só ${limite} rotina(s) pode(m) ter peso <b>${TAG_LABELS[nivel].toLowerCase()}</b> ${escopoVagaLabel(draft)}.</p>
        <div class="dev-n" style="margin-bottom:12px;">Escolha quem cede a vaga — ela passa para <b>${TAG_LABELS[abaixo].toLowerCase()}</b>.</div>
        <div style="display:flex; flex-direction:column; gap:8px; max-height:40vh; overflow-y:auto;">
          ${ocup.map(r=>`<button class="btn-cancel" data-cede="${r.id}" style="width:100%; text-align:left; padding:12px 14px; border-radius:12px; font-size:15px; font-family:'Inter'; flex:0 0 auto;">${escapeHtml(r.name)} &rarr; ${TAG_LABELS[abaixo].toLowerCase()}</button>`).join("")}
        </div>
        <div class="confirm-actions" style="margin-top:14px;">
          <button class="btn-cancel" id="vagaCancel">Voltar e escolher outro peso</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if(e.target===ov) ov.remove(); };
    ov.querySelector("#vagaCancel").onclick = () => ov.remove();
    ov.querySelectorAll("[data-cede]").forEach(b=> b.onclick = () => {
      const r = routines.find(x=>x.id===b.dataset.cede);
      if(r){ r.tagValor = abaixo; save(K_ROUTINES, routines); showAlertBanner("“"+r.name+"” passou para peso "+TAG_LABELS[abaixo].toLowerCase()); }
      ov.remove();
      onOk();
    });
  }
  function contagemBadges(escopo){
    const out = { diamante:0, ouro:0, prata:0, bronze:0 };
    gam.badges.filter(b=>b.escopo===escopo).forEach(b=>{ out[b.tipo] = (out[b.tipo]||0)+1; });
    return out;
  }
  /* Distribuição das etapas pontuáveis por tag — se quase tudo virar "alto",
     a tag perdeu poder discriminatório e os multiplicadores precisam de ajuste.
     Etapas com peso "nenhum" ficam fora: não pontuam, então não dizem nada
     sobre o poder discriminatório dos multiplicadores. */
  function distribuicaoTags(){
    const out = { alto:0, medio:0, baixo:0, nenhum:0, total:0 };
    routines.forEach(r=>{
      (r.steps||[]).forEach(s=>{
        if(s.type !== "timer") return;
        const tag = stepTagEfetiva(s, r);
        out[tag] = (out[tag]||0) + 1;
        if(tag !== "nenhum") out.total++;
      });
    });
    return out;
  }
  /* Pontos já ganhos na semana somados por área da roda — vale para rotinas e
     tarefas de estudo, que compartilham as mesmas chaves de área. O "previsto"
     é a fatia congelada daquela área (só existe com a roda ativa). */
  function pontosPorAreaSemana(){
    const sem = gam.semanaAtual;
    const ganhos = pontosGanhosPorArea(sem), previsto = {};
    (sem.agendaCongelada||[]).forEach(a=>{ const k = a.area || ""; previsto[k] = (previsto[k]||0) + a.pontos; });
    const chaves = [...new Set([...Object.keys(ganhos), ...Object.keys(previsto)])]
      .filter(k => (ganhos[k] || 0) > 0 || (previsto[k] || 0) > 0);
    // uma linha só, toda em "sem área", não diz nada sobre a roda
    if(chaves.length <= 1 && !chaves.some(k=>k)) return { linhas:[], max:0 };
    // ordem manual das áreas (Configurações → Roda da vida, ↑/↓) — "sem área"
    // sempre por último, por não fazer parte da lista editável.
    const ordemArea = k => { const i = rodaAreas().findIndex(a=>a.id===k); return k && i>=0 ? i : 999; };
    const linhas = chaves.map(k=>{
      const info = areaInfoRoda(k);
      return { label: info.label, color: info.color, pontos: ganhos[k] || 0, previsto: rodaAtiva() ? (previsto[k] || 0) : 0, _ordem: ordemArea(k) };
    }).sort((a,b)=> a._ordem - b._ordem || b.pontos - a.pontos);
    const max = Math.max(...linhas.map(l=>Math.max(l.pontos, l.previsto)), 0);
    return { linhas, max };
  }

  /* Tendência por área ao longo das últimas semanas fechadas — só semanas
     arquivadas DEPOIS que fecharSemanaAtual passou a gravar `porArea` entram
     aqui; semanas antigas ficam de fora (nunca tiveram esse retrato salvo). */
  function tendenciaAreaSemanas(n){
    const semanas = gam.historico.semanas.filter(s=>!s.dispensada && s.porArea).slice(-n);
    if(semanas.length < 2) return [];
    const chaves = new Set();
    semanas.forEach(s=> Object.keys(s.porArea).forEach(k=>{ if(k) chaves.add(k); }));
    const ordemArea = k => { const i = rodaAreas().findIndex(a=>a.id===k); return i>=0 ? i : 999; };
    return [...chaves].map(k=>{
      const info = areaInfoRoda(k);
      return { label: info.label, color: info.color, valores: semanas.map(s=> Math.round((s.porArea[k]||0)*10)/10), _ordem: ordemArea(k) };
    }).sort((a,b)=> a._ordem - b._ordem);
  }

     no topo das abas Rotinas, Metas, Diário e Dados — mesma marcação das barras
     do boletim, mas sem a linha "Sem área" (ela não diz nada sobre a roda) e
     sem seções nem rodapé explicativo. Vazio (sem chamar attention) quando não
     há pelo menos uma área com pontos. */
  function rodaVidaResumoHtml(){
    const roda = pontosPorAreaSemana();
    const linhas = roda.linhas.filter(l=>l.label !== "Sem área");
    if(!linhas.length) return "";
    const max = Math.max(...linhas.map(l=>Math.max(l.pontos, l.previsto)), 0);

      </div>`).join("")}
    </div>`;
  }

  /* Acessibilidade: todo botão só-de-ícone com title ganha aria-label
     automaticamente (title não é lido por leitores de tela no toque). */
  new MutationObserver(muts=>{
    muts.forEach(m=> m.addedNodes.forEach(n=>{
      if(n.nodeType !== 1) return;
      const btns = [];
      if(n.matches && n.matches("button[title]:not([aria-label])")) btns.push(n);
      if(n.querySelectorAll) btns.push(...n.querySelectorAll("button[title]:not([aria-label])"));

  /* ---------------- SWIPE: revelar botão de excluir (tarefas/notas/documentos) ---------------- */
  let openSwipeTrack = null;
  function closeOpenSwipe(except){
    if(openSwipeTrack && openSwipeTrack !== except){
      openSwipeTrack.style.transition = "transform .18s ease";
      openSwipeTrack.style.transform = "translateX(0)";
      openSwipeTrack.dataset.swipeOpen = "0";
      openSwipeTrack = null;
    }
  }
  document.addEventListener("pointerdown", e => {
    if(!openSwipeTrack) return;
    // não fecha se o toque foi dentro do card OU no botão de excluir (ambos vivem no wrapper .swipe-item)
    const wrap = openSwipeTrack.closest(".swipe-item");
    if(wrap && wrap.contains(e.target)) return;
    closeOpenSwipe(null);
  }, true);
  /* envolve cardEl (já pronto, com sua própria classe/estilo) num wrapper com botão de excluir atrás,
     revelado ao arrastar da direita pra esquerda. Retorna o wrapper — use no lugar de cardEl na lista. */
  function wrapSwipeDelete(cardEl, onDelete, label){
    const REVEAL = 76;
    const wrap = document.createElement("div");
    wrap.className = "swipe-item";
    const delBtn = document.createElement("button");
    delBtn.className = "swipe-del-btn";
    delBtn.textContent = label || "Excluir";
    delBtn.onclick = () => { closeOpenSwipe(null); onDelete(); };
    wrap.appendChild(delBtn);
    cardEl.classList.add("swipe-track");
    cardEl.dataset.swipeOpen = "0";
    wrap.appendChild(cardEl);

    let startX=0, startY=0, dragging=false, decided=false, horiz=false, baseX=0;
    cardEl.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      startX = e.clientX; startY = e.clientY; dragging = true; decided = false; horiz = false;
      baseX = cardEl.dataset.swipeOpen==="1" ? -REVEAL : 0;
      cardEl.style.transition = "none";
    });
    cardEl.addEventListener("pointermove", e=>{
      if(!dragging) return;
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!decided){
        if(Math.abs(dx)>8 || Math.abs(dy)>8){
          decided = true;
          horiz = Math.abs(dx) > Math.abs(dy)*1.2;
          if(horiz){ try{ cardEl.setPointerCapture(e.pointerId); }catch(err){} closeOpenSwipe(cardEl); }
          else { dragging = false; return; }
        } else return;
      }
      if(!horiz) return;
      e.preventDefault();
      const next = Math.max(-REVEAL, Math.min(0, baseX+dx));
      cardEl.style.transform = `translateX(${next}px)`;
    });
    function finish(e){
      if(!dragging) return;
      dragging = false;
      if(!horiz) return;
      const dx = (e.clientX!=null ? e.clientX : startX) - startX;
      const next = Math.max(-REVEAL, Math.min(0, baseX+dx));
      const open = next < -REVEAL/2;
      cardEl.style.transition = "transform .18s ease";
      cardEl.style.transform = `translateX(${open?-REVEAL:0}px)`;
      cardEl.dataset.swipeOpen = open ? "1" : "0";
      openSwipeTrack = open ? cardEl : (openSwipeTrack===cardEl ? null : openSwipeTrack);
    }
    cardEl.addEventListener("pointerup", finish);
    cardEl.addEventListener("pointercancel", finish);
    return wrap;
  }

  /* envolve cardEl com DUAS ações: arrastar p/ esquerda revela onLeft (à direita), arrastar p/ direita revela onRight (à esquerda).
     Usado nos cards de etapa do editor de rotina (excluir/duplicar). Ignora o gesto se começar num controle interativo do card. */
  function wrapSwipeActions(cardEl, opts){
    const REVEAL = 76;
    const { onLeft, leftLabel, onRight, rightLabel } = opts;
    const wrap = document.createElement("div");
    wrap.className = "swipe-item";
    const delBtn = document.createElement("button");
    delBtn.className = "swipe-del-btn";
    delBtn.textContent = leftLabel || "Excluir";
    delBtn.onclick = () => { closeOpenSwipe(null); onLeft(); };
    wrap.appendChild(delBtn);
    const dupBtn = document.createElement("button");
    dupBtn.className = "swipe-dup-btn";
    dupBtn.textContent = rightLabel || "Duplicar";
    dupBtn.onclick = () => { closeOpenSwipe(null); onRight(); };
    wrap.appendChild(dupBtn);
    cardEl.classList.add("swipe-track");
    cardEl.dataset.swipeOpen = "0";
    wrap.appendChild(cardEl);

    let startX=0, startY=0, dragging=false, decided=false, horiz=false, baseX=0;
    cardEl.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      if(e.target.closest(".drag-handle, .order-btn, input, select, button, textarea, .type-toggle span")) return;
      startX = e.clientX; startY = e.clientY; dragging = true; decided = false; horiz = false;
      baseX = cardEl.dataset.swipeOpen==="1" ? REVEAL : (cardEl.dataset.swipeOpen==="-1" ? -REVEAL : 0);
      cardEl.style.transition = "none";
    });
    cardEl.addEventListener("pointermove", e=>{
      if(!dragging) return;
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!decided){
        if(Math.abs(dx)>8 || Math.abs(dy)>8){
          decided = true;
          horiz = Math.abs(dx) > Math.abs(dy)*1.2;
          if(horiz){ try{ cardEl.setPointerCapture(e.pointerId); }catch(err){} closeOpenSwipe(cardEl); }
          else { dragging = false; return; }
        } else return;
      }
      if(!horiz) return;
      e.preventDefault();
      const next = Math.max(-REVEAL, Math.min(REVEAL, baseX+dx));
      cardEl.style.transform = `translateX(${next}px)`;
    });
    function finish(e){
      if(!dragging) return;
      dragging = false;
      if(!horiz) return;
      const dx = (e.clientX!=null ? e.clientX : startX) - startX;
      const next = Math.max(-REVEAL, Math.min(REVEAL, baseX+dx));
      const openState = next < -REVEAL/2 ? "1" : (next > REVEAL/2 ? "-1" : "0");
      const openX = openState==="1" ? -REVEAL : (openState==="-1" ? REVEAL : 0);
      cardEl.style.transition = "transform .18s ease";
      cardEl.style.transform = `translateX(${openX}px)`;
      cardEl.dataset.swipeOpen = openState;
      openSwipeTrack = openState!=="0" ? cardEl : (openSwipeTrack===cardEl ? null : openSwipeTrack);
    }
    cardEl.addEventListener("pointerup", finish);
    cardEl.addEventListener("pointercancel", finish);
    return wrap;
  }

  /* ---------------- SWIPE: dispensar aviso (cima ou lados) ---------------- */
  function attachSwipeDismiss(el, onDismissed){
    const THRESH = 44;
    let startX=0, startY=0, dragging=false, decided=false;
    el.addEventListener("pointerdown", e=>{
      startX = e.clientX; startY = e.clientY; dragging = true; decided = false;
      el.style.transition = "none";
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener("pointermove", e=>{
      if(!dragging) return;
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!decided && (Math.abs(dx)>6 || Math.abs(dy)>6)) decided = true;
      if(!decided) return;
      const ty = Math.min(0, dy);
      el.style.transform = `translate(${dx}px, ${ty}px)`;
      el.style.opacity = String(Math.max(0.15, 1 - (Math.abs(dx)+Math.abs(ty))/180));
    });
    function finish(e){
      if(!dragging) return;
      dragging = false;
      const dx = (e.clientX!=null?e.clientX:startX)-startX, dy = (e.clientY!=null?e.clientY:startY)-startY;
      el.style.transition = "transform .2s ease, opacity .2s ease";
      if(Math.abs(dx) > THRESH || dy < -THRESH){
        el.style.transform = `translate(${dx>=0?220:-220}px, ${dy<-THRESH?-160:0}px)`;
        el.style.opacity = "0";
        setTimeout(()=>{ if(el.parentNode) el.remove(); }, 200);
        onDismissed && onDismissed();
      } else {
        el.style.transform = "translate(0,0)";
        el.style.opacity = "1";
      }
    }
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  const GRAD_CSS = "linear-gradient(135deg,#EC6AA8,#5B8DEF)";
  function fillStyle(c){ return (!c || c === "grad" || c === "#C98A3E") ? GRAD_CSS : c; }
  function solidColor(c){ return (!c || c === "grad" || c === "#C98A3E") ? "#B96BC4" : c; }
  /* A rotina não escolhe mais cor própria (editor perdeu o picker): a cor vem
     da área a que ela foi designada (configurável em Configurações → roda da
     vida), com o degradê padrão como fallback pra quem não tem área. */
  function corDaRotina(r){
    const area = r && areaDaRotina(r);
    return area ? areaInfoRoda(area).color : "grad";
  }

  function computeStreakFor(routineId){
    const r = routines.find(x=>x.id===routineId);
    const days = new Set(history.filter(h=>h.routineId===routineId).map(h=>h.date));
    if(days.size===0) return 0;
    // rotina agendada em dias específicos: dias fora da agenda não contam nem quebram
    const schedDays = (r && r.schedule && r.schedule.enabled && r.schedule.days && r.schedule.days.length < 7) ? r.schedule.days : null;
    const todayKey = localKey();
    let streak = 0, d = new Date(), guard = 0;
    while(guard++ < 3700){
      const key = localKey(d);
      const dow = d.getDay();
      if(schedDays && !schedDays.includes(dow)){ d.setDate(d.getDate()-1); continue; }
      if(days.has(key)){ streak++; d.setDate(d.getDate()-1); }
      else if(key === todayKey){ d.setDate(d.getDate()-1); } // hoje ainda em curso não quebra
      else break;
    }
    return streak;
  }

  // dia sem NENHUMA rotina agendada devida (todas as agendadas são de dias
  // específicos que não incluem esse dow) não deveria contar contra a
  // sequência global — mesmo critério que computeStreakFor já aplica por
  // rotina, só que aqui olhando o conjunto de rotinas agendadas
  function algumaRotinaDevidaEm(dow){
    return routines.some(r => r.schedule && r.schedule.enabled && r.schedule.days && r.schedule.days.includes(dow));
  }
  function computeStreak(){
    if(history.length===0) return 0;
    const days = new Set(history.map(h=>h.date));
    const todayKey = localKey();
    let streak=0, d=new Date(), guard=0;
    while(guard++ < 3700){
      const key = localKey(d);
      if(days.has(key)){ streak++; d.setDate(d.getDate()-1); }
      else if(key === todayKey){ d.setDate(d.getDate()-1); } // hoje em curso não quebra
      else if(!algumaRotinaDevidaEm(d.getDay())){ d.setDate(d.getDate()-1); } // nada devido nesse dia — não quebra
      else break;
    }
    return streak;
  }
  /* ---------------- SOUND / HAPTICS ---------------- */
  let audioCtx = null;
  function beep(freq, dur){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur+0.02);
    }catch(e){}
  }
  function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }
  // opção de som foi removida do editor: sempre vibração, nunca beep
  function soundMode(){ return "mudo"; }
  function cueBeep(freq, dur, mode){
    if(mode === "mudo") return;
    if(mode === "suave") beep(freq*0.75, dur*0.8);
    else beep(freq, dur);
  }
  function stepTransitionCue(){ const m = soundMode(); cueBeep(880,0.15,m); vibrate([40,30,40]); }
  function timeUpCue(){ const m = soundMode(); cueBeep(760,0.18,m); vibrate([60,50,60]); }
  function finishCue(){ const m = soundMode(); cueBeep(660,0.12,m); setTimeout(()=>cueBeep(990,0.22,m),140); vibrate([50,60,50,60,120]); }
  function alarmCue(routine){ const m = soundMode(routine); cueBeep(720,0.3,m); setTimeout(()=>cueBeep(720,0.3,m),420); setTimeout(()=>cueBeep(720,0.4,m),840); vibrate([200,100,200,100,200]); }

  /* ---- Erros não tratados viram banner (senão a tela quebra em silêncio) ---- */
  let lastErrBannerTs = 0;
  function reportUncaught(msg){
    console.error("Erro não tratado:", msg);
    if(Date.now() - lastErrBannerTs < 60000) return; // no máx. 1 banner de erro por minuto
    lastErrBannerTs = Date.now();
    try{ showAlertBanner("⚠️ Erro inesperado: " + msg); }catch(e){}
  }
  window.addEventListener("error", e => reportUncaught(e.message || "desconhecido"));
  window.addEventListener("unhandledrejection", e => reportUncaught((e.reason && e.reason.message) || String(e.reason || "promise rejeitada")));

  function showAlertBanner(text, onTap){
    let banner = document.getElementById("alertBanner");

    const hideTimer = setTimeout(()=>{ banner.classList.add("hide"); setTimeout(()=>{ if(banner.parentNode) banner.remove(); }, 400); }, 7000);

  /* ---- Notificação nativa do Electron (desktop) ----
     Bypassa o caminho via Service Worker: no Electron, `navigator.serviceWorker`
     existe (a propriedade está lá) mas o registro sobre file:// nunca ativa, então
     `serviceWorker.ready` fica pendurado para sempre e a notificação nunca dispara.
     `new Notification()` já mapeia direto para a notificação nativa do SO no
     Chromium do Electron — não precisa de node-notifier nem de IPC para isso. */
  function notifyDesktop(title, body, onClick){
    if(!("Notification" in window) || Notification.permission !== "granted") return false;
    try{
      const n = new Notification(title, { body });
      n.onclick = () => {
        try{ window.electronBridge.showWindow(); }catch(e){}
        try{ window.focus(); }catch(e){}
        if(onClick) onClick();
      };
      return true;
    }catch(e){ return false; }
  }

  function requestNotifPermission(){
    if(isNative){
      nativeLN().requestPermissions().then(r=>{
        const ok = r.display === "granted";
        showAlertBanner(ok ? "Notificações ativadas ✓" : "Notificações não permitidas");
        if(ok) syncNativeSchedules();
      }).catch(()=>{ showAlertBanner("Não foi possível pedir permissão de notificação"); });
      return;
    }
    if(!("Notification" in window)){ showAlertBanner("Notificações não suportadas neste navegador"); return; }
    if(Notification.permission === "granted"){ showAlertBanner("Notificações já ativadas ✓"); return; }
    Notification.requestPermission().then(p=>{
      showAlertBanner(p==="granted" ? "Notificações ativadas ✓" : "Notificações não permitidas");
    });

  /* ---------------- SERVICE WORKER (PWA real p/ Android) ---------------- */

  function showRichNotification(title, body, routineId){

  function notifyDigestSemanal(sem){

    if(isDesktop){ notifyDesktop(title, body, () => { goTo({ tab:"home", screen:"boletim" }); render(); }); return; }
    if(!("Notification" in window) || Notification.permission !== "granted") return;

      navigator.serviceWorker.ready.then(reg=>{

  /* ---- Notificações nativas (Capacitor LocalNotifications, só no APK) ----
     Além das notificações imediatas, as rotinas agendadas viram notificações
     recorrentes do Android (weekday/hora/minuto), que disparam mesmo com o
     app fechado. Re-sincronizadas a cada boot e a cada mudança em rotinas
     ou snoozes (hook no save()). */
  /* ---- Bolha do cronômetro sobre outros apps (só no APK) ----
     Espelha a etapa atual numa janela flutuante do Android, como o timer nativo
     da Samsung. Três regras que o desenho anterior violava:

     1. A bolha só aparece quando o app NÃO está na frente — dentro do app ela
        apenas duplicaria o cronômetro da tela.
     2. O serviço fica de pé durante toda a execução (mesmo com a bolha oculta).
        Iniciar um foreground service já em segundo plano é bloqueado no Android
        12+, então quem some é a *view*, não o serviço.
     3. Com o WebView suspenso o JS não avança as etapas. Por isso o serviço
        recebe a fila do que vem depois e rola os descansos por conta própria —
        exatamente o que catchUpSteps() vai recalcular quando o app voltar. Sem
        a fila, a bolha ficava presa na etapa anterior contando negativo. */
  let appEmSegundoPlano = false;
  function overlayPlugin(){
    return (isNative && window.Capacitor.Plugins.TimerOverlay) ? window.Capacitor.Plugins.TimerOverlay : null;
  }
  function overlayAtivo(){ return !!overlayPlugin() && !!load(K_OVERLAY, false); }
  async function pedirPermissaoOverlay(){
    const p = overlayPlugin();
    if(!p){ showAlertBanner("Disponível apenas no app instalado"); return false; }
    try{
      const r = await p.requestPermission();
      if(!r || !r.granted){ showAlertBanner("Permissão \"Sobrepor a outros apps\" não concedida"); return false; }
      return true;
    }catch(e){ console.error("permissão de overlay:", e); return false; }
  }
  /* Etapas a partir da próxima, no formato que o serviço entende. `auto` marca
     as que o app avançaria sozinho ao zerar (só os descansos); nas outras o
     cronômetro entra em tempo negativo e espera o toque. Para na primeira etapa
     de checklist: dali em diante só o app resolve. */
  function filaOverlay(){
    const out = [];
    for(let i = playerState.idx + 1; i < playerState.steps.length; i++){
      const s = playerState.steps[i];
      if(s.type !== "timer") break;
      out.push({ label: s.name || "", seconds: s.seconds || 0, auto: !!s.isRest });
    }
    return out;
  }
  function sincronizarOverlay(){
    const p = overlayPlugin();
    if(!p) return;
    if(!overlayAtivo() || !playerState){ pararOverlay(); return; }
    const step = currentStep();
    if(!step || step.type !== "timer"){ pararOverlay(); return; }
    const remMs = computeRemaining() * 1000;
    try{
      const r = p.show({
        endTs: playerState.paused ? 0 : Date.now() + remMs,
        // pode ser negativo: pausar dentro do tempo estourado tem que mostrar
        // "+MM:SS", e não 00:00 como antes
        remainingMs: remMs,
        paused: !!playerState.paused,
        auto: !!step.isRest,
        visible: appEmSegundoPlano,
        label: step.name || playerState.routine.name || "",
        queue: JSON.stringify(filaOverlay())
      });
      if(r && r.catch) r.catch(e => console.error("overlay:", e));
    }catch(e){ console.error("overlay:", e); }
  }
  function pararOverlay(){
    const p = overlayPlugin();
    if(p){
      try{
        const r = p.hide();
        if(r && r.catch) r.catch(()=>{});
      }catch(e){}
    }
    // independente da bolha: encerra também o alerta de fundo, se houver
    cancelarAlertaFundo();
  }
  /* ---- Alerta sonoro/vibração de fim de etapa/descanso EM SEGUNDO PLANO ----
     Em primeiro plano quem avisa é o WebAudio (timeUpCue/stepTransitionCue, ver
     startTicking) — mas com o WebView suspenso essas funções não rodam. Como a
     bolha do cronômetro (TimerOverlay) só existe se o Pedro ligou a preferência
     e concedeu a permissão de sobreposição, este alerta usa OUTRO canal —
     LocalNotifications, que já funciona para as notificações agendadas de
     rotina/meta — e por isso não depende daquela preferência nem daquele
     plugin: funciona sempre que a permissão de notificação estiver concedida.
     Tag própria (extra.brita:"stepAlert") pra não se misturar com o
     cancela-e-reagenda de syncNativeSchedules(), que só mexe em "sched". */
  const STEPALERT_ID_BASE = 2000000000; // faixa reservada, longe do espaço de notifIdFor
  async function ensureTimerAlertChannels(){
    if(!isNative) return;
    try{
      await nativeLN().createChannel({ id:"brita_timer", name:"Fim de etapa/descanso", description:"Avisa quando o tempo de uma etapa ou descanso da rotina acaba", importance:4, vibration:true });
      await nativeLN().createChannel({ id:"brita_timer_mudo", name:"Fim de etapa/descanso (só vibrar)", description:"Mesmo aviso, sem som", importance:2, vibration:true });
    }catch(e){ console.error("ensureTimerAlertChannels:", e); }
  }
  async function cancelarAlertaFundo(){
    if(!isNative) return;
    try{
      const LN = nativeLN();
      const pending = await LN.getPending();
      const mine = (pending.notifications||[]).filter(n=>n.extra && n.extra.brita==="stepAlert");
      if(mine.length) await LN.cancel({ notifications: mine.map(n=>({id:n.id})) });
    }catch(e){ console.error("cancelarAlertaFundo:", e); }
  }
  /* Reagenda a cada mudança relevante do player (ver sincronizarPlayerBackground)
     — cancela sempre primeiro e só recria se: nativo, em segundo plano, com
     rotina rodando, não pausada e na etapa atual em tempo (timer). Encadeia os
     descansos automáticos seguintes (mesmo critério de filaOverlay()/auto),
     até um teto de 10, para avisar mesmo se o app ficar minimizado por várias
     etapas seguidas. */
  async function sincronizarAlertaFundo(){
    await cancelarAlertaFundo();
    if(!isNative || !appEmSegundoPlano || !playerState || playerState.paused) return;
    const step = currentStep();
    if(!step || step.type !== "timer" || !playerState.stepEndTs) return;
    try{
      const LN = nativeLN();
      const perm = await LN.checkPermissions();
      if(perm.display !== "granted") return;
      const channelId = soundMode(playerState.routine) === "mudo" ? "brita_timer_mudo" : "brita_timer";
      const notifs = [];
      let quando = playerState.stepEndTs;
      let n = 0;
      notifs.push({
        id: STEPALERT_ID_BASE + n, channelId,
        title: step.isRest ? "Descanso acabou" : "Tempo esgotado",
        body: playerState.routine.name + (step.name ? " — " + step.name : ""),
        extra: { brita:"stepAlert" },
        schedule: { at: new Date(quando), allowWhileIdle: true }
      });
      n++;
      for(let i = playerState.idx+1; i < playerState.steps.length && n < 10; i++){
        const s = playerState.steps[i];
        if(s.type !== "timer" || !s.isRest) break;
        quando += s.seconds*1000;
        notifs.push({
          id: STEPALERT_ID_BASE + n, channelId,
          title: "Descanso acabou",
          body: playerState.routine.name + (s.name ? " — " + s.name : ""),
          extra: { brita:"stepAlert" },
          schedule: { at: new Date(quando), allowWhileIdle: true }
        });
        n++;
      }
      await LN.schedule({ notifications: notifs });
    }catch(e){ console.error("sincronizarAlertaFundo:", e); }
  }
  /* ponto único chamado sempre que o estado do player muda de um jeito que
     precisa refletir fora do WebView — bolha (se ligada) + alerta de fundo
     (sempre, independente da bolha) */
  function sincronizarPlayerBackground(){
    sincronizarOverlay();
    sincronizarAlertaFundo();
  }
  /* O sinal de "saiu da frente": no APK o appStateChange do Capacitor é o
     confiável; visibilitychange cobre o navegador e serve de rede. */
  function marcarSegundoPlano(v){
    if(appEmSegundoPlano === v) return;
    appEmSegundoPlano = v;
    sincronizarPlayerBackground();
    // widgets de tela inicial (streak, rotina, metas do dia): o momento de ir
    // para trás é exatamente quando a tela inicial está prestes a aparecer —
    // eles também se atualizam sozinhos a cada 30min, isto só evita a espera.
    if(v && isNative && window.Capacitor.Plugins.Widgets){
      try{ window.Capacitor.Plugins.Widgets.refresh(); }catch(e){}
    }
    // sync com o Google Drive: sem processo em segundo plano (o app Android é
    // encerrado quando fecha de verdade), então o gancho é "acabou de voltar
    // para frente" — o mais parecido que dá do "sync a cada N min" do desktop.
    if(!v) tentarAutoSyncNative();
  }
  async function tentarAutoSyncNative(){
    if(!isNative || !window.Capacitor.Plugins.DriveSync) return;
    try{
      const P = window.Capacitor.Plugins.DriveSync;
      const status = await P.getStatus();
      if(!status.connected) return;
      const DEZ_MIN = 10*60*1000;
      if(status.lastSyncAt && Date.now()-status.lastSyncAt < DEZ_MIN) return;
      const r = await P.syncNow();
      await aplicarChavesSincronizadasNative(r.downloaded);
      if(r.conflicts && r.conflicts.length) showAlertBanner("⚠️ Conflito de sincronização — resolva em Configurações → Backup");
      if(document.getElementById("cfgSyncCard")) refreshSyncCard();
    }catch(e){ console.error("auto-sync nativo falhou:", e); }
  }
  document.addEventListener("visibilitychange", ()=> marcarSegundoPlano(!!document.hidden));
  if(isNative && window.Capacitor.Plugins.App){
    try{
      window.Capacitor.Plugins.App.addListener("appStateChange", st => marcarSegundoPlano(!st.isActive));
    }catch(e){ console.error("appStateChange:", e); }
  }

  function nativeLN(){ return window.Capacitor.Plugins.LocalNotifications; }
  function notifIdFor(key, day){
    let h = 0;
    for(let i = 0; i < key.length; i++){ h = (h * 31 + key.charCodeAt(i)) | 0; }
    return (Math.abs(h) % 200000000) * 8 + (day % 8); // int32 positivo, único por chave+dia
  }
  function notifyNative(title, body, extra, id){
    nativeLN().schedule({ notifications: [{ id, title, body, extra: extra || {} }] }).catch(()=>{});
  }
  function queueNativeSchedSync(){
    if(!isNative) return;
    clearTimeout(nativeSyncTimer);
    nativeSyncTimer = setTimeout(()=>{ syncNativeSchedules(); syncAppShortcuts(); }, 800);
  }
  async function syncNativeSchedules(){
    if(!isNative) return;
    const LN = nativeLN();
    try{
      const perm = await LN.checkPermissions();
      if(perm.display !== "granted") return;
      const pending = await LN.getPending();
      const mine = (pending.notifications || []).filter(n => n.extra && n.extra.brita === "sched");
      if(mine.length) await LN.cancel({ notifications: mine.map(n => ({ id: n.id })) });
      if(agendaSnoozed()) return; // com agenda pausada, nada é reagendado até o próximo uso do app
      const notifs = [];
      const usedIds = new Set(); // colisão de hash entre rotinas: desloca +8 (mantém o slot do dia)
      routines.forEach(r => {
        const sched = computeSchedule(r);
        if(!sched) return;
        const days = (r.schedule.days && r.schedule.days.length) ? r.schedule.days : [0,1,2,3,4,5,6];
        days.forEach(d => {
          let nid = notifIdFor(r.id, d);
          while(usedIds.has(nid)) nid += 8;
          usedIds.add(nid);
          notifs.push({
            id: nid,
            title: "Hora de começar: " + r.name,
            body: "Início previsto às " + sched.startStr,
            extra: { routineId: r.id, brita: "sched" },
            schedule: { on: { weekday: d + 1, hour: Math.floor(sched.startMin/60), minute: sched.startMin % 60 } } // weekday do plugin: 1=domingo
          });
        });
      });
      // alvos de contagem regressiva: notificação única às 9h do dia-alvo
      templates.filter(t => t.type === "countdown").forEach(t => {
        (t.targets || []).forEach(tg => {
          if(!tg.date) return;
          const when = new Date(tg.date + "T09:00:00");
          if(isNaN(when.getTime()) || when.getTime() <= Date.now()) return;
          let nid = notifIdFor("cd-" + tg.id, 7);
          while(usedIds.has(nid)) nid += 8;
          usedIds.add(nid);
          notifs.push({
            id: nid,
            title: "Hoje: " + tg.title,
            body: "O alvo de \"" + t.title + "\" chegou.",
            extra: { brita: "sched" },
            schedule: { at: when }
          });
        });
      });
      // compromissos avulsos: notificação única, no horário do compromisso ou
      // no mesmo horário um dia antes, conforme escolhido na criação
      compromissos.forEach(c => {
        if(!c.date || !c.notify || c.notify === "nenhuma") return;
        const hhmm = c.time || "09:00";
        const when = new Date(c.date + "T" + hhmm + ":00");
        if(c.notify === "diaanterior") when.setDate(when.getDate() - 1);
        if(isNaN(when.getTime()) || when.getTime() <= Date.now()) return;
        let nid = notifIdFor("cp-" + c.id, 7);
        while(usedIds.has(nid)) nid += 8;
        usedIds.add(nid);
        notifs.push({
          id: nid,
          title: (c.notify === "diaanterior" ? "Amanhã: " : "Hoje: ") + c.title,
          body: c.time ? ("Horário: " + c.time) : "Compromisso do dia",
          extra: { brita: "sched" },
          schedule: { at: when }
        });
      });
      // metas recorrentes diárias com janela de notificação: um alarme
      // recorrente por horário (schedule.on sem weekday = repete todo dia)
      templates.filter(t => t.type === "countdown").forEach(t => {
        (t.recorrentes || []).forEach(rec => {
          metaRecHorarios(rec).forEach((h, i) => {
            let nid = notifIdFor("mr-" + rec.id, i);
            while(usedIds.has(nid)) nid += 8;
            usedIds.add(nid);
            notifs.push({
              id: nid,
              title: rec.titulo,
              body: "Meta recorrente — " + rec.vezes + "x ao dia",
              extra: { brita: "sched" },
              schedule: { on: { hour: h.hour, minute: h.minute } }
            });
          });
        });
      });
      if(notifs.length) await LN.schedule({ notifications: notifs });
    }catch(e){ console.error("syncNativeSchedules:", e); }
  }
  /* Atalhos dinâmicos do launcher (plugin próprio ShortcutsPlugin no APK):
     manter o ícone do app pressionado → "Iniciar rotina X" (4 primeiras). */
  async function syncAppShortcuts(){
    if(!isNative || !window.Capacitor.Plugins.Shortcuts) return;
    try{
      const shortcuts = routines.slice(0, 4).map(r => ({ id: r.id, label: ((r.icon ? r.icon + " " : "") + r.name).slice(0, 25) }));

      SC.getLaunch().then(d => { if(d && d.routineId && routines.find(r => r.id === d.routineId)) startPlayer(d.routineId); }).catch(()=>{});
